<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7EVEN · Gloss Chrome (preview)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#040404;color:#e8e9eb;font-family:'JetBrains Mono',monospace;overflow:hidden}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,4,4,.55),rgba(4,4,4,.3) 44%,rgba(4,4,4,.8))}

.stage{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sevenwrap{display:flex;flex-direction:column;align-items:center;opacity:0;animation:brandIn 2.4s ease-out .4s forwards}
@keyframes brandIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.seven{width:clamp(300px,44vw,620px);position:relative;aspect-ratio:1800/280}
.s7{position:absolute;inset:0;display:block;
  -webkit-mask:url('/seven-mark-white-hd.png') center / contain no-repeat;
  mask:url('/seven-mark-white-hd.png') center / contain no-repeat}

/* full high-gloss piano black — no light effects, subtle dark reflections only */
.s7k{background:linear-gradient(180deg,
    #0d0e10 0%, #020203 28%, #000 55%,
    #000 80%, #060708 100%);
  filter:drop-shadow(0 4px 20px rgba(0,0,0,.85))}

/* white master cross-fades over it — 8s, then holds */
.s7w{background:#fff;opacity:0;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(255,255,255,.28)) drop-shadow(0 3px 18px rgba(0,0,0,.6));
  animation:toWhite 8s ease-in-out 2.9s forwards}
@keyframes toWhite{to{opacity:1}}

.sub{margin-top:22px;font-size:7px;letter-spacing:.5em;color:#8a8f95;text-transform:uppercase;text-align:center;padding-left:.5em}

.replay{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:20;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:2px;color:#b9bdc4;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.28em;text-transform:uppercase;padding:9px 18px}
.replay:hover{border-color:#d6b36a;color:#d6b36a}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline src="/haavn-black-bg.mp4"></video>
<div class="scrim"></div>

<div class="stage">
  <div class="sevenwrap" id="wrap">
    <div class="seven" role="img" aria-label="7EVEN">
      <i class="s7 s7k"></i><i class="s7 s7w"></i>
    </div>
    <div class="sub">Atrium &nbsp;·&nbsp; Precision Feasibility &nbsp;·&nbsp; By Invitation</div>
  </div>
</div>

<button class="replay" onclick="var w=document.getElementById('wrap'),p=w.parentNode;var c=w.cloneNode(true);p.removeChild(w);p.appendChild(c);c.id='wrap'">⟳ Replay</button>
</body>
</html>
