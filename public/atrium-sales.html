<!DOCTYPE html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATRIUM · HAAVN BLACK Sales</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* HAAVN BLACK sales: pipeline, approvals and dashboard. Built from haavnblack.au itself: the same black ground, hairline notched panels, Inter 300 with an Instrument Serif accent,
   JetBrains Mono labels, the real swatch colours for cladding, interior palette and joinery, and the LED accent. */
:root{
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  /* the website's own selection colours, used here for the four chapters of the journey */
  --tide:#7cb5c0;--vine:#d9a54f;--sage:#96b483;--rose:#c2747a;
  --gold:#d6b36a;--led:#7fd3ff;--over:#ff6b5e;
  --notch:10px;
  --notch-clip:polygon(0 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%);
}
[data-theme=dark]{
  --bg:#050607;--panel:#0d0f12;--panel2:#12151a;--hov:#171b21;
  --edge:rgb(117 113 116 / .55);--edge2:rgb(255 255 255 / .08);--hl:rgb(220 235 255 / .42);
  --ink:#eaf1f6;--ink2:#a8b3bc;--ink3:#7d8891;--ink4:#566068;
  --accent:#7fd3ff;--glow:rgb(110 200 255 / .5);--ctm:0%;--ring:rgb(255 255 255 / .3);--scrim:rgba(0,0,0,.62);
}
[data-theme=light]{
  --bg:#efede8;--panel:#ffffff;--panel2:#f7f5f1;--hov:#efece5;
  --edge:rgb(150 143 132 / .6);--edge2:rgb(20 20 25 / .09);--hl:rgb(20 20 25 / .4);
  --ink:#15171a;--ink2:#444950;--ink3:#737880;--ink4:#a4a7ac;
  --accent:#a3782a;--glow:rgb(163 120 42 / .35);--ctm:44%;--ring:rgb(0 0 0 / .22);--scrim:rgba(20,20,25,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 13px/1.45 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[data-theme=dark] body{background:radial-gradient(1200px 480px at 50% -180px,rgb(110 200 255 / .07),transparent 70%),var(--bg)}
body[data-tab=pipe]{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--edge);background-clip:content-box;border:2px solid transparent}
.eb{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.mono{font-family:var(--mono)}
.sp{flex:1}
.hide{display:none!important}
.ct{color:color-mix(in srgb,var(--c),#000 var(--ctm))}

/* the site's notched panel: hairline border, 4px radius, one cut corner with the edge drawn along the cut */
.nc,.card,.tablewrap{position:relative;background:linear-gradient(-45deg,transparent 50%,var(--nedge,var(--edge)) 50% calc(50% + 1.5px),transparent calc(50% + 1.5px)) bottom right/var(--notch) var(--notch) no-repeat border-box,var(--panel);
  border:1px solid var(--edge);border-radius:4px 4px 0;clip-path:var(--notch-clip)}

/* ---------- top bar ---------- */
.tb{position:sticky;top:0;z-index:60;height:58px;display:flex;align-items:center;gap:22px;padding:0 24px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--edge2)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.dev{height:21px;width:26px;display:block}
.wm{height:11px;width:135px;display:block}
.brand .bar{width:1px;height:20px;background:var(--edge2);margin:0 4px}
.tabs{display:flex;height:100%}
.tabs button{position:relative;padding:0 16px;height:100%;color:var(--ink3);font:400 13px var(--sans);display:flex;align-items:center;gap:8px;transition:color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--accent);box-shadow:0 0 14px var(--glow)}
.nb{font:500 10px/1 var(--mono);padding:3px 6px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold),#000 var(--ctm));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.nb.hot{background:color-mix(in srgb,var(--over) 20%,transparent);color:color-mix(in srgb,var(--over),#000 var(--ctm));border-color:color-mix(in srgb,var(--over) 50%,transparent)}
.tbr{margin-left:auto;display:flex;align-items:center;gap:12px}
.pv{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--edge2);border-radius:99px;padding:6px 10px;white-space:nowrap}
.pv i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--edge2);border-radius:99px;padding:4px 6px 4px 5px;position:relative}
.who select{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--ink);font:400 12.5px var(--sans);padding:3px 18px 3px 0;outline:none;cursor:pointer;max-width:270px}
.who select option{background:var(--panel);color:var(--ink)}
.who::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border-right:1px solid var(--ink3);border-bottom:1px solid var(--ink3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--edge2);display:grid;place-items:center;color:var(--ink2)}
.ic:hover{color:var(--ink);border-color:var(--edge)}
.ic svg{width:15px;height:15px}
.av{--c:#888;flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:500 8.5px/1 var(--mono);letter-spacing:.02em;color:color-mix(in srgb,var(--c),#000 var(--ctm));background:color-mix(in srgb,var(--c) 17%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.av.lg{width:30px;height:30px;font-size:10.5px}

/* ---------- page ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:30px 28px 90px}
.hd{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.hd h1{font:300 34px/1.1 var(--sans);letter-spacing:-.01em;color:var(--ink)}
.hd h1 .serif{font-size:1.14em;color:var(--ink)}
.hd p{color:var(--ink3);margin-top:8px;font-size:13.5px}
.hd .sp{min-width:20px}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:99px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:99px;font:400 12px var(--sans);color:var(--ink3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button .n{font:500 9.5px var(--mono);opacity:.75}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge);border-radius:4px 4px 0;padding:8px 14px;font:500 12px var(--sans);color:var(--ink);white-space:nowrap;transition:border-color .2s,background .2s;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.btn:hover{border-color:var(--hl);background:var(--hov)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#17130a}
.btn.gold:hover{background:color-mix(in srgb,var(--gold),#fff 14%);border-color:transparent}
.btn.ghost{border-color:var(--edge2)}
.btn:disabled,.btn.off{opacity:.38;cursor:not-allowed;pointer-events:none}
.btn.over{border-color:color-mix(in srgb,var(--over) 60%,transparent);color:color-mix(in srgb,var(--over),#000 var(--ctm))}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--edge2);color:var(--ink2);white-space:nowrap}
.chip.gold{color:color-mix(in srgb,var(--gold),#000 var(--ctm));border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.chip.ok{color:color-mix(in srgb,var(--sage),#000 var(--ctm));border-color:color-mix(in srgb,var(--sage) 50%,transparent);background:color-mix(in srgb,var(--sage) 12%,transparent)}
.chip.over{color:color-mix(in srgb,var(--over),#000 var(--ctm));border-color:color-mix(in srgb,var(--over) 55%,transparent);background:color-mix(in srgb,var(--over) 12%,transparent)}
.chip.warn{color:color-mix(in srgb,var(--vine),#000 var(--ctm));border-color:color-mix(in srgb,var(--vine) 50%,transparent);background:color-mix(in srgb,var(--vine) 10%,transparent)}
.chip.ct{color:color-mix(in srgb,var(--c),#000 var(--ctm));border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.chip.tide{color:color-mix(in srgb,var(--tide),#000 var(--ctm));border-color:color-mix(in srgb,var(--tide) 50%,transparent);background:color-mix(in srgb,var(--tide) 10%,transparent)}
.gm{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#17130a;font:500 9.5px/1 var(--mono);flex:none;font-style:normal}
.sw{display:inline-flex;gap:3px;align-items:center}
.sw i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--ring);display:block}
input,select,textarea{font:400 12.5px var(--sans);color:var(--ink);background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--panel);color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:64px}
.tog{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px;cursor:pointer;user-select:none}
.tog i{width:30px;height:17px;border-radius:99px;border:1px solid var(--edge);position:relative;transition:.2s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink3);transition:.2s}
.tog.on i{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
.tog.on i::after{left:15px;background:var(--accent)}

/* ---------- desk ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.tile{padding:16px 18px 15px;--notch:12px}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c)}
.tile .v{font:300 36px/1.05 var(--sans);letter-spacing:-.02em;margin:10px 0 6px;color:var(--ink)}
.tile .v small{font:400 13px var(--sans);color:var(--ink3);letter-spacing:0;margin-left:4px}
.tile .s{color:var(--ink3);font-size:12px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,360px);gap:16px;align-items:start}
.panel{padding:0}
.ph{display:flex;align-items:center;gap:10px;padding:15px 18px 12px}
.ph h3{font:300 17px var(--sans);color:var(--ink)}
.ph h3 .serif{font-size:1.1em}
.ph .cnt{font:500 10px var(--mono);color:var(--ink3)}
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:4px minmax(150px,1.15fr) minmax(170px,1.5fr) 74px 28px 232px;gap:14px;align-items:center;padding:11px 18px 11px 0;border-top:1px solid var(--edge2);cursor:pointer;transition:background .15s}
.wr:hover{background:var(--hov)}
.wr .bar{align-self:stretch;background:var(--c);opacity:.85;margin:-11px 0}
.wr .nm{color:var(--ink);font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .sub{display:flex;gap:8px;align-items:center;color:var(--ink3);font-size:11.5px;margin-top:3px;white-space:nowrap}
.wr .what{color:var(--ink);font-size:12.5px}
.wr .what small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.wr .acts{display:flex;gap:6px;justify-content:flex-end}
.age{font:500 10.5px/1 var(--mono);padding:4px 7px;border-radius:99px;border:1px solid var(--edge2);color:var(--ink3);text-align:center;white-space:nowrap}
.age.warn{color:color-mix(in srgb,var(--vine),#000 var(--ctm));border-color:color-mix(in srgb,var(--vine) 50%,transparent)}
.age.over{color:color-mix(in srgb,var(--over),#000 var(--ctm));border-color:color-mix(in srgb,var(--over) 55%,transparent);background:color-mix(in srgb,var(--over) 11%,transparent)}
.age.ok{color:color-mix(in srgb,var(--sage),#000 var(--ctm));border-color:color-mix(in srgb,var(--sage) 45%,transparent)}
.more{padding:12px 18px;border-top:1px solid var(--edge2);color:var(--ink3);font-size:12px;display:flex;align-items:center;gap:10px}
.empty{padding:26px 18px;color:var(--ink3);text-align:center;border-top:1px solid var(--edge2)}
.side{display:flex;flex-direction:column;gap:16px}
.mrow{padding:13px 18px;border-top:1px solid var(--edge2)}
.mrow .t{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mrow .t b{font-weight:400;color:var(--ink);flex:1}
.mrow .amt{font:300 22px var(--sans);letter-spacing:-.01em}
.mrow .mini{color:var(--ink3);font-size:11.5px;margin-top:6px}
.meter{height:4px;border-radius:4px;background:var(--edge2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.pl{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--edge2)}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm span{color:var(--ink3);font-size:11.5px}
.wk{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--edge2)}
.wk .nm{flex:1}.wk .nm span{color:var(--ink3);font-size:11.5px;display:block}
.wk .n{font:300 20px var(--sans)}

/* ---------- pipeline ---------- */
.pipe{height:calc(100vh - 58px);display:flex;flex-direction:column;padding:16px 24px 0}
.jr{padding:12px 16px 12px;margin-bottom:12px;flex:none}
.jr-h{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.jr-h h2{font:300 17px var(--sans)}
.jr-h h2 .serif{font-size:1.1em}
.jr-h .rng{color:var(--ink3);font-size:12px}
.jr-h .nav{display:flex;gap:6px;margin-left:auto;align-items:center}
.jr-h .nav .ic{width:28px;height:28px}
.jr-ph{display:grid;grid-template-columns:repeat(10,1fr);margin-bottom:4px}
.jr-ph span{grid-column:var(--gc);border-top:2px solid var(--c);margin-right:4px;padding-top:6px;font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.jr-ph span em{font-style:normal;color:var(--ink4);letter-spacing:.04em;margin-left:7px;text-transform:none}
.jr-st{display:grid;grid-template-columns:repeat(10,1fr);position:relative}
.jr-s{position:relative;text-align:left;padding:6px 8px 7px;border-radius:3px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .15s}
.jr-s:hover{background:var(--hov)}
.jr-s .n{display:flex;align-items:center;justify-content:space-between;font:500 9.5px/1 var(--mono);color:var(--ink4);min-height:15px}
.jr-s .c{font:300 28px/1 var(--sans);letter-spacing:-.02em;color:color-mix(in srgb,var(--c),#000 var(--ctm));transition:color .2s,opacity .2s}
.jr-s .l{font:400 11.5px/1.2 var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-s .v{font:400 10.5px/1 var(--mono);color:var(--ink3)}
.jr-s:not(.in) .c{opacity:.4}
.jr-s:not(.in) .l{color:var(--ink3)}
.jr-win{position:absolute;top:0;bottom:0;border:1px solid var(--accent);border-radius:4px;background:color-mix(in srgb,var(--accent) 5%,transparent);box-shadow:0 0 20px -8px var(--glow),inset 0 0 18px -10px var(--glow);pointer-events:none;transition:left .1s linear,width .1s linear;z-index:1}
.jr-sl{height:16px;margin-top:9px;position:relative;cursor:pointer;touch-action:none}
.jr-sl .trk{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:4px;opacity:.45;
  background:linear-gradient(90deg,var(--tide) 0 30%,var(--vine) 30% 60%,var(--sage) 60% 80%,var(--rose) 80% 100%)}
.jr-th{position:absolute;top:1px;bottom:1px;border-radius:99px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));box-shadow:0 0 16px -4px var(--glow);cursor:grab;touch-action:none;min-width:34px;display:grid;place-items:center}
.jr-th:active,.jr-th.on{cursor:grabbing}
.jr-th::after{content:"";width:14px;height:6px;border-left:1px solid var(--accent);border-right:1px solid var(--accent);box-shadow:inset 3px 0 0 -2px transparent;opacity:.8;background:linear-gradient(90deg,transparent 4px,var(--accent) 4px 5px,transparent 5px 8px,var(--accent) 8px 9px,transparent 9px) center/100% 100% no-repeat;border:0}
.jr.all .jr-win,.jr.all .jr-sl,.jr.all .nav .ic{display:none}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;flex:none}
.filters input[type=search]{width:170px}
.filters select{min-width:104px}
.filters .sum{color:var(--ink3);font-size:12px;margin-left:auto;display:flex;gap:14px;align-items:center}
.filters .sum b{color:var(--ink);font-weight:400}
.boardwrap{flex:1;min-height:0;position:relative}
.boardwrap::before,.boardwrap::after{content:"";position:absolute;top:0;bottom:14px;width:42px;pointer-events:none;z-index:3;opacity:0;transition:opacity .2s}
.boardwrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.boardwrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.boardwrap.l::before,.boardwrap.r::after{opacity:1}
.board{position:relative;height:100%;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:12px}
.kcol{flex:0 0 254px;display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--edge2);border-top:2px solid var(--c);border-radius:4px;transition:border-color .15s,background .15s}
.kcol.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.kh{padding:11px 12px 8px;flex:none}
.kt{display:flex;align-items:baseline;gap:8px}
.kn{font:500 10px var(--mono)}
.kl{font:400 13px/1.2 var(--sans);color:var(--ink);flex:1;min-width:0}
.kc{font:300 20px/1 var(--sans);color:var(--ink2)}
.ks{font:400 11px/1.3 var(--sans);color:var(--ink3);margin-top:4px;min-height:14px;display:flex;align-items:center;gap:6px}
.kbody{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:7px}
.kempty{color:var(--ink4);text-align:center;padding:22px 8px;font-size:12px}
.kcard{--notch:8px;--nedge:var(--edge2);position:relative;background:linear-gradient(-45deg,transparent 50%,var(--nedge) 50% calc(50% + 1.5px),transparent calc(50% + 1.5px)) bottom right/var(--notch) var(--notch) no-repeat border-box,var(--panel2);
  border:1px solid var(--edge2);border-left:2px solid var(--st,var(--edge2));border-radius:4px 4px 0;clip-path:var(--notch-clip);padding:9px 10px 8px;cursor:pointer;transition:border-color .15s,transform .15s;flex:none}
.kcard:hover{border-color:var(--hl);border-left-color:var(--st,var(--hl));--nedge:var(--hl)}
.kcard.drag{opacity:.35}
.kcard.s-over{--st:var(--over)}.kcard.s-warn{--st:var(--vine)}
.k1{display:flex;align-items:baseline;gap:8px}
.k1 b{font-weight:400;font-size:13px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k1 .kp{font:400 11px var(--mono);color:var(--ink3)}
.k2{color:var(--ink3);font-size:11.5px;margin-top:2px}
.k3{display:flex;align-items:center;gap:9px;margin-top:8px;color:var(--ink2);font-size:11.5px}
.kb{display:flex;align-items:center;gap:6px;margin-top:8px;padding:5px 7px;border-radius:3px;font-size:11px;line-height:1.25;border:1px solid var(--edge2);color:var(--ink2)}
.kb.ap{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 9%,transparent);color:var(--ink)}
.kb.ch{border-style:dashed}
.kb.ch.over{border-color:color-mix(in srgb,var(--over) 55%,transparent);background:color-mix(in srgb,var(--over) 8%,transparent);color:var(--ink)}
.kb.ret{border-color:color-mix(in srgb,var(--over) 55%,transparent);color:var(--ink)}
.k4{display:flex;align-items:center;gap:8px;margin-top:9px}
.age .sh{display:none}
.gm.hol{background:none;border:1px dashed var(--ink3);color:transparent}
.kb.over .gm.hol,.kb.ret .gm{border-color:var(--over)}
.gm.rd{background:var(--over);color:#fff}
.board.fit .kcol{flex:1 1 0;min-width:118px}
.board.fit .age .lo{display:none}.board.fit .age .sh{display:inline}
.board.fit .kb{position:absolute;top:8px;right:7px;margin:0;padding:0;border:0;background:none}
.board.fit .kcard .k1 b{padding-right:20px}
.board.fit .kh{padding:9px 8px 6px}
.board.fit .kl{font-size:11.5px}
.board.fit .ks,.board.fit .k2,.board.fit .kp,.board.fit .kst,.board.fit .kb .t,.board.fit .k4 .av{display:none}
.board.fit .kcard{padding:7px 8px}
.board.fit .k3{margin-top:5px}
.board.fit .k4{margin-top:6px}

/* ---------- approvals ---------- */
.agrid{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;align-items:start}
.chain{padding:16px 18px 14px;margin-bottom:16px}
.cr{display:grid;grid-template-columns:repeat(8,1fr);position:relative;margin-top:14px}
.cn{position:relative;padding:0 6px;text-align:center;cursor:pointer}
.cn::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:1px;background:var(--edge)}
.cn:first-child::before{display:none}
.cn .d{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--panel);border:1px solid var(--edge);font:500 9.5px var(--mono);color:var(--ink3)}
.cn.done .d{background:color-mix(in srgb,var(--c) 85%,#000);border-color:transparent;color:#0b0c0d}
.cn.cur .d{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 16%,transparent)}
.cn .t{margin-top:8px;font-size:11.5px;color:var(--ink);line-height:1.25}
.cn .w{margin-top:3px;font-size:10.5px;color:var(--ink3);line-height:1.25}
.cn .k{margin-top:5px;font:500 9.5px var(--mono);color:var(--ink3)}
.cn.cnt .d::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;min-width:16px;height:16px;border-radius:99px;background:var(--gold);color:#17130a;font:500 9px/16px var(--mono);text-align:center}
.cn.sel .t{color:var(--accent)}
.alist{max-height:calc(100vh - 360px);overflow:auto}
.ai{display:block;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--edge2);position:relative}
.ai:hover{background:var(--hov)}
.ai.sel{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.ai.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.ai .a1{display:flex;align-items:center;gap:8px}
.ai .a1 b{font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai .a2{color:var(--ink3);font-size:11.5px;margin-top:4px;display:flex;gap:8px;align-items:center}
.gl{padding:9px 16px 6px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--edge2);background:var(--panel2)}
.det{padding:0}
.det .top{padding:20px 24px 16px;display:flex;gap:18px;align-items:flex-start}
.det h2{font:300 26px/1.15 var(--sans);letter-spacing:-.01em}
.det h2 .serif{font-size:1.1em}
.det .meta{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;color:var(--ink3);font-size:12px}
.det .sec{padding:16px 24px;border-top:1px solid var(--edge2)}
.ck{display:flex;gap:11px;align-items:flex-start;padding:9px 0;cursor:pointer;color:var(--ink2);font-size:13px;user-select:none}
.ck i{flex:none;width:18px;height:18px;border-radius:4px;border:1px solid var(--edge);display:grid;place-items:center;margin-top:1px;transition:.15s}
.ck.on{color:var(--ink)}
.ck.on i{background:var(--accent);border-color:var(--accent);color:#04121a}
.ck i svg{width:11px;height:11px;opacity:0}.ck.on i svg{opacity:1}
.fx{display:flex;flex-direction:column;gap:7px;color:var(--ink2);font-size:12.5px}
.fx div{display:flex;gap:9px;align-items:flex-start}
.fx div::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;opacity:.8}
.led{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc .chip{max-width:100%;white-space:normal;line-height:1.3}
.pc{padding:13px 14px;border:1px solid var(--edge2);border-radius:4px;background:var(--panel2)}
.pc .a{font:300 22px/1 var(--sans);letter-spacing:-.01em;margin:8px 0 8px}
.pc.cur{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.pc .ds{color:var(--ink3);font-size:11.5px;margin-top:7px}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--edge2);font-size:12.5px;color:var(--ink2)}
.log div:first-child{border-top:0}
.log .d{font:400 10.5px var(--mono);color:var(--ink3);padding-top:2px}

/* ---------- funnel ---------- */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.fun{display:grid;grid-template-columns:200px minmax(0,1fr) 150px;padding:6px 20px 20px}
.fun .col{display:flex;flex-direction:column}
.fun .r{height:40px;display:flex;align-items:center;gap:10px}
.fun .r .n{font:500 10px var(--mono);color:var(--ink4);width:18px}
.fun .r .l{color:var(--ink);font-size:13px}
.fun .r.num{justify-content:flex-end;gap:12px}
.fun .r.num b{font:300 20px var(--sans);width:40px;text-align:right}
.fun .r.num span{font:400 11px var(--mono);color:var(--ink3);width:64px;text-align:right}
.fun svg{display:block;width:100%;height:400px}
.bars{padding:4px 18px 14px}
.cb{display:grid;grid-template-columns:78px 1fr 28px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px;color:var(--ink2)}
.cb .tr{height:8px;border-radius:2px;background:var(--edge2);overflow:hidden}
.cb .tr i{display:block;height:100%;background:var(--c);border-radius:2px}
.cb .n{text-align:right;color:var(--ink);font:400 12px var(--mono)}
.mrow .amt small{font:400 12px var(--sans);color:var(--ink3);margin-left:6px;letter-spacing:0}
.bt{padding:12px 18px 2px;color:var(--ink3)}

/* ---------- drawer, modal, toast ---------- */
.shade{position:fixed;inset:0;background:var(--scrim);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--edge);z-index:100;transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.on{transform:none}
.dh{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:18px 24px 14px;border-bottom:1px solid var(--edge2);display:flex;gap:14px;align-items:flex-start}
.dh h2{font:300 28px/1.1 var(--sans);letter-spacing:-.01em}
.dh h2 .serif{font-size:1.12em}
.db{padding:18px 24px 80px;display:flex;flex-direction:column;gap:14px}
.hm{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center;padding:18px 20px}
.hm svg{width:100%;height:auto;display:block}
.fin{display:flex;flex-direction:column;gap:10px}
.fin div{display:flex;align-items:center;gap:10px;font-size:13px}
.fin .sq{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--ring);flex:none}
.fin small{display:block;color:var(--ink3);font-size:11px}
.hmedit{grid-column:1/-1;border-top:1px solid var(--edge2);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.hmrow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}
.hmrow .lab{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.hks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hk{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border:1px solid var(--edge2);border-radius:4px;text-align:left;color:var(--ink2);transition:border-color .15s,background .15s}
.hk b{font:500 13px var(--sans);color:var(--ink)}.hk small{font-size:11px;color:var(--ink3)}
.hk:hover:not(:disabled){border-color:var(--edge)}
.hk.on{border-color:var(--ink);background:var(--hov)}
.hk:disabled{opacity:.45;cursor:not-allowed}
.sws2{display:flex;gap:6px;flex-wrap:wrap}
.swb{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border:1px solid var(--edge2);border-radius:99px;color:var(--ink2);font-size:12px;transition:border-color .15s,background .15s}
.swb i{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--ring);flex:none}
.swb:hover{border-color:var(--edge)}
.swb.on{border-color:var(--ink);background:var(--hov);color:var(--ink)}
.hmlock{margin:-4px 0 0 130px}
.fu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border:1px solid var(--edge2);border-radius:6px}.fu b{font-weight:500;color:var(--ink)}.fu.over{border-color:color-mix(in srgb,var(--bad,#e5736a) 55%,transparent)}.fu.over b,.fu.over .small{color:var(--bad,#e5736a)}.fu .sp{flex:1}
.oline{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--edge2);border-radius:6px}
.olh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.olh .sp{flex:1}
.olp{font-size:12.5px;color:var(--ink3)}.olp b{color:var(--ink);font-weight:500}
.qty{display:inline-flex;align-items:center;gap:0;border:1px solid var(--edge2);border-radius:4px;overflow:hidden;width:max-content}
.qty button{width:40px;height:38px;font-size:18px;color:var(--ink2)}.qty button:hover:not(:disabled){background:var(--hov)}.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty input{width:56px;height:38px;text-align:center;border:0;border-left:1px solid var(--edge2);border-right:1px solid var(--edge2);border-radius:0;background:transparent;font-size:15px;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.otot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--edge);border-radius:6px;background:var(--hov)}.otot span{color:var(--ink2);font-size:13px}.otot b{font:300 24px var(--sans);color:var(--ink)}
.hmask{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:11px 14px;border:1px dashed var(--edge);border-radius:4px;color:var(--ink2);font-size:12.5px}
.hmask .lab{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:inline-flex;align-items:center;gap:7px}
.hmask .lab svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hmask .pv{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.hmask .pv i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--ring);flex:none}
.hmask .pv.none{color:var(--ink3)}
.was{font-size:11px;color:var(--ink3);align-self:center}
.hmwas{margin:-6px 0 0 130px}
@media(max-width:620px){.hmrow{grid-template-columns:1fr;gap:6px}.hmlock{margin-left:0}}
.mj{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:12px}
.mj i{height:6px;border-radius:2px;background:var(--edge2);display:block}
.mj i.d{background:var(--c)}
.mj i.c{background:var(--c);box-shadow:0 0 10px var(--c)}
.mjl{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}
.mjl span{font:400 9px/1.2 var(--mono);color:var(--ink4);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mjl span.c{color:var(--ink)}
.now{padding:18px 20px}
.now .q{font:300 21px/1.25 var(--sans);margin:8px 0 14px}
.now .q .serif{font-size:1.1em}
.modalbg{position:fixed;inset:0;z-index:120;background:var(--scrim);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modalbg.on{opacity:1;pointer-events:auto}
.modal{width:min(520px,100%);padding:22px 24px}
.modal.wide{width:min(740px,100%);max-height:calc(100vh - 40px);overflow:auto}
.nt h5{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:20px 0 10px}
.nt ul,.nt ol{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;display:flex;flex-direction:column;gap:7px}
.nt li::marker{color:var(--accent)}
.nt b{color:var(--ink);font-weight:500}
.modal h4{font:300 21px var(--sans);margin-bottom:6px}
.modal p{color:var(--ink3);margin-bottom:14px}
.pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pick button{padding:6px 11px;border:1px solid var(--edge);border-radius:99px;font-size:12px;color:var(--ink2)}
.pick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,18px);z-index:200;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1180px){.tiles{grid-template-columns:repeat(3,1fr)}.dgrid,.agrid,.fgrid{grid-template-columns:1fr}.alist{max-height:none}}
@media(max-width:860px){
  .tb{padding:0 14px;gap:12px;overflow-x:auto}.brand .wm,.brand .bar,.pv{display:none}.tabs button{padding:0 11px}.tabs button.on::after{left:11px;right:11px}
  .wrap{padding:20px 14px 80px}.hd h1{font-size:27px}.tiles{grid-template-columns:repeat(2,1fr)}
  .wr{grid-template-columns:4px 1fr auto;gap:8px 10px;padding-right:12px}.wr .what{grid-column:2/4;order:3}.wr .age{order:2}.wr .av,.wr .sub .sw{display:none}.wr .acts{grid-column:2/4;order:4;justify-content:flex-start}
  .pipe{padding:12px 12px 0}.jr-ph em,.jr-s .v{display:none}.jr-s .l{font-size:10px}.jr-s .c{font-size:22px}.jr-s{padding:5px 4px}
  .cr{grid-template-columns:repeat(4,1fr);row-gap:18px}.cn:nth-child(4n+1)::before{display:none}
  .led{grid-template-columns:1fr}.hm{grid-template-columns:1fr}.fun{grid-template-columns:130px minmax(0,1fr) 98px;padding:4px 12px 16px}.fun .r.num span{display:none}.fun .r .n{display:none}
}

/* ---------- the rest of the app, in the same language ---------- */
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--edge2);border-radius:99px;padding:4px 12px 4px 5px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.card{padding:18px 20px}
.tablewrap{overflow:auto;padding:0}
.grid{display:grid}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.small{font-size:12px;color:var(--ink3)}
.tag{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.wrapx{flex-wrap:wrap}
.banner{margin:0 0 16px;padding:12px 16px;border:1px solid var(--edge2);border-radius:4px;color:var(--ink2);font-size:12.5px;background:var(--panel)}
.banner b{color:var(--ink);font-weight:500}
.banner.warn{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--over) 60%,transparent)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--edge2);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--edge2);color:var(--ink2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click:hover{background:var(--hov);cursor:pointer}
td.tt{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:116px 1fr;gap:8px 12px;font-size:12.5px;color:var(--ink)}
.kv dt{color:var(--ink3)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
label.f{display:flex;flex-direction:column;gap:6px;font:500 9.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;width:100%}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pickchip{padding:6px 12px;border-radius:99px;border:1px solid var(--edge);font-size:12px;color:var(--ink2)}
.pickchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pickchip:disabled{opacity:.5;cursor:default}
.email{background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;padding:14px;font:400 11.5px/1.7 var(--mono);color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.email mark{background:color-mix(in srgb,var(--sage) 30%,transparent);color:var(--ink);border-radius:3px;padding:0 3px}
.cplog .s{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--edge2);font-size:12.5px;color:var(--ink2)}

.dsteps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:14px 0 4px}
.dsteps div{height:6px;border-radius:3px;background:var(--edge2)}
.dsteps div.d{background:var(--sage)}
.dsteps div.c{background:var(--accent);box-shadow:0 0 10px var(--glow)}
.dlab{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:10px;color:var(--ink3);line-height:1.25}
.dlab span.c{color:var(--ink)}
.signin{max-width:480px;margin:90px auto;text-align:center}
.swc{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ring);vertical-align:-1px}
.chip.green{color:color-mix(in srgb,var(--sage),#000 var(--ctm));border-color:color-mix(in srgb,var(--sage) 50%,transparent)}
.bar2{height:5px;border-radius:3px;background:var(--edge2);overflow:hidden;margin-top:9px}

.btn.red{color:color-mix(in srgb,var(--over),#000 var(--ctm));border-color:color-mix(in srgb,var(--over) 45%,transparent)}
.panel .tablewrap{clip-path:none}
.modal .lead{color:var(--ink3);margin-bottom:14px;font-size:12.5px}
.kcard.drag{opacity:.35}
.alist .kcard{width:100%;text-align:left}
body.embed .brand{display:none}

@media(max-width:900px){.grid2,.grid3,.formgrid{grid-template-columns:1fr}}

/* ---------- commission ---------- */
.cmgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.cmamt{font:300 17px/1.1 var(--sans);letter-spacing:-.01em;color:var(--ink);margin-top:6px}
.cmbar{display:flex;height:4px;border-radius:4px;overflow:hidden;background:var(--edge2);margin-top:7px;min-width:90px}
.cmbar i{display:block;height:100%}
.cmbar .p{background:var(--sage)}.cmbar .d{background:var(--gold)}.cmbar .h{background:var(--tide)}.cmbar .l{background:var(--ink4)}
.cmkey{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink3);font-size:11.5px}
.cmkey span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--k)}
.cmkey span:last-child::before{display:none}
.rates{padding:0 18px 8px}
.rates table td,.rates table th{padding:11px 4px}
.rates input{width:92px;text-align:right;padding:6px 8px}
.rates td.lab{color:var(--ink)}
.rates td.lab small{display:inline;margin-left:8px;color:var(--ink3);font-size:11px}
.flow{padding:4px 18px 16px;display:flex;flex-direction:column}
.fstep{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--edge2);align-items:start}
.fstep:first-child{border-top:0}
.fstep b{font-weight:400;color:var(--ink)}
.fstep small{display:block;color:var(--ink3);font-size:11.5px;margin-top:3px}
.split{display:flex;height:6px;border-radius:4px;overflow:hidden;margin:2px 18px 14px;gap:3px}
.split i{flex:1;background:var(--gold);opacity:.9}.split i+i{background:var(--sage)}
.earn{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--edge2)}
.earn .nm{flex:1;min-width:0}.earn .nm b{display:block;font-weight:400;color:var(--ink)}.earn .nm span{color:var(--ink3);font-size:11.5px}
.gcard{margin-bottom:16px}
.gcard .gh{display:flex;align-items:center;gap:14px;padding:16px 18px 12px;flex-wrap:wrap}
.gcard .gh h3{font:300 18px var(--sans)}
.gcard .gt{display:flex;gap:24px;margin-left:auto}
.gcard .gt div{text-align:right}.gcard .gt b{display:block;font:300 20px/1 var(--sans);letter-spacing:-.01em;font-weight:300}.gcard .gt span{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.notes{padding:4px 18px 16px;color:var(--ink2);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.notes div{display:flex;gap:10px}.notes div::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:7px}
.notes b{color:var(--ink);font-weight:500}
.hc{min-width:150px}
.mystats{display:flex;gap:44px;padding:2px 18px 18px;flex-wrap:wrap}
.mystats b{display:block;font:300 28px/1 var(--sans);letter-spacing:-.01em;margin-bottom:8px}
.mystats span{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.drawer.wide{width:min(980px,100%)}
.stg{display:flex;flex-direction:column;margin-top:8px}
.stgi{display:grid;grid-template-columns:28px 1fr auto;gap:14px;padding:16px 0;border-top:1px solid var(--edge2);align-items:start}
.stgi:first-child{border-top:0}
.stgi b{font-weight:400;color:var(--ink)}
.stgi small{display:block;color:var(--ink3);font-size:11.5px;margin-top:3px}
.stgi .meta2{color:var(--ink3);font-size:11.5px;margin-top:6px}
.stgi.paid .gm{background:var(--sage)}
.stgi.later .gm,.stgi.hold .gm{background:var(--edge);color:var(--ink2)}
.stgi .btn{margin-top:8px}
.staged{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dn{padding:12px 0;border-top:1px solid var(--edge2);color:var(--ink2);font-size:12.5px}
.dn .m{color:var(--ink3);font-size:11.5px;margin-bottom:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dn .m b{color:var(--ink);font-weight:400}
.cmgrid td.tt,.cmgrid td.tt .small,.drawer td.tt,.drawer td.tt .small{white-space:normal}
.cmgrid td.tt .small{max-width:300px}
.tabs button{white-space:nowrap;padding:0 13px}
.tabs button.on::after{left:13px;right:13px}
@media(max-width:1500px){.brand .bar,.brand .eb{display:none}.tb{gap:14px}}
@media(max-width:1340px){.me>span:last-child{display:none}.tabs button{padding:0 10px}.tabs button.on::after{left:10px;right:10px}}
@media(max-width:1180px){.cmgrid{grid-template-columns:1fr}}

function $(s,r){return (r||document).querySelector(s)}function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

function now(){return Date.now()}
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function fmtD(t){return t?new Date(t).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):''}

function fmtDT(t){return t?new Date(t).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):''}
function money(n){return n?'$'+Math.round(n).toLocaleString('en-AU'):'-'}
function mshort(n){return n>=1e6?'$'+(n/1e6).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'m':n>=1e3?'$'+Math.round(n/1e3)+'k':'$'+Math.round(n||0)}
function pct(a,b){return b?Math.round(a/b*1000)/10:0}
function pad(n){return n<10?'0'+n:''+n}
function fmtAge(d){return d<1/24?Math.max(1,Math.round(d*1440))+'m':d<1?Math.round(d*24)+'h':Math.floor(d)+'d'}
function ageWords(d){return d<1?fmtAge(d):Math.floor(d)+(Math.floor(d)===1?' day':' days')}
function ini(n){return String(n||'?').split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}

var SOURCES=['Facebook','Instagram','LinkedIn','Google search','Website direct','Agent referral','Other'];
var SETTING=['City','Coast','Country','Not sure yet'],PAY=['No preference','Cash','Finance','Undecided'],DELIV=['No preference','Supply','Delivered','Installed'];

 pre:{role:'fin',ask:'Confirm the pre-order deposit',chase:'Awaiting the pre-order deposit',short:'Pre-order deposit',sla:1,csla:3,money:1,badge:'Finance to confirm'},

function api(a,body){
  return fetch('/api/sales',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({a:a},body||{}))}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401){S.error='signin';throw new Error('signin')}
      if(!r.ok)throw new Error(j.error||j.message||'That did not work.');
      if(j.setup===false){S.setup=j.message;throw new Error(j.message)}
      return j;
    });
  });
}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},3400)}
function fail(e){if(e&&e.message==='signin')return;toast(e&&e.message?e.message:'That did not work.')}
function load(){
  return api('init').then(function(j){
    S.me=j.me;S.leads=j.leads;S.companies=j.companies||[];S.agents=j.agents||[];S.settings=j.settings;S.inbox=j.inbox||[];S.mail=j.mail;S.team=j.team||[];S.staff=j.staff||[];S.now=j.now;S.ready=true;S.error='';S.setup='';

  }).catch(function(e){S.ready=true;if(!S.error&&!S.setup)S.error=e.message});
}
function poll(){
  if(!S.me||document.hidden||UI.modal)return;
  api('poll',{since:S.now}).then(function(j){
    var changed=false;
    j.leads.forEach(function(l){var i=S.leads.findIndex(function(x){return x.id===l.id});if(i<0){S.leads.unshift(l);changed=true}else if(l.updated>(S.leads[i].updated||0)){S.leads[i]=l;changed=true}});
    if(JSON.stringify(j.inbox.map(function(m){return m.id+m.status}))!==JSON.stringify(S.inbox.map(function(m){return m.id+m.status}))){S.inbox=j.inbox;changed=true}
    S.mail=j.mail;S.now=j.now;
    if(changed&&!UI.lead&&document.activeElement&&['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName)<0)render();

function announce(){try{parent.postMessage({hbSales:{open:S.leads.filter(function(l){return l.status==='open'&&!l.concept&&l.stage<7}).length}},'*')}catch(e){}}

/* ---------- people, leads, money ---------- */
function agentById(id){return S.agents.find(function(a){return a.id===id})}
function teamById(id){return S.team.find(function(t){return t.id===id})}
function staffById(id){return S.staff.find(function(t){return t.id===id})}
function ownerName(id){var t=teamById(id)||staffById(id);if(t)return t.name;var a=agentById(id);return a?a.name:(id?'Unknown':'Unassigned')}
function firstName(id){return String(ownerName(id)).split(' ')[0]}
function companyById(id){return S.companies.find(function(c){return c.id===id})}
function ownerCompany(id){var a=agentById(id);var c=a&&companyById(a.companyId);return c?c.name:(teamById(id)?'HAAVN BLACK Direct':'')}
function lead(id){return S.leads.find(function(l){return l.id===id})}
/* the order: a customer can buy several dwellings, each line its own model, number and finishes. A customer with no list has the one home they always had. */
function lines(l){if(l.homes&&l.homes.length)return l.homes;return SOLUM.indexOf(l.product)>=0?[{id:'h0',product:l.product,qty:1,clad:l.clad||'',pal:l.pal||'',join:l.join||''}]:[]}
function units(l){return lines(l).reduce(function(n,h){return n+h.qty},0)}
function lineName(h){return (h.qty>1?h.qty+' × ':'')+PRODUCTS[h.product].n}
function words(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1]}
function home(l){var ls=lines(l);return ls.length?words(ls.map(lineName)):(PRODUCTS[l.product]?PRODUCTS[l.product].n:'No preference')}
function homeShort(l){var ls=lines(l);if(!ls.length)return (PRODUCTS[l.product]||PRODUCTS.none).s;if(ls.length===1)return (ls[0].qty>1?ls[0].qty+' × ':'')+PRODUCTS[ls[0].product].s;return ls.map(function(h){return h.qty+' '+PRODUCTS[h.product].s}).join(' + ')}
function homeLine(l){var ls=lines(l);if(ls.length===1&&ls[0].qty===1){var p=PRODUCTS[ls[0].product];return p.n+' · '+p.m2+' m²'}return ls.length?home(l)+' · '+units(l)+' homes':(PRODUCTS[l.product]||PRODUCTS.none).n}

  else if(l.stage===7&&l.order){
    var o=l.order;
    if(!o.handoverAt){it.k='handover';it.role='con';it.txt='Send the handover to projects';it.sla=1;it.amt=price(l);it.age=(now()-(l.gateAt||l.lastTouch||l.created))/DAY}
    else if(now()-o.lastUpdate>=14*DAY){it.k='update';it.role='sales';it.txt='Send the fortnightly update';it.sla=14;it.age=(now()-o.lastUpdate)/DAY;it.amt=price(l)}
    else return null;
  }else return null;

  if(l.gate==='final'&&l.order&&l.order.depart){it.dep=(l.order.depart-now())/DAY;it.urgent=!l.paid&&it.dep<=5}

  return it;
}

  var from=l.stage,to=from+1,e=addAct(l,'Moved to '+ST[to].n+' by '+S.me.name+'.');

/* ---------- DESK: what is outstanding and what needs following up ---------- */
function money3(){
  var ls=visible().filter(function(l){return !l.concept&&l.status==='open'}),sum=function(a,f){return a.reduce(function(s,l){return s+f(l)},0)};
  var p=ls.filter(function(l){return l.stage===3}),d=ls.filter(function(l){return l.stage===5}),f=ls.filter(function(l){return l.stage===8});
  var nx=f.filter(function(l){return l.order&&l.order.depart}).map(function(l){return l.order.depart}).sort()[0]||0;
  return {pre:{n:p.length,amt:p.length*pre(),paid:p.filter(function(l){return l.paid}).length},dep:{n:d.length,amt:sum(d,depBal),inv:d.filter(function(l){return l.gate==='invoice'}).length,paid:d.filter(function(l){return l.gate==='dep'&&l.paid}).length},fin:{n:f.length,amt:sum(f,finalAmt),paid:f.filter(function(l){return l.paid}).length,next:nx}};
}
function received(since,until){
  var t={pre:0,dep:0,fin:0};
  visible().forEach(function(l){(l.appr||[]).forEach(function(a){if(a.at>=since&&a.at<(until||1e15)){if(a.g==='pre')t.pre+=pre();else if(a.g==='dep')t.dep+=depBal(l);else if(a.g==='final')t.fin+=finalAmt(l)}})});
  t.all=t.pre+t.dep+t.fin;return t;
}

  var l=it.l,bar=it.gate?(it.role==='con'?'var(--rose)':'var(--gold)'):phc(l.stage),mineIt=it.gate&&canGate(it.gate);
  var who=it.k==='approve'&&mineIt?'yours to approve':it.role==='sales'?'with '+firstName(l.owner):'with '+roleWho(it.role);
  var what=esc(it.txt)+'<small>'+(it.amt?money(it.amt)+' · ':'')+(it.dep!=null?'leaves '+(portOf(l)||'port').replace('Port of ','')+' in '+Math.max(0,Math.ceil(it.dep))+' days':who)+'</small>';

  var acts='',chased=l.chased&&now()-l.chased<DAY;

function filt(ls){var f=UI.f;return ls.filter(function(l){

/* The server decides what each person may see (api/_utils/sales.js, the `commission` action): directors and the admin team get everyone, an agent gets only their own, and only Finance and directors may change anything. */
UI.cm={mode:'agent',f:'all',o:''};UI.stmt=null;UI.deal=null;

  return api('commission').then(function(j){S.comm=j;S.commErr='';if(quiet&&UI.view!=='comm')$('#top').innerHTML=topHTML();else if(!(quiet&&(UI.deal||UI.stmt||UI.modal)))render()}).catch(function(e){if(e&&e.message==='signin')return;S.commErr=e&&e.message?e.message:'That did not work.';if(UI.view==='comm')render()});
