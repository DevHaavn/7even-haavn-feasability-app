<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAAVN · Entrance preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PREVIEW ONLY — the HAAVN wordmark entrance. Not linked from anywhere.

   Three pieces, cut on true vertical stem edges so nothing is sliced:
     H       0      → 21.71%   (the H's right stem ends at px 520 of 2400)
     A A V   21.71% → 76.833%  (static — it never moves)
     N       76.833% → 100%    (the N's left stem starts at px 1844)

   The H flies in from off-screen left and the N from off-screen right, both
   landing at the 3 second mark. Then the assembled wordmark flicks through
   four of Seth's greens and settles on black.

   Each piece is the SAME artwork used as a mask over a solid colour — that is
   what lets the colour flick hit the exact palette hexes, and it means a
   redrawn wordmark needs no re-cutting, just new percentages.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#e2e4e2;
  --ink:#101010; --ink-3:#6c6e6c; --ink-4:#9a9c9a;
  --lime:#a8bc10; --lime-txt:#687808;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --in:3s;                    /* everything lands on this mark */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:300;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
#stage .wash{position:absolute;inset:0;
  background:radial-gradient(100% 70% at 50% 26%, rgba(168,188,16,.06) 0%, rgba(226,228,226,0) 60%)}
#stage .vig{position:absolute;inset:0;
  background:radial-gradient(140% 120% at 50% 46%, rgba(226,228,226,0) 42%, rgba(168,170,168,.24) 100%)}
#stage .device{position:absolute;right:-6vw;bottom:-7vh;width:min(39vw,630px);height:auto;
  opacity:0;animation:deviceIn 2.4s ease 2.4s forwards}
@keyframes deviceIn{to{opacity:.26}}

#shell{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 clamp(16px,3.4vw,46px)}

/* ── the wordmark, in three pieces ───────────────────────────────────── */
.mk{position:relative;width:min(54vw,620px);aspect-ratio:2400/281}
.mk span{position:absolute;inset:0;display:block;background:var(--ink);
  -webkit-mask:url(assets/brand/haavn-wordmark-black.png) center/100% 100% no-repeat;
          mask:url(assets/brand/haavn-wordmark-black.png) center/100% 100% no-repeat;
  filter:drop-shadow(0 10px 26px rgba(16,16,16,.14))}
.mk .h{clip-path:inset(0 78.29% 0 0);      transform:translateX(-128vw)}
.mk .m{clip-path:inset(0 23.167% 0 21.71%)}
.mk .n{clip-path:inset(0 0 0 76.833%);     transform:translateX(128vw)}

.mk.go .h{animation:slideL 2.9s cubic-bezier(.16,.86,.26,1) .1s forwards,
                    flick  1.6s ease var(--in) forwards}
.mk.go .n{animation:slideR 2.4s cubic-bezier(.16,.86,.26,1) .6s forwards,
                    flick  1.6s ease var(--in) forwards}
.mk.go .m{animation:flick  1.6s ease var(--in) forwards}
@keyframes slideL{to{transform:translateX(0)}}
@keyframes slideR{to{transform:translateX(0)}}
/* four of Seth's greens, then home to black */
@keyframes flick{
   0%,  9%{background:#d4e84a}
  13%, 22%{background:#bdd420}
  26%, 35%{background:#a8bc10}
  39%, 48%{background:#687808}
  62%,100%{background:#101010}
}

.subline{margin-top:clamp(18px,2.8vh,32px);display:flex;align-items:center;gap:16px;opacity:0}
.mk.go ~ .subline{animation:fade 1.3s ease calc(var(--in) + 1.5s) forwards}
.subline span{font-family:var(--f-mono);font-size:9px;letter-spacing:.42em;color:var(--ink-3);white-space:nowrap}
.subline .dot{width:4px;height:4px;border-radius:50%;background:var(--lime-txt)}
@keyframes fade{to{opacity:1}}

/* ── preview controls (never ship) ───────────────────────────────────── */
.ctl{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:20;display:flex;gap:8px}
.ctl button{padding:9px 16px;border:1px solid transparent;border-radius:2px;
  border-image:linear-gradient(180deg,#4a4a4a 0%,#141414 32%,#000 58%,#2e2e2e 88%,#181818 100%) 1;
  background:rgba(250,251,250,.06);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);
  transition:.3s}
.ctl button:hover{background:rgba(250,251,250,.2);box-shadow:inset 3px 0 0 var(--lime)}
.note{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;
  font-family:var(--f-mono);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-4)}
</style>
</head>
<body>

<div id="stage">
  <div class="wash"></div>
  <img class="device" src="assets/brand/haavn-device-d4e84a.png" alt="">
  <div class="vig"></div>
</div>

<div id="shell">
  <div class="mk" id="mk">
    <span class="h"></span>
    <span class="m"></span>
    <span class="n"></span>
  </div>
  <div class="subline">
    <span>A SUPPLY BUSINESS</span><span class="dot"></span><span>NOT A BUILDER</span>
  </div>
</div>

<div class="ctl"><button id="replay">&#8635; Replay</button></div>
<div class="note">Preview &nbsp;·&nbsp; H and N move &nbsp;·&nbsp; 3 seconds in, then the colour flick</div>

<script>
(function(){
  var mk = document.getElementById('mk');
  function play(){ mk.classList.remove('go'); void mk.offsetWidth; mk.classList.add('go'); }
  document.getElementById('replay').addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
