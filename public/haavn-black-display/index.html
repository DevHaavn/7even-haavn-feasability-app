body{font:300 17px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:0;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:0;-webkit-tap-highlight-color:transparent;text-align:left}
img{display:block}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#logo:hover{background:var(--gold)}
#where{font-size:14px;color:var(--ink3)}
#top .sp{flex:1}
.tb{font-size:15px;color:var(--ink2);padding:8px 2px;transition:color .25s}
.tb:hover,.tb[aria-expanded=true]{color:var(--gold)}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--pad);
  background:linear-gradient(0deg,rgba(5,5,6,.9),rgba(5,5,6,0))}
#scenes{display:flex;gap:clamp(14px,2.2vw,34px);overflow-x:auto;scrollbar-width:none}
#scenes::-webkit-scrollbar{display:none}
#scenes button{font-size:15px;color:rgba(241,241,238,.72);padding:8px 0;border-top:1px solid transparent;white-space:nowrap;transition:color .25s,border-color .25s;position:relative}
#scenes button:hover{color:var(--gold);border-top-color:var(--gold)}
#scenes button[aria-current=true]{color:var(--ink);border-top-color:var(--ink)}
#tod{display:flex;gap:16px;font-size:15px}
#tod button{color:var(--ink3);padding:8px 0;transition:color .25s}
#tod button:hover{color:var(--gold)}
#tod button[aria-pressed=true]{color:var(--ink)}
#dots{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(var(--bar) - 1px);height:1px;background:var(--line);z-index:39}
#dots i{display:block;height:1px;background:var(--ink);transition:width .6s var(--ease);width:0}

/* ── scenes ───────────────────────────────────────────────── */
#stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility 0s .8s}
.scene.on{opacity:1;visibility:visible;transition:opacity .8s var(--ease),visibility 0s}
.bg{position:absolute;inset:0;background:#0b0b0c;overflow:hidden}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.bg img.on{opacity:1}
.bg .pend{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--ink3);font-size:16px;text-align:center;padding:0 20px}
.bg.missing .pend{display:flex}
.shade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(5,5,6,.82) 0%,rgba(5,5,6,.5) 30%,rgba(5,5,6,0) 62%),
  radial-gradient(130% 100% at 0% 100%,rgba(5,5,6,.92),rgba(5,5,6,0) 68%),
  radial-gradient(60% 50% at 100% 100%,rgba(5,5,6,.8),rgba(5,5,6,0) 70%),
  linear-gradient(180deg,rgba(5,5,6,.55) 0,rgba(5,5,6,0) 20%)}
.shade.deep{background:linear-gradient(180deg,rgba(5,5,6,.7) 0,rgba(5,5,6,.35) 45%,rgba(5,5,6,.6) 100%)}
.cap{position:absolute;left:var(--pad);bottom:calc(var(--bar) + 44px);max-width:min(560px,86vw);z-index:5}
.eb{font-size:14px;color:var(--ink3)}
.cap h1,.cap h2{font-weight:300;font-size:clamp(34px,4vw,64px);line-height:1.05;margin-top:12px}
.cap .p{margin-top:18px;color:var(--ink2);max-width:46ch}
.cap .spec{margin-top:16px;color:var(--ink);font-size:17px;line-height:1.5}
.nums{display:flex;flex-wrap:wrap;gap:12px 44px;margin-top:30px}
.nums .v{font-size:clamp(22px,2.1vw,32px);line-height:1.1}
.nums .l{font-size:13px;color:var(--ink3);margin-top:2px}
.nums>div:first-child .v{color:var(--gold)}

/* open */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;z-index:5;padding:clamp(110px,22vh,240px) var(--pad) 0}

.center .lead{margin-top:34px;font-size:clamp(20px,2vw,30px);color:var(--ink2)}
.center .hint{position:absolute;left:0;right:0;bottom:calc(var(--bar) + 26px);font-size:14px;color:var(--ink2)}

/* range */
.tiles{position:absolute;left:0;right:0;top:0;bottom:calc(var(--bar) + 120px);display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tile{position:relative;overflow:hidden;display:block;width:100%;height:100%}
.tile .bg img{transition:opacity 1.1s ease,transform 2.4s var(--ease)}
.tile:hover .bg img.on{transform:scale(1.03)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,6,.97) 0%,rgba(5,5,6,.86) 26%,rgba(5,5,6,.45) 50%,rgba(5,5,6,0) 74%),linear-gradient(180deg,rgba(5,5,6,.6) 0,rgba(5,5,6,0) 22%)}
.tile .tc{position:absolute;left:var(--pad);right:var(--pad);bottom:26px;z-index:3}
.tile h2{font-weight:300;font-size:clamp(34px,4vw,64px);line-height:1.05;margin-top:10px;transition:color .3s}
.tile:hover h2{color:var(--gold)}
.tile .p{margin-top:14px;color:var(--ink2);max-width:40ch;font-size:16px}
.strip{position:absolute;left:0;right:0;bottom:var(--bar);height:120px;z-index:6;display:grid;grid-template-columns:minmax(260px,36%) 1fr;gap:var(--pad);padding:18px var(--pad) 0;background:var(--bg);border-top:1px solid var(--line2)}
.more{display:flex;gap:6px 26px;flex-wrap:wrap;align-content:flex-start;font-size:14px;color:var(--ink3)}
.more .t{flex:0 0 100%}
.more span b{font-weight:300;color:var(--ink2)}
.statement{color:var(--ink2);font-size:15px;line-height:1.5;max-width:46ch}

/* inside */
.in{position:absolute;inset:0;display:grid;grid-template-columns:minmax(280px,30%) 1fr;gap:clamp(20px,3vw,56px);padding:calc(var(--top) + 6px) var(--pad) calc(var(--bar) + 26px)}
.in .l{display:flex;flex-direction:column;min-height:0;overflow:auto;scrollbar-width:none}
.in .l::-webkit-scrollbar{display:none}
.rooms{margin-top:20px;border-top:1px solid var(--line)}
.rooms button{display:flex;justify-content:space-between;width:100%;padding:11px 0;border-bottom:1px solid var(--line);color:rgba(241,241,238,.72);font-size:17px;transition:color .25s,border-color .25s}
.rooms button:hover{color:var(--gold);border-bottom-color:var(--gold)}
.rooms button[aria-current=true]{color:var(--ink);border-bottom-color:var(--ink)}
.grp{margin-top:22px}
.grp .gl{font-size:13px;color:var(--ink3);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px 8px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 8px;border:1px solid var(--line);font-size:15px;color:var(--ink2);transition:color .25s,border-color .25s}
.chip i{display:block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.chip:hover{color:var(--gold);border-color:var(--gold)}
.chip[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.chip[disabled]{opacity:.35;cursor:default;border-style:dashed}
.chip[disabled]:hover{color:var(--ink2);border-color:var(--line)}
.in .r{display:flex;flex-direction:column;min-height:0;gap:20px}
.in .why{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:start;color:var(--ink2);font-size:16px;line-height:1.5}
.in .why h3{font-weight:300;font-size:clamp(22px,2vw,32px);line-height:1.15;color:var(--ink);margin-bottom:8px}
.in .why .ft{margin-top:10px;color:var(--ink);font-size:16px;line-height:1.5}
.in .why .s{color:var(--ink3);font-size:14px}
.frame{position:relative;min-height:0;flex:1;display:flex;align-items:center;justify-content:center}
.frame .bg{position:relative;inset:auto;width:100%;height:100%;background:#0b0b0c}
.frame .bg img{object-fit:contain}
.frame .tag{position:absolute;right:0;top:-2px;transform:translateY(-100%);font-size:13px;color:var(--ink3)}

/* outside config */
.cfg{position:absolute;right:var(--pad);bottom:calc(var(--bar) + 44px);z-index:6;display:flex;flex-direction:column;gap:20px;align-items:flex-end}
.cfg .gl{font-size:13px;color:var(--ink3);margin-bottom:10px;text-align:right}
.sws{display:flex;gap:12px}
.sw{position:relative;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);transition:box-shadow .25s,transform .25s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed=true]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 0 0 2px #050506,0 0 0 3px var(--gold)}
.sw[disabled]{opacity:.3;cursor:default}
.sw[disabled]:hover{transform:none}
.views{display:flex;gap:6px}
.views button{width:38px;height:34px;border:1px solid var(--line);color:var(--ink2);text-align:center;font-size:15px;transition:color .25s,border-color .25s}
.views button:hover{color:var(--gold);border-color:var(--gold)}
.views button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}

/* plan */
.pl{position:absolute;inset:0;padding:calc(var(--top) + 12px) var(--pad) calc(var(--bar) + 26px);display:grid;grid-template-rows:auto 1fr auto;gap:22px}
.pl h2{font-weight:300;font-size:clamp(28px,3vw,46px);line-height:1.1;margin-top:10px;max-width:22ch}
.pl .pic{display:flex;align-items:center;justify-content:center;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pl .pic img{width:min(100%,1600px);height:100%;object-fit:contain}
.pl .fn{font-size:13px;color:var(--ink3);margin-top:16px}
.pl .nums{margin-top:0}

/* way */
.wy{position:absolute;inset:0;display:grid;grid-template-columns:minmax(260px,32%) 1fr;gap:clamp(24px,4vw,72px);padding:calc(var(--top) + 6px) var(--pad) calc(var(--bar) + 26px)}
.wy h2{font-weight:300;font-size:clamp(30px,3.4vw,54px);line-height:1.08;margin-top:12px}
.wy .p{margin-top:18px;color:var(--ink2);max-width:36ch}
.tabs{display:flex;gap:6px;margin-top:28px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:min-content;gap:0 clamp(20px,3vw,48px);align-content:start;overflow:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{display:grid;grid-template-columns:34px 1fr;border-top:1px solid var(--line);padding:14px 0 16px}
.st .n{font-size:13px;color:var(--ink3);padding-top:4px}
.st .t{font-size:clamp(17px,1.35vw,21px);line-height:1.25}
.st .d{color:var(--ink2);font-size:15px;margin-top:3px}
.st .o{font-size:12px;color:var(--gold);margin-left:8px}

/* mine */
.mn{position:absolute;inset:0;display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,4vw,72px);padding:calc(var(--top) + 6px) var(--pad) calc(var(--bar) + 26px)}
.mn .pics{position:relative;min-height:0}
.mn .pics .a{position:absolute;left:0;top:0;width:100%;height:78%}
.mn .pics .b{position:absolute;right:0;bottom:0;width:46%;height:42%;border:6px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.mn .pics .bg{position:absolute;inset:0}
.mn h2{font-weight:300;font-size:clamp(30px,3.4vw,54px);line-height:1.08;margin-top:12px}
.mn .rows{margin-top:30px;border-top:1px solid var(--line)}
.mn .row{display:grid;grid-template-columns:130px 1fr auto;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding:14px 0}
.mn .row .k{font-size:14px;color:var(--ink3)}
.mn .row .v{font-size:20px}
.mn .row .c{font-size:14px;color:var(--ink2);transition:color .25s}
.mn .row .c:hover{color:var(--gold)}
.mn .acts{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border:1px solid var(--line2);font-size:16px;transition:color .3s,border-color .3s,background .3s}
.btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(214,179,106,.06)}
.mn .fn{margin-top:22px;font-size:13px;color:var(--ink3);max-width:46ch}

/* present popover */
#present{position:fixed;right:var(--pad);top:calc(var(--top) - 6px);z-index:60;width:min(360px,calc(100vw - 2*var(--pad)));background:rgba(8,8,10,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);padding:6px 20px 14px;display:none}
#present.on{display:block}
#present .it{display:block;width:100%;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;transition:color .25s}
#present .it:hover{color:var(--gold)}
#present .it small{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
#present .live{display:flex;align-items:center;gap:10px;padding-top:12px;font-size:13px;color:var(--ink3)}
#present .live i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
#present .live.on i{background:var(--led);box-shadow:0 0 10px rgba(47,224,122,.7)}

/* the TV window: the same page, bigger, with no controls */
body.tv #top .sp,body.tv #bar,body.tv #present,body.tv .cfg,body.tv #tvbtn,body.tv #presentBtn{display:none!important}
body.tv #top{background:none}
body.tv #dots{bottom:0}
body.tv .cap{bottom:56px;max-width:min(760px,86vw)}
body.tv .cap h1,body.tv .cap h2,body.tv .tile h2{font-size:clamp(46px,5.2vw,96px)}
body.tv .cap .p,body.tv .cap .spec{font-size:clamp(19px,1.5vw,28px)}
body.tv .eb{font-size:clamp(15px,1.1vw,20px)}
body.tv .nums .v{font-size:clamp(28px,2.8vw,48px)}
body.tv .nums .l{font-size:clamp(14px,1vw,18px)}
body.tv .in{padding-bottom:40px}body.tv .pl{padding-bottom:40px}body.tv .wy{padding-bottom:40px}body.tv .mn{padding-bottom:40px}

 if(e.metaKey||e.ctrlKey||e.altKey)return; if(e.target&&e.target.tagName==='INPUT')return; var k=e.key;
 if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();step(1)}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();step(-1)}

});
/* the mouse wheel moves through a home, one page a gesture; SOLUM's own page does its scrolling itself */
(function(){var lock=0,last=0,acc=0;
 function scrolls(el,dy){while(el&&el!==document.body){var cs=getComputedStyle(el);if((cs.overflowY==='auto'||cs.overflowY==='scroll')&&el.scrollHeight>el.clientHeight+2){if(dy>0?el.scrollTop+el.clientHeight<el.scrollHeight-1:el.scrollTop>0)return true}el=el.parentElement}return false}
 document.addEventListener('wheel',function(e){
  if(TV||onSolum()||e.ctrlKey)return; if(e.target.closest&&e.target.closest('#present,#homes,#modal'))return;
  var now=Date.now(),dy=e.deltaY; if(Math.abs(dy)<2)return; if(scrolls(e.target,dy))return;
  if(now-last>260)acc=0; last=now; if(now<lock)return;
  acc+=dy; if(Math.abs(acc)<60)return;
  var d=acc>0?1:-1; acc=0; lock=now+950; step(d);
 },{passive:true});
})();
var tx=0,ty=0;

document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){if(e.target.closest('.steps,.in .l,.wy,.mn,.tiles,.pl'))return;step(dx<0?1:-1)}},{passive:true});
