<!doctype html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAAVN Feasibility</title>
<meta name="theme-color" content="#cfccc6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('atrium_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
/* HAAVN FEASIBILITY. One tool to price the HAAVN range from the factory in Shenzhen to the finished home on the customer's site:
   ex factory, sea freight, the Australian port authority (by state), transport to site, then construction on site.
   Same look as ATRIUM HAAVN (the CRM): HAAVN paper ground with the moving isometric field, notched tablets with one dark hairline,
   lime for every accent, Chakra Petch for display. Every line can be turned on and off, edited, added or removed. */
:root{--display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--lime:#a8bc10;--notch:10px;
  --notch-clip:polygon(0 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%);--side:252px}
html[data-theme=light]{--bg:#cfccc6;--panel:#fafbfa;--hov:#f1f0ec;--side-bg:rgba(233,230,224,.82);--side-solid:#e9e6e0;--bar:rgba(233,230,224,.78);
  --edge:rgb(16 16 16 / .74);--edge2:rgb(16 16 16 / .13);--ink:#101010;--ink2:#2c2c2c;--ink3:#54564f;--ink4:#6a6c6a;--accent:#687808;--lime-dp:#687808;
  --over:#b3382c;--ok:#4f7a1e;--warn:#9a6a10;--scrim:rgba(16,16,16,.4);--in:#fff;--ring:rgba(16,16,16,.25)}
html[data-theme=dark]{--bg:#050605;--panel:#0b0c0a;--hov:#151713;--side-bg:rgba(7,8,7,.82);--side-solid:#070807;--bar:rgba(7,8,7,.78);
  --edge:rgb(255 255 255 / .3);--edge2:rgb(255 255 255 / .09);--ink:#eef0e8;--ink2:#b5b9a8;--ink3:#868b78;--ink4:#5d6153;--accent:#a8bc10;--lime-dp:#a8bc10;
  --over:#ff6b5e;--ok:#9bbf2a;--warn:#e0b04a;--scrim:rgba(0,0,0,.62);--in:#080908;--ring:rgba(255,255,255,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--bg)}
body{font:400 13px/1.45 var(--sans);color:var(--ink);background:transparent;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
#iso{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;opacity:0;transition:opacity 1.4s ease}#iso.on{opacity:1}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;height:100dvh}
.hide{display:none!important}.sp{flex:1}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.eb{font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--mono)}
/* tablets: the HAAVN BLACK cut corner, one dark hairline */
.nc{position:relative;background:linear-gradient(-45deg,transparent 50%,var(--edge) 50% calc(50% + 1.5px),transparent calc(50% + 1.5px)) bottom right/var(--notch) var(--notch) no-repeat,var(--panel);
  border:1px solid var(--edge);border-radius:4px 4px 0;clip-path:var(--notch-clip)}
.nc.lime:before{content:"";position:absolute;left:18px;top:-1px;width:30px;height:3px;background:var(--lime)}
/* sidebar */
.side{display:flex;flex-direction:column;background:var(--side-bg);border-right:1px solid var(--edge);padding:22px 14px 14px;min-height:0;overflow:hidden}
.brand{padding:0 8px}
.wm{display:block;background:var(--ink);-webkit-mask:url(atrium-hm/haavn-wordmark-black.png) center/contain no-repeat;mask:url(atrium-hm/haavn-wordmark-black.png) center/contain no-repeat;width:150px;height:17.6px}
.brand .sub{display:flex;align-items:center;gap:8px;margin-top:14px;font:400 10px var(--mono);letter-spacing:.18em;color:var(--ink3)}
.brand .sub b{font-weight:500;color:var(--ink)}
.nav{flex:1;overflow:auto;margin:18px -4px 0;padding:0 4px}
.nh{font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);padding:14px 10px 6px}
.ni{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:6px;color:var(--ink2);text-align:left;transition:background .15s,color .15s}
.ni:hover{background:var(--hov);color:var(--ink)}
.ni.on{color:var(--ink);background:linear-gradient(90deg,rgba(168,188,16,.18),transparent 85%)}
.ni.on:before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:2px;background:var(--lime)}
.ni .n{margin-left:auto;font:500 10px var(--mono);color:var(--ink3)}
.sidefoot{border-top:1px solid var(--edge2);margin-top:10px;padding-top:8px}
.note{font-size:11px;color:var(--ink3);line-height:1.5;padding:8px 10px}
/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--edge);background:var(--bar)}
.ttl{font:500 19px var(--display);letter-spacing:.02em}
.ttl em{font-style:normal;color:var(--lime-dp)}
.ib{width:34px;height:34px;border:1px solid var(--edge);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;flex:none}
.ib:hover{color:var(--ink);background:var(--hov)}
.ib.go svg{animation:spin .9s cubic-bezier(.65,0,.25,1) forwards}@keyframes spin{to{transform:rotate(360deg)}}
.menubtn{display:none}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:99px;padding:3px;gap:2px;background:var(--panel)}
.seg button{padding:5px 13px;border-radius:99px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--ink3);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
#view{flex:1;min-height:0;overflow:auto;padding:24px 28px 80px}
.pg{max-width:1400px;margin:0 auto}
.hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hd h1{font:500 30px/1.05 var(--display);letter-spacing:-.005em}
.hd h1 em{font-style:normal;color:var(--lime-dp)}
.hd p{color:var(--ink3);margin-top:8px;max-width:760px;font-size:13px}
/* buttons, inputs */
.btn{height:34px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--edge);border-radius:6px;color:var(--ink);font-size:12px;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.gold{background:var(--lime);color:#101010;border-color:transparent;font-weight:500;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);border-radius:5px 5px 0}
.btn.gold:hover{filter:brightness(1.06)}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px}
.btn.ghost{border-color:var(--edge2);color:var(--ink3)}
.btn.danger{color:var(--over)}
.in{height:30px;padding:0 9px;border:1px solid var(--edge2);border-radius:4px;background:var(--in);color:var(--ink);font:400 12.5px var(--sans);min-width:0;width:100%}
.in:focus{outline:none;border-color:var(--edge)}
.in.num{text-align:right;font-family:var(--mono);font-size:12px}
.in.ro{background:transparent;border-color:transparent;color:var(--ink2)}
select.in{padding-right:4px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}.f>span{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sw{position:relative;width:32px;height:18px;border-radius:99px;background:var(--edge2);border:1px solid var(--edge2);flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink3);transition:.15s}
.sw.on{background:var(--lime);border-color:transparent}.sw.on:after{left:16px;background:#101010}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border:1px solid var(--edge2);border-radius:99px;font:500 10px var(--mono);letter-spacing:.04em;color:var(--ink3);white-space:nowrap}
.chip.lime{color:var(--lime-dp);border-color:color-mix(in srgb,var(--lime-dp) 55%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.chip.over{color:var(--over);border-color:color-mix(in srgb,var(--over) 55%,transparent)}
.dotsrc{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;display:inline-block}
.dotsrc.model{background:var(--lime-dp)}
/* range */
.fam{margin:26px 0 12px}.fam h2{font:500 17px var(--display)}.fam p{color:var(--ink3);font-size:12px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.hc{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.hc:hover{border-color:var(--ink)}
.hc .ph{height:150px;background:var(--hov) center/cover no-repeat;border-bottom:1px solid var(--edge2);position:relative}
.hc .ph.none{display:grid;place-items:center;color:var(--ink4);font:400 10px var(--mono);letter-spacing:.12em}
.hc .ph .tg{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.hc .ph .chip{background:var(--panel)}
.hc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.hc h3{font:500 17px var(--display);letter-spacing:.01em}
.hc .sub{color:var(--ink3);font-size:12px;margin-top:2px}
.specs{display:flex;gap:6px;flex-wrap:wrap}
.pr3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--edge2);padding-top:10px}
.pr3 div{min-width:0}.pr3 .l{font:400 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.pr3 .v{font:500 14px var(--display);margin-top:2px;white-space:nowrap}
/* price a home */
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.bar .f{min-width:130px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.sticky{position:sticky;top:0}
.stg{overflow:hidden}
.stg>.sh{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.stg .no{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;font:500 11px var(--mono);flex:none}
.stg .tt b{font:500 15px var(--display);display:block}.stg .tt i{font-style:normal;color:var(--ink3);font-size:11.5px}
.stg .tot{font:500 15px var(--display);white-space:nowrap}
.stg .chev{transition:transform .2s;color:var(--ink3)}.stg.closed .chev{transform:rotate(-90deg)}
.stg.closed>.sb{display:none}
.stg>.sb{border-top:1px solid var(--edge2);padding:4px 0 12px}
.grp{padding:12px 16px 4px;font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:10px}
.grp .gt{margin-left:auto;font:500 11px var(--mono);color:var(--ink2);letter-spacing:0}
.lr{display:grid;grid-template-columns:34px minmax(120px,1fr) 108px 64px 86px 90px 20px;gap:8px;align-items:center;padding:4px 16px}
.lr.hd2{font:400 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);padding-top:8px}
.lr.hd2 span:nth-child(n+4){text-align:right}
.lr .nm{min-width:0;display:flex;flex-direction:column;gap:2px}
.lr .nm b{font-weight:400;font-size:12.5px;line-height:1.3;display:flex;align-items:center;gap:7px}
.lr .nm small{color:var(--ink3);font-size:11px;line-height:1.3}
.lr.off .nm b,.lr.off .amt,.lr.off .in{opacity:.45}
.lr .amt{text-align:right;font:500 12px var(--mono);white-space:nowrap}
.lr .rm{color:var(--ink4);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}.lr .rm:hover{color:var(--over);background:var(--hov)}
.ovd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);flex:none}
.addrow{display:flex;gap:8px;align-items:center;padding:10px 16px 0;flex-wrap:wrap}
.addrow .in{width:auto;flex:1;min-width:140px}
/* summary */
.sum{padding:18px}
.sum h3{font:500 16px var(--display)}
.pk{display:grid;grid-template-columns:minmax(64px,1fr) repeat(3,minmax(76px,92px));gap:6px 8px;align-items:center;margin-top:14px}
.pk .h{font:400 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:right}
.pk .h:first-child{text-align:left}
.pk .l{color:var(--ink2);font-size:12px;white-space:nowrap}
.pk .v{text-align:right;font:500 12px var(--mono);white-space:nowrap}
.pk .v.big{font:500 15px var(--display)}
.pk .in{height:26px;padding:0 6px}
.pk hr{grid-column:1/-1;border:0;border-top:1px solid var(--edge2);margin:4px 0}
.stbar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--edge2);margin-top:12px}
.stbar i{display:block;height:100%}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.c1{background:#a8bc10}.c2{background:#7a8f12}.c3{background:#566a0c}.c4{background:#8a8c85}.c5{background:#3c3d39}
html[data-theme=dark] .c5{background:#d8dccb}
.hb .t i.c1{background:#a8bc10}.hb .t i.c2{background:#7a8f12}.hb .t i.c3{background:#566a0c}.hb .t i.c4{background:#8a8c85}.hb .t i.c5{background:#3c3d39}html[data-theme=dark] .hb .t i.c5{background:#d8dccb}
.cmp{margin-top:14px;padding:12px 14px;border:1px dashed var(--edge);border-radius:4px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.cmp .r{display:flex;justify-content:space-between;gap:10px}.cmp b{font:500 12px var(--mono)}
/* tables (shipping, finishes, price sheet, orders) */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:400 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--edge2);white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--edge2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td .in{height:28px}
.tbl tr.off td{opacity:.5}
.tbl tfoot td{font-weight:500;border-top:1px solid var(--edge)}
.scroll{overflow:auto}
.pad{padding:16px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:14px 16px 16px}.kpi .v{font:500 24px var(--display);margin-top:8px;letter-spacing:-.01em}.kpi .s{color:var(--ink3);font-size:11.5px;margin-top:2px}
.kpi:before{content:"";position:absolute;left:16px;top:-1px;width:30px;height:3px;background:var(--lime)}
.hb{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:12px}
.hb .t{height:12px;background:var(--edge2);border-radius:2px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--lime)}
.hb .n{text-align:right;font:500 11px var(--mono);color:var(--ink2)}
/* orders */
.ords{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.oc{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.oc.on{border-color:var(--ink)}.oc:hover{border-color:var(--ink)}
.oc b{font:500 14px var(--display)}
.steps{display:flex;gap:4px;margin:6px 0 2px}
.steps i{flex:1;height:5px;background:var(--edge2);border-radius:1px}.steps i.d{background:var(--lime)}
.stp{display:flex;gap:6px;flex-wrap:wrap}
.stp button{padding:6px 11px;border:1px solid var(--edge2);border-radius:99px;font:500 10.5px var(--mono);letter-spacing:.04em;color:var(--ink3)}
.stp button.d{background:var(--hov);color:var(--ink);border-color:var(--edge)}
.stp button.on{background:var(--lime);color:#101010;border-color:transparent}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--ring);vertical-align:-1px;margin-right:6px}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px dashed var(--edge);border-radius:4px;font-size:12px;color:var(--ink2);margin-bottom:14px}
.banner b{font-weight:500;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;background:var(--panel);border:1px solid var(--edge);border-radius:99px;padding:9px 18px;font-size:12px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.savepill{display:inline-flex;align-items:center;gap:7px;font:400 10px var(--mono);letter-spacing:.1em;color:var(--ink3)}
.savepill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime-dp)}
#navscrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:100}
@media(max-width:1180px){.work{grid-template-columns:1fr}.sticky{position:static}.two,.three{grid-template-columns:1fr}.ords{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .25s ease;z-index:120;background:var(--side-solid)}
  body.nav-open .side{transform:none}body.nav-open #navscrim{display:block}
  .menubtn{display:inline-flex}.tb{padding:0 12px;gap:8px}#view{padding:18px 14px 80px}.savepill{display:none}.seg button{padding:5px 8px}.ttl{font-size:16px;white-space:nowrap}
  .lr{grid-template-columns:34px minmax(0,1fr) 62px 76px 84px}
  .lr>*:nth-child(3),.lr>*:nth-child(7){display:none}
  .pk{grid-template-columns:1fr repeat(3,74px)}
}
@media print{
  body{overflow:visible}#iso,.side,.tb,.noprint{display:none!important}.app{display:block;height:auto}#view{overflow:visible;padding:0}
  .nc{clip-path:none;border-radius:0}html{background:#fff}
}
</style>
</head>
<body>
<canvas id="iso" aria-hidden="true"></canvas>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="wm" role="img" aria-label="HAAVN"></span>
      <div class="sub"><b>FEASIBILITY</b><span>·</span><span id="subMarket">VIC</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <button class="ni" id="bBack"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Back to HAAVN</span></button>
      <div class="note" id="srcNote"></div>
    </div>
  </aside>
  <div id="navscrim"></div>
  <main class="main">
    <header class="tb">
      <button class="ib menubtn" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="ttl" id="ttl"></div>
      <span class="sp"></span>
      <span class="savepill noprint" id="savePill">SAVED IN THIS BROWSER</span>
      <div class="seg noprint" id="stateSeg" title="Delivering to"></div>
      <button class="ib noprint" id="themeBtn" aria-label="Light or dark"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <button class="ib noprint" id="refreshBtn" aria-label="Get the latest version" title="Get the latest version"><svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
    </header>
    <section id="view"></section>
  </main>

/* the haavn.au isometric ground, the same field as ATRIUM HAAVN */
(function(){
function makeGround(cv, cfg) {
  cfg = cfg || {}
  const P = {
    accent: [125, 127, 118],   // haavn.au --accent  hsl(72 4% 48%)
    white:  [242, 237, 233],   // haavn.au --white   hsl(26.67 25.71% 93.14%)
    // floor to peak tone, as mix(accent, white). sat < 1 lets the upper swells
    // reach full white , haavn.au spends a lot of time in open near-white
    // swells, and without it ours read ~8 levels darker (time-averaged, 20
    // moments each over 40s: now within 0-2 levels at every percentile).
    t0: 0.82, tTop: 1.0, gamma: 0.8, sat: 0.75,
    shadeX: 0.95,              // +X faces: the dark bands along "/"
    shadeZ: 1.03,              // +Z faces: the bright slivers along "\"
    unit: cfg.unit || 0.020,               // px per tile-unit, x viewport width (haavn.au scales the same way)
    // swell size, swell height (tiles), floor clamp. Height sets line WEIGHT
    // only (tone is keyed to relative height) , above ~3.5 the slivers turn
    // into bands and it stops reading as haavn.au.
    freq: 0.018, amp: 3.2, cut: -0.55,
    speed: cfg.speed || 0.36,               // noise time per second
    dprMax: 1.5,               // haavn.au caps its canvas at 1.5x too

  var h='<div class="pg"><div class="hd"><div><h1>The <em>range</em></h1><p>Every home, priced from the factory in Shenzhen to the finished home on site, for <b>'+UI.state+'</b> ('+esc(S.states[UI.state].port)+'). Sizes are from the display floor plans. Open a home to see and change every line.</p></div></div>';
  FAM.forEach(function(f){var hs=S.homes.filter(function(x){return x.fam===f.k});if(!hs.length)return;
    h+='<div class="fam"><h2>'+esc(f.n)+'</h2><p>'+esc(f.d)+'</p></div><div class="grid">'+hs.map(function(x){
      var e=est(x.id,{state:UI.state});var no=x.tbc||!x.area;
      return '<div class="nc lime hc" data-open="'+x.id+'"><div class="ph '+(x.img?'':'none')+'" '+(x.img?'style="background-image:url('+x.img+')"':'')+'>'+(x.img?'':'NO RENDER YET')+'<div class="tg">'+homeTag(x)+'</div></div><div class="bd"><div><h3>'+esc(x.name)+'</h3><div class="sub">'+esc(x.sub)+'</div></div><div class="specs">'+specs(x)+'</div>'+
        '<div class="pr3">'+PKGS.map(function(p){return '<div><div class="l">'+p.s+'</div><div class="v">'+(no?'to set':money(e.pk[p.k].sell))+'</div></div>'}).join('')+'</div>'+(x.list?'<div class="sub">Sales list price '+money(x.list)+' (inc GST)</div>':'')+'</div></div>'}).join('')+'</div>';});
  return h+'<div class="note" style="padding:20px 0 0">Prices are what we would sell for, inc GST, using each home’s margin and prelims. Supply to port is ex factory + sea freight + the port authority. Delivered adds transport to site. Turnkey adds construction on site.</div></div>';
}

/* ---- price a home ---- */
function lineRowHTML(r,st,h){
  var k=st+':'+r.id,isHome=(st==='s1'||st==='s5')&&!r.fixed,editBasis=(isHome||r.extra)&&!r.fixed;
  var qtyCell;
  if(r.basis==='unit'&&!r.fixed)qtyCell=inp(k+':qty',r.qty,'data-a="line" data-st="'+st+'" data-id="'+r.id+'" data-f="qty"','num');
  else if(r.basis==='area')qtyCell='<span class="mono" style="font-size:11.5px;color:var(--ink3);text-align:right;display:block">'+fmt(r.qty)+' m²</span>';
  else if(r.basis==='module')qtyCell='<span class="mono" style="font-size:11.5px;color:var(--ink3);text-align:right;display:block">'+fmt(r.qty,0)+' mod</span>';
  else if(r.basis==='km')qtyCell='<span class="mono" style="font-size:11.5px;color:var(--ink3);text-align:right;display:block">'+fmt(r.qty,0)+' km</span>';
  else if(r.fixed)qtyCell='<span class="mono" style="font-size:11.5px;color:var(--ink3);text-align:right;display:block">1</span>';
  else qtyCell='<span class="mono" style="font-size:11.5px;color:var(--ink4);text-align:right;display:block">%</span>';
  var rateCell=r.fixed?'<span class="mono" style="font-size:12px;text-align:right;display:block;color:var(--ink2)">'+money(r.rate)+'</span>':inp(k+':rate',r.rate,'data-a="line" data-st="'+st+'" data-id="'+r.id+'" data-f="rate"','num');
  var basisCell=editBasis?'<select class="in" data-a="line" data-st="'+st+'" data-id="'+r.id+'" data-f="basis">'+opts(BASIS,r.basis)+'</select>':'<span style="font-size:11.5px;color:var(--ink3)">'+esc(BASISN[r.basis]||r.basis)+(r.byState?' · '+UI.state:'')+'</span>';
  var can=(isHome||r.extra)&&!r.fixed;
  return '<div class="lr '+(r.on?'':'off')+'">'+(r.fixed?'<span class="sw '+(r.on?'on':'')+'" title="Turned on or off in the Finishes tab"></span>':sw(r.on,'data-a="line" data-st="'+st+'" data-id="'+r.id+'" data-f="on"'))+
    '<div class="nm"><b>'+srcDot(r.src)+esc(r.name)+(r.ov?'<span class="ovd" title="Changed for this home only"></span>':'')+'</b>'+((r.sup||r.note)?'<small>'+esc([r.sup,r.note].filter(Boolean).join(' · '))+'</small>':'')+'</div>'+
    basisCell+qtyCell+rateCell+'<span class="amt">'+money(r.amt)+'</span>'+(can?'<button class="rm" title="Remove this line" data-a="rmline" data-st="'+st+'" data-id="'+r.id+'">×</button>':'<span></span>')+'</div>';
}
function stageHTML(e,s,i){
  var h=e.h,rows=e.rows[s.k],closed=UI.open[s.k]===false;
  var sub=s.k==='s3'?'Customs, duty, wharf and biosecurity · '+esc(S.states[e.state].port):s.k==='s4'?'Port to site, '+fmt(e.km,0)+' km · '+esc(S.states[e.state].port)+' to the customer’s home':s.sub;
  var body='<div class="lr hd2"><span></span><span>Line</span><span>Basis</span><span style="text-align:right">Qty</span><span style="text-align:right">Rate</span><span style="text-align:right">Amount</span><span></span></div>';
  stageRowsGroups(rows).forEach(function(g){body+='<div class="grp">'+esc(g.n)+'<span class="gt">'+money(sumOn(g.rows))+'</span></div>'+g.rows.map(function(r){return lineRowHTML(r,s.k,h)}).join('')});
  var lib=(S.lib||[]).filter(function(x){return (s.k==='s1'&&x.sec==='S1')||(s.k==='s5'&&x.sec==='S5')});
  var groups=s.k==='s5'?['Design & approvals','Site, civil & logistics','Services & connections','Fitout & external works','Site labour','Other costs']:s.k==='s1'?['Module','External envelope & fixtures','Factory extras','Other costs']:['Extras'];
  body+='<div class="addrow noprint"><input class="in" id="add_'+s.k+'_n" list="lib_'+s.k+'" placeholder="Add a line: type a name'+(lib.length?' or pick from the library':'')+'">'+(lib.length?'<datalist id="lib_'+s.k+'">'+lib.map(function(x){return '<option value="'+esc(x.name)+'">'}).join('')+'</datalist>':'')+
    '<select class="in" id="add_'+s.k+'_b" style="width:130px;flex:none">'+opts(BASIS.slice(0,4))+'</select><input class="in num" id="add_'+s.k+'_r" placeholder="Rate" style="width:90px;flex:none"><input class="in num" id="add_'+s.k+'_q" placeholder="Qty" style="width:70px;flex:none">'+
    '<select class="in" id="add_'+s.k+'_g" style="width:170px;flex:none">'+opts(groups)+'</select><button class="btn sm" data-a="addline" data-st="'+s.k+'">+ Add line</button>'+((s.k==='s2'||s.k==='s3'||s.k==='s4')?'<button class="btn sm ghost" data-a="resetov" data-st="'+s.k+'" title="Put every line of this stage back to the Shipping &amp; ports defaults">Reset to defaults</button>':'')+'</div>';
  return '<div class="nc stg '+(closed?'closed':'')+'" id="stg_'+s.k+'"><div class="sh" data-a="toggle" data-st="'+s.k+'"><span class="no">'+(i+1)+'</span><div class="tt"><b>'+s.n+'</b><i>'+sub+'</i></div><span class="sp"></span><span class="tot">'+money(e.tot[s.k])+'</span><svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div><div class="sb">'+body+'</div></div>';
}
function summaryHTML(e){
  var h=e.h,a=h.area||0,tot=PKGS[2].st.reduce(function(x,k){return x+e.tot[k]},0)||1;
  var bar='<div class="stbar">'+STAGES.map(function(s){return '<i class="'+s.c+'" style="width:'+(e.tot[s.k]/tot*100)+'%" title="'+s.n+' '+money(e.tot[s.k])+'"></i>'}).join('')+'</div><div class="legend">'+STAGES.map(function(s,i){return '<span><i class="'+s.c+'"></i>'+(i+1)+' '+s.n+' '+money(e.tot[s.k])+'</span>'}).join('')+'</div>';
  var t='<div class="pk"><span class="h"></span>'+PKGS.map(function(p){return '<span class="h">'+p.s+'</span>'}).join('');
  var row=function(l,f,big){return '<span class="l">'+l+'</span>'+PKGS.map(function(p){return '<span class="v '+(big?'big':'')+'">'+f(e.pk[p.k],p)+'</span>'}).join('')};
  t+=row('Cost',function(x){return money(x.cost)})+row('Prelims',function(x){return money(x.prelims)});
  t+='<span class="l">Margin %</span>'+PKGS.map(function(p){return '<span>'+inp('set:'+p.mk,h.set[p.mk],'data-a="set" data-f="'+p.mk+'"','num')+'</span>'}).join('');
  t+=row('Margin $',function(x){return money(x.margin)})+row('Ex GST',function(x){return money(x.exgst)})+row('GST',function(x){return money(x.gst)})+'<hr>'+row('Sell inc GST',function(x){return money(x.sell)},true)+row('Per m²',function(x){return a?money(x.perM2):'-'})+'</div>';
  var ctrl='<div class="two" style="margin-top:14px;gap:10px"><label class="f"><span>Prelims % (all packages)</span>'+inp('set:prelims',h.set.prelims,'data-a="set" data-f="prelims"','num')+'</label><label class="f"><span>GST %</span>'+inp('set:gst',h.set.gst,'data-a="set" data-f="gst"','num')+'</label></div>';
  var cmp='';
  if(h.list){var d=e.pk.port.sell-h.list;cmp='<div class="cmp"><div class="r"><span>Sales list price (inc GST)</span><b>'+money(h.list)+'</b></div><div class="r"><span>Supply to port sell, this model</span><b>'+money(e.pk.port.sell)+'</b></div><div class="r"><span>'+(d>0?'Above the list price by':'Below the list price by')+'</span><b style="color:'+(d>0?'var(--over)':'var(--ok)')+'">'+money(Math.abs(d))+'</b></div><span style="font-size:11px;color:var(--ink3)">The list price is set in Sales pipeline, Setup. If it should cover supply to the port, this shows whether it does.</span></div>'}
  return '<div class="nc lime sum"><h3>Landed price · '+esc(h.name)+'</h3><div style="color:var(--ink3);font-size:12px;margin-top:3px">'+UI.state+' · '+esc(S.states[UI.state].port)+' · '+fmt(a)+' m²</div>'+bar+t+ctrl+cmp+'</div>';
}
function vPrice(){
  var h=home(UI.home)||S.homes[0];UI.home=h.id;var e=est(h.id,{state:UI.state,km:UI.km,useUI:true});
  var fin=h.fam==='solum'?'<label class="f"><span>Cladding</span><select class="in" data-a="hfin" data-f="clad">'+opts(S.fin.clad.filter(function(o){return o.on!==false}).map(function(o){return o.name}),h.fin.clad)+'</select></label><label class="f"><span>Interior palette</span><select class="in" data-a="hfin" data-f="pal">'+opts(S.fin.pal.filter(function(o){return o.on!==false}).map(function(o){return o.name}),h.fin.pal)+'</select></label><label class="f"><span>Joinery</span><select class="in" data-a="hfin" data-f="join">'+opts(S.fin.join.filter(function(o){return o.on!==false}).map(function(o){return o.name}),h.fin.join)+'</select></label>':'';
  var out='<div class="pg"><div class="bar"><label class="f" style="min-width:200px"><span>Home</span><select class="in" data-a="pickhome">'+homeOpts(h.id)+'</select></label>'+
    '<label class="f" style="min-width:120px;max-width:140px"><span>Floor area m²</span>'+inp('h:area',h.area||'','data-a="hf" data-f="area"','num')+'</label>'+
    '<label class="f" style="max-width:90px"><span>Modules</span>'+inp('h:modules',h.modules||'','data-a="hf" data-f="modules"','num')+'</label>'+
    '<label class="f" style="max-width:130px"><span>Site km from port</span>'+inp('km',UI.km!=null?UI.km:S.states[UI.state].km,'data-a="km"','num')+'</label>'+fin+
    '<span class="sp"></span><button class="btn sm ghost" data-a="resetkm" title="Use the state default distance">Default distance</button></div>';
  if(h.tbc||!h.area)out+='<div class="banner"><b>Set the size.</b> This home has no floor area yet, so area-based lines price at $0. Type the floor area above.</div>';
  else if(h.src==='placeholder')out+='<div class="banner"><b>Placeholder rates.</b> No estimate exists for this home yet, so the factory and construction lines are placeholders. Change any line, or turn it off.</div>';
  out+='<div class="work"><div class="stack">'+STAGES.map(function(s,i){return stageHTML(e,s,i)}).join('')+'</div><div class="sticky">'+summaryHTML(e)+'</div></div></div>';
  return out;
}

/* ---- price sheet ---- */
function vSheet(){
  var out='<div class="pg"><div class="hd"><div><h1>Price <em>sheet</em></h1><p>The whole range for <b>'+UI.state+'</b>, ready for a deck or a quote. Prices inc GST, at each home’s margin and prelims. Switch state at the top right.</p></div><span class="sp"></span><button class="btn noprint" data-a="copysheet">Copy as text</button><button class="btn gold noprint" data-a="print">Print or save as PDF</button></div>';
  FAM.forEach(function(f){var hs=S.homes.filter(function(x){return x.fam===f.k});if(!hs.length)return;
    out+='<div class="nc" style="margin-bottom:16px;overflow:hidden"><div class="pad" style="padding-bottom:6px"><div class="eb">'+esc(f.n)+'</div></div><div class="scroll"><table class="tbl"><thead><tr><th>Home</th><th class="r">m²</th><th class="r">Supply to port</th><th class="r">Delivered to site</th><th class="r">Turnkey on site</th><th class="r">Turnkey $/m²</th>'+(f.k==='solum'?'<th class="r">Sales list</th>':'')+'</tr></thead><tbody>'+hs.map(function(x){
      var e=est(x.id,{state:UI.state}),no=x.tbc||!x.area;
      return '<tr><td><b style="font-weight:500">'+esc(x.name)+'</b><div style="color:var(--ink3);font-size:11px">'+esc(x.sub)+'</div></td><td class="r mono">'+(x.area?fmt(x.area):'-')+'</td>'+PKGS.map(function(p){return '<td class="r mono">'+(no?'-':money(e.pk[p.k].sell))+'</td>'}).join('')+'<td class="r mono">'+(no?'-':money(e.pk.turn.perM2))+'</td>'+(f.k==='solum'?'<td class="r mono">'+(x.list?money(x.list):'-')+'</td>':'')+'</tr>'}).join('')+'</tbody></table></div></div>'});
  return out+'<div class="note" style="padding:6px 0">Supply to port = ex factory Shenzhen (CCIST) + sea freight + '+esc(S.states[UI.state].port)+' charges. Delivered to site adds transport at '+S.states[UI.state].km+' km. Turnkey adds construction on site. Finishes use each SOLUM home’s selected finishes.</div></div>';
}

/* ---- factory rates ---- */
function modLine(h){return h.s1.find(function(l){return l.basis==='area'&&/precision module|concept, all-in/i.test(l.name)})}
function supLine(h){return h.s1.find(function(l){return l.basis==='area'&&/base supply/i.test(l.name)})}
function vFactory(){
  var out='<div class="pg"><div class="hd"><div><h1>Factory <em>rates</em></h1><p>The ex-factory price at Shenzhen (CCIST), per square metre of floor area. Change a rate here and every estimate follows. Other ex-factory lines, packing, QA, export and fixtures, are on each home’s Price page.</p></div></div>';
  FAM.forEach(function(f){var hs=S.homes.filter(function(x){return x.fam===f.k});
    out+='<div class="nc" style="margin-bottom:16px;overflow:hidden"><div class="pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="eb">'+esc(f.n)+'</div><span class="sp"></span><span class="eb">Set the module rate for the whole range</span><input class="in num" id="bulk_'+f.k+'" style="width:100px" placeholder="$ / m²"><button class="btn sm" data-a="bulkmod" data-fam="'+f.k+'">Apply</button></div><div class="scroll"><table class="tbl"><thead><tr><th>Home</th><th class="r">Area m²</th><th class="r">Module $/m²</th><th class="r">Base supply $/m²</th><th class="r">Ex factory total</th><th class="r">Ex factory $/m²</th><th class="r">Per module</th></tr></thead><tbody>'+hs.map(function(x){
      var e=est(x.id,{state:UI.state}),m=modLine(x),b=supLine(x);
      return '<tr><td><b style="font-weight:500">'+esc(x.name)+'</b></td><td class="r"><input class="in num" style="width:84px" data-k="fa:'+x.id+'" data-a="hf" data-hid="'+x.id+'" data-f="area" value="'+esc(x.area||'')+'"></td><td class="r">'+(m?'<input class="in num" style="width:94px" data-k="fm:'+x.id+'" data-a="rate" data-hid="'+x.id+'" data-lid="'+m.id+'" value="'+esc(m.rate)+'">':'-')+'</td><td class="r">'+(b?'<input class="in num" style="width:94px" data-k="fb:'+x.id+'" data-a="rate" data-hid="'+x.id+'" data-lid="'+b.id+'" value="'+esc(Math.round(b.rate*100)/100)+'">':'<span style="color:var(--ink4)">-</span>')+'</td><td class="r mono">'+money(e.tot.s1)+'</td><td class="r mono">'+(x.area?money(e.tot.s1/x.area):'-')+'</td><td class="r mono">'+(x.modules?money(e.tot.s1/x.modules):'-')+'</td></tr>'}).join('')+'</tbody></table></div></div>'});
  return out+'<div class="note" style="padding:4px 0">Module rate comes from the live model (SOLUM $1,400/m², Essentials $1,800/m² and so on). SOLUM’s base supply package is the old $62,485 lump spread over the 60.3 m² plan.</div></div>';
}

/* ---- shipping & ports ---- */
function logiTable(k,title,desc){
  var rows=S.logi[k];
  var out='<div class="nc lime" style="margin-bottom:16px;overflow:hidden"><div class="pad" style="padding-bottom:4px"><div style="display:flex;align-items:center;gap:12px"><div><div style="font:500 15px var(--display)">'+title+'</div><div style="color:var(--ink3);font-size:12px;margin-top:2px">'+desc+'</div></div></div></div><div class="scroll"><table class="tbl"><thead><tr><th style="width:44px"></th><th>Line</th><th>Basis</th>'+STATES.map(function(s){return '<th class="r">'+s+'</th>'}).join('')+'<th class="r">Qty</th><th></th></tr></thead><tbody>';
  rows.forEach(function(l){
    var rs=l.rates?STATES.map(function(s){return '<td class="r"><input class="in num" style="width:84px" data-k="lg:'+l.id+':'+s+'" data-a="lgrate" data-lid="'+l.id+'" data-st="'+k+'" data-state="'+s+'" value="'+esc(l.rates[s])+'"></td>'}).join(''):'<td class="r" colspan="4"><input class="in num" style="width:84px" data-k="lg:'+l.id+'" data-a="lgrate" data-lid="'+l.id+'" data-st="'+k+'" value="'+esc(l.rate)+'"></td>';
    out+='<tr class="'+(l.on===false?'off':'')+'"><td>'+sw(l.on!==false,'data-a="lgon" data-lid="'+l.id+'" data-st="'+k+'"')+'</td><td><b style="font-weight:400">'+srcDot(l.src)+esc(l.name)+'</b>'+((l.sup||l.note)?'<div style="color:var(--ink3);font-size:11px">'+esc([l.sup,l.note].filter(Boolean).join(' · '))+'</div>':'')+'</td><td><select class="in" style="width:150px" data-a="lgbasis" data-lid="'+l.id+'" data-st="'+k+'">'+opts(BASIS,l.basis)+'</select></td>'+rs+'<td class="r">'+(l.basis==='unit'?'<input class="in num" style="width:64px" data-k="lq:'+l.id+'" data-a="lgqty" data-lid="'+l.id+'" data-st="'+k+'" value="'+esc(l.qty||0)+'">':'<span style="color:var(--ink4)">-</span>')+'</td><td><button class="rm btn sm ghost" data-a="lgrm" data-lid="'+l.id+'" data-st="'+k+'" title="Remove for every home">×</button></td></tr>'});
  out+='</tbody></table></div><div class="addrow noprint" style="padding-bottom:14px"><input class="in" id="lga_'+k+'_n" placeholder="Add a line for every home"><select class="in" id="lga_'+k+'_b" style="width:140px;flex:none">'+opts(BASIS)+'</select><input class="in num" id="lga_'+k+'_r" placeholder="Rate, all states" style="width:120px;flex:none"><button class="btn sm" data-a="lgadd" data-st="'+k+'">+ Add line</button></div></div>';
  return out;
}
function vLogi(){
  var out='<div class="pg"><div class="hd"><div><h1>Shipping &amp; <em>ports</em></h1><p>The three shipping stages, with the rate for each state. These are the defaults for every home. On a home’s Price page you can change a line for that home only. Rates marked with an amber dot are placeholders until the forwarder, the broker and the haulier confirm them.</p></div></div>';
  out+='<div class="banner"><span style="font:500 11px var(--mono);letter-spacing:.06em">STAGE 1</span><span><b>Ex factory, Shenzhen (CCIST)</b> is priced home by home. Set the $/m² rates in <a href="#" data-go="factory" style="color:var(--lime-dp)">Factory rates</a>.</span></div>';
  out+='<div class="nc" style="margin-bottom:16px;overflow:hidden"><div class="pad" style="padding-bottom:4px"><div style="font:500 15px var(--display)">Ports and distance by state</div><div style="color:var(--ink3);font-size:12px;margin-top:2px">The Australian port each state ships to, and the default distance from that port to a typical site.</div></div><div class="scroll"><table class="tbl"><thead><tr><th>State</th><th>Port authority</th><th class="r">Default km to site</th></tr></thead><tbody>'+STATES.map(function(s){return '<tr><td><b style="font-weight:500">'+s+'</b></td><td><input class="in" style="max-width:280px" data-k="sp:'+s+'" data-a="port" data-state="'+s+'" value="'+esc(S.states[s].port)+'"></td><td class="r"><input class="in num" style="width:90px" data-k="sk:'+s+'" data-a="portkm" data-state="'+s+'" value="'+esc(S.states[s].km)+'"></td></tr>'}).join('')+'</tbody></table></div></div>';
  out+=logiTable('s2','2 · Sea freight','Shenzhen to the Australian port. Oversize modules ship on flat-rack or break-bulk, so freight is per module.');
  out+=logiTable('s3','3 · Port authority, customs and taxes','Duty, wharf and terminal charges, port levy, biosecurity and the broker, for the state the home lands in.');
  out+=logiTable('s4','4 · Transport to site','Port to the customer’s home: haulage, permits and escorts. Distance comes from the state default or the home’s own site distance.');
  return out+'</div>';
}

/* ---- finishes ---- */
function vFin(){
  var out='<div class="pg"><div class="hd"><div><h1><em>Finishes</em></h1><p>What each SOLUM exterior facade and interior choice adds to the ex-factory cost, by home size. The first option in each list is the base: no extra cost. Margin and prelims are then added on top, like every other line. These are placeholder costs until the factory quotes them.</p></div></div>';

function orderCalc(o){
  var r={units:0,m2:0,cost:0,sell:0,ex:0,margin:0,stages:{},lines:[]},pk=PKGS.find(function(p){return p.k===o.pkg})||PKGS[2];
  STAGES.forEach(function(s){r.stages[s.k]=0});
  o.lines.forEach(function(l){
    var h=home(l.home);if(!h){r.lines.push(null);return}
    var e=est(h.id,{state:o.state,km:o.km,fin:l.fin||h.fin}),p=e.pk[pk.k],q=+l.qty||0;
    r.units+=q;r.m2+=q*(h.area||0);r.cost+=q*p.totalCost;r.sell+=q*p.sell;r.ex+=q*p.exgst;r.margin+=q*p.margin;
    pk.st.forEach(function(k){r.stages[k]+=q*e.tot[k]});

  r.pk=pk;return r;
}

    var n=$('#add_'+st+'_n').value.trim();if(!n){toast('Type a name for the line');return}
    var lib=(S.lib||[]).find(function(x){return x.name.toLowerCase()===n.toLowerCase()}),b=$('#add_'+st+'_b').value,r=$('#add_'+st+'_r').value,q=$('#add_'+st+'_q').value,g=$('#add_'+st+'_g').value;
    var l={id:uid(),name:n,basis:b,rate:r!==''?num(r):(lib?lib.rate:0),qty:q!==''?num(q):1,on:true,src:'placeholder',grp:lib&&lib.grp&&(st==='s1'||st==='s5')?lib.grp:g,custom:true};
    commit(function(){if(st==='s1'||st==='s5')h[st].push(l);else{h.x=h.x||{};h.x[st]=h.x[st]||[];h.x[st].push(l)}});toast('Line added');return}
  if(a==='resetkm'){UI.km=null;save();render();return}
  if(a==='lgon'){commit(function(){var g=S.logi[st].find(function(l){return l.id===t.dataset.lid});g.on=g.on===false})}
  if(a==='lgrm'){if(confirm('Remove this line for every home?'))commit(function(){S.logi[st]=S.logi[st].filter(function(l){return l.id!==t.dataset.lid})});return}
  if(a==='lgadd'){var nm=$('#lga_'+st+'_n').value.trim();if(!nm){toast('Type a name for the line');return}var bb=$('#lga_'+st+'_b').value,rr=num($('#lga_'+st+'_r').value);commit(function(){S.logi[st].push({id:uid(),name:nm,basis:bb,rate:rr,qty:1,on:true,src:'placeholder',grp:'Added'})});toast('Added for every home');return}
  if(a==='finon'){commit(function(){var o=finOpt(t.dataset.g,t.dataset.n);o.on=o.on===false})}
  if(a==='finrm'){if(confirm('Remove this option?'))commit(function(){S.fin[t.dataset.g]=S.fin[t.dataset.g].filter(function(o){return o.name!==t.dataset.n})});return}
  if(a==='finadd'){var g=t.dataset.g,nn=$('#fa_'+g+'_n').value.trim();if(!nn){toast('Type a name');return}commit(function(){S.fin[g].push({id:nn,name:nn,color:$('#fa_'+g+'_c').value,base:false,on:true,cost:{'solum-studio':num($('#fa_'+g+'_s').value),'solum-plus':num($('#fa_'+g+'_p').value),'solum-max':num($('#fa_'+g+'_m').value)}})});return}
  if(a==='neworder'){commit(function(){var o={id:uid(),name:'New order',client:'',state:UI.state,km:null,status:'Quote',pkg:'turn',created:new Date().toISOString().slice(0,10),notes:'',lines:[{id:uid(),home:UI.home,qty:1}],actual:{}};S.orders.unshift(o);UI.order=o.id});return}
  if(a==='oaddline'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});o.lines.push({id:uid(),home:UI.home,qty:1})});return}
  if(a==='olrm'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});o.lines=o.lines.filter(function(l){return l.id!==t.dataset.lid})});return}
  if(a==='ostatus'){commit(function(){S.orders.find(function(x){return x.id===UI.order}).status=t.dataset.s});return}
  if(a==='odel'){if(confirm('Delete this order?'))commit(function(){S.orders=S.orders.filter(function(x){return x.id!==UI.order});UI.order=null});return}
  if(a==='print'){window.print();return}
  if(a==='copysheet'){copySheet();return}
  if(a==='bulkmod'){var fam=t.dataset.fam,v=num($('#bulk_'+fam).value);if(!v){toast('Type a $/m² rate first');return}commit(function(){S.homes.filter(function(x){return x.fam===fam}).forEach(function(x){var m=modLine(x);if(m)m.rate=v})});toast('Module rate set');return}
  if(a==='applyall'){commit(function(){['prelims','gst','mPort','mSite','mTurn'].forEach(function(k){var v=$('#ap_'+k).value;if(v!=='')S.homes.forEach(function(x){x.set[k]=num(v)})})});toast('Applied to every home');return}
  if(a==='export'){var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),aa=document.createElement('a');aa.href=u;aa.download='haavn-feasibility-backup-'+new Date().toISOString().slice(0,10)+'.json';aa.click();setTimeout(function(){URL.revokeObjectURL(u)},500);return}
  if(a==='import'){$('#importFile').click();return}
  if(a==='clearsamples'){commit(function(){S.orders=S.orders.filter(function(o){return !o.sample});UI.order=null});toast('Sample orders removed');return}
  if(a==='reset'){if(confirm('Reset every number back to the starting data? Your edits and orders will be lost.')){S=clone(window.SEED);save();render();toast('Reset')}return}
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.id==='importFile'){var f=t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var s=JSON.parse(rd.result);if(s&&s.v===1&&s.homes){S=s;save();render();toast('Backup loaded')}else toast('That file is not a backup')}catch(x){toast('That file is not a backup')}};rd.readAsText(f);return}
  var a=t.dataset.a;if(!a)return;var v=t.value,h=home(UI.home),st=t.dataset.st;
  if(a==='pickhome'){UI.home=v;UI.km=null;save();render();return}
  if(a==='km'){UI.km=v===''?null:num(v);save();render();return}
  if(a==='hf'){var hh=home(t.dataset.hid||UI.home);commit(function(){hh[t.dataset.f]=num(v);if(t.dataset.f==='area'&&hh.tbc&&num(v)>0)hh.tbc=false})}
  else if(a==='rate'){commit(function(){var x=home(t.dataset.hid),l=findHomeLine(x,'s1',t.dataset.lid);if(l)l.rate=num(v)})}
  else if(a==='hfin'){commit(function(){h.fin[t.dataset.f]=v})}
  else if(a==='set'){commit(function(){h.set[t.dataset.f]=num(v)})}
  else if(a==='line'){if(t.tagName!=='BUTTON')commit(function(){lineEdit(t,v)})}
  else if(a==='lgrate'){commit(function(){var g=S.logi[st].find(function(l){return l.id===t.dataset.lid});if(g.rates)g.rates[t.dataset.state]=num(v);else g.rate=num(v)})}
  else if(a==='lgbasis'){commit(function(){S.logi[st].find(function(l){return l.id===t.dataset.lid}).basis=v})}
  else if(a==='lgqty'){commit(function(){S.logi[st].find(function(l){return l.id===t.dataset.lid}).qty=num(v)})}
  else if(a==='port'){commit(function(){S.states[t.dataset.state].port=v})}
  else if(a==='portkm'){commit(function(){S.states[t.dataset.state].km=num(v)})}
  else if(a==='fincost'){commit(function(){finOpt(t.dataset.g,t.dataset.n).cost[t.dataset.hid]=num(v)})}
  else if(a==='ofld'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});var f=t.dataset.f;o[f]=(f==='km')?(v===''?null:num(v)):v})}
  else if(a==='olhome'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});var l=o.lines.find(function(x){return x.id===t.dataset.lid});l.home=v;delete l.fin})}
  else if(a==='olqty'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});o.lines.find(function(x){return x.id===t.dataset.lid}).qty=Math.max(0,num(v))})}
  else if(a==='olfin'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});var l=o.lines.find(function(x){return x.id===t.dataset.lid});var hh=home(l.home);l.fin=Object.assign({},hh.fin,l.fin||{});l.fin[t.dataset.f]=v})}
  else if(a==='oact'){commit(function(){var o=S.orders.find(function(x){return x.id===UI.order});o.actual=o.actual||{};o.actual[t.dataset.st]=v===''?'':num(v)})}
});
function copySheet(){
  var L=['HAAVN price sheet · '+UI.state+' · '+S.states[UI.state].port+' · prices inc GST',''];
  FAM.forEach(function(f){var hs=S.homes.filter(function(x){return x.fam===f.k&&x.area&&!x.tbc});if(!hs.length)return;L.push(f.n);hs.forEach(function(x){var e=est(x.id,{state:UI.state});L.push('  '+x.name+' ('+fmt(x.area)+' m²): to port '+money(e.pk.port.sell)+' · to site '+money(e.pk.site.sell)+' · turnkey '+money(e.pk.turn.sell))});L.push('')});
  var tx=L.join('\n');try{navigator.clipboard.writeText(tx).then(function(){toast('Price sheet copied')},function(){toast('Could not copy')})}catch(x){toast('Could not copy')}
}
/* shell */
$('#menuBtn').addEventListener('click',function(){document.body.classList.toggle('nav-open')});
$('#navscrim').addEventListener('click',function(){document.body.classList.remove('nav-open')});
function setTheme(t){t=t==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('atrium_theme',t)}catch(e){}try{if(window.hmGround)window.hmGround(t)}catch(e){}var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#050605':'#cfccc6'}
$('#themeBtn').addEventListener('click',function(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')});
$('#refreshBtn').addEventListener('click',function(){var b=this;if(b.classList.contains('go'))return;b.classList.add('go');
  if(window.parent!==window)try{window.parent.postMessage({hbShell:'refresh'},'*')}catch(e){}
  setTimeout(function(){try{if('caches' in window)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){}location.replace(location.pathname+'?u='+Date.now())},900)});
$('#bBack').addEventListener('click',function(){location.href='/haavn-supply/index.html'});
try{setTheme(localStorage.getItem('atrium_theme')==='dark'?'dark':'light')}catch(e){setTheme('light')}
render();
window.__feas={S:function(){return S},est:est,home:home,orderCalc:orderCalc};
})();
