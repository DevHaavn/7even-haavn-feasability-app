<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAAVN × Hamilton Marino — Shareholder · Path to Market</title>
<style>
:root{
  --paper:#eeece6;--paper-2:#f5f4ef;--ink:#1c1c1e;
  --olive:#6b6c5c;--olive-d:#565646;--sage:#8f907f;
  --bronze:#a9855c;--bronze-d:#8a6a44;
  --green:#2f8f5b;--green-d:#1f7d49;
  --line:#c9c7bd;--line-soft:#d9d7cd;--card:#ffffff;
  --shadow:0 1px 2px rgba(28,28,30,.05),0 8px 26px rgba(28,28,30,.08);
  --font:"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);
  background:
    radial-gradient(1200px 700px at 78% -8%, #f7f6f1 0%, rgba(247,246,241,0) 55%),
    radial-gradient(1100px 800px at 6% 108%, #e7e6dd 0%, rgba(231,230,221,0) 55%),
    var(--paper);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ---------- masthead ---------- */
header{padding:16px clamp(16px,3.4vw,40px) 0;flex:0 0 auto}
.top-rule{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.wordmark{font-weight:800;letter-spacing:.14em;font-size:clamp(15px,2vw,20px);color:var(--ink);white-space:nowrap}
.wordmark .xd{color:var(--sage);font-weight:400;font-size:.82em;margin:0 .28em;transform:translateY(-1px);display:inline-block}
.hm-word{font-weight:700;letter-spacing:.11em;font-size:clamp(12px,1.6vw,16px);color:var(--olive-d)}
.tagline{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--sage);font-weight:600}
.top-spacer{flex:1}
.access{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--green-d);font-weight:700;white-space:nowrap}
.access .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(47,143,91,.5)}
.title-block{padding:16px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font-weight:800;letter-spacing:-.02em;font-size:clamp(22px,3.4vw,36px);line-height:1;color:var(--ink)}
h1 .thin{font-weight:300;color:var(--olive)}
.subhead{max-width:520px;font-size:12.5px;color:#55564c;line-height:1.55}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px clamp(16px,3.4vw,40px) 16px;flex:0 0 auto}
.tab{
  border:1px solid var(--line);background:var(--paper-2);cursor:pointer;
  font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--olive-d);
  padding:11px 18px;border-radius:12px;transition:.2s;display:flex;align-items:center;gap:10px;
}
.tab:hover{border-color:var(--olive);color:var(--ink)}
.tab .tn{font-family:var(--mono);font-size:11px;color:var(--bronze-d);font-weight:700}
.tab.active{background:var(--ink);color:#f4f3ee;border-color:var(--ink);box-shadow:var(--shadow)}
.tab.active .tn{color:var(--bronze)}

/* ---------- frame ---------- */
.stage{flex:1 1 auto;position:relative;margin:0 clamp(16px,3.4vw,40px) clamp(16px,3.4vw,40px);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);
  background:var(--card);transition:opacity .3s;pointer-events:none}
.loading.hide{opacity:0}

@media(max-width:720px){
  .title-block{padding-top:12px}
  .subhead{display:none}
  .tab{padding:9px 13px;font-size:11px}
}
</style>
</head>
<body>
<header>
  <div class="top-rule">
    <div class="brand">
      <span class="wordmark">HAAVN<span class="xd">×</span></span>
      <span class="hm-word">HAMILTON MARINO</span>
    </div>
    <div class="top-spacer"></div>
    <div class="access"><span class="dot"></span>Shareholder Access</div>
  </div>
  <div class="title-block">
    <div>
      <div class="tagline">Partnership · Confidential</div>
      <h1 style="margin-top:6px">Path to market <span class="thin">&amp; the business</span></h1>
    </div>
    <p class="subhead">The route to market for HAAVN Black, the income to the partnership, the cost to run and scale it, and the group structure behind it — for HAAVN&nbsp;×&nbsp;Hamilton&nbsp;Marino shareholders.</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-src="/haavn-partners-market.html"><span class="tn">01</span> Path to Market &amp; Revenue</button>
  <button class="tab" data-src="/haavn-partners-costs.html"><span class="tn">02</span> Cost to the Business</button>
  <button class="tab" data-src="/haavn-partners-structure.html"><span class="tn">03</span> Group Structure</button>
  <button class="tab" data-src="/haavn-partners-directive.html"><span class="tn">04</span> Operating Directive</button>
</nav>

<div class="stage">
  <div class="loading" id="loading">Loading…</div>
  <iframe id="frame" src="/haavn-partners-market.html" title="Shareholder view"></iframe>
</div>

<script>
(function(){
  var tabs=document.getElementById('tabs');
  var frame=document.getElementById('frame');
  var loading=document.getElementById('loading');
  frame.addEventListener('load',function(){loading.classList.add('hide');});
  tabs.addEventListener('click',function(e){
    var btn=e.target.closest('.tab'); if(!btn) return;
    if(btn.classList.contains('active')) return;
    tabs.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    btn.classList.add('active');
    loading.classList.remove('hide');
    frame.src=btn.getAttribute('data-src');
  });
})();
</script>
</body>
</html>
