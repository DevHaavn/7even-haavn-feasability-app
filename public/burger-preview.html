<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Icon (preview)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#060708;color:#e8e9eb;font-family:'JetBrains Mono',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:40px}
h1{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#8a8f95;font-weight:400}
.row{display:flex;gap:70px;align-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:16px}
.lab{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#6a6f75}

/* ── the new burger: two vertical lines (middle removed) ── */
.vburger{width:46px;height:42px;display:flex;align-items:center;justify-content:center;gap:14px;
  cursor:pointer;border:none;background:transparent;padding:0;transition:.3s}
.vburger span{display:block;width:4px;height:22px;background:#dfe1e4;transition:.3s;border-radius:1px}
.vburger.gold:hover span{background:#d6b36a;box-shadow:0 0 10px rgba(214,179,106,.9),0 0 22px rgba(214,179,106,.5)}
.vburger.green:hover span{background:#2fe07a;box-shadow:0 0 10px rgba(47,224,122,.9),0 0 22px rgba(47,224,122,.5)}

/* open state — same designer chevron X as now */
.vburger.on span{opacity:0}
.vburger{position:relative}
.vburger.on::before,.vburger.on::after{content:'';position:absolute;top:50%;width:13px;height:22px;transform:translateY(-50%);transition:.3s}
.vburger.on::before{left:8px;clip-path:polygon(0 0,42% 0,100% 50%,42% 100%,0 100%,58% 50%)}
.vburger.on::after{right:8px;clip-path:polygon(100% 0,58% 0,0 50%,58% 100%,100% 100%,42% 50%)}
.vburger.gold.on::before,.vburger.gold.on::after{background:#d6b36a;filter:drop-shadow(0 0 8px rgba(214,179,106,.85))}
.vburger.green.on::before,.vburger.green.on::after{background:#2fe07a;filter:drop-shadow(0 0 8px rgba(47,224,122,.85))}

.hint{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:#4d5257;margin-top:8px}
.frame{padding:26px 34px;border:1px solid rgba(255,255,255,.12);border-radius:4px;background:#0a0b0c}
</style>
</head>
<body>
<h1>New menu icon — two vertical lines</h1>

<div class="row">
  <div class="cell frame">
    <button class="vburger gold" onclick="this.classList.toggle('on')"><span></span><span></span></button>
    <div class="lab">7EVEN · gold hover</div>
  </div>
  <div class="cell frame">
    <button class="vburger green" onclick="this.classList.toggle('on')"><span></span><span></span></button>
    <div class="lab">HAAVN BLACK · green hover</div>
  </div>
</div>

<div class="hint">Hover for the glow · click to see the open chevron X (unchanged)</div>
</body>
</html>
