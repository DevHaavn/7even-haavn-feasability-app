<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAAVN Homes · ATRIUM CRM & Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#ECE8DE; --paper:#F4F1E9; --card:#FBFAF6; --ink:#1A1714; --ink2:#403A32;
  --ink3:#736E62; --line:#D6D0C2; --line2:#C4BDAB; --gold:#9A7526; --goldl:#C39A46;
  --char:#17150F; --char2:#211E17; --charline:#332F26;
  --ok:#3C6E47; --okbg:#E4EBE0; --warn:#9A6B1F; --warnbg:#F3E9D4; --bad:#8A3A2E; --badbg:#F1E0DA;
  --blue:#2A4C6B; --bluebg:#E1E8EE;
  --sh:0 1px 2px rgba(26,23,20,.05),0 8px 24px rgba(26,23,20,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bone);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace}
.app{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{width:246px;background:var(--char);color:#E9E5DB;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;border-right:1px solid #000}
.sb-brand{padding:20px 20px 14px;border-bottom:1px solid var(--charline)}
.sb-brand svg{width:118px;height:auto;display:block}
.sb-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;color:#8C8578;margin-top:9px}
.roleswitch{display:flex;gap:4px;margin:14px 16px 6px;background:#0C0B08;border:1px solid var(--charline);border-radius:8px;padding:3px}
.roleswitch button{flex:1;padding:7px 0;font-size:11px;font-weight:700;letter-spacing:.04em;color:#8C8578;border-radius:6px;transition:.15s}
.roleswitch button.on{background:var(--paper);color:var(--ink)}
.sb-nav{flex:1;overflow-y:auto;padding:10px 12px 20px}
.sb-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;color:#6E6858;margin:16px 10px 7px}
.sb-nav button.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:8px;color:#B9B3A5;font-size:13px;font-weight:500;text-align:left;transition:.13s;margin-bottom:1px}
.sb-nav button.nav:hover{background:#211E16;color:#EFEBE1}
.sb-nav button.nav.on{background:#26221A;color:#fff;font-weight:600}
.sb-nav .nic{width:18px;text-align:center;font-size:13px;color:#8C8578}
.sb-nav button.nav.on .nic{color:var(--goldl)}
.nav-ct{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;background:#000;color:#B9B3A5;padding:1px 7px;border-radius:20px}
.sb-foot{padding:14px 20px;border-top:1px solid var(--charline);font-size:10px;color:#6E6858;line-height:1.6}

/* ---------- MAIN ---------- */
.main{flex:1;margin-left:246px;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:0 26px;height:54px;background:var(--char);color:#E9E5DB;border-bottom:1px solid #000}
.home-btn{font-size:12px;color:#B9B3A5;text-decoration:none;font-weight:600;white-space:nowrap}
.home-btn:hover{color:#fff}
.crumb{font-size:12px;color:#8C8578;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.crumb b{color:#EFEBE1;font-weight:600}
.hdr-tag{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;color:#6E6858;display:none}
@media(min-width:1180px){.hdr-tag{display:block}}
.savepill{display:flex;align-items:center;gap:7px;font-size:11px;color:#B9B3A5;background:#0C0B08;border:1px solid var(--charline);padding:5px 11px;border-radius:20px;white-space:nowrap}
.savepill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savepill.saving .dot{background:var(--goldl);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.wrap{padding:26px 30px 60px;max-width:1240px;width:100%}

/* ---------- HEADERS ---------- */
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.17em;color:var(--gold);text-transform:uppercase;font-weight:600}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
h1.title{font-size:29px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin-top:5px}
h1.title i{font-style:normal;color:var(--ink3)}
.sub{color:var(--ink3);font-size:13.5px;margin-top:5px;max-width:640px}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line2);color:var(--ink);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--ink3);background:#fff}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold:hover{background:#87651f}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--badbg);border-color:var(--bad)}

/* ---------- CARDS / KPIS ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(184px,1fr));margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px;box-shadow:var(--sh)}
.kpi.dark{background:var(--char);border-color:#000;color:var(--paper)}
.kpi .kl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;color:var(--ink3);text-transform:uppercase}
.kpi.dark .kl{color:#8C8578}
.kpi .kv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1}
.kpi .kv .u{font-size:14px;color:var(--gold);font-weight:700}
.kpi .kf{font-size:11.5px;color:var(--ink3);margin-top:6px}
.kpi.dark .kf{color:#A39C8C}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden;margin-bottom:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.panel-h .pmeta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.06em}
.panel-b{padding:16px 18px}
.panel-b.flush{padding:0}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse}
th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--bone)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr.rowlink{cursor:pointer;transition:.1s}
tr.rowlink:hover td{background:#fff}
tbody tr:last-child td{border-bottom:none}
.tname{font-weight:700}
.tsub{font-size:11px;color:var(--ink3);margin-top:1px}

/* ---------- PILLS ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.mute{background:var(--bone);color:var(--ink3)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--ink2)}

/* ---------- FORM FIELDS ---------- */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.f input,.f select,.f textarea,.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;transition:.13s}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(154,117,38,.1)}
.f textarea{resize:vertical;min-height:70px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.inp.tiny{padding:5px 8px;font-size:12px;width:auto}
.dateinp{padding:6px 9px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:12px;font-family:'IBM Plex Mono',monospace}
.selinp{padding:6px 9px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:12px}

/* ---------- PIPELINE BOARD ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bone);border:1px solid var(--line);border-radius:11px;min-height:120px;display:flex;flex-direction:column}
.col-h{padding:11px 13px;border-bottom:1px solid var(--line);position:sticky;top:0}
.col-h .ph{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--gold);font-weight:600}
.col-h .cn{font-size:12.5px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.col-h .cc{font-size:10px;color:var(--ink3);font-family:'IBM Plex Mono',monospace}
.col-b{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1}
.lead{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.lead:hover{border-color:var(--ink3);transform:translateY(-1px);box-shadow:var(--sh)}
.lead .ln{font-weight:700;font-size:12.5px}
.lead .lm{font-size:10.5px;color:var(--ink3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lead .lb{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.srcdot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- DETAIL DRAWER ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,21,15,.5);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:var(--paper);z-index:70;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drawer.on{transform:none}
.dr-top{background:var(--char);color:var(--paper);padding:18px 22px}
.dr-top .dclose{position:absolute;top:16px;right:18px;font-size:20px;color:#B9B3A5;background:none}
.dr-top .dclose:hover{color:#fff}
.dr-nm{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dr-sub{font-size:11.5px;color:#A39C8C;margin-top:3px;font-family:'IBM Plex Mono',monospace}
.dr-tabs{display:flex;gap:2px;padding:0 14px;background:var(--char2);border-bottom:1px solid var(--charline)}
.dr-tabs button{padding:11px 13px;font-size:12px;font-weight:600;color:#8C8578;border-bottom:2px solid transparent}
.dr-tabs button.on{color:#fff;border-color:var(--goldl)}
.dr-body{flex:1;overflow-y:auto;padding:20px 22px}
.dr-foot{display:flex;justify-content:space-between;gap:12px;padding:13px 22px;background:var(--paper);border-top:1px solid rgba(0,0,0,.12)}
.dr-foot .btn{padding:11px 20px;font-size:13px;font-weight:700;border-radius:9px}
.btn.arm{background:#c0362f!important;color:#fff!important;border-color:#c0362f!important}

/* ---------- STEP TRACKER ---------- */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:13px;padding:2px 0}
.step .sdot{display:flex;flex-direction:column;align-items:center}
.step .sc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink3);flex-shrink:0;z-index:1;cursor:pointer;transition:.13s}
.step.done .sc{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step.cur .sc{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(154,117,38,.15)}
.step .sline{width:2px;flex:1;background:var(--line2);min-height:16px}
.step.done .sline{background:var(--ink)}
.step .stx{padding-bottom:14px;flex:1}
.step .sph{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.09em;color:var(--gold)}
.step .snm{font-size:13px;font-weight:600;margin-top:1px}
.step.done .snm{color:var(--ink2)}
.step:not(.done):not(.cur) .snm{color:var(--ink3)}

/* ---------- DELIVERY GATES + STAGES ---------- */
.gates{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.gate{border:1px solid var(--line2);border-radius:9px;padding:9px 6px;text-align:center;cursor:pointer;transition:.13s;background:#fff}
.gate:hover{border-color:var(--ink3)}
.gate.done{background:var(--char);border-color:var(--char);color:var(--paper)}
.gate .gk{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600}
.gate .gl{font-size:8.5px;line-height:1.2;margin-top:4px;color:var(--ink3)}
.gate.done .gl{color:#A39C8C}
.gate .gd{font-family:'IBM Plex Mono',monospace;font-size:8px;margin-top:4px;color:var(--gold)}
.dstage{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;background:#fff}
.dstage-h{display:flex;align-items:center;gap:11px}
.dstage .dsn{font-weight:700;font-size:13px;flex:1}
.dstage .dsi{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);width:22px}
.bar{height:7px;background:var(--bone);border-radius:20px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldl));border-radius:20px;transition:.3s}
.dstage-ctl{display:flex;gap:10px;align-items:center;margin-top:11px;flex-wrap:wrap}

/* ---------- NOTES ---------- */
.note{border-left:2px solid var(--line2);padding:4px 0 12px 13px;margin-left:3px}
.note .nh{font-size:11px;color:var(--ink3);font-family:'IBM Plex Mono',monospace}
.note .nh b{color:var(--ink);font-weight:600}
.note .ntx{font-size:13px;margin-top:3px}
.attach{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--blue);background:var(--bluebg);padding:3px 9px;border-radius:6px;margin-top:6px;margin-right:6px}

/* ---------- SHAREHOLDER BOARD ---------- */
.shrow td{padding:14px}
.rag{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.rag.g{background:var(--ok)}.rag.a{background:var(--warn)}.rag.r{background:var(--bad)}
.miniprog{display:flex;align-items:center;gap:8px}
.miniprog .mb{width:90px;height:6px;background:var(--bone);border-radius:20px;overflow:hidden}
.miniprog .mb i{display:block;height:100%;background:var(--ink)}
.miniprog .mp{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;width:34px}

/* utility */
.muted{color:var(--ink3)}
.right{text-align:right}
.center{text-align:center}
.mt2{margin-top:8px}.mt3{margin-top:14px}.mb2{margin-bottom:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.flexwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty .ei{font-size:26px;opacity:.4}
.linkbtn{color:var(--gold);font-weight:600;font-size:12px}
.linkbtn:hover{text-decoration:underline}
.divlbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;color:var(--ink3);text-transform:uppercase;margin:20px 0 10px;border-top:1px solid var(--line);padding-top:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two,.frow{grid-template-columns:1fr}.board{grid-template-columns:repeat(5,240px)}}

/* capability scoped */
.capwrap .eyebrow{color:var(--gold)}
.hm-logo{font-family:'Saira Condensed',sans-serif;font-weight:700;letter-spacing:.01em;font-size:15px}
.hm-logo .hm1{color:var(--ink)}.hm-logo .hm2{color:#F0791E}
.capcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
</style>
</head>

<script>
/* ==================================================================
   HAAVN ATRIUM — CRM + Contract + Delivery Program
   Single-file working application · localStorage autosave
   ================================================================== */

/* ---------------- REFERENCE MODEL ---------------- */
const HOMES={
  'SOLUM':{price:238000,beds:'1–2 bed',foot:'Granny flat / rear dwelling'},
  'HAVEN':{price:392000,beds:'2–3 bed',foot:'Single-level home'},
  'MAGNA':{price:548000,beds:'3–4 bed',foot:'Family home'},
  'MAGNA PLUS':{price:642000,beds:'4–5 bed',foot:'Premium family home'},
  'FORMA':{price:486000,beds:'3 bed',foot:'Architectural / sloping site'},
};
const SOURCES={
  walkin:{label:'Walk-in · Display',color:'#9A7526'},
  social:{label:'Social media ad',color:'#2A4C6B'},
  web:{label:'Website enquiry',color:'#3C6E47'},
  referral:{label:'Referral',color:'#8A3A2E'},
};
const PHASES=[
  {k:'A',name:'Discover & Qualify',team:'sales'},
  {k:'B',name:'Configure & Prove',team:'sales'},
  {k:'C',name:'Design · Contract · Permit',team:'both'},
  {k:'D',name:'Manufacture · Site · Install',team:'construction'},
  {k:'E',name:'Handover & Warranty',team:'construction'},
];

let _cloudOk=false,_cloudTs=0,_pushT=null;
function _isTyping(){const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);}
function _reuid(){try{const ids=[...DB.customers.map(c=>c.id),...(DB.shareholders||[]).map(s=>s.id)];_uid=(ids.length?Math.max(...ids):0)+1;}catch(e){}}
async function cloudPull(){
  try{const r=await fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+CLOUD_KEY+'&select=value,updated_at',{headers:SUPA_H});
    if(!r.ok)return null; _cloudOk=true; const rows=await r.json(); return (rows&&rows.length)?rows[0]:null;
  }catch(e){return null;}
}
function cloudPush(){
  if(!_cloudOk)return; clearTimeout(_pushT);
  _pushT=setTimeout(async()=>{
    try{const body=[{key:CLOUD_KEY,value:DB,updated_at:new Date().toISOString()}];
      const r=await fetch(SUPA_URL+'/rest/v1/capital_kv',{method:'POST',headers:Object.assign({},SUPA_H,{Prefer:'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(body)});
      if(r.ok){const rows=await r.json(); if(rows&&rows[0])_cloudTs=Date.parse(rows[0].updated_at)||Date.now();}
    }catch(e){}
  },500);
}
async function cloudPoll(){
  if(!_cloudOk||_isTyping())return;
  try{const r=await fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+CLOUD_KEY+'&select=updated_at',{headers:SUPA_H});
    if(!r.ok)return; const rows=await r.json(); if(!rows||!rows.length)return;
    const ts=Date.parse(rows[0].updated_at)||0;
    if(ts>_cloudTs){const row=await cloudPull(); if(!row||!row.value)return;
      DB=row.value; _cloudTs=ts; _reuid(); try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
      const openId=(typeof curId!=='undefined')?curId:null; render(); if(openId&&typeof renderDrawer==='function')renderDrawer();
    }
  }catch(e){}
}

const moneyk=n=>{n=n||0; return n>=1e6?'$'+(n/1e6).toFixed(2)+'M':'$'+Math.round(n/1e3)+'k';};
function fmtDate(d){ if(!d)return '—'; const x=new Date(d+(d.length<=10?'T00:00':'')); if(isNaN(x))return d; return x.toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}); }

function get(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function set(o,path,v){const ks=path.split('.');const last=ks.pop();let t=o;ks.forEach(k=>t=t[k]);t[last]=v;}
function phaseOf(step){return STEPS.find(s=>s.n===step)?.ph||'A';}
function phaseName(step){return PHASES.find(p=>p.k===phaseOf(step))?.name||'';}
function stepName(step){return STEPS.find(s=>s.n===step)?.t||'';}
function contractSum(c){return CONTRACT_DEFS.filter(d=>d.pct>0).reduce((a,d)=>a+(c.contracts[d.k].value||0),0);}
function isActive(c){return c.stage>=6;}            // reserved onward = live project
function inDelivery(c){return c.stage>=11;}
function deliveryPct(c){const s=c.delivery.stages;return Math.round(s.reduce((a,x)=>a+x.pct,0)/s.length);}
function ragOf(c){
  if(c.delivery.stages.some(s=>s.status===2))return 'r';
  const p=deliveryPct(c); if(c.stage>=15)return 'g';
  return p>0?'g':'a';
}

/* ===========================================================
   DETAIL DRAWER
   =========================================================== */
function openDetail(id){curId=id;detTab='journey';renderDrawer();$('#drawer').classList.add('on');$('#scrim').classList.add('on');}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');curId=null;}
function renderDrawer(){
  const c=cust(curId); if(!c)return;
  const tabs=[['journey','Journey'],['contracts','Contracts'],['delivery','Delivery'],['notes','Notes'],['edit','Details']];
  $('#drawer').innerHTML=`
  <div class="dr-top">
    <button class="dclose" data-act="closeDrawer">✕</button>
    <div class="dr-nm">${esc(c.name)}</div>
    <div class="dr-sub">${c.home} · ${esc(c.suburb||'—')} · Step ${c.stage}/15 · ${esc(c.owner)}</div>
  </div>
  <div class="dr-tabs">${tabs.map(([k,l])=>`<button class="${detTab===k?'on':''}" data-act="detTab" data-tab="${k}">${l}</button>`).join('')}</div>
  <div class="dr-body">${dBody(c)}</div>
  <div class="dr-foot">
    <button class="btn danger" data-act="delCust" data-id="${c.id}">🗑 Delete</button>
    <button class="btn gold" data-act="saveClose">✓ Save &amp; Close</button>
  </div>`;
}
function dBody(c){
  if(detTab==='journey')return dJourney(c);
  if(detTab==='contracts')return dContracts(c);
  if(detTab==='delivery')return dDelivery(c);
  if(detTab==='notes')return dNotes(c);
  if(detTab==='edit')return dEdit(c);
}
function dJourney(c){
  return `<div class="row-between mb2"><div class="eyebrow">15-step journey</div>
    <div class="flexwrap"><button class="btn sm" data-act="back" data-id="${c.id}" ${c.stage<=1?'disabled style="opacity:.3"':''}>‹ Back</button><button class="btn sm gold" data-act="fwd" data-id="${c.id}" ${c.stage>=15?'disabled style="opacity:.3"':''}>Advance ›</button></div></div>
  <p class="muted mb2" style="font-size:12.5px">Tap any step to jump the customer to that point. Phase ${phaseOf(c.stage)} — ${phaseName(c.stage)}.</p>
  <div class="steps">
  ${STEPS.map((s,i)=>{
    const done=c.stage>s.n, cur=c.stage===s.n;
    return `<div class="step ${done?'done':''} ${cur?'cur':''}">
      <div class="sdot"><div class="sc" data-act="setStep" data-id="${c.id}" data-step="${s.n}">${done?'✓':s.n}</div>${i<STEPS.length-1?'<div class="sline"></div>':''}</div>
      <div class="stx"><div class="sph">PHASE ${s.ph} · ${PHASES.find(p=>p.k===s.ph).name}</div><div class="snm">${s.t}</div></div>
    </div>`;
  }).join('')}
  </div>`;
}
function dContracts(c){
  const canRelease=c.contracts.supply.status>=3&&c.contracts.install.status>=3&&c.contracts.warranty.status>=3&&c.contracts.permit.status>=3;
  return `<div class="row-between mb2"><div class="eyebrow">Two-contract model</div>
    <span class="pill ${c.contracts.releaseGate?'ok':canRelease?'warn':'mute'}"><span class="d"></span>${c.contracts.releaseGate?'Released':canRelease?'Ready':'Gate open'}</span></div>
  ${CONTRACT_DEFS.map(d=>{const ct=c.contracts[d.k];return `<div class="capcard" style="margin-bottom:10px">
    <div class="row-between"><div><div class="tname" style="font-size:13px">${d.name}</div><div class="tsub">${d.who} · ${d.note}</div></div>
    ${d.pct>0?`<input class="inp tiny mono" style="width:110px" value="${ct.value}" data-bind="c:${c.id}:contracts.${d.k}.value" data-num="1">`:''}</div>
    <div class="dstage-ctl" style="margin-top:10px">
      <select class="selinp" data-bind="c:${c.id}:contracts.${d.k}.status" data-num="1">${CSTATUS.map((s,i)=>`<option value="${i}" ${ct.status===i?'selected':''}>${s}</option>`).join('')}</select>
      <label class="mono muted" style="font-size:10px">Signed <input class="dateinp" type="date" value="${ct.signed}" data-bind="c:${c.id}:contracts.${d.k}.signed"></label>
    </div></div>`;}).join('')}
  <button class="btn ${c.contracts.releaseGate?'':'gold'}" style="width:100%;justify-content:center;margin-top:6px" data-act="toggleRelease" data-id="${c.id}" ${(!canRelease&&!c.contracts.releaseGate)?'disabled style="opacity:.4"':''}>${c.contracts.releaseGate?'Revoke manufacture release':'Release to manufacture (G3) ▸'}</button>`;
}
function dDelivery(c){
  if(!inDelivery(c))return `<div class="empty"><div class="ei">▦</div><div>This home isn't in delivery yet.<br>Release its contract to manufacture to open the program.</div></div>`;
  const d=c.delivery;
  return `<div class="row-between mb2"><div class="eyebrow">7-stage delivery</div><span class="miniprog"><span class="mb"><i style="width:${deliveryPct(c)}%"></i></span><span class="mp">${deliveryPct(c)}%</span></span></div>
  <div class="gates">${d.gates.map(g=>{const def=DGATES.find(x=>x.k===g.k);return `<div class="gate ${g.done?'done':''}" data-act="toggleGate" data-id="${c.id}" data-gate="${g.k}"><div class="gk">${g.k}</div><div class="gl">${def.l}</div></div>`;}).join('')}</div>
  ${d.stages.map((s,i)=>`<div class="dstage">
    <div class="dstage-h"><span class="dsi">${i+1}</span><span class="dsn">${s.name}</span><span class="pill ${s.status===3?'ok':s.status===2?'bad':s.status===1?'warn':'mute'}"><span class="d"></span>${DSTATUS[s.status]}</span></div>
    <div class="bar"><i style="width:${s.pct}%"></i></div>
    <div class="dstage-ctl">
      <select class="selinp" data-bind="c:${c.id}:delivery.stages.${i}.status" data-num="1" data-hook="stageStatus:${c.id}:${i}">${DSTATUS.map((t,si)=>`<option value="${si}" ${s.status===si?'selected':''}>${t}</option>`).join('')}</select>
      <label class="mono muted" style="font-size:10px">% <input class="inp tiny mono" style="width:50px" value="${s.pct}" data-bind="c:${c.id}:delivery.stages.${i}.pct" data-num="1" data-clamp="100"></label>
      <input class="inp tiny" style="flex:1;min-width:130px" value="${esc(s.note)}" data-bind="c:${c.id}:delivery.stages.${i}.note" placeholder="Note…">
    </div></div>`).join('')}`;
}
function dNotes(c){
  return `<div class="eyebrow mb2">Activity & notes</div>
  <div class="capcard mb2">
    <textarea id="noteInp" class="inp" placeholder="Add a note, site update, or record a call…" style="min-height:64px"></textarea>
    <div class="row-between mt2"><input id="noteAtt" class="inp tiny" placeholder="Attach a file name (e.g. survey.pdf)" style="flex:1;margin-right:8px"><button class="btn sm pri" data-act="addNote" data-id="${c.id}">Add note</button></div>
  </div>
  ${c.notes.length?c.notes.map((n,i)=>`<div class="note"><div class="nh"><b>${esc(n.who)}</b> · ${esc(n.when)} <button class="linkbtn" style="float:right;color:var(--bad)" data-act="delNote" data-id="${c.id}" data-i="${i}">delete</button></div><div class="ntx">${esc(n.tx)}</div>${n.attach?`<span class="attach">▤ ${esc(n.attach)}</span>`:''}</div>`).join(''):'<div class="empty">No notes yet.</div>'}`;
}
function dEdit(c){
  return `<div class="eyebrow mb2">Customer details</div>
  <div class="f"><label>Full name</label><input value="${esc(c.name)}" data-bind="c:${c.id}:name"></div>
  <div class="frow"><div class="f"><label>Phone</label><input value="${esc(c.phone)}" data-bind="c:${c.id}:phone"></div>
    <div class="f"><label>Email</label><input value="${esc(c.email)}" data-bind="c:${c.id}:email"></div></div>
  <div class="frow"><div class="f"><label>Suburb</label><input value="${esc(c.suburb)}" data-bind="c:${c.id}:suburb"></div>
    <div class="f"><label>Owner</label><select data-bind="c:${c.id}:owner">${['Sarah Deakin','James Cole','Jeffrey Witbreuk','Callum McDonald'].map(o=>`<option ${c.owner===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <div class="frow"><div class="f"><label>Source</label><select data-bind="c:${c.id}:source">${Object.entries(SOURCES).map(([k,v])=>`<option value="${k}" ${c.source===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="f"><label>Home / product</label><select data-bind="c:${c.id}:home" data-hook="homeChange:${c.id}">${Object.keys(HOMES).map(h=>`<option ${c.home===h?'selected':''}>${h}</option>`).join('')}</select></div></div>
  <div class="f"><label>Budget (ex-GST)</label><input class="mono" value="${c.budget}" data-bind="c:${c.id}:budget" data-num="1"></div>
  <p class="muted" style="font-size:12px;margin-top:14px">All changes save automatically. Use <b>✓ Save &amp; Close</b> below to confirm, or <b>🗑 Delete</b> to remove this customer.</p>`;
}

/* ===========================================================
   MUTATIONS
   =========================================================== */
function newLead(){
  const c=mkCust({name:'New enquiry',stage:1,created:new Date().toISOString().slice(0,10)});
  DB.customers.push(c); save(); render(); openDetail(c.id); detTab='edit'; renderDrawer();
}
function moveStage(id,dir){
  const c=cust(id); if(!c)return;
  c.stage=Math.max(1,Math.min(15,c.stage+dir));
  syncFromStage(c); save();
  if(curId===id)renderDrawer();
  render();
}
function setStep(id,n){const c=cust(id);if(!c)return;c.stage=n;syncFromStage(c);save();if(curId===id)renderDrawer();render();}
function syncFromStage(c){
  /* keep gates roughly in step when advancing through the journey */
  if(c.stage>=11)c.contracts.releaseGate=true;
  const g=c.delivery.gates;
  const map={6:'G0',7:'G1',10:'G2',11:'G3',12:'G4',13:'G5',15:'G6'};
  Object.entries(map).forEach(([st,gk])=>{const gate=g.find(x=>x.k===gk);if(gate&&c.stage>=+st&&!gate.done){gate.done=true;if(!gate.date)gate.date=new Date().toISOString().slice(0,10);}});
}
function toggleRelease(id){const c=cust(id);if(!c)return;c.contracts.releaseGate=!c.contracts.releaseGate;
  const g=c.delivery.gates.find(x=>x.k==='G3'); if(g){g.done=c.contracts.releaseGate;if(g.done&&!g.date)g.date=new Date().toISOString().slice(0,10);}
  if(c.contracts.releaseGate&&c.stage<11){c.stage=11;syncFromStage(c);}
  save();render();if(curId===id)renderDrawer();
}
function toggleGate(id,gk){const c=cust(id);if(!c)return;const g=c.delivery.gates.find(x=>x.k===gk);if(!g)return;g.done=!g.done;g.date=g.done?new Date().toISOString().slice(0,10):'';if(gk==='G3')c.contracts.releaseGate=g.done;save();render();if(curId===id)renderDrawer();}
function addNote(id){const c=cust(id);if(!c)return;const t=$('#noteInp').value.trim();if(!t)return;const att=$('#noteAtt').value.trim();
  c.notes.unshift({who:c.owner,when:new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}),tx:t,attach:att});save();renderDrawer();}
function delNote(id,i){const c=cust(id);if(!c)return;c.notes.splice(i,1);save();renderDrawer();}
let _delArm=null,_delT=null;
function delCust(id){const c=cust(id);if(!c)return;
  if(_delArm!==id){_delArm=id;
    document.querySelectorAll('[data-act="delCust"][data-id="'+id+'"]').forEach(b=>{if(!b.dataset.lbl)b.dataset.lbl=b.innerHTML;b.innerHTML='⚠ Click again to confirm';b.classList.add('arm');});
    clearTimeout(_delT);_delT=setTimeout(()=>{_delArm=null;document.querySelectorAll('[data-act="delCust"]').forEach(b=>{if(b.dataset.lbl){b.innerHTML=b.dataset.lbl;b.classList.remove('arm');}});},3500);
    return;}
  clearTimeout(_delT);_delArm=null;
  DB.customers=DB.customers.filter(x=>x.id!==id);save();closeDrawer();render();}
function addSh(){DB.shareholders.push({id:uid(),name:'New stakeholder',role:'',org:'HAAVN',email:''});save();render();}
function delSh(id){DB.shareholders=DB.shareholders.filter(s=>s.id!==id);save();render();}

/* ===========================================================
   EVENT DELEGATION
   =========================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const a=t.dataset.act, id=t.dataset.id?+t.dataset.id:null;
  switch(a){
    case 'go': go(t.dataset.view); break;
    case 'open': openDetail(id); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'saveClose': save(); closeDrawer(); render(); break;
    case 'detTab': detTab=t.dataset.tab; renderDrawer(); break;
    case 'newLead': newLead(); break;
    case 'fwd': moveStage(id,1); break;
    case 'back': moveStage(id,-1); break;
    case 'setStep': setStep(id,+t.dataset.step); break;
    case 'toggleRelease': toggleRelease(id); break;
    case 'toggleGate': toggleGate(id,t.dataset.gate); break;
    case 'addNote': addNote(id); break;
    case 'delNote': delNote(id,+t.dataset.i); break;
    case 'delCust': delCust(id); break;
    case 'addSh': addSh(); break;
    case 'delSh': delSh(id); break;
  }
});
/* role toggle */
document.getElementById('roleSwitch').addEventListener('click',e=>{
  const b=e.target.closest('[data-role]'); if(!b)return;
  role=b.dataset.role;
  document.querySelectorAll('#roleSwitch button').forEach(x=>x.classList.toggle('on',x.dataset.role===role));
  const allowed=NAV[role].map(n=>n[0]); if(!allowed.includes(view))view='dashboard';
  render();
});
/* inline binding: data-bind="c:<id>:path" or "s:<id>:path" */
function applyBind(el){
  const b=el.dataset.bind; if(!b)return;
  const [kind,id,...pp]=b.split(':'); const path=pp.join(':');
  let obj; if(kind==='c')obj=cust(+id); else if(kind==='s')obj=DB.shareholders.find(s=>s.id===+id);
  if(!obj)return;
  let v=el.value;
  if(el.dataset.num){v=parseInt(String(v).replace(/[^0-9-]/g,''),10);if(isNaN(v))v=0;if(el.dataset.clamp)v=Math.max(0,Math.min(+el.dataset.clamp,v));}
  set(obj,path,v);
  save();
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.bind&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))applyBind(e.target);});
document.addEventListener('change',e=>{
  if(!e.target.dataset||!e.target.dataset.bind)return;
  applyBind(e.target);
  const hook=e.target.dataset.hook;
  if(hook){
    const [h,id,i]=hook.split(':'); const c=cust(+id);
    if(h==='stageStatus'&&c){const s=c.delivery.stages[+i];if(s.status===3)s.pct=100;else if(s.status===0)s.pct=0;else if(s.pct===0||s.pct===100)s.pct=s.status===1?40:s.pct;save();}
    if(h==='homeChange'&&c){c.budget=HOMES[c.home].price;}
  }
  /* re-render for selects that change visible rollups (status pills, releases) */
  if(e.target.tagName==='SELECT'){const openId=curId;render();if(openId){renderDrawer();}}
});

/* ===========================================================
   INIT
   =========================================================== */
(async function boot(){
  const row=await cloudPull();
  if(row&&row.value){ DB=row.value; _cloudTs=Date.parse(row.updated_at)||Date.now(); _reuid(); try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){} }
  else { load(); if(_cloudOk) cloudPush(); }
  render();
  if(_cloudOk) setInterval(cloudPoll, 12000);
})();
</script>
