<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preston · Modular Assembly</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PRESTON — MODULAR ASSEMBLY, as screen two of the HAAVN home page.

   Jamie's "HAAVN SUPPLY - Preston Modular Assembly.html" (Desktop/HAAVN/
   Preston - Files, 10 Sep) ported line for line in geometry, sequence and
   read-outs: basement excavation → screw piling → basement pour → in-situ
   ground → precast lift shaft → modular set. What changed, because this is a
   slide floating over the page's isometric ground rather than a presentation
   on black:
     · the frame is glass — no ground of its own; the line work is INK at full
       strength (the source's white would vanish on the light field) and the
       green stays the source's #bdd420 at full brightness;
     · the crane's sign plates keep their dark fill — they are lit signs and
       the white mark needs something to sit on; the HAAVN mark on the trucks,
       dumpers and read-out is the ink version;
     · no title card or control bar. The ENDING is the source's, whole: the
       wireframe dissolves slowly while the render fades up underneath it,
       the line-work registering onto the render's building as it goes, then
       the PRESTON / HAAVN SUPPLY lockup comes up on the source's dark
       gradient; it holds 5s and replays from the dig. Only change: the render
       and its gradient are feathered at the edges so the photograph sits
       into the field instead of ending in a hard rectangle;
     · TWO modules to a truck — Jamie's confirmed figure (700 modules, 350
       deliveries); the source had gone back to one per truck;
     · it runs at 4× (the speed Jamie set for the previous version) and it
       only draws while the page says it is on screen.
   The original is untouched on the Desktop.
   ══════════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
/* the source's 16:9 frame, as large as the screen allows, centred */
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.78vh);aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
/* read-outs — the source's positions and wording, re-inked for the light ground */
.lab{position:absolute;font-size:clamp(7px,.78vw,11px);letter-spacing:.22em;text-transform:uppercase;
  color:#5f615f;pointer-events:none;line-height:2.0;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.lab b{color:#101010;font-weight:500}
.lab .lm,.lab i{font-style:normal;color:#8a9c08}
#tl{top:13.5%;left:2.6%}
#tl img{width:clamp(64px,7vw,104px);height:auto;display:inline-block;vertical-align:-2px}
#tl .sup{letter-spacing:.46em;margin-left:9px;color:#101010}
#tr{top:13.5%;right:5.4%;text-align:right}
#bl{top:24%;left:2.6%}
#br{top:50%;right:.9%;transform:translateY(-50%);display:flex;
  flex-direction:row-reverse;align-items:center;gap:clamp(6px,.62vw,11px);
  line-height:1.2;letter-spacing:.28em}
#br span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
/* below tablet the frame is too small to carry the read-outs legibly — by id,
   because #br's own display:flex outranks a class */
@media(max-width:560px){#tl,#tr,#bl,#br{display:none}}
/* portrait: fitting 16:9 to the width leaves the tower a few centimetres
   tall, so size the frame by height instead and let it bleed off both sides.
   The building sits at 36–64% of the frame and stays whole; the jib tip and
   the far end of the convoy run off the edges, the way a close shot would. */
@media(max-aspect-ratio:4/5){#stage{width:auto;height:min(52vh,108vw)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="lab" id="tl"><img src="assets/brand/haavn-wordmark-black.png" alt="HAAVN"><span class="sup">SUPPLY</span><br><span class="lm">MODULAR ASSEMBLY</span></div>
  <div class="lab" id="tr">PRESTON</div>
  <div class="lab" id="bl"></div>
  <div class="lab" id="br"></div>
</div>

<script>
/* ============ PALETTE =================================================== */
const INK='#101010', LIME='#bdd420';

/* ============ THE REAL SCHEDULE ========================================= */
/* The drawing is a representative elevation, not one box per real module;
   the read-outs scale progress onto Preston's own numbers. PER_WEEK is the
   20-a-week install assumption already on this project (700 → 35 weeks) —
   swap it when Hamilton Marino confirm the program. */
const APTS=400, MODULES=700, PER_TRUCK=2, PER_WEEK=20;

/* ============ GEOMETRY MODEL ============================================ */
const W=2000,H=1125;
const GROUND=985;                 // site datum
const BAY=54, BX0=730, NB=10;     // 3.5m module bay = 54px  → 1m ≈ 15.4px
const GH=95, LH=48;               // ground storey / typical storey
const PICK=300;                   // truck pickup centreline (jib tip)
const JIB=90, MASTX=1500;         // crane
const BL=730-11, BR=730+540+11;   // basement extent, matching the transfer slab
const BDEPTH=68;                  // one basement level below the hard ground line
const DIGX=BR+66;                 // the excavator works off the east end
const PSPACE=22, PDEPTH=34;       // screw piles: pitch and embedment below the dig
const PX0=BL+9;
const NPILE=Math.floor((BR-BL-18)/PSPACE)+1;
const NB1=NB+1;                   // basement columns sit on every bay line
/* a module's height on the trailer. The source carried one at 48; two
   stacked at 48 stand above the ground line and cross the arcade as the
   convoy passes the site, so at 36 the pair tops out just under GROUND */
const TMH=36;

const levBot = l => l===1 ? GROUND : 890-(l-2)*LH;
const levTop = l => levBot(l) - (l===1?GH:LH);
const bx = b => BX0 + b*BAY;

/* module schedule ------------------------------------------------------- */
const SB=5;                                   // lift-shaft bay: 6th box from the left
const MODS=[];
const add=(l,b,t,w)=>{MODS.push({l,b,t,x:bx(b),y:levTop(l),w:w||BAY,h:l===1?GH:LH,f:0,n:l});
  return MODS[MODS.length-1];};

for(let b=0;b<NB;b++) if(b!==SB) add(1,b,'arch');             // GROUND — traditional
for(let l=1;l<=15;l++) add(l,SB,'shaft').n = l===1?'G':String(l-1);   // shaft: G, 1–14
add(1,SB,'archm');                            // arcade infill in front of the core
for(let l=2;l<=5;l++){                                        // L01–L04 podium
  for(let b=0;b<=6;b++) add(l,b,'pod');
  for(let b=7;b<=9;b++) add(l,b,'core');
}
for(let l=6;l<=14;l++){                                       // L05–L13 tower
  for(let b=2;b<=6;b++) add(l,b,'tower');
  for(let b=7;b<=9;b++) add(l,b,'core');
}
for(let b=2;b<=6;b++) add(15,b,'tower');                      // L14
add(15,7,'pav',BAY*2);                        // rooftop pavilion + core parapet, top right
MODS.push({l:16,b:3,t:'plant',x:bx(3)+6,y:levTop(15)-32,w:BAY*2-12,h:32,f:0}); // roof plant

const GND   = MODS.filter(m=>m.t==='arch');                    // in-situ, no crane
const SHAFT = MODS.filter(m=>m.t==='shaft').sort((a,b)=>a.l-b.l);// craned, floors 1–15
const LIFT  = MODS.filter(m=>m.t!=='arch'&&m.t!=='shaft');      // craned + trucked
const NLIFT = LIFT.length;
const COVER={};                               // level -> the module that clads the core
LIFT.forEach((m,i)=>{ if(m.b===SB) COVER[m.l]=i; });
function coreAlpha(l){                        // 1 = core exposed, 0 = module in front of it
  const i=COVER[l];
  if(i===undefined||idx<=i) return 1;
  return Math.max(0,Math.min(1,LIFT[i].f));   // crossfades out as the module settles
}

const lname = l => l===1?'GROUND': l===16?'ROOF':'L'+String(l-1).padStart(2,'0');

/* ============ DRAWING =================================================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let SC=1;
function resize(){
  const r=stage.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.width*9/16*dpr);
  SC=cv.width/W; draw();
}
addEventListener('resize',resize);

const L=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();};
const R=(x,y,w,h)=>{ctx.beginPath();ctx.rect(x,y,w,h);ctx.stroke();};

/* facade detail for one module box -------------------------------------- */
function facade(m,x,y,w,h){
  const i=5;
  if(m.t==='arch'||m.t==='archm'){                    // ground arcade
    const ax=x+i,ay=y+i,aw=w-2*i,ah=h-2*i,r=aw/2;
    ctx.beginPath();ctx.moveTo(ax,ay+ah);ctx.lineTo(ax,ay+r);
    ctx.arc(ax+r,ay+r,r,Math.PI,0);ctx.lineTo(ax+aw,ay+ah);ctx.stroke();
    const jx=ax+4,jw=aw-8,jr=jw/2;
    ctx.beginPath();ctx.moveTo(jx,ay+ah);ctx.lineTo(jx,ay+r);
    ctx.arc(jx+jr,ay+r,jr,Math.PI,0);ctx.lineTo(jx+jw,ay+ah);ctx.stroke();
    L(ax+r,ay+r,ax+r,ay+ah);
    L(jx,ay+ah-30,jx+jw,ay+ah-30);
    L(jx,ay+ah-52,jx+jw,ay+ah-52);
    L(jx+jr*0.5,ay+r-jr*0.86,jx+jr,ay+r);
    L(jx+jr*1.5,ay+r-jr*0.86,jx+jr,ay+r);
  } else if(m.t==='pod'){                             // podium apartment
    R(x+i,y+i,w-2*i,h-2*i);
    const iw=w-2*i;
    L(x+i+iw/3,y+i,x+i+iw/3,y+h-i);
    L(x+i+2*iw/3,y+i,x+i+2*iw/3,y+h-i);
    L(x+i,y+i+(h-2*i)*0.42,x+w-i,y+i+(h-2*i)*0.42);
    L(x+i,y+h-i-9,x+w-i,y+h-i-9);
  } else if(m.t==='tower'){                           // tower apartment + balcony
    R(x+i,y+i,w-2*i,h-i-13);
    L(x+w/2,y+i,x+w/2,y+h-13);
    L(x+i,y+i+(h-i-13-i)*0.5,x+w-i,y+i+(h-i-13-i)*0.5);
    L(x-7,y+h,x+w+7,y+h);                             // slab edge
    L(x-7,y+h-8,x+w+7,y+h-8);                         // balustrade
    for(let k=0;k<=4;k++) L(x-7+k*(w+14)/4,y+h-8,x-7+k*(w+14)/4,y+h);
  } else if(m.t==='core'){                            // lift / stair core glazing
    const px=x+8,pw=w-16;
    R(px,y,pw,h);
    L(px+pw/3,y,px+pw/3,y+h);
    L(px+2*pw/3,y,px+2*pw/3,y+h);
    for(let k=1;k<4;k++) L(px,y+h*k/4,px+pw,y+h*k/4);
    if(m.l===14){                                     // arched head
      ctx.beginPath();ctx.arc(px+pw/2,y,pw/2,Math.PI,0);ctx.stroke();
    }
  } else if(m.t==='shaft'){
    R(x+4,y+4,w-8,h-8);
    const na=(m.na===undefined?1:m.na);
    if(na>0.012){
      ctx.save();
      ctx.globalAlpha*=na;
      ctx.fillStyle=ctx.strokeStyle;
      ctx.font='500 '+Math.round(Math.min(23,h*0.46))+'px "Helvetica Neue",Helvetica,Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(m.n), x+w/2, y+h/2+1);
      ctx.restore();
    }
  } else if(m.t==='pav'){
    /* set-back rooftop pavilion, three glazed panels */
    R(x,y,w,h-11);
    L(x,y+9,x+w,y+9);
    L(x+w/3,y+9,x+w/3,y+h-11);
    L(x+2*w/3,y+9,x+2*w/3,y+h-11);
    /* projecting parapet slab capping the full core below */
    const s0=x-10, s1=x+w+64;
    L(s0,y+h-11,s1,y+h-11); L(s0,y+h,s1,y+h);
    L(s0,y+h-11,s0,y+h);    L(s1,y+h-11,s1,y+h);
  } else if(m.t==='plant'){
    R(x+7,y+7,w-14,h-14);
    L(x,y+h,x+w,y+h);
  }
}
function box(m,x,y,w,h,alpha,col,lw){
  if(alpha<=0.004) return;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=lw||1.6;
  R(x,y,w,h); facade(m,x,y,w,h); ctx.restore();
}
/* corner ticks — the box breakdown, shown while the site is still a plan */
function ticks(x,y,w,h,a){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=LIME;ctx.lineWidth=1.4;const t=7;
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{
    L(px,py,px+t*sx,py); L(px,py,px,py+t*sy);
  });
  ctx.restore();
}

/* HAAVN wordmark — white, LED-lit, on the crane's sign plates; ink on the
   trucks and dumpers, which have no plate behind them ------------------- */
const WM=new Image(), WK=new Image(); let WMOK=false, WKOK=false;
WM.onload=()=>{WMOK=true;}; WK.onload=()=>{WKOK=true;};
WM.src='assets/brand/haavn-wordmark-white.png';
WK.src='assets/brand/haavn-wordmark-black.png';
const WMAR=2400/281;                          // wordmark aspect ratio
function mark(x,y,h,glow,ink){                // returns drawn width
  const w=h*WMAR, img=ink?WK:WM;
  if(ink?WKOK:WMOK){
    ctx.save();
    if(!ink){ ctx.shadowColor='#ffffff'; ctx.shadowBlur=glow; }
    ctx.drawImage(img,x,y,w,h);
    if(!ink){ ctx.shadowBlur=glow*0.5; ctx.drawImage(img,x,y,w,h); }   // second pass = bloom
    ctx.restore();
  }
  return w;
}
function led(str,x,y,size,sp,glow,col){
  ctx.save();
  ctx.fillStyle=col||'#ffffff'; ctx.font='300 '+size+'px "Helvetica Neue",Helvetica,Arial';
  ctx.shadowColor=col||'#ffffff'; ctx.shadowBlur=glow; ctx.textBaseline='alphabetic';
  let cx=x; for(const ch of str){ ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+sp; }
  ctx.restore(); return cx-x-sp;
}
function ledWidth(str,size,sp){
  ctx.save(); ctx.font='300 '+size+'px "Helvetica Neue",Helvetica,Arial';
  let w=0; for(const ch of str) w+=ctx.measureText(ch).width+sp; ctx.restore(); return w-sp;
}

/* crane ------------------------------------------------------------------ */
function crane(tx,hy){
  ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=.85*WF;ctx.lineWidth=1.4;
  const a=MASTX-13,b=MASTX+13;
  L(a,GROUND,a,JIB); L(b,GROUND,b,JIB);
  for(let y=GROUND;y>JIB;y-=42){ L(a,y,b,y-21); L(b,y,a,y-21); L(a,y,b,y); }
  L(a-18,GROUND,b+18,GROUND);
  // jib
  L(200,JIB,1790,JIB); L(200,JIB+18,1790,JIB+18);
  for(let x=200;x<1790;x+=46){ L(x,JIB,Math.min(x+46,1720),JIB+18); }
  // apex + pendants
  ctx.beginPath();ctx.moveTo(a,JIB);ctx.lineTo(MASTX,JIB-58);ctx.lineTo(b,JIB);ctx.stroke();
  L(MASTX,JIB-58,220,JIB); L(MASTX,JIB-58,1770,JIB);
  // counterweight
  R(1698,JIB+18,88,36);  L(1698,JIB+31,1786,JIB+31);
  // operator cab
  R(a-34,JIB+18,34,30);
  // trolley + hook
  R(tx-16,JIB+18,32,14);
  L(tx,JIB+32,tx,hy);  L(tx-9,hy,tx+9,hy); R(tx-9,hy,18,11);
  ctx.restore();

  /* ---- HAAVN SUPPLY illuminated signage ---- */
  const t=performance.now()/1000, glow=15+7*Math.sin(t*1.9), gl2=11+5*Math.sin(t*1.9+1);
  ctx.save(); ctx.globalAlpha=WF;

  // counter-jib LED sign panel
  const sx=1516, sy=JIB+21, sw=170, sh=38;
  ctx.save();
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(sx,sy,sw,sh);
  ctx.globalAlpha*=.10; ctx.fillStyle=LIME; ctx.fillRect(sx,sy,sw,sh);
  ctx.globalAlpha=WF; ctx.strokeStyle=LIME; ctx.lineWidth=1.4;
  ctx.shadowColor=LIME; ctx.shadowBlur=gl2; R(sx,sy,sw,sh);
  ctx.restore();
  ctx.save(); ctx.strokeStyle=INK; ctx.globalAlpha=.75*WF; ctx.lineWidth=1.3;
  L(sx+26,JIB+18,sx+26,sy); L(sx+sw-26,JIB+18,sx+sw-26,sy); ctx.restore();
  const mh=15, wid=mh*WMAR;
  mark(sx+(sw-wid)/2, sy+(sh-mh)/2, mh, glow);

  // mast banner — vertical lockup
  ctx.save();
  ctx.translate(MASTX, 790); ctx.rotate(-Math.PI/2);
  const bh=21, bw=bh*WMAR, sub=ledWidth('SUPPLY',16,7.5), pw=bw+sub+58, ph=52;
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(-22,-ph/2,pw,ph);
  ctx.globalAlpha=.09*WF; ctx.fillStyle=LIME; ctx.fillRect(-22,-ph/2,pw,ph);
  ctx.globalAlpha=WF; ctx.strokeStyle=LIME; ctx.lineWidth=1.4;
  ctx.shadowColor=LIME; ctx.shadowBlur=gl2;
  ctx.strokeRect(-22,-ph/2,pw,ph); ctx.shadowBlur=0;
  mark(0,-bh/2,bh,glow);
  led('SUPPLY', bw+22, 6, 16, 7.5, glow, '#ffffff');
  ctx.restore();

  // aviation LEDs
  ctx.save(); ctx.fillStyle=LIME; ctx.shadowColor=LIME;
  [[206,JIB-4],[MASTX,JIB-62],[1784,JIB-4]].forEach(([lx,ly],i)=>{
    ctx.shadowBlur=8+9*Math.abs(Math.sin(t*2.2+i));
    ctx.globalAlpha=(.5+.5*Math.abs(Math.sin(t*2.2+i)))*WF;
    ctx.beginPath(); ctx.arc(lx,ly,3.2,0,7); ctx.fill();
  });
  ctx.restore();
  ctx.restore();
}

/* basement — excavation, then the concrete pour ------------------------- */
function polyPart(pts,frac,lw,alpha,col){
  let total=0; const seg=[];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    seg.push(d); total+=d;
  }
  let want=total*Math.max(0,Math.min(1,frac));
  if(want<=0) return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=lw;
  ctx.lineCap='square'; ctx.lineJoin='miter';
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length&&want>0;i++){
    const d=seg[i-1], t=Math.min(1,want/d);
    ctx.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,
               pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t);
    want-=d;
  }
  ctx.stroke(); ctx.restore();
}

function basement(exc,conc){
  const d=BDEPTH*exc;
  if(d>0.5){
    ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=.62*WF;ctx.lineWidth=1.5;
    L(BL,GROUND,BL,GROUND+d); L(BL,GROUND+d,BR,GROUND+d); L(BR,GROUND+d,BR,GROUND);
    ctx.globalAlpha=.26*WF;                       // batter hatching on the cut faces
    for(let y=GROUND+9;y<GROUND+d;y+=12){ L(BL,y,BL+10,y-7); L(BR,y,BR-10,y-7); }
    ctx.restore();
  }
  if(pdrawn>0||phase==='piling'){
    const top=GROUND+BDEPTH;
    const done = phase==='piling' ? pidx : pdrawn;
    const a = phase==='piling' ? .85*WF : .30*WF;   // buried once the pour starts
    for(let i=0;i<done;i++) pile(PX0+i*PSPACE, top, PDEPTH, i*1.3, a, INK);
    if(phase==='piling'&&pidx<NPILE){
      const t=ease(pp), x=PX0+pidx*PSPACE;
      pile(x, top, PDEPTH*t, pp*34, WF, INK);
      rig(x, top+PDEPTH*t-PDEPTH-6, .8*WF);
    }
  }
  if(conc>0){
    const q=Math.min(1,conc/0.45);
    polyPart([[BL,GROUND],[BL,GROUND+BDEPTH],[BR,GROUND+BDEPTH],[BR,GROUND]],
             q,3.4,WF,INK);                       // pumped perimeter

    if(conc>0.45){          // structural columns, on the bay grid of the building above
      const t=(conc-0.45)/0.33, full=Math.floor(t*NB1), part=t*NB1-full;
      const top=GROUND-7, bot=GROUND+BDEPTH;
      ctx.save();ctx.globalAlpha=WF;ctx.strokeStyle=INK;
      ctx.lineWidth=4;ctx.lineCap='butt';
      for(let i=0;i<Math.min(full,NB1);i++) L(bx(i),bot,bx(i),top);
      if(full<NB1) L(bx(full),bot,bx(full),bot-(bot-top)*Math.min(1,part));
      ctx.restore();
    }

    if(conc>0.78){                                // slab separating basement from ground
      const t=(conc-0.78)/0.22, w=(BR-BL)*t;
      ctx.save();ctx.globalAlpha=WF;ctx.strokeStyle=INK;ctx.lineWidth=2.4;
      L(BL,GROUND,BL+w,GROUND); L(BL,GROUND-7,BL+w,GROUND-7);
      ctx.globalAlpha=.5*WF;ctx.lineWidth=1;
      for(let x=BL;x<BL+w;x+=14) L(x,GROUND,x+7,GROUND-7);
      ctx.restore();
    }
  }
}

/* screw pile — helical flight, drawn spinning as it drives in */
function pile(x,top,depth,rot,alpha,col){
  if(depth<=0.4) return;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineCap='round';
  ctx.lineWidth=2.1; L(x,top,x,top+depth);                    // shaft
  ctx.lineWidth=1.2; ctx.beginPath();                          // helix
  for(let t=0;t<=depth;t+=1.4){
    const a=(t/9)*Math.PI*2+rot, px=x+Math.cos(a)*6.2, py=top+t;
    t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.lineWidth=1.6; ctx.beginPath();                          // tip
  ctx.moveTo(x-4.5,top+depth-7);ctx.lineTo(x,top+depth);ctx.lineTo(x+4.5,top+depth-7);
  ctx.stroke();
  ctx.restore();
}

/* piling rig — mast over the pile being driven, head follows it down */
function rig(x,headY,alpha){
  const base=GROUND+BDEPTH, topY=GROUND-104;
  ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=alpha;ctx.lineWidth=1.4;
  L(x-9,topY,x-9,base); L(x+9,topY,x+9,base);                  // mast
  for(let y=topY;y<base;y+=17) L(x-9,y,x+9,y+8.5);
  L(x-22,base,x+22,base);                                      // sole
  R(x-15,headY-16,30,16);                                      // rotary head
  L(x-15,headY-8,x+15,headY-8);
  ctx.restore();
}

/* excavator — one dig, swing and dump per cycle */
const DIGKEY=[[0,2.72,0.95,0.15],[.28,2.42,0.62,0.15],[.44,2.42,0.52,0.95],
              [.68,3.52,1.05,0.95],[.84,3.62,1.18,0.10],[1,2.72,0.95,0.15]];
function digger(x,cyc,alpha){
  let a1=2.7,a2=0.9,bk=0.2;
  for(let i=1;i<DIGKEY.length;i++){
    if(cyc<=DIGKEY[i][0]){
      const A=DIGKEY[i-1],B=DIGKEY[i], t=ease((cyc-A[0])/(B[0]-A[0]||1));
      a1=A[1]+(B[1]-A[1])*t; a2=A[2]+(B[2]-A[2])*t; bk=A[3]+(B[3]-A[3])*t; break;
    }
  }
  const gy=GROUND;
  ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=alpha;ctx.lineWidth=1.5;
  R(x-36,gy-16,72,16);                                   // tracks
  for(let i=1;i<6;i++) L(x-36+i*12,gy-16,x-36+i*12,gy);
  ctx.beginPath();ctx.arc(x-25,gy-8,5.5,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(x+25,gy-8,5.5,0,7);ctx.stroke();
  R(x-26,gy-47,44,31); R(x-21,gy-43,18,16);              // house + cab glazing
  L(x+18,gy-47,x+26,gy-40); L(x+26,gy-40,x+26,gy-16);    // counterweight
  const px=x-22, py=gy-42, BOOM=76, DIP=54;
  const bxE=px+Math.cos(a1)*BOOM, byE=py+Math.sin(a1)*BOOM;
  const dxE=bxE+Math.cos(a1+a2)*DIP, dyE=byE+Math.sin(a1+a2)*DIP;
  ctx.lineWidth=2.2; L(px,py,bxE,byE); ctx.lineWidth=1.8; L(bxE,byE,dxE,dyE);
  ctx.lineWidth=1.4; L(px,py-4,bxE,byE-4);               // boom back member
  const ba=a1+a2+bk*1.5;                                 // bucket
  ctx.beginPath();
  ctx.moveTo(dxE,dyE);
  ctx.lineTo(dxE+Math.cos(ba+1.0)*17,dyE+Math.sin(ba+1.0)*17);
  ctx.lineTo(dxE+Math.cos(ba+0.1)*24,dyE+Math.sin(ba+0.1)*24);
  ctx.lineTo(dxE+Math.cos(ba-0.5)*13,dyE+Math.sin(ba-0.5)*13);
  ctx.closePath();ctx.stroke();
  ctx.restore();
}

/* dump truck — takes the spoil away, cab leading, right to left */
function dumper(x,loaded,alpha){
  const y=1062;
  ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=alpha*.8;ctx.lineWidth=1.5;
  ctx.beginPath();                                        // prime mover, facing left
  ctx.moveTo(x,y);ctx.lineTo(x,y-20);ctx.lineTo(x+12,y-20);
  ctx.lineTo(x+20,y-44);ctx.lineTo(x+58,y-44);ctx.lineTo(x+58,y);ctx.stroke();
  R(x+24,y-40,24,15);                                     // cab glazing
  ctx.beginPath();                                        // tipper body behind it
  ctx.moveTo(x+62,y);ctx.lineTo(x+56,y-44);ctx.lineTo(x+196,y-44);
  ctx.lineTo(x+196,y);ctx.closePath();ctx.stroke();
  [[x+14],[x+48],[x+140],[x+176]].forEach(([wx])=>{
    ctx.beginPath();ctx.arc(wx,y+13,13,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(wx,y+13,5,0,7);ctx.stroke();
  });
  ctx.globalAlpha=alpha*.95;                              // HAAVN on the body
  const bh=13, bw=bh*WMAR;
  mark(x+62+((196-62)-bw)/2, y-30, bh, 0, true);
  if(loaded){                                             // spoil heap
    ctx.globalAlpha=alpha;ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(x+56,y-44);
    for(let i=0;i<=7;i++){
      const t=i/7, hx=x+56+t*140, hh=-44-14*Math.sin(t*Math.PI)-3*Math.sin(t*13);
      ctx.lineTo(hx,y+hh);
    }
    ctx.lineTo(x+196,y-44);ctx.stroke();
  }
  ctx.restore();
}

/* truck — two modules to a truck, stacked, cab leading right to left ----- */
function truck(x,load){
  x-=92.5;                       // so the modules sit centred on x
  const y=1062, ml=185;
  ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=.8*WF;ctx.lineWidth=1.5;
  // trailer deck
  L(x-40,y,x+ml+30,y); L(x-40,y+9,x+ml+30,y+9); L(x-40,y,x-40,y+9); L(x+ml+30,y,x+ml+30,y+9);
  // prime mover
  ctx.beginPath();
  ctx.moveTo(x-40,y);ctx.lineTo(x-40,y-46);ctx.lineTo(x-92,y-46);
  ctx.lineTo(x-100,y-22);ctx.lineTo(x-118,y-22);ctx.lineTo(x-118,y);ctx.stroke();
  R(x-90,y-40,26,17);
  // wheels
  [[x-108,0],[x-58,0],[x+96,0],[x+134,0]].forEach(([wx])=>{
    ctx.beginPath();ctx.arc(wx,y+22,13,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(wx,y+22,5,0,7);ctx.stroke();
  });
  for(let n=0;n<load;n++){
    const yy=y-TMH*(n+1);
    ctx.globalAlpha=WF;ctx.strokeStyle=LIME;
    R(x,yy,ml,TMH);
    L(x,yy+9,x+ml,yy+9);
    for(let k=1;k<4;k++) L(x+ml*k/4,yy,x+ml*k/4,yy+TMH);
    const bh=12, bw=bh*WMAR;                 // HAAVN on the side of every module
    mark(x+(ml-bw)/2, yy+20, bh, 0, true);
  }
  ctx.restore();
}

/* module in flight — spins 90° from 12m long face to 3.5m elevation face -- */
function flight(m,cx,cy,s,rot){
  const sh=m.t==='shaft';
  const lw=sh?m.w:185, lh=sh?m.h:TMH;
  const w=lw+(m.w-lw)*s, h=lh+(m.h-lh)*s;
  const x=cx-w/2, y=cy-h/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.translate(-cx,-cy);
  ctx.strokeStyle=LIME;ctx.lineWidth=1.8;ctx.globalAlpha=WF;
  R(x,y,w,h);
  if(s<0.62){ ctx.globalAlpha=(1-s/0.62)*WF;
    L(x,y+9,x+w,y+9); for(let k=1;k<4;k++) L(x+w*k/4,y,x+w*k/4,y+h);
  }
  if(s>0.45){ ctx.globalAlpha=(s-0.45)/0.55*WF; facade(m,x,y,w,h); }
  ctx.restore();
  return {x,y,w,h};
}

/* ============ THE RENDER ================================================ */
/* The completed project, fading up under the drawing at the end. Loaded on
   the first play, not on page load — most visitors never reach the end.
   It is pre-composited twice, feathered at the edges: the photograph itself,
   and the source's bottom-dark gradient the lockup sits on (confined to the
   photograph — across the open field it would read as a dark band). */
const RW=2200, RH=1543;
const RBASE=Math.min(W/RW,H/RH), RDW=RW*RBASE, RDH=RH*RBASE, RX=(W-RDW)/2, RY=(H-RDH)/2;
const RENDER=new Image(); let RDY=false, rFeather=null, rShade=null;
function feather(c){                      // soft edges: 7% sides, 5% top, 3% bottom
  const g=c.getContext('2d'); g.globalCompositeOperation='destination-in';
  let lg=g.createLinearGradient(0,0,c.width,0);
  lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(.07,'#000'); lg.addColorStop(.93,'#000'); lg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lg; g.fillRect(0,0,c.width,c.height);
  lg=g.createLinearGradient(0,0,0,c.height);
  lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(.05,'#000'); lg.addColorStop(.97,'#000'); lg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lg; g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over'; return c;
}
RENDER.onload=()=>{
  const a=document.createElement('canvas'); a.width=RW; a.height=RH;
  a.getContext('2d').drawImage(RENDER,0,0); rFeather=feather(a);
  /* the source's gradient runs H-470 → H in frame units; same stops */
  const s=document.createElement('canvas'); s.width=RW; s.height=RH; const g=s.getContext('2d');
  const y0=(H-470-RY)/RBASE, y1=(H-RY)/RBASE, gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,'rgba(10,10,10,0)'); gr.addColorStop(.45,'rgba(10,10,10,.62)'); gr.addColorStop(1,'rgba(10,10,10,.96)');
  g.fillStyle=gr; g.fillRect(0,y0,RW,y1-y0); rShade=feather(s);
  RDY=true;
};
function loadRender(){ if(!RENDER.src) RENDER.src='assets/preston/preston-render.jpg'; }

/* ============ STATE ===================================================== */
let idx=0, p=0, last=0, WF=1;
const SPEED=4;               // Jamie's 4× for the build — the sequence in ~25s
const RATE=1.4;              // the source's build-sequence speed-up
const INTRO=1.6;             // phase-seconds on the plan (ghost + box breakdown) before the dig
/* the ending runs at the source's own pace, not 4× — it is meant to be slow */
const DONE_HOLD=1.5;         // s — the finished wireframe on its lime ground line
const REVEAL=26;             // s — the source's wireframe → render dissolve
const END_HOLD=5.0;          // s — render + lockup held, then it replays (Jamie, 11 Sep)
const OUT=1.4, IN=0.9;       // s — render out before the replay, plan in after it
let phase='intro';           // intro → excavate → piling → concrete → insitu → shaft → modular → done → reveal → end → out
let ep=0, cp=0, pidx=0, pp=0, pdrawn=0, sidx=0, insituT=0, holdT=0, rev=0, OUTA=1, sinceReset=0;
const EXCAV=9.6, CONC=11.4;  // basement dig / pour, in phase-seconds
const pdur=i=>i<3?0.96:0.408; // per pile
const INSITU=7.0;            // seconds for the traditional ground floor
function dur(i){ return i<3?3.0 : i<8?2.0 : i<16?1.15 : i<32?0.72 : i<64?0.5 : 0.28; }

function reset(){ idx=0;sidx=0;p=0;phase='intro';insituT=0;holdT=0;rev=0;OUTA=1;sinceReset=0;ep=0;cp=0;pidx=0;pp=0;pdrawn=0;MODS.forEach(m=>m.f=0); }

/* ============ FRAME ===================================================== */
/* It only runs while the page says the slide is on screen: the parent
   posts {preston:'play'|'pause'}. 'play' after the slide has been fully off
   screen starts the sequence again, so everyone arrives at the dig. Opened on
   its own (no parent), it simply plays. */
let running = window.parent === window, raf = 0;
if (running) loadRender();
addEventListener('message', e => {
  const d = e.data || {};
  if (d.preston === 'play') { loadRender(); if (d.restart) reset(); if (!running){ running = true; last = 0; raf = requestAnimationFrame(frame); } }
  if (d.preston === 'pause') { running = false; cancelAnimationFrame(raf); }
});

function frame(ts){
  if(!running) return;
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000)||0; last=ts;
  const s=dt*SPEED;
  if(phase==='intro'){ insituT+=s; if(insituT>INTRO){phase='excavate';ep=0;insituT=0;} }
  else if(phase==='excavate'){ ep+=s*RATE/EXCAV;
    if(ep>=1){ep=1;phase='piling';pidx=0;pp=0;} }
  else if(phase==='piling'){ pp+=s*RATE/pdur(pidx);
    if(pp>=1){ pidx++; pp=0; pdrawn=pidx;
               if(pidx>=NPILE){phase='concrete';cp=0;} } }
  else if(phase==='concrete'){ cp+=s*RATE/CONC; if(cp>=1){cp=1;phase='insitu';insituT=0;} }
  else if(phase==='insitu'){ insituT+=s*RATE; if(insituT>=INSITU){phase='shaft';p=0;} }
  else if(phase==='shaft'){
    p+=s*RATE/(sidx<2?1.9:1.15);
    if(p>=1){ SHAFT[sidx].f=1; sidx++; p=0; if(sidx>=SHAFT.length){phase='modular';} }
  }
  else if(phase==='modular'){
    p+=s*RATE/dur(idx);
    if(p>=1){ if(idx<NLIFT){LIFT[idx].f=1;} idx++; p=0; if(idx>=NLIFT){phase='done';holdT=0;} }
  }
  else if(phase==='done'){ holdT+=dt;
    if(holdT>=DONE_HOLD && RDY){phase='reveal';holdT=0;}
    else if(holdT>=DONE_HOLD+8){phase='out';holdT=0;} }     // render never arrived: fade out and replay
  else if(phase==='reveal'){ rev=Math.min(1,rev+dt/REVEAL); if(rev>=1){phase='end';holdT=0;} }
  else if(phase==='end'){ holdT+=dt; if(holdT>=END_HOLD){phase='out';holdT=0;} }
  else if(phase==='out'){ holdT+=dt; OUTA=Math.max(0,1-holdT/OUT); if(holdT>=OUT) reset(); }
  sinceReset+=dt;
  MODS.forEach(m=>{ if(m.f>0) m.f=Math.max(0,m.f-dt*2.2); });
  draw();
}

function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.clearRect(0,0,W,H);                     // glass — the page's ground shows through
  ctx.lineJoin='miter'; ctx.lineCap='butt';

  /* the source's ending: the completed project fades up underneath the
     drawing, which dissolves off it (WF) — the plan also eases in after a
     replay (IN), and everything eases out before one (OUTA) */
  const r=soft(rev);
  WF=(1-soft(Math.min(1,rev/0.88))) * OUTA * Math.min(1,sinceReset/IN);
  const kreg=ease(Math.min(1,rev/0.78));
  SHAFT.forEach(m=>{ m.na=coreAlpha(m.l); });    // modules clad over the core as they land
  if(r>0&&rFeather){
    ctx.save(); ctx.globalAlpha=r*OUTA;
    ctx.drawImage(rFeather,RX,RY,RDW,RDH);
    ctx.restore();
  }

  /* the line-work settles onto the render's building as it dissolves —
     the source's registration, number for number */
  ctx.save();
  if(rev>0){
    ctx.translate(1000+(957-1000)*kreg, 985+(1034-985)*kreg);
    ctx.scale(1+0.45*kreg, 1+0.264*kreg);
    ctx.translate(-1000,-985);
  }

  /* ghost of the completed elevation */
  MODS.forEach(m=>{ box(m,m.x,m.y,m.w,m.h,.16*WF*(m.t==='shaft'?m.na:1),INK,1); });

  /* the box breakdown, while the site is still a plan */
  if(phase==='intro') MODS.forEach(m=>ticks(m.x,m.y,m.w,m.h,.4*WF));

  /* basement — dug, then poured, before anything comes out of the ground */
  basement(ep, cp);

  /* ground floor — traditional in-situ, rises as concrete not as boxes */
  const gp = (phase==='intro'||phase==='excavate'||phase==='piling'
              ||phase==='concrete') ? 0
           : phase==='insitu' ? insituT/INSITU : 1;
  if(gp>0){
    const g = Math.min(1, gp/0.78);
    if(g>=1){
      GND.forEach(m=>box(m,m.x,m.y,m.w,m.h,WF,INK,1.6));
    } else {
      const soft = 62, N = 26, bh = GH/N;
      /* start wholly below the ground line so it begins at zero, and finish
         exactly on the slab line, so the fade spans the full storey */
      const edge = GROUND + soft - (GH+soft)*g;
      for(let k=N-1;k>=0;k--){
        const y0 = levTop(1)+bh*k;
        const a = Math.max(0, Math.min(1, ((y0+bh/2)-(edge-soft))/soft));
        if(a<=0.012) continue;
        ctx.save(); ctx.beginPath(); ctx.rect(0,y0,W,bh+0.6); ctx.clip();
        GND.forEach(m=>box(m,m.x,m.y,m.w,m.h,WF*a,INK,1.6));
        ctx.restore();
      }
    }
    if(gp>0.78){                                  // transfer slab / podium deck
      const a=Math.min(1,(gp-0.78)/0.22);
      ctx.save();ctx.globalAlpha=a*WF;ctx.strokeStyle=LIME;ctx.lineWidth=2.2;
      const w=(bx(NB)-BX0+22)*Math.min(1,(gp-0.78)/0.22);
      L(BX0-11,levTop(1),BX0-11+w,levTop(1));
      L(BX0-11,levTop(1)-7,BX0-11+w,levTop(1)-7);
      ctx.globalAlpha=a*.7*WF;ctx.lineWidth=1;
      for(let x=BX0-11;x<BX0-11+w;x+=13) L(x,levTop(1),x+7,levTop(1)-7);
      ctx.restore();
    }
  }
  /* excavation plant */
  if(phase==='excavate'){
    const cyc=(ep*EXCAV*1.6)%1;
    digger(DIGX, cyc, .9*WF);
    const load=(ep*5)%1, shift=smooth(load,.62,.96);
    const slots=[DIGX+120,DIGX+430,DIGX+740];
    for(let k=2;k>=0;k--){
      const from=slots[k], to=k===0?-720:slots[k-1];
      const x=from+(to-from)*shift;
      if(x>-560&&x<2400) dumper(x, k===0?(load<.62):false, WF);
    }
  }

  /* site datum */
  ctx.save();ctx.globalAlpha=.35*WF;ctx.strokeStyle=INK;ctx.lineWidth=1;
  if(ep>0.01){ L(60,GROUND,BL,GROUND); L(BR,GROUND,1940,GROUND); }
  else L(60,GROUND,1940,GROUND);
  ctx.globalAlpha=.16*WF; L(60,1088,1940,1088); ctx.restore();

  /* lift shaft already erected */
  for(let i=0;i<sidx&&i<SHAFT.length;i++){ const m=SHAFT[i];
    box(m,m.x,m.y,m.w,m.h,WF*m.na,m.f>0?LIME:INK,m.f>0?2.2:1.7);
  }

  /* modules already set */
  for(let i=0;i<idx&&i<NLIFT;i++){ const m=LIFT[i];
    box(m,m.x,m.y,m.w,m.h,WF,m.f>0?LIME:INK,m.f>0?2.2:1.6);
  }

  /* crane + convoy + lift cycle */
  if(phase==='shaft'||phase==='modular'){
    const sh = phase==='shaft';
    const arr = sh?SHAFT:LIFT, ii = sh?sidx:idx;
    const m = ii<arr.length?arr[ii]:null;
    /* two to a truck: the top module comes off first, then the one under it */
    const onTruck = sh ? 0 : PER_TRUCK - (idx % PER_TRUCK);        // before this pick
    const pickCy  = sh ? 0 : 1062 - TMH*(onTruck - 0.5);
    let tx=PICK, hy=JIB+55;
    if(m){
      const tgt=m.x+m.w/2, prev=ii>0?arr[ii-1].x+arr[ii-1].w/2:PICK;
      let cx=PICK, cy=0, s=0, rot=0, carry=false;
      const HI=JIB+55, LO=(sh?(GROUND-m.h/2):pickCy)-45-m.h/2;
      if(p<.28){ const q=p/.28; tx=prev+(PICK-prev)*ease(q); hy=HI+(LO-HI)*ease(q); }
      else if(p<.50){ const q=(p-.28)/.22; tx=PICK; hy=LO+(HI-LO)*ease(q);
        carry=true; cx=PICK; cy=hy+45+m.h/2; s=Math.max(0,(q-.2)/.8); }
      else if(p<.72){ const q=(p-.50)/.22; tx=PICK+(tgt-PICK)*ease(q); hy=HI;
        carry=true; cx=tx; cy=hy+45+m.h/2; s=1; rot=Math.sin(q*7)*0.022*(1-q); }
      else { const q=Math.min(1,(p-.72)/.22); tx=tgt; hy=HI+(m.y-45-HI)*ease(q);
        carry=true; cx=tgt; cy=hy+45+m.h/2; s=1; }
      crane(tx,hy);
      if(carry){
        ctx.save();ctx.strokeStyle=LIME;ctx.globalAlpha=.8*WF;ctx.lineWidth=1.2;
        const b=flight(m,cx,cy,s,rot);
        L(cx,hy+11,b.x+2,b.y); L(cx,hy+11,b.x+b.w-2,b.y);
        ctx.restore();
      }
    } else { crane(PICK,JIB+55); }

    if(sh){                       /* shaft segments staged on the ground */
      for(let k=1;k<=2;k++){ const sm=SHAFT[sidx+k];
        if(sm) box(sm, PICK+150*k-sm.w/2, GROUND-sm.h, sm.w, sm.h, .5*WF,INK,1.4);
      }
      if(m&&p<0.28) box(m, PICK-m.w/2, GROUND-m.h, m.w, m.h, WF,INK,1.7);
    } else {
      /* truck convoy — cab leading, right to left. The front truck is emptied
         over two lifts, so the convoy only draws forward on the second. */
      const second = (idx % PER_TRUCK) === PER_TRUCK-1;
      const shift = (m && second) ? smooth(p,.56,.94) : 0;
      const load0 = m ? onTruck - (p>=.30 ? 1 : 0) : 0;
      const slots=[PICK,PICK+430,PICK+860,PICK+1290,PICK+1720,PICK+2150];
      for(let k=5;k>=0;k--){
        const from=slots[k], to=k===0?-620:slots[k-1];
        const x=from+(to-from)*shift;
        if(x>-440&&x<2560) truck(x, k===0 ? load0 : PER_TRUCK);
      }
    }
  }

  if(phase==='done'||phase==='reveal'||phase==='end'||phase==='out'){
    ctx.save();ctx.strokeStyle=LIME;ctx.globalAlpha=.9*WF;ctx.lineWidth=2.4;
    L(BX0-46,GROUND,bx(NB)+46,GROUND);ctx.restore();
  }

  ctx.restore();                                   // end registered line-work

  /* end lockup — the source's, on its dark gradient over the render */
  const ec=Math.max(0,Math.min(1,(rev-0.5)/0.42))*OUTA;
  if(ec>0){
    ctx.save();
    if(rShade){ ctx.globalAlpha=ec; ctx.drawImage(rShade,RX,RY,RDW,RDH); }
    const by=H-150;
    ctx.globalAlpha=ec*.85;
    const pw=ledWidth('PRESTON',16,11);
    led('PRESTON', (W-pw)/2, by-62, 16, 11, 0, '#ffffff');

    const mh=40, mw=mh*WMAR, gap=26;
    const sw2=ledWidth('SUPPLY',22,10);
    const tot=mw+gap+sw2, lx=(W-tot)/2;
    ctx.globalAlpha=ec;
    mark(lx, by-mh+4, mh, 12);
    led('SUPPLY', lx+mw+gap, by, 22, 10, 9, LIME);

    ctx.globalAlpha=ec*.55;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    L((W-tot)/2, by+30, (W+tot)/2, by+30);
    ctx.globalAlpha=ec*.7;
    const st='15 LEVELS · '+APTS+' APARTMENTS · '+MODULES+' MODULES · DELIVERED MODULAR';
    const stw=ledWidth(st,12,4.2);
    led(st, (W-stw)/2, by+58, 12.5, 4.4, 0, '#ffffff');
    ctx.restore();
  }

  /* HUD — the source's read-outs, Preston's own numbers */
  const set=Math.min(idx,NLIFT), shown=Math.round(set*MODULES/NLIFT);
  const cur = phase==='excavate' ? 'BASEMENT EXCAVATION'
            : phase==='piling' ? 'SCREW PILING '+String(Math.min(pidx+1,NPILE)).padStart(2,'0')+' / '+NPILE
            : phase==='concrete' ? (cp<0.45?'BASEMENT CONCRETE'
                                 :cp<0.78?'BASEMENT COLUMNS':'GROUND SLAB POUR')
            : phase==='intro'||phase==='insitu' ? 'GROUND SLAB'
            : phase==='shaft' ? 'LIFT SHAFT '+String(Math.min(sidx+1,15)).padStart(2,'0')
            : (idx<NLIFT?lname(LIFT[idx].l):'COMPLETE');
  bl.innerHTML=
    'MODULES SET <b>'+String(shown).padStart(3,'0')+' / '+MODULES+'</b><br>'+
    'TRUCK DELIVERIES <b>'+String(Math.ceil(shown/PER_TRUCK)).padStart(3,'0')+' / '+(MODULES/PER_TRUCK)+'</b><br>'+
    'PLACING <span class="lm">'+cur+'</span>';
  br.innerHTML=[
    '<b>15 LEVELS · '+APTS+' APARTMENTS</b>',
    'BASEMENT + GROUND <b>IN-SITU</b>',
    'SCREW PILES <b>'+NPILE+'</b>',
    'BASEMENT COLUMNS <b>'+NB1+'</b>',
    'L01–L14 <i>MODULAR</i>',
    'LIFT SHAFT <b>15 PRECAST</b>',
    'MODULE <b>12.0 × 3.5 m</b>',
    MODULES+' MODULES · <b>'+PER_TRUCK+' PER TRUCK</b>',
    'INSTALL <b>WEEK '+Math.max(1,Math.ceil(shown/PER_WEEK))+'</b>'
  ].map(t=>'<span>'+t+'</span>').join('');
  /* the read-outs clear early in the dissolve, as in the source */
  const hud=(1-Math.max(0,Math.min(1,(rev-0.05)/0.35)))*OUTA*Math.min(1,sinceReset/IN);
  [tl,tr,bl,br].forEach(e=>e.style.opacity=hud);
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const soft=t=>0.22*ease(t)+0.78*t;   // the source's: gentle ends, even middle
const smooth=(v,a,b)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);};

resize();
if(running) raf=requestAnimationFrame(frame);
</script>
</body>
</html>
