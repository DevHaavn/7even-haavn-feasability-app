<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAAVN BLACK — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--o4:.44;--o3:.52;--o2:.62;--o1:.92;--k4:.34;--k3:.42;--k2:.52;--k1:.78}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;   /* jet black */
  color:#6a6e74;font-family:'JetBrains Mono',monospace;overflow:hidden;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.grain{display:none}   /* no texture — pure black */

/* fade the whole intro out on EXPLORE */
.stagewrap{position:fixed;inset:0;display:flex;flex-direction:column;transition:opacity 1s ease, transform 1s ease}
body.leaving .stagewrap{opacity:0;transform:scale(1.035)}

.room{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
.room.on{opacity:1}
.room .pool{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(122vw,1780px);height:min(72vh,660px);
  background:
    radial-gradient(48% 60% at 33% 50%, rgba(196,218,250,.135), rgba(0,0,0,0) 68%),
    radial-gradient(46% 58% at 70% 50%, rgba(150,158,168,.054), rgba(0,0,0,0) 68%);
  filter:blur(10px)}
.room .floor{position:absolute;inset:0;
  background:radial-gradient(80% 55% at 50% 50%, rgba(130,150,180,.070), rgba(0,0,0,0) 70%)}
.vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 46%, rgba(0,0,0,.72) 100%)}

/* fine silver LED picture-frame, fades in with the ignition */
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
.frame{position:fixed;left:clamp(15px,2vw,34px);right:clamp(15px,2vw,34px);top:17vh;bottom:17vh;pointer-events:none;
  border:1.2px solid rgba(47,224,122,.20);border-radius:3px;opacity:0;
  box-shadow:0 0 10px rgba(47,224,122,.16),inset 0 0 12px rgba(47,224,122,.10)}
/* bright green light travelling around the rectangle (anti-clockwise) — matches the hero LED */
.frame::before{content:"";position:absolute;inset:-1.2px;border-radius:inherit;padding:1.6px;
  background:conic-gradient(from var(--fa), #7dffb5 0deg, #2fe07a 12deg, rgba(47,224,122,0) 54deg, rgba(47,224,122,0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  filter:drop-shadow(0 0 5px rgba(47,224,122,.85)) drop-shadow(0 0 13px rgba(47,224,122,.4));
  animation:frameSpin 5.5s linear infinite}
@keyframes frameSpin{to{--fa:-360deg}}
.run .frame{animation:frameOn 3.9s cubic-bezier(.3,.6,.4,1) .3s forwards}
@keyframes frameOn{0%{opacity:0}100%{opacity:1}}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(26px,5vh,58px);padding:0 clamp(16px,5vw,80px);
  transform:translateY(clamp(52px,8vh,92px))}

/* WELCOME eyebrow */
.welcome{position:absolute;top:clamp(128px,24vh,290px);left:0;right:0;opacity:0;text-align:center;
  font-size:clamp(13px,1.9vw,19px);letter-spacing:.7em;text-transform:uppercase;text-indent:.7em;
  background:linear-gradient(180deg,#ffffff 0%,#e3e9f0 38%,#98a0a9 53%,#c9d1da 66%,#f4f8fc 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.5)) drop-shadow(0 0 14px rgba(190,215,255,.28))}
.run .welcome{animation:rise 1.6s cubic-bezier(.2,.7,.3,1) .5s forwards}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}

.sign{width:min(80vw,1180px);position:relative}
svg{width:100%;height:auto;display:block;overflow:visible;shape-rendering:geometricPrecision}

/* ---- per-glyph ignition, left to right ---- */
.gl{opacity:0}
.run .gl{animation:ignite .62s cubic-bezier(.25,.75,.3,1) var(--d) forwards}
@keyframes ignite{0%{opacity:0}16%{opacity:.62}24%{opacity:.10}44%{opacity:.90}54%{opacity:.42}72%{opacity:1}84%{opacity:.86}100%{opacity:1}}
.run .stack{animation:breathe 7.4s ease-in-out 2.8s infinite}
@keyframes breathe{0%,100%{opacity:.95}50%{opacity:1}}
/* broken-LED flicker on the V (HAAVN) + A (BLACK), after they ignite */
.run .gl.flick{animation:ignite .62s cubic-bezier(.25,.75,.3,1) var(--d) forwards,
  flicker var(--fd,2.8s) linear var(--fs,3s) infinite}
@keyframes flicker{
  0%,100%{opacity:1}
  3%{opacity:.18}   4%{opacity:1}
  7%{opacity:.42}   8%{opacity:1}
  33%{opacity:1}    34%{opacity:.12}  35%{opacity:.9}  36%{opacity:.3}  37.5%{opacity:1}
  55%{opacity:1}    56%{opacity:.5}   57%{opacity:1}
  74%{opacity:1}    75%{opacity:.1}   76.5%{opacity:1}  77%{opacity:.55}  78%{opacity:1}
  92%{opacity:1}    93%{opacity:.22}  95%{opacity:1}
}

.L4{opacity:var(--o4)} .L3{opacity:var(--o3)} .L2{opacity:var(--o2)} .L1{opacity:var(--o1)}
.k .L4{opacity:var(--k4)} .k .L3{opacity:var(--k3)} .k .L2{opacity:var(--k2)} .k .L1{opacity:var(--k1)}
.edge{opacity:1}
.k .edge{opacity:.85}

/* EXPLORE CTA */
.cta{opacity:0;margin-top:clamp(34px,7vh,88px)}
.run .cta{animation:rise 1.4s cubic-bezier(.2,.7,.3,1) 2.7s forwards}
.explore{position:relative;overflow:hidden;font:inherit;font-size:clamp(10px,1.2vw,13px);letter-spacing:.44em;
  color:#e9edf2;cursor:pointer;padding:16px 48px;border-radius:7px;text-indent:.44em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(74,79,86,.42) 0%,rgba(26,29,34,.5) 52%,rgba(16,18,22,.55) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -10px 20px rgba(0,0,0,.28),0 12px 30px -12px rgba(0,0,0,.6);
  text-shadow:0 1px 3px rgba(0,0,0,.45);
  transition:.4s cubic-bezier(.2,.7,.3,1);animation:ctaGlow 4s ease-in-out 3.6s infinite}
/* soft glass sheen — subtle */
.explore::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:44%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg);animation:sheen 6s ease-in-out 4s infinite}
@keyframes sheen{0%{left:-60%}26%{left:130%}100%{left:130%}}
.explore:hover{border-color:rgba(207,225,255,.5);
  background:linear-gradient(180deg,rgba(90,96,104,.5) 0%,rgba(30,34,40,.56) 52%,rgba(18,20,24,.6) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -10px 20px rgba(0,0,0,.25),0 16px 40px -10px rgba(150,180,220,.4);animation:none}
@keyframes ctaGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -10px 20px rgba(0,0,0,.28),0 0 0 0 rgba(150,180,220,0)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -10px 20px rgba(0,0,0,.28),0 10px 30px -14px rgba(150,180,220,.4)}}

.skip{position:fixed;top:20px;right:22px;font:inherit;font-size:8.5px;letter-spacing:.24em;
  color:#4d5157;background:none;border:none;cursor:pointer;text-transform:uppercase;opacity:0;transition:.3s}
body.run .skip{opacity:1}.skip:hover{color:#9aa0a6}
/* ---- framed ENTER button (matches the hero Black Display / Feasibility CTA) ---- */
.enterbtn{position:relative;display:grid;grid-template-columns:auto 1px auto auto;align-items:center;
  border:1px solid rgba(214,226,238,.4);border-radius:3px;overflow:hidden;cursor:pointer;padding:0;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.018));
  -webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.45),
    0 22px 48px -22px rgba(0,0,0,.95), 0 0 34px -16px rgba(190,215,255,.22);
  transition:border-color .4s var(--hb-ease,cubic-bezier(.2,.7,.3,1)), box-shadow .4s, transform .4s, background .4s}
.enterbtn:hover,.enterbtn:focus-visible{border-color:rgba(228,240,252,.62);transform:translateY(-2px);
  background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(0,0,0,.45),
    0 30px 62px -24px rgba(0,0,0,.95), 0 0 48px -14px rgba(190,215,255,.42);outline:none}
.enterbtn .eb-ds{display:flex;align-items:center;justify-content:center;padding:0 17px 0 21px;
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12px;letter-spacing:.06em;color:#e7e9ec}
.enterbtn .eb-div{align-self:stretch;background:rgba(255,255,255,.12);margin:13px 0}
.enterbtn .eb-lbl{padding:16px 22px;display:flex;flex-direction:column;gap:6px;text-align:left}
.enterbtn .eb-lbl b{font-weight:500;font-size:13.5px;letter-spacing:.26em;color:#fff;white-space:nowrap}
.enterbtn .eb-lbl i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.26em;color:#a9a6a9;white-space:nowrap}
.enterbtn .eb-go{padding:0 24px 0 6px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#2fe07a;opacity:.85;transition:.45s}
.enterbtn:hover .eb-go,.enterbtn:focus-visible .eb-go{transform:translateX(5px);opacity:1}
.enterbtn::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);
  transition:left .85s cubic-bezier(.2,.7,.3,1);pointer-events:none}
.enterbtn:hover::after{left:115%}
/* ---- shared background video (same as the main HAAVN BLACK page) ---- */
.bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.bgdim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(125% 95% at 50% 46%, rgba(0,0,0,.32) 0%, rgba(0,0,0,.66) 68%, rgba(0,0,0,.85) 100%)}
.room{z-index:2} .vig{z-index:2}
main{position:relative;z-index:5}
.frame{z-index:6} .skip{z-index:7}
</style></head>
<body>
<div class="stagewrap">
<video class="bgv" id="bgvid" autoplay muted loop playsinline webkit-playsinline preload="metadata" src="/haavn-black-bg.mp4"></video>

<div class="grain"></div>
<div class="room" id="room"><div class="floor"></div><div class="pool"></div></div>
<div class="vig"></div>
<div class="frame"></div>

<button class="skip" id="skip">Skip →</button>

<script>
var body=document.body, room=document.getElementById('room');
var SWEEP=1600;
function play(){
  body.classList.add('run');
  setTimeout(function(){room.classList.add('on')}, SWEEP*0.45);
}
function enter(){
  if(body.classList.contains('leaving'))return;
  body.classList.add('leaving');
  var embedded = window.self !== window.top;
  setTimeout(function(){
    // embedded in the app: tell the React wrapper to reveal the main hero.
    try{parent.postMessage({haavnBlack:'welcome-explore'},'*');}catch(e){}
    // standalone (preview): fade straight into the main HAAVN BLACK page.
    if(!embedded){ window.location.href='/haavn-black.html'; }
  }, 1000);
}
document.getElementById('explore').onclick=enter;
document.getElementById('skip').onclick=enter;
/* Fit the LED frame into a rectangle ~2cm above WELCOME TO and ~2cm below the Enter button. */
function fitFrame(){
  var f=document.querySelector('.frame'), w=document.querySelector('.welcome'), b=document.getElementById('explore');
  if(!f||!w||!b)return;
  var pad=76; /* ~2cm */
  var wt=w.getBoundingClientRect().top;
  var bb=b.getBoundingClientRect().bottom;
  f.style.top=Math.max(10,wt-pad)+'px';
  f.style.bottom=Math.max(10,window.innerHeight-bb-pad)+'px';
}
addEventListener('resize',fitFrame);
addEventListener('load',function(){fitFrame();setTimeout(fitFrame,320);setTimeout(fitFrame,4300);});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(play)}else{addEventListener('load',play)}
</script>
</body></html>
