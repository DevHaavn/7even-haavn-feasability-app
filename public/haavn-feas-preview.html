<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAAVN BLACK — ATRIUM · Design & Look-and-feel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --char:#0b0c0d;--char2:#141518;--char3:#1c1e22;--charline:rgba(255,255,255,.10);--charline2:rgba(255,255,255,.18);
  --white:#fff;--steel:#8c9095;--steel2:#6a6e73;--dim:#4a4d51;
  --mint:#E4EEE7;--mint2:#D6E3DA;--card:#FBFCFB;--card2:#F1F6F2;
  --ink:#12201A;--ink2:#39473F;--ink3:#697770;--line:#CAD8CF;--line2:#B4C4BA;
  --green:#2E6B47;--greenbg:#DCEBE1;--gold:#8a6d1f;--goldbg:#F0E8D2;--red:#9A4433;--redbg:#F0DED8;--blue:#2A4C6B;
  --p1:#8FA69A;--p2:#2E6B47;--p3:#5b6169;
  --f-d:'Chakra Petch','Rajdhani',sans-serif;--f-b:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-b);background:var(--mint);color:var(--ink);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:13px;color:var(--ink)}
.mono{font-family:var(--f-d);letter-spacing:.02em}
/* top bar */
.top{height:46px;background:var(--char);color:var(--steel);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--charline);font-family:var(--f-d);font-size:11px;letter-spacing:.06em}
.top .home{color:#cfd2d0}.top .home:hover{color:#fff}
.top .crumb b{color:#eceeec}
.top .sp{flex:1}
.savepill{display:flex;align-items:center;gap:6px;font-size:10px;border:1px solid var(--charline);padding:4px 10px;border-radius:20px}
.savepill .dot{width:6px;height:6px;border-radius:50%;background:#7ea88a}
.savepill.saving .dot{background:#c9a227;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* layout */
.app{display:flex;min-height:calc(100vh - 46px)}
.side{width:236px;background:var(--char);color:#cfd2d0;flex:none;position:sticky;top:46px;height:calc(100vh - 46px);overflow-y:auto;border-right:1px solid #000;display:flex;flex-direction:column}
.side .brand{padding:18px 18px 15px;display:flex;align-items:baseline;gap:7px;border-bottom:1px solid var(--charline)}
.side .brand svg{height:16px}.side .brand .blk{font-family:var(--f-d);font-weight:400;font-size:17px;line-height:1;letter-spacing:.04em;color:var(--steel);background:none;padding:0}
.side .lbl{font-family:var(--f-d);font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;padding:16px 20px 8px}
.side .nav{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:#b7bab8;cursor:pointer;border-left:2px solid transparent}
.side .nav:hover{background:var(--char2);color:#fff}
.side .nav.on{background:var(--char2);color:#fff;border-left-color:#fff;font-weight:500}
.side .rng{margin:0 14px 6px;padding:11px 13px;border:1px solid var(--charline);border-radius:9px;cursor:pointer}
.side .rng.on{background:#fff;color:#000;border-color:#fff}
.side .rng .rn{font-family:var(--f-d);font-weight:600;font-size:13px;letter-spacing:.02em}
.side .rng .rs{font-size:10px;color:var(--steel2);margin-top:1px}.side .rng.on .rs{color:#555}
.side .foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--charline);font-family:var(--f-d);font-size:9px;letter-spacing:.06em;color:var(--dim);line-height:1.8}
/* content */
.main{flex:1;min-width:0}
.wrap{max-width:1220px;padding:26px 32px 80px}
.eyebrow{font-family:var(--f-d);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1.title{font-family:var(--f-d);font-weight:600;font-size:28px;letter-spacing:.01em;margin-top:7px;color:var(--ink)}
h1.title i{font-style:italic;color:var(--green)}
.lede{color:var(--ink2);font-size:13px;margin-top:7px;max-width:720px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.flexwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;font-family:var(--f-d);font-size:11.5px;font-weight:500;letter-spacing:.04em;background:var(--card);border:1px solid var(--line2);color:var(--ink);transition:.13s;white-space:nowrap;text-transform:uppercase}
.btn:hover{border-color:var(--ink3)}
.btn.dark{background:var(--char);color:#fff;border-color:var(--char)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:6px 10px;font-size:10.5px}
/* range cards */
.rcard{display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:0 1px 2px rgba(18,32,26,.05)}
.rcard .img{position:relative;min-height:300px;background:repeating-linear-gradient(135deg,#EDE9DF 0 14px,#E7E2D6 14px 28px);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-family:var(--f-d);font-size:12px}
.rcard .info{padding:26px 30px}
.rcard .rt{font-family:var(--f-d);font-size:10px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.rcard .rn{font-family:var(--f-d);font-weight:600;font-size:30px;letter-spacing:.02em;color:var(--ink);margin-top:8px}
.rcard .rd{color:var(--ink2);font-size:13px;margin-top:4px}
.rcard .specs{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:20px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rcard .sp .l{font-family:var(--f-d);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.rcard .sp .v{font-family:var(--f-d);font-weight:600;font-size:16px;color:var(--ink);margin-top:2px}
.rcard .costs{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:18px}
.rcard .marg{font-family:var(--f-d);font-size:14px;color:var(--green);font-weight:600;margin-bottom:16px}
.flag{font-family:var(--f-d);font-size:8.5px;letter-spacing:.12em;padding:3px 8px;border-radius:20px;text-transform:uppercase;font-weight:600;position:absolute;top:16px;left:16px;background:var(--char);color:#fff;z-index:2}
.rcard .img{position:relative;overflow:hidden}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(10,10,10,.5);color:#fff;font-size:18px;z-index:2;backdrop-filter:blur(4px)}
.gnav:hover{background:rgba(10,10,10,.8)}.gp{left:12px}.gn{right:12px}
.gmeta{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:2;background:linear-gradient(transparent,rgba(10,10,10,.6));font-family:var(--f-d);font-size:10px;letter-spacing:.06em;color:#fff;text-transform:uppercase}
.addimg{background:rgba(255,255,255,.9);color:#000;border-radius:20px;padding:5px 11px;font-family:var(--f-d);font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.addimg:hover{background:#fff}
.planstrip{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:7px;z-index:2}
.pthumb{width:66px;background:#fff;border-radius:7px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pthumb img{width:100%;height:46px;object-fit:cover;display:block;background:#f2f0ea}
.pthumb span{display:block;font-family:var(--f-d);font-size:7.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:2px}
.mstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mthumb{width:60px;height:44px;border-radius:7px;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;background:#eceae2}
.mthumb img{width:100%;height:100%;object-fit:cover}
.mthumb .x{position:absolute;top:1px;right:1px;width:15px;height:15px;background:rgba(10,10,10,.6);color:#fff;font-size:10px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.maddbtn{border:1px dashed var(--line2);border-radius:8px;padding:8px 12px;font-family:var(--f-d);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.maddbtn:hover{border-color:var(--green);color:var(--green)}
.lb{position:fixed;inset:0;background:rgba(8,10,9,.92);z-index:120;display:none;align-items:center;justify-content:center;padding:34px}
.lb.on{display:flex}.lb img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:6px}
.lb .x{position:absolute;top:22px;right:26px;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
/* kpi row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--card);padding:16px 18px}
.kpi.dark{background:var(--char);color:#eceeec}
.kpi .kl{font-family:var(--f-d);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}.kpi.dark .kl{color:var(--steel2)}
.kpi .kv{font-family:var(--f-d);font-weight:600;font-size:24px;margin-top:6px;color:var(--ink);letter-spacing:.01em}.kpi.dark .kv{color:#fff}
.kpi .kf{font-size:10.5px;color:var(--ink3);margin-top:4px}.kpi.dark .kf{color:var(--steel2)}
/* block bar */
.blockbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.blockbar label{font-family:var(--f-d);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-right:6px}
.blockbar select{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-family:var(--f-d);font-size:13px}
.bchip{display:inline-flex;align-items:center;gap:8px;background:var(--char);color:#fff;border-radius:20px;padding:5px 6px 5px 13px;font-family:var(--f-d);font-size:12px}
.bchip.sel{outline:2px solid var(--green)}
.bchip .qy{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:14px;padding:1px 4px}
.bchip .qy button{width:18px;height:18px;color:#fff;font-size:13px;line-height:1}
.bchip .rm{color:var(--steel);margin-left:2px}.bchip .rm:hover{color:#fff}
/* feasibility grid */
.feasgrid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:1000px){.feasgrid{grid-template-columns:1fr}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:var(--card2);border-bottom:1px solid var(--line)}
.sec-h .tri{font-size:10px;color:var(--ink3);transition:.15s}.sec-h.collapsed .tri{transform:rotate(-90deg)}
.sec-h .sn{font-family:var(--f-d);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;flex:1}
.sec-h .ph{display:flex;gap:4px}
.sec-h .pht{font-family:var(--f-d);font-size:8px;letter-spacing:.05em;padding:2px 6px;border-radius:5px;text-transform:uppercase;font-weight:600}
.sec-h .cnt{font-family:var(--f-d);font-size:10px;color:var(--ink3);background:var(--mint2);padding:2px 8px;border-radius:20px}
.sec-h .st{font-family:var(--f-d);font-weight:600;font-size:14px;color:var(--ink)}
.sec-b{padding:6px 16px 14px}
.lhead{display:grid;grid-template-columns:1fr 76px 96px 96px 30px;gap:10px;font-family:var(--f-d);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 0 6px}
.lrow{display:grid;grid-template-columns:1fr 76px 96px 96px 30px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.lrow .li{min-width:0}.lrow .li .ln{font-weight:600;font-size:13px;color:var(--ink)}
.lrow .li input.ename{border:none;background:transparent;font-weight:600;font-size:13px;color:var(--ink);width:100%;padding:2px 0}
.lrow .li input.ename:focus{outline:none;background:var(--card2);border-radius:4px}
.lrow .li .ls{font-size:10.5px;color:var(--ink3)}
.lrow .li input.esup{border:none;background:transparent;font-size:10.5px;color:var(--ink3);width:100%;padding:1px 0}
.qin,.rin{text-align:right;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-family:var(--f-d);font-size:12.5px;width:100%}
.qin:focus,.rin:focus{outline:none;border-color:var(--green)}
.amt{text-align:right;font-family:var(--f-d);font-weight:600;font-size:12.5px;color:var(--ink)}
.del{width:26px;height:26px;border-radius:6px;color:var(--ink3);font-size:14px;display:flex;align-items:center;justify-content:center}
.del:hover{background:var(--redbg);color:var(--red)}
.addline{width:100%;border:1px dashed var(--line2);border-radius:8px;padding:9px;font-family:var(--f-d);font-size:11px;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase;margin-top:8px}
.addline:hover{border-color:var(--green);color:var(--green)}
/* waterfall / phase rail */
.rail{position:sticky;top:60px}
.pwf{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.pwf-h{padding:12px 15px;color:#fff}
.pwf.p1 .pwf-h{background:linear-gradient(180deg,#7d8f85,#5f6f66)}.pwf.p2 .pwf-h{background:linear-gradient(180deg,#357a52,#255c3c)}.pwf.p3 .pwf-h{background:linear-gradient(180deg,#5b6169,#3f444b)}
.pwf-h .pk{font-family:var(--f-d);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.pwf-h .pn{font-family:var(--f-d);font-weight:600;font-size:15px;letter-spacing:.02em}
.pwf-h .pbig{font-family:var(--f-d);font-weight:700;font-size:22px;margin-top:6px}
.pwf-h .pl{font-family:var(--f-d);font-size:8px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.pwf-b{padding:6px 15px 12px}
.wrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:none}.wrow .k{color:var(--ink3)}.wrow .v{font-family:var(--f-d);font-weight:600;color:var(--ink)}
.wrow .pctin{width:52px;text-align:right;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-family:var(--f-d);font-size:11px;margin-left:6px}
.wrow.tot{border-top:1px solid var(--ink);margin-top:2px}.wrow.tot .v{color:var(--ink)}
.wrow.sale{background:var(--char);margin:8px -15px -12px;padding:11px 15px}.wrow.sale .k{color:var(--steel)}.wrow.sale .v{color:#fff;font-size:15px}
/* program */
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:16px;overflow:hidden}
.panel-h{padding:13px 18px;border-bottom:1px solid var(--line);font-family:var(--f-d);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-b{padding:16px 18px}
.gantt{overflow-x:auto}
.gt{min-width:760px}
.gt .grow{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line);min-height:46px;align-items:center}
.gt .gname{padding:8px 10px}.gt .gname .gn{font-family:var(--f-d);font-weight:600;font-size:12.5px}.gt .gname .gc{font-size:10px;color:var(--ink3)}
.gt .glane{position:relative;height:100%;border-left:1px solid var(--line)}
.gbar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:6px;color:#fff;font-family:var(--f-d);font-size:10px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.gbar.pre{background:#7d8f85}.gbar.mfg{background:var(--char)}.gbar.con{background:var(--green)}.gbar.ship{background:var(--gold)}
.ghead{display:grid;grid-template-columns:200px 1fr}.ghead .gm{border-left:1px solid var(--line);font-family:var(--f-d);font-size:9px;color:var(--ink3);padding:6px 4px;text-align:center}
.map{background:#dfe6e0;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.cf-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
/* dashboard */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.legend{font-size:12px}.legend div{display:flex;align-items:center;gap:8px;padding:3px 0}.legend .sw{width:10px;height:10px;border-radius:2px}
.pill{font-family:var(--f-d);font-size:9px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.note{font-size:11.5px;color:var(--ink3);margin-top:14px;border-left:2px solid var(--gold);padding:6px 0 6px 13px;line-height:1.6}
.empty{text-align:center;padding:40px;color:var(--ink3)}
/* ==== HAAVN BLACK — faceted shapes backdrop ==== */
body{background:#08090a}
.bg-shapes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(1200px 720px at 82% -12%, #191b20 0%, rgba(25,27,32,0) 60%),
    radial-gradient(1000px 640px at -8% 112%, #141519 0%, rgba(20,21,25,0) 55%),
    linear-gradient(180deg,#0a0b0c 0%,#050506 100%)}
.bg-shapes i{position:absolute;display:block;background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,0));border:1px solid rgba(255,255,255,.05)}
.bg-shapes i:nth-child(1){width:560px;height:560px;top:-140px;right:-90px;transform:rotate(18deg);clip-path:polygon(30% 0,100% 25%,80% 100%,0 70%)}
.bg-shapes i:nth-child(2){width:400px;height:400px;bottom:-110px;left:5%;transform:rotate(-12deg);clip-path:polygon(0 20%,70% 0,100% 80%,25% 100%)}
.bg-shapes i:nth-child(3){width:280px;height:280px;top:38%;left:46%;transform:rotate(25deg);opacity:.55;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.bg-shapes i:nth-child(4){width:200px;height:200px;bottom:16%;right:9%;transform:rotate(-8deg);opacity:.5;clip-path:polygon(20% 0,100% 30%,70% 100%,0 60%)}
.app,.top{position:relative;z-index:1}
.main,.wrap{background:transparent}
</style>
</head>

<div class="top">

const KEY='haavn_black_atrium_feas_v1';
let DB=null, view='range', rangeSel='black', fhome='SOLUM-LINEA', collapsed={}, progHome='SOLUM-LINEA';
let _uid=1; const uid=()=>_uid++;
function cloneEst(id){const src=ESTIMATES[id]||{};const est={};SECTION_META.forEach(s=>{est[s.id]=(src[s.id]||[]).map(l=>({id:uid(),name:l.name,sup:l.sup,qty:l.qty,rate:l.rate}));});return est;}
function defSet(h){const m=h&&h.marginBase!=null?h.marginBase:20;return{prelimsPct:4.5,marginP1:m,marginP2:m,marginP3:m,gstPct:10};}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){DB=JSON.parse(r);const ids=[];Object.values(DB.est).forEach(e=>Object.values(e).forEach(a=>a.forEach(l=>ids.push(l.id))));_uid=(ids.length?Math.max(...ids):0)+1;return;}}catch(e){}
  DB={est:{},set:{},media:{},block:[{homeId:'SOLUM-LINEA',qty:1}],prog:{start:'2026-09-07'}};
  HOMES.forEach(h=>{DB.est[h.id]=cloneEst(h.id);DB.set[h.id]=defSet(h);DB.media[h.id]=seedMedia(h);});
}
let _st=null;
function save(){const p=document.getElementById('savePill'),t=document.getElementById('saveTxt');if(p){p.classList.add('saving');t.textContent='Saving…';}
  clearTimeout(_st);_st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}if(p){p.classList.remove('saving');t.textContent='Saved '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});}},400);}
const money=n=>'$'+Math.round(n||0).toLocaleString('en-AU');
/* ---- media (images & floor plans) ---- */
function seedMedia(h){return {i:0,images:(h.renders||[]).map(k=>({key:k})),plans:(h.plans||[]).map(p=>({label:p[0],key:p[1]}))};}
function mSrc(m){return m.url||(m.key?IMG[m.key]:'')||'';}
let _mTarget=null,_mKind='image';
function addMedia(id,kind){_mTarget=id;_mKind=kind;document.getElementById('mediaInput').click();}
document.getElementById('mediaInput').onchange=function(e){const f=e.target.files[0];if(!f||!_mTarget)return;const url=URL.createObjectURL(f);const md=DB.media[_mTarget];const ent={url,name:f.name};
  if(_mKind==='plan')md.plans.push(Object.assign(ent,{label:f.name.replace(/\.[^.]+$/,'').slice(0,14)}));else md.images.push(ent);
  save();render();e.target.value='';};
function openLB(src){const el=document.getElementById('lb');document.getElementById('lbImg').src=src;el.classList.add('on');}
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- compute ---- */
function secTotal(id,secId){return (DB.est[id][secId]||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.rate||0),0);}
function phaseCost(id,phase){return SECTION_META.filter(s=>s.phases.includes(phase)).reduce((a,s)=>a+secTotal(id,s.id),0);}
function totalArea(id){return home(id).area;}
function wf(cost,marginPct,st){const prelims=cost*(+st.prelimsPct||0)/100;const totalCost=cost+prelims;const marginAmt=totalCost*(+marginPct||0)/100;const exgst=totalCost+marginAmt;const gst=exgst*(+st.gstPct||0)/100;return {cost,prelims,totalCost,marginAmt,exgst,gst,sale:exgst+gst};}
function phaseWf(id,phase){const st=DB.set[id];const m=[st.marginP1,st.marginP2,st.marginP3][phase-1];return wf(phaseCost(id,phase),m,st);}
function blockTotals(){let cost=0,sale2=0,area=0,units=0;DB.block.forEach(b=>{const q=b.qty;area+=totalArea(b.homeId)*q;units+=q;cost+=phaseCost(b.homeId,2)*q;sale2+=phaseWf(b.homeId,2).sale*q;});return{cost,sale2,area,units,margin:sale2-cost};}

/* ---------- PROGRAM (delivery + shipping + cashflow) ---------- */
function vProgram(){
  const id=progHome;const pre=secTotal(id,'design')+secTotal(id,'site');const mfg=secTotal(id,'mfg');const ship=secTotal(id,'freight');const con=secTotal(id,'install')+secTotal(id,'services')+secTotal(id,'compliance');
  const total=pre+mfg+ship+con;
  const WK=['7 Sep','21 Sep','5 Oct','19 Oct','2 Nov','16 Nov','30 Nov','14 Dec','28 Dec','11 Jan'];
  const bars=[{n:'Pre-construction',c:'pre',s:0,w:22,cost:pre},{n:'Manufacture',c:'mfg',s:18,w:34,cost:mfg},{n:'Ocean freight',c:'ship',s:50,w:16,cost:ship},{n:'Construction & install',c:'con',s:64,w:32,cost:con}];
  /* cashflow weekly */
  const wkN=14;const weights=[.04,.05,.06,.07,.08,.10,.12,.12,.10,.08,.07,.05,.04,.02];const wsum=weights.reduce((a,b)=>a+b,0);
  let cum=0;const cf=weights.map((w,i)=>{const v=total*w/wsum;cum+=v;return {v,cum};});const peak=Math.max(...cf.map(x=>x.v));
  return `<div class="h-row"><div><div class="eyebrow">Delivery · shipping · cashflow</div><h1 class="title">Delivery <i>program</i></h1>
    <p class="lede">The cost-loaded delivery cycle — factory to site under the HAAVN × Hamilton Marino model. Sea freight from Shenzhen, phase roll-up and weekly cash drawdown, driven live by the feasibility estimate.</p></div>
    <div class="flexwrap"><label class="mono" style="font-size:10px;color:var(--ink3)">COSTING HOME</label><select data-act="setProg" style="background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-family:var(--f-d)">${HOMES.map(x=>`<option value="${x.id}" ${x.id===progHome?'selected':''}>${x.name}</option>`).join('')}</select></div>
  </div>
  <div class="panel"><div class="panel-h"><span>Logistics route · Shenzhen → Melbourne</span><span class="mono" style="color:var(--ink3)">≈ 5,900 nm · 18–24 days</span></div>
    <div class="panel-b" style="padding:0"><div class="map">${logisticsSVG()}</div></div></div>
  <div class="panel"><div class="panel-h"><span>Cost-loaded delivery program · every cost line rolls up by phase</span><span class="mono" style="color:var(--ink3)">${esc(home(id).name)} · ${money(total)}</span></div>
    <div class="panel-b gantt"><div class="gt">
      <div class="ghead"><div></div><div style="display:grid;grid-template-columns:repeat(${WK.length},1fr)">${WK.map(w=>`<div class="gm">${w}</div>`).join('')}</div></div>
      ${bars.map(b=>`<div class="grow"><div class="gname"><div class="gn">${b.n}</div><div class="gc">${money(b.cost)}</div></div><div class="glane"><div class="gbar ${b.c}" style="left:${b.s}%;width:${b.w}%">${money(b.cost)}</div></div></div>`).join('')}
    </div></div></div>
  <div class="panel"><div class="panel-h"><span>Cash flow · cost drawdown over time</span><span class="mono" style="color:var(--ink3)">${money(total)} across ${wkN} weeks</span></div>
    <div class="panel-b">
      <div class="cf-kpis"><div class="kpi"><div class="kl">Total build cost</div><div class="kv">${money(total)}</div></div>
        <div class="kpi"><div class="kl">Peak weekly draw</div><div class="kv">${money(peak)}</div></div>
        <div class="kpi"><div class="kl">Avg weekly</div><div class="kv">${money(total/wkN)}</div></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div><div class="mono" style="font-size:10px;color:var(--ink3);margin-bottom:8px">WEEKLY DRAWDOWN</div>${barsSVG(cf.map(x=>x.v),peak)}</div>
        <div><div class="mono" style="font-size:10px;color:var(--ink3);margin-bottom:8px">CUMULATIVE SPEND · S-CURVE</div>${curveSVG(cf.map(x=>x.cum),total)}</div>
      </div>
    </div></div>`;
}
function logisticsSVG(){
  return `<svg viewBox="0 0 900 300" style="width:100%;display:block">
    <rect width="900" height="300" fill="#dfe6e0"/>
    <g fill="#cdd6cf">${[[120,60,60,40],[220,90,120,80],[600,70,150,90],[560,200,120,70],[720,150,80,60]].map(r=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="10"/>`).join('')}</g>
    <path d="M665,95 C640,160 600,210 720,250" fill="none" stroke="var(--char)" stroke-width="2" stroke-dasharray="5 5"/>
    ${[['665','95','Port of Shenzhen','load'],['640','170','Singapore','transhipment'],['720','250','Port of Melbourne','discharge']].map(n=>`<circle cx="${n[0]}" cy="${n[1]}" r="5" fill="var(--char)"/><text x="${+n[0]+9}" y="${+n[1]-4}" font-family="Chakra Petch" font-size="12" fill="#12201A" font-weight="600">${n[2]}</text><text x="${+n[0]+9}" y="${+n[1]+9}" font-family="Chakra Petch" font-size="9" fill="#697770">${n[3]}</text>`).join('')}
    <text x="24" y="280" font-family="Chakra Petch" font-size="11" fill="#697770">Shenzhen → Melbourne · sea freight · Hamilton Marino delivery</text>
  </svg>`;
}
function barsSVG(vals,peak){const W=380,H=150,n=vals.length,bw=W/n*.66;return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${vals.map((v,i)=>{const h=peak?v/peak*(H-24):0;const x=i*(W/n)+(W/n-bw)/2;return `<rect x="${x}" y="${H-20-h}" width="${bw}" height="${h}" rx="2" fill="var(--char)"/>`;}).join('')}<line x1="0" y1="${H-20}" x2="${W}" y2="${H-20}" stroke="var(--line2)"/></svg>`;}
function curveSVG(cum,total){const W=380,H=150;const n=cum.length;const pts=cum.map((c,i)=>[i/(n-1)*W,H-20-(total?c/total*(H-30):0)]);const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><path d="${d} L${W},${H-20} L0,${H-20} Z" fill="rgba(46,107,71,.10)"/><path d="${d}" fill="none" stroke="var(--green)" stroke-width="2"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="var(--green)"/>`).join('')}<line x1="0" y1="${H-20}" x2="${W}" y2="${H-20}" stroke="var(--line2)"/></svg>`;}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='nav'){view=t.dataset.view;render();}
  else if(a==='range'){rangeSel=t.dataset.r;if(view!=='range'&&view!=='dash')view='range';render();}
  else if(a==='openFeas'){fhome=t.dataset.id;if(!DB.block.find(b=>b.homeId===fhome))DB.block.push({homeId:fhome,qty:1});view='feas';save();render();}
  else if(a==='setFhome2'){fhome=t.dataset.id;render();}
  else if(a==='qtyUp'){const b=DB.block.find(x=>x.homeId===t.dataset.id);b.qty++;save();render();}
  else if(a==='qtyDn'){const b=DB.block.find(x=>x.homeId===t.dataset.id);b.qty=Math.max(1,b.qty-1);save();render();}
  else if(a==='rmBlock'){DB.block=DB.block.filter(x=>x.homeId!==t.dataset.id);if(fhome===t.dataset.id&&DB.block[0])fhome=DB.block[0].homeId;save();render();}
  else if(a==='collapse'){collapsed[t.dataset.sec]=!collapsed[t.dataset.sec];render();}
  else if(a==='addLine'){DB.est[fhome][t.dataset.sec].push({id:uid(),name:'New cost line',sup:'Supplier',qty:1,rate:0});save();render();}
  else if(a==='delLine'){DB.est[fhome][t.dataset.sec]=DB.est[fhome][t.dataset.sec].filter(l=>l.id!==+t.dataset.id);save();render();}
  else if(a==='mimg'){const md=DB.media[t.dataset.id];md.i=((md.i||0)+ (+t.dataset.d)+md.images.length)%Math.max(1,md.images.length);render();}
  else if(a==='addMedia'){addMedia(t.dataset.id,t.dataset.kind||'image');}
  else if(a==='mdel'){const md=DB.media[t.dataset.id];const arr=t.dataset.kind==='plan'?md.plans:md.images;arr.splice(+t.dataset.i,1);save();render();}
  else if(a==='lb'){openLB(t.dataset.src);}
  else if(a==='lbclose'){document.getElementById('lb').classList.remove('on');}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.act==='setFhome'){fhome=el.value;if(!DB.block.find(b=>b.homeId===fhome))DB.block.push({homeId:fhome,qty:1});render();return;}
  if(el.dataset.act==='addBlock'){if(el.value){DB.block.push({homeId:el.value,qty:1});fhome=el.value;save();render();}return;}
  if(el.dataset.act==='setProg'){progHome=el.value;render();return;}
  if(el.dataset.bind){bindWrite(el);render();}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind&&el.tagName==='INPUT')bindWrite(el,true);});
function bindWrite(el,live){const p=el.dataset.bind.split(':');const kind=p[0];
  const num=v=>{let n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
  if(kind==='set'){DB.set[p[1]][p[2]]=num(el.value);save();if(live)liveFeas();}
  else if(kind==='lqty'||kind==='lrate'){const l=DB.est[p[1]][p[2]].find(x=>x.id===+p[3]);if(!l)return;l[kind==='lqty'?'qty':'rate']=num(el.value);save();if(live)liveLine(p[2],l);}
  else if(kind==='lname'||kind==='lsup'){const l=DB.est[p[1]][p[2]].find(x=>x.id===+p[3]);if(!l)return;l[kind==='lname'?'name':'sup']=el.value;save();}
}
function liveLine(secId,l){
  const amt=document.querySelector('[data-amt="'+l.id+'"]');if(amt)amt.textContent=money(l.qty*l.rate);
  const sst=document.querySelector('[data-sst="'+secId+'"]');if(sst)sst.textContent=money(secTotal(fhome,secId));
  liveFeas();
}
function liveFeas(){
  PHASEINFO.forEach(p=>{const w=phaseWf(fhome,p.k);['cost','prelims','totalCost','marginAmt','exgst','gst','sale'].forEach(f=>{const el=document.querySelector('[data-wf="'+p.k+':'+f+'"]');if(el)el.textContent=money(w[f]);});const b=document.querySelector('[data-wsale="'+p.k+'"]');if(b)b.textContent=money(w.sale);});
  const set=(i,t)=>{const el=document.getElementById(i);if(el)el.textContent=t;};
  set('k_cost',money(phaseWf(fhome,2).totalCost));set('k_sale',money(phaseWf(fhome,2).sale));set('k_block',money(blockTotals().sale2));
}

load();render();
