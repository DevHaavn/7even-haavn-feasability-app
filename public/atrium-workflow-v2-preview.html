<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ATRIUM · Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   ATRIUM WORKFLOW — Pillar 01 preview (v2)
   CRM (companies + contacts, internal & external) + tasks + weekly agenda
   staging, feeding bidirectionally into Meeting Management (Pillar 02).
   Brand: black / bone / gold — no 7EVEN or HAAVN marks on this surface.
   ============================================================================ */
:root{
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bg0:#060708; --bg1:#0B0D0F; --panel:#101215; --ink:#F3F2EE; --ink2:#b9bcc2; --ink3:#7a7e86;
  --gold:#d6b36a; --gold-hi:#f4e3bd; --gold-lo:#a3782a;
  --line:rgba(243,242,238,.14); --line2:rgba(243,242,238,.07);
  --red:#e0645c; --green:#2fe07a; --blue:#5b8def;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg0);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:var(--mono)}
::selection{background:rgba(214,179,106,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}

.pvbanner{position:fixed;top:0;left:0;right:0;z-index:500;text-align:center;padding:6px 10px;font:500 9.5px/1 var(--mono);
  letter-spacing:.28em;text-transform:uppercase;color:#0B0D0F;background:linear-gradient(90deg,var(--gold),var(--gold-hi));}

.app{padding-top:30px;min-height:100%;display:flex;flex-direction:column}

/* ---- header : ATRIUM wordmark strip, no other brand marks ---- */
.hdr{position:sticky;top:30px;z-index:80;background:rgba(6,7,8,.86);backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line2);padding:16px 26px}
.hdr-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px}
.hmark{width:34px;height:34px;flex:none;border-radius:999px;border:1px solid rgba(243,242,238,.32);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hmark svg{width:16px;height:16px;display:block}
.hword{display:flex;align-items:baseline;font:100 22px/1 var(--sans);letter-spacing:.32em;color:var(--ink)}
.hword b{font-weight:400}
.hpillar{margin-left:2px;color:var(--ink3);font:400 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;
  border-left:1px solid var(--line);padding-left:14px}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.hclock{font:400 11px var(--mono);letter-spacing:.16em;color:var(--ink3)}
.hclock i{color:var(--green);font-style:normal}

/* ---- tab pills — same pill language as the app menus (border,999px,mono,uppercase) ---- */
.tabs{max-width:1180px;margin:22px auto 0;padding:0 26px;display:flex;gap:10px;flex-wrap:wrap}
.tab{padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--ink2);font:500 11.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.25s}
.tab:hover{border-color:rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.07)}
.tab.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(214,179,106,.1);
  box-shadow:0 0 22px -10px rgba(214,179,106,.7)}

.wrap{max-width:1180px;margin:0 auto;padding:22px 26px 90px;flex:1;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:20px}
.card h3{font:500 12px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font:300 34px var(--sans);color:#fff}
.stat span{font:400 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:700px){.statrow{grid-template-columns:repeat(2,1fr)}}

.btn{border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.04);color:var(--ink);
  font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.09)}
.btn.gold{border-color:var(--gold);color:var(--gold-hi);background:rgba(214,179,106,.08)}
.btn.gold:hover{background:rgba(214,179,106,.18);box-shadow:0 0 24px -10px rgba(214,179,106,.7)}
.btn.sm{padding:7px 13px;font-size:10px}
.btn:disabled{opacity:.35;cursor:default}

.row{display:flex;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.litem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.02);transition:.2s}
.litem:hover{border-color:var(--line);background:rgba(255,255,255,.04)}
.lname{font:500 13px var(--sans);color:#fff}
.lsub{font:400 10.5px var(--mono);letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.chip{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.chip.int{color:var(--blue);border-color:rgba(91,141,239,.45);background:rgba(91,141,239,.08)}
.chip.ext{color:var(--gold-hi);border-color:rgba(214,179,106,.45);background:rgba(214,179,106,.08)}
.chip.weekly{color:var(--green);border-color:rgba(47,224,122,.45);background:rgba(47,224,122,.08)}
.spacer{flex:1}

input,select,textarea{font-family:var(--sans);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);padding:10px 13px;font-size:13px;outline:none;transition:.2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:6px;font:500 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.empty{padding:26px;text-align:center;color:var(--ink3);font:400 12px var(--mono);letter-spacing:.1em}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.25s}
.modalbg.on{opacity:1;pointer-events:auto}
.modal{width:min(520px,100%);max-height:88vh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line);border-radius:24px;padding:24px}
.modal h4{font:500 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* floating recording indicator — reads the shared meetings store; in the real
   app this same doc drives a bar rendered in App.tsx above the iframe so it
   survives navigation to any other screen, not just this one */
.recbar{position:fixed;right:20px;bottom:20px;z-index:200;display:none;align-items:center;gap:10px;padding:11px 18px;
  border-radius:999px;border:1px solid rgba(224,100,92,.6);background:rgba(20,10,10,.85);backdrop-filter:blur(12px);
  cursor:pointer;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
.recbar.on{display:flex}
.recdot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:recPulse 1.2s ease-in-out infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.3}}
.recbar span{font:500 11px var(--mono);letter-spacing:.14em;color:#fff}
.recbar b{color:var(--red)}

@media(max-width:600px){
  .hword{font-size:17px;letter-spacing:.24em}
  .hpillar{display:none}
  .statrow{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="pvbanner">PREVIEW BUILD · PILLAR 01 · ATRIUM WORKFLOW — not yet wired into the live hub</div>

<div class="app">
  <div class="hdr">
    <div class="hdr-inner">
      <div class="hmark"><svg viewBox="0 0 66 74" aria-hidden="true"><path d="M4 74 L33 0 L62 74" fill="none" stroke="#F3F2EE" stroke-width="5.2" stroke-linejoin="miter" stroke-linecap="butt"/></svg></div>
      <div class="hword"><b>ATRIUM</b></div>
      <div class="hpillar">01 · WORKFLOW</div>
      <div class="hright">
        <div class="hclock"><i>●</i> LIVE <span id="clock">--:--:--</span> MELBOURNE</div>
        <button class="btn sm" onclick="location.href='atrium-meeting-hub-v2-preview.html'">Meeting Management → 02</button>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="wrap" id="view"></div>
</div>

<div class="recbar" id="recbar" onclick="jumpToMeeting()">
  <span class="recdot"></span>
  <span>RECORDING — <b id="recTitle"></b> — <b id="recTime">00:00</b> — tap to return</span>
</div>

<div class="modalbg" id="modalbg"><div class="modal" id="modalBody"></div></div>

<script>
/* ===================== cloud (capital_kv, shared with pillar 02) ===================== */
var SUPA_URL='https://vgvavmnqrdgcnledztyk.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZndmF2bW5xcmRnY25sZWR6dHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzIwODEsImV4cCI6MjA5OTU0ODA4MX0.hiWSzfEMXPJGs67iqiuB3hwJVxUO51uu2rygmA5wO10';
var SUPA_H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var CRM_KEY='atrium_crm_v2_preview', TASKS_KEY='atrium_tasks_v2_preview', MEET_KEY='atrium_meetings_v2_preview';

function kvPull(key,fallback){
  return fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+key+'&select=value',{headers:SUPA_H})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(rows){return (rows&&rows.length)?rows[0].value:fallback;})
    .catch(function(){return fallback;});
}
function kvPush(key,value){
  var body=[{key:key,value:value,updated_at:new Date().toISOString()}];
  return fetch(SUPA_URL+'/rest/v1/capital_kv',{method:'POST',headers:Object.assign({},SUPA_H,{Prefer:'resolution=merge-duplicates'}),body:JSON.stringify(body)}).catch(function(){});
}

/* ===================== data model ===================== */
var CRM={companies:[],contacts:[],seq:1};
var TASKS={tasks:[],seq:1};
var MEET={meetings:[],seq:1};

function uid(store){return 'a'+(store.seq++)+'-'+Math.random().toString(36).slice(2,7);}

function seedIfEmpty(){
  var seededCrm=false, seededTasks=false;
  if(!CRM.companies.length){
    seededCrm=true;
    CRM.companies=[
      {id:uid(CRM),name:'7EVEN',kind:'internal',notes:'Development & delivery',updated:Date.now()},
      {id:uid(CRM),name:'HAAVN',kind:'internal',notes:'Product & brand',updated:Date.now()},
      {id:uid(CRM),name:'HAAVN Management',kind:'internal',notes:'Admin & operations',updated:Date.now()},
    ];
    var c7=CRM.companies[0].id,ch=CRM.companies[1].id,cm=CRM.companies[2].id;
    CRM.contacts=[
      {id:uid(CRM),companyId:c7,name:'Jamie Baldwin',role:'Director',email:'jamie@7even.au',phone:'',updated:Date.now()},
      {id:uid(CRM),companyId:ch,name:'Daniel Sette',role:'Engine Lead',email:'daniel@haavn.au',phone:'',updated:Date.now()},
      {id:uid(CRM),companyId:cm,name:'James Winstanley',role:'Management',email:'james@haavn.au',phone:'',updated:Date.now()},
    ];
  }
  if(!TASKS.tasks.length){
    seededTasks=true;
    TASKS.tasks=[
      {id:uid(TASKS),title:'Confirm SOLUM pricing sheet',owner:'Jamie Baldwin',dept:'7EVEN',status:'doing',due:'',weekly:true,updated:Date.now()},
      {id:uid(TASKS),title:'Azure Speech resource — production key',owner:'Daniel Sette',dept:'HAAVN',status:'todo',due:'',weekly:true,updated:Date.now()},
    ];
  }
  if(seededCrm) saveCRM();
  if(seededTasks) saveTasks();
}

/* ===================== state ===================== */
var TAB=location.hash.replace('#','')||'dashboard';
var TABS=[['dashboard','Dashboard'],['crm','Companies & Contacts'],['tasks','Tasks'],['agenda','Weekly Agenda'],['meetings','Meetings']];

function boot(){
  Promise.all([
    kvPull(CRM_KEY,null), kvPull(TASKS_KEY,null), kvPull(MEET_KEY,null)
  ]).then(function(r){
    if(r[0]) CRM=r[0];
    if(r[1]) TASKS=r[1];
    if(r[2]) MEET=r[2];
    seedIfEmpty();
    renderTabs(); render();
    setInterval(pollRecording,4000);
    setInterval(tickClock,1000); tickClock();
  });
}
function saveCRM(){CRM.companies.forEach(function(c){c.updated=Date.now();});kvPush(CRM_KEY,CRM);}
function saveTasks(){kvPush(TASKS_KEY,TASKS);}
function saveMeet(){kvPush(MEET_KEY,MEET);}

function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}

/* ===================== tabs / router ===================== */
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<div class="tab'+(TAB===t[0]?' on':'')+'" onclick="goTab(\''+t[0]+'\')">'+t[1]+'</div>';
  }).join('');
}
function goTab(t){TAB=t;location.hash=t;renderTabs();render();}
window.addEventListener('hashchange',function(){TAB=location.hash.replace('#','')||'dashboard';renderTabs();render();});

function render(){
  var v=document.getElementById('view');
  if(TAB==='dashboard') v.innerHTML=viewDashboard();
  else if(TAB==='crm') v.innerHTML=viewCrm();
  else if(TAB==='tasks') v.innerHTML=viewTasks();
  else if(TAB==='agenda') v.innerHTML=viewAgenda();
  else if(TAB==='meetings') v.innerHTML=viewMeetings();
}

/* ===================== dashboard ===================== */
function viewDashboard(){
  var weekly=TASKS.tasks.filter(function(t){return t.weekly&&t.status!=='done';});
  var open=TASKS.tasks.filter(function(t){return t.status!=='done';});
  var ext=CRM.companies.filter(function(c){return c.kind==='external';});
  var upcoming=MEET.meetings.filter(function(m){return m.status!=='ended';}).length;
  return ''+
  '<div class="statrow" style="margin-bottom:18px">'+
    stat(open.length,'Open tasks')+stat(weekly.length,'Staged for weekly')+stat(ext.length,'External companies')+stat(upcoming,'Meetings this week')+
  '</div>'+
  '<div class="grid">'+
    '<div class="card"><h3>Weekly agenda staging <span class="chip weekly">→ pillar 02</span></h3>'+
      (weekly.length?'<div class="list">'+weekly.map(function(t){return litem(t.title,t.owner+' · '+t.dept,'<span class="chip weekly">Weekly</span>');}).join('')+'</div>':
      '<div class="empty">Nothing staged — flag a task "Weekly" from the Tasks tab.</div>')+
      '<div style="margin-top:14px"><button class="btn gold sm" onclick="goTab(\'agenda\')">Open Weekly Agenda →</button></div>'+
    '</div>'+
    '<div class="card"><h3>Recent meetings</h3>'+
      (MEET.meetings.length?'<div class="list">'+MEET.meetings.slice(-4).reverse().map(function(m){
        return litem(m.title,fmtDate(m.whenISO)+' · '+m.kind,'<span class="chip '+(m.kind==='external'?'ext':'int')+'">'+m.status+'</span>');
      }).join('')+'</div>':'<div class="empty">No meetings yet.</div>')+
      '<div style="margin-top:14px"><button class="btn sm" onclick="goTab(\'meetings\')">Open Meeting Management →</button></div>'+
    '</div>'+
  '</div>';
}
function stat(n,l){return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>';}
function litem(name,sub,right){return '<div class="litem"><div><div class="lname">'+esc(name)+'</div><div class="lsub">'+esc(sub)+'</div></div><div class="spacer"></div>'+(right||'')+'</div>';}

/* ===================== CRM ===================== */
function viewCrm(){
  var h='<div class="row" style="margin-bottom:16px"><h3 class="mono" style="letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);font-size:11px">Companies &amp; contacts — shared with Meeting Management</h3><div class="spacer"></div>'+
    '<button class="btn sm gold" onclick="openCompanyModal()">+ Company</button><button class="btn sm" onclick="openContactModal()">+ Contact</button></div>';
  h+='<div class="grid">';
  CRM.companies.forEach(function(co){
    var contacts=CRM.contacts.filter(function(c){return c.companyId===co.id;});
    h+='<div class="card"><h3>'+esc(co.name)+' <span class="chip '+(co.kind==='internal'?'int':'ext')+'">'+co.kind+'</span></h3>';
    h+=contacts.length?('<div class="list">'+contacts.map(function(c){return litem(c.name,(c.role||'')+' · '+c.email,'');}).join('')+'</div>'):'<div class="empty">No contacts yet.</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function openCompanyModal(){
  showModal('New company','<form onsubmit="return addCompany(event)">'+
    '<label class="f">Name<input id="mCoName" required placeholder="e.g. Diamond Valley Baptist Church"/></label>'+
    '<div style="height:10px"></div>'+
    '<label class="f">Type</label><div class="row" style="margin-top:6px">'+
      '<label class="row"><input type="radio" name="kind" value="internal" style="width:auto"/> Internal</label>'+
      '<label class="row"><input type="radio" name="kind" value="external" checked style="width:auto"/> External</label>'+
    '</div>'+
    '<div style="height:10px"></div>'+
    '<label class="f">Notes<textarea id="mCoNotes" rows="2"></textarea></label>'+
    '<div class="foot"><button type="button" class="btn sm" onclick="closeModal()">Cancel</button><button type="submit" class="btn sm gold">Add company</button></div>'+
  '</form>');
}
function addCompany(e){
  e.preventDefault();
  var kind=document.querySelector('input[name=kind]:checked').value;
  CRM.companies.push({id:uid(CRM),name:document.getElementById('mCoName').value.trim(),kind:kind,notes:document.getElementById('mCoNotes').value.trim(),updated:Date.now()});
  saveCRM(); closeModal(); render(); return false;
}
function openContactModal(){
  var opts=CRM.companies.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');
  showModal('New contact','<form onsubmit="return addContact(event)">'+
    '<label class="f">Company<select id="mCtCo">'+opts+'</select></label><div style="height:10px"></div>'+
    '<div class="formgrid"><label class="f">Name<input id="mCtName" required/></label><label class="f">Role<input id="mCtRole"/></label></div><div style="height:10px"></div>'+
    '<div class="formgrid"><label class="f">Email<input id="mCtEmail" type="email"/></label><label class="f">Phone<input id="mCtPhone"/></label></div>'+
    '<div class="foot"><button type="button" class="btn sm" onclick="closeModal()">Cancel</button><button type="submit" class="btn sm gold">Add contact</button></div>'+
  '</form>');
}
function addContact(e){
  e.preventDefault();
  CRM.contacts.push({id:uid(CRM),companyId:document.getElementById('mCtCo').value,name:document.getElementById('mCtName').value.trim(),
    role:document.getElementById('mCtRole').value.trim(),email:document.getElementById('mCtEmail').value.trim(),phone:document.getElementById('mCtPhone').value.trim(),updated:Date.now()});
  saveCRM(); closeModal(); render(); return false;
}

/* ===================== tasks ===================== */
function viewTasks(){
  var h='<div class="row" style="margin-bottom:16px"><div class="spacer"></div><button class="btn sm gold" onclick="openTaskModal()">+ Task</button></div>';
  ['todo','doing','done'].forEach(function(s){
    var items=TASKS.tasks.filter(function(t){return t.status===s;});
    h+='<div class="card" style="margin-bottom:14px"><h3>'+s.toUpperCase()+' <span class="chip">'+items.length+'</span></h3>';
    h+=items.length?('<div class="list">'+items.map(function(t){
      return '<div class="litem"><div><div class="lname">'+esc(t.title)+'</div><div class="lsub">'+esc(t.owner)+' · '+esc(t.dept)+'</div></div><div class="spacer"></div>'+
        (t.weekly?'<span class="chip weekly">Weekly</span>':'')+
        '<button class="btn sm" onclick="toggleWeekly(\''+t.id+'\')">'+(t.weekly?'Unflag':'Flag weekly')+'</button>'+
        (s!=='done'?'<button class="btn sm" onclick="advanceTask(\''+t.id+'\')">Advance →</button>':'')+
      '</div>';
    }).join('')+'</div>'):'<div class="empty">Nothing here.</div>';
    h+='</div>';
  });
  return h;
}
function openTaskModal(){
  var people=CRM.contacts.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('');
  var depts=CRM.companies.filter(function(c){return c.kind==='internal';}).map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('');
  showModal('New task','<form onsubmit="return addTask(event)">'+
    '<label class="f">Title<input id="mTTitle" required/></label><div style="height:10px"></div>'+
    '<div class="formgrid"><label class="f">Owner<select id="mTOwner">'+people+'</select></label><label class="f">Department<select id="mTDept">'+depts+'</select></label></div>'+
    '<div class="foot"><button type="button" class="btn sm" onclick="closeModal()">Cancel</button><button type="submit" class="btn sm gold">Add task</button></div>'+
  '</form>');
}
function addTask(e){
  e.preventDefault();
  TASKS.tasks.push({id:uid(TASKS),title:document.getElementById('mTTitle').value.trim(),owner:document.getElementById('mTOwner').value,
    dept:document.getElementById('mTDept').value,status:'todo',due:'',weekly:false,updated:Date.now()});
  saveTasks(); closeModal(); render(); return false;
}
function toggleWeekly(id){var t=TASKS.tasks.find(function(x){return x.id===id;});t.weekly=!t.weekly;saveTasks();render();}
function advanceTask(id){var t=TASKS.tasks.find(function(x){return x.id===id;});t.status=t.status==='todo'?'doing':'done';saveTasks();render();}

/* ===================== weekly agenda (bridge to pillar 02) ===================== */
function viewAgenda(){
  var weekly=TASKS.tasks.filter(function(t){return t.weekly&&t.status!=='done';});
  var linked=weekly.filter(function(t){return isLinked(t.id);});
  var unlinked=weekly.filter(function(t){return !isLinked(t.id);});
  return '<div class="card"><h3>Staged for the Weekly Company Meeting <span class="chip weekly">'+weekly.length+'</span></h3>'+
    '<p style="color:var(--ink3);font-size:12px;margin-bottom:14px">Flagging a task "Weekly" here stages it. Sending pushes each item into the live Weekly Company Meeting agenda in Meeting Management — updating a status there flows the change back to the task automatically.</p>'+
    (unlinked.length?('<div class="list">'+unlinked.map(function(t){return litem(t.title,t.owner+' · '+t.dept,'');}).join('')+'</div>'):'')+
    (linked.length?('<div style="margin-top:10px" class="list">'+linked.map(function(t){return litem(t.title,t.owner+' · '+t.dept,'<span class="chip int">Sent to 02</span>');}).join('')+'</div>'):'')+
    '<div style="margin-top:16px"><button class="btn gold" '+(unlinked.length?'':'disabled')+' onclick="sendToWeeklyMeeting()">Send '+unlinked.length+' item(s) to Meeting Management →</button></div>'+
  '</div>';
}
function isLinked(taskId){return MEET.meetings.some(function(m){return m.agenda.some(function(a){return a.fromTaskId===taskId;});});}
function getOrCreateWeeklyMeeting(){
  var m=MEET.meetings.find(function(m){return m.kind==='weekly'&&m.status!=='ended';});
  if(!m){
    m={id:uid(MEET),title:'Weekly Company Meeting',kind:'weekly',whenISO:nextMonday(),status:'scheduled',
      attendees:CRM.contacts.filter(function(c){var co=CRM.companies.find(function(x){return x.id===c.companyId;});return co&&co.kind==='internal';})
        .map(function(c){return {contactId:c.id,name:c.name,email:c.email,kind:'internal'};}),
      agenda:[],transcript:[],summary:'',decisions:[],actions:[],recording:{active:false,startedAt:0,lastBeat:0},sentAt:null,sentTo:[]};
    MEET.meetings.push(m);
  }
  return m;
}
function sendToWeeklyMeeting(){
  var weekly=TASKS.tasks.filter(function(t){return t.weekly&&t.status!=='done'&&!isLinked(t.id);});
  var m=getOrCreateWeeklyMeeting();
  weekly.forEach(function(t){
    m.agenda.push({id:uid(MEET),title:t.title,ownerName:t.owner,dept:t.dept,fromTaskId:t.id,state:'pending',notes:''});
  });
  saveMeet(); render();
  showModal('Sent to Meeting Management','<p style="font-size:13px;line-height:1.6">'+weekly.length+' item(s) added to <b>'+esc(m.title)+'</b>. Open Meeting Management to run the meeting, record it, and send the agenda + notes afterwards.</p>'+
    '<div class="foot"><button class="btn sm" onclick="closeModal()">Stay here</button><button class="btn sm gold" onclick="location.href=\'atrium-meeting-hub-v2-preview.html?m='+m.id+'\'">Open Meeting Management →</button></div>');
}
function nextMonday(){var d=new Date();d.setDate(d.getDate()+((1+7-d.getDay())%7||7));d.setHours(8,30,0,0);return d.toISOString();}

/* ===================== meetings register ===================== */
function viewMeetings(){
  var h='<div class="row" style="margin-bottom:16px"><div class="spacer"></div><button class="btn sm gold" onclick="location.href=\'atrium-meeting-hub-v2-preview.html\'">+ New meeting in Meeting Management →</button></div>';
  h+='<div class="card"><h3>All meetings</h3>';
  h+=MEET.meetings.length?('<div class="list">'+MEET.meetings.slice().reverse().map(function(m){
    return '<div class="litem"><div><div class="lname">'+esc(m.title)+'</div><div class="lsub">'+fmtDate(m.whenISO)+' · '+m.attendees.length+' attendees</div></div><div class="spacer"></div>'+
      '<span class="chip '+(m.kind==='external'?'ext':'int')+'">'+m.kind+'</span><span class="chip">'+m.status+'</span>'+
      '<button class="btn sm" onclick="location.href=\'atrium-meeting-hub-v2-preview.html?m='+m.id+'\'">Open →</button></div>';
  }).join('')+'</div>'):'<div class="empty">No meetings yet.</div>';
  h+='</div>';
  return h;
}

/* ===================== recording persistence indicator ===================== */
function pollRecording(){
  kvPull(MEET_KEY,null).then(function(v){
    if(!v) return;
    MEET=v;
    var live=MEET.meetings.find(function(m){return m.recording&&m.recording.active&&(Date.now()-m.recording.lastBeat)<20000;});
    var bar=document.getElementById('recbar');
    if(live){
      bar.classList.add('on');
      document.getElementById('recTitle').textContent=live.title;
      var secs=Math.floor((Date.now()-live.recording.startedAt)/1000);
      document.getElementById('recTime').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
      window._liveMeetingId=live.id;
    } else { bar.classList.remove('on'); }
    if(TAB==='dashboard'||TAB==='meetings'||TAB==='agenda') render();
  });
}
function jumpToMeeting(){if(window._liveMeetingId) location.href='atrium-meeting-hub-v2-preview.html?m='+window._liveMeetingId;}

/* ===================== modal / util ===================== */
function showModal(title,body){document.getElementById('modalBody').innerHTML='<h4>'+title+'</h4>'+body;document.getElementById('modalbg').classList.add('on');}
function closeModal(){document.getElementById('modalbg').classList.remove('on');}
document.getElementById('modalbg').addEventListener('click',function(e){if(e.target===this)closeModal();});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false});}

boot();
</script>
