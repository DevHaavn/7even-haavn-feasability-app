<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAAVN BLACK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   HAAVN BLACK · main page (rebuilt 23 Sep 2026)
   The old animated-shader intro (haavn-black-welcome.html) is skipped
   entirely — HaavnHomes.tsx now opens straight here. This page itself is
   stripped back to Jamie's brief: the new still wallpaper, no wordmark, no
   LED accents, and a permanent menu rail on the left rather than a burger
   and a centred dropdown. The message protocol to the parent app (ATRIUM /
   HaavnHomes.tsx) is unchanged: display, feasibility, capital, crm, return,
   logout — so nothing on the React side needed to change.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{--ink:#f2f1ee;--ink2:#b9bcc1;--ink3:#7c7f85;--line:rgba(255,255,255,.16);--live:#8fd6a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050506;color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── the ground: one still image, no motion, no shader ── */
#stage{position:fixed;inset:0;background:#050506}
#stage picture,#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#stage .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,3,4,.30) 0%,rgba(3,3,4,.10) 30%,rgba(3,3,4,.20) 62%,rgba(3,3,4,.55) 100%)}
#stage .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 42%,transparent 46%,rgba(0,0,0,.45) 100%)}

/* ── the rail: fixed to the left, always present ── */
.rail{position:fixed;top:0;left:0;bottom:0;z-index:200;width:min(238px,74vw);
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:0 clamp(20px,3vw,30px);
  background:linear-gradient(90deg,rgba(3,3,4,.62) 0%,rgba(3,3,4,.34) 68%,transparent 100%)}
.rail .eyebrow{font-size:8.5px;letter-spacing:.4em;color:var(--ink3);text-transform:uppercase;margin-bottom:18px;padding-left:2px}
.railrow{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;
  padding:14px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;
  font-family:inherit;color:var(--ink2);text-align:left;transition:.25s}
.rail>.railrow:last-of-type{border-bottom:1px solid var(--line)}
.railrow .t{font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.railrow .g{color:var(--ink3);font-size:11px;transition:transform .25s}
.railrow:hover{color:#fff;padding-left:6px}
.railrow:hover .g{transform:translateX(3px);color:var(--ink)}
.railrow.gold{color:#d6b36a}
.railrow.gold:hover{color:#f0dcae}
.railrow.logout{margin-top:22px;color:var(--ink3);font-size:9.5px;letter-spacing:.3em;justify-content:center;border-top:1px solid var(--line);border-bottom:0}
.railrow.logout:hover{color:#e6987f;padding-left:0}
@media(max-width:640px){
  .rail{width:100vw;padding:0 26px;background:linear-gradient(180deg,rgba(3,3,4,.72),rgba(3,3,4,.5) 60%,rgba(3,3,4,.72))}
}

/* ── the corner: minimal, no wordmark — just what the page is ── */
.corner{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:22px;z-index:150;
  font-size:8.5px;letter-spacing:.36em;color:var(--ink3);text-transform:uppercase;text-align:right}
@media(max-width:640px){.corner{display:none}}

/* ── footer: live clock and the essentials only ── */
footer{position:fixed;left:0;right:0;bottom:0;z-index:150;padding:0 clamp(16px,3vw,28px) calc(14px + env(safe-area-inset-bottom,0px));
  padding-top:14px}
footer .hair{height:1px;background:linear-gradient(90deg,transparent,var(--line) 14%,var(--line) 86%,transparent)}
.frail{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding-top:12px;flex-wrap:wrap}
.frail .fc{display:flex;align-items:center;gap:10px}
.dot-live{width:5px;height:5px;border-radius:50%;background:var(--live);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,214,168,.55)}100%{box-shadow:0 0 0 9px rgba(143,214,168,0)}}
.frail .live{font-size:9px;letter-spacing:.3em;color:var(--live)}
.frail .clock{font-size:11px;letter-spacing:.16em;color:#d5d8dd;font-variant-numeric:tabular-nums}
.frail .zone{font-size:8.5px;letter-spacing:.26em;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:2px;border:1px solid var(--line);
  color:var(--ink2);text-decoration:none;font-size:9px;letter-spacing:.2em;text-transform:uppercase;transition:.3s;background:none;cursor:pointer}
.chip:hover{border-color:rgba(255,255,255,.5);color:#fff}
.chip .ring{width:6px;height:6px;border:1px solid rgba(255,255,255,.4);border-radius:50%}
@media(max-width:640px){.frail{justify-content:center}.chip{padding:7px 11px;font-size:8.5px;letter-spacing:.16em}}

/* ── Partners password gate — unchanged behaviour, restyled to match ── */
.pw-scrim{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center}
.pw-scrim.on{display:flex}
.pw-card{width:min(372px,92vw);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:14px;padding:26px 24px;text-align:center}
.pw-brand{font-weight:600;font-size:15px;letter-spacing:.2em;color:#fff}
.pw-t{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:#8f959c;margin-top:9px}
.pw-card input{width:100%;margin-top:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:9px;
  padding:12px 14px;color:#fff;font-family:inherit;font-size:12px;letter-spacing:.08em;outline:none}
.pw-card input:focus{border-color:rgba(214,179,106,.55);box-shadow:0 0 0 3px rgba(214,179,106,.12)}
.pw-err{min-height:13px;margin-top:10px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#e6987f}
.pw-row{display:flex;gap:10px;margin-top:16px}
.pw-cancel,.pw-go{flex:1;font-family:inherit;font-size:10px;letter-spacing:.24em;text-transform:uppercase;padding:11px;border-radius:9px;cursor:pointer;transition:.3s}
.pw-cancel{background:none;border:1px solid rgba(255,255,255,.16);color:#9aa0a6}
.pw-cancel:hover{border-color:rgba(255,255,255,.3);color:#fff}
.pw-go{background:linear-gradient(180deg,rgba(214,179,106,.22),rgba(214,179,106,.06));border:1px solid rgba(214,179,106,.55);color:#f6ecd2}
.pw-go:hover{border-color:rgba(214,179,106,.85)}
</style>
</head>
<body>

<div id="stage">
  <picture>
    <source media="(max-width:640px)" srcset="/haavn-black-wallpaper-sm.jpg">
    <source media="(max-width:1400px)" srcset="/haavn-black-wallpaper-md.jpg">
    <img src="/haavn-black-wallpaper.jpg" alt="">
  </picture>
  <div class="dim"></div>
  <div class="vignette"></div>
</div>

<div class="corner">HAAVN BLACK<br>Feasibility Studio</div>

<nav class="rail" aria-label="HAAVN BLACK menu">
  <div class="eyebrow">Menu</div>
  <button class="railrow" id="mDisplay"><span class="t">Black Display</span><span class="g">&#8594;</span></button>
  <button class="railrow" id="mFeas"><span class="t">Black Feasibility</span><span class="g">&#8594;</span></button>
  <button class="railrow" id="mPartners"><span class="t">Partners</span><span class="g">&#8594;</span></button>
  <button class="railrow" id="mSeven"><span class="t">7EVEN</span><span class="g">&#8594;</span></button>
  <button class="railrow gold" id="mEnterprise"><span class="t">Enterprise</span><span class="g">&#8594;</span></button>
  <button class="railrow logout" id="mLogout">Log Out</button>
</nav>

<footer>
  <div class="hair"></div>
  <div class="frail">
    <div class="fc"><span class="dot-live"></span><span class="live">LIVE</span>
      <span class="clock" id="clock">--:--:--</span><span class="zone" id="zone">MELBOURNE</span></div>
    <a class="chip" href="https://7even.au" target="_blank" rel="noopener">7EVEN.AU</a>
    <a class="chip" href="https://haavn.au" target="_blank" rel="noopener">HAAVN.AU</a>
    <button class="chip" id="btnUpdate"><span class="ring"></span> UPDATE</button>
  </div>
</footer>

<div class="pw-scrim" id="pwScrim"><div class="pw-card">
  <div class="pw-brand">HAAVN BLACK</div>
  <div class="pw-t">Partners &middot; Shareholder Access</div>
  <input id="pwInput" type="password" placeholder="Access password" autocomplete="off" spellcheck="false">
  <div class="pw-err" id="pwErr"></div>
  <div class="pw-row"><button class="pw-cancel" id="pwCancel">Cancel</button><button class="pw-go" id="pwGo">Enter &#8594;</button></div>
</div></div>

<script>
(function(){
  var c=document.getElementById('clock'), z=document.getElementById('zone');
  function tick(){
    var n=new Date();
    c.textContent=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n);
    z.textContent=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',day:'2-digit',month:'short'}).format(n).toUpperCase()+' · MELBOURNE';
  }
  tick(); setInterval(tick,1000);
})();

document.getElementById('btnUpdate').addEventListener('click',function(){
  var b=this;b.style.opacity=.5;b.innerHTML='<span class="ring"></span> SYNCING';
  setTimeout(function(){b.style.opacity=1;b.innerHTML='<span class="ring"></span> UPDATED';
    setTimeout(function(){b.innerHTML='<span class="ring"></span> UPDATE';},1800);},900);
});

/* Wire the rail to the ATRIUM app (postMessage to parent). Same protocol as
   before, so HaavnHomes.tsx needed no change: display, feasibility, capital
   (Enterprise), return (7EVEN), logout, crm (Partners, behind the gate). */
(function(){
  function post(m){try{parent.postMessage({haavnBlack:m},'*');}catch(e){}}
  function wire(id,m){var el=document.getElementById(id);if(el)el.addEventListener('click',function(e){e.preventDefault();post(m);});}
  wire('mSeven','return');
  wire('mDisplay','display');
  wire('mFeas','feasibility');
  wire('mEnterprise','capital');
  wire('mLogout','logout');

  /* PARTNERS — shareholder-only password gate → management/CRM */
  var scrim=document.getElementById('pwScrim'),inp=document.getElementById('pwInput'),err=document.getElementById('pwErr');
  var b=document.getElementById('mPartners');
  function openGate(){
    try{if(sessionStorage.getItem('haavn_partners')==='1'){post('crm');return;}}catch(e){}
    if(err)err.textContent='';if(inp)inp.value='';scrim.classList.add('on');setTimeout(function(){if(inp)inp.focus();},50);
  }
  function closeGate(){scrim.classList.remove('on');}
  function submitGate(){
    if(inp.value==='HaavnBlack!!!'){try{sessionStorage.setItem('haavn_partners','1');}catch(e){}closeGate();post('crm');}
    else{if(err)err.textContent='Access denied';inp.value='';}
  }
  if(b)b.addEventListener('click',function(e){e.preventDefault();openGate();});
  var go=document.getElementById('pwGo'),cx=document.getElementById('pwCancel');
  if(go)go.onclick=submitGate; if(cx)cx.onclick=closeGate;
  if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')submitGate();else if(e.key==='Escape')closeGate();});
  if(scrim)scrim.addEventListener('click',function(e){if(e.target===scrim)closeGate();});

  /* external links open outside the app frame */
  document.querySelectorAll('a[href^="https://7even"],a[href^="https://haavn"]').forEach(function(a){a.target='_blank';a.rel='noopener';});
})();
</script>
</body>
</html>
