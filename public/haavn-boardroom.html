<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATRIUM — Weekly Company Meeting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#ECE8DE;--paper:#F4F1E9;--card:#FBFAF6;--ink:#1A1714;--ink2:#403A32;--ink3:#736E62;
  --line:#D6D0C2;--line2:#C4BDAB;--gold:#9A7526;--goldl:#C39A46;
  --char:#17150F;--char2:#211E17;--charline:#332F26;
  --green:#3C6E47;--greenbg:#E4EBE0;--amber:#9A6B1F;--amberbg:#F3E9D4;--red:#8A3A2E;--redbg:#F1E0DA;--blue:#2A4C6B;--bluebg:#E1E8EE;
  --sh:0 1px 2px rgba(26,23,20,.05),0 8px 24px rgba(26,23,20,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html,body{overscroll-behavior:none;-webkit-overflow-scrolling:touch}
body{font-family:Inter,system-ui,sans-serif;background:var(--bone);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace}
/* chrome */
.topbar{height:56px;background:var(--char);color:#E9E5DB;display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40;border-bottom:1px solid #000}
.brand svg{height:18px;display:block}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;color:#75715F;font-weight:600;padding-left:13px;border-left:1px solid var(--charline)}
.hubback{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#B9B3A5;background:#0C0B08;border:1px solid var(--charline);padding:6px 12px;border-radius:20px;font-weight:600;white-space:nowrap}
.hubback:hover{color:#fff;border-color:#4a463a}
.savepill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:#B9B3A5;background:#0C0B08;border:1px solid var(--charline);padding:5px 11px;border-radius:20px;white-space:nowrap}
.savepill .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.savepill.saving .dot{background:var(--goldl);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.tabsbar{background:var(--char);padding:0 24px;display:flex;gap:2px;position:sticky;top:56px;z-index:39;border-bottom:1px solid #000;overflow-x:auto}
.tabsbar button{padding:12px 15px;font-size:12.5px;font-weight:600;color:#8C8578;border-bottom:2px solid transparent;white-space:nowrap}
.tabsbar button.on{color:#fff;border-bottom-color:var(--goldl)}
.tabsbar .tct{font-family:'IBM Plex Mono',monospace;font-size:10px;background:#000;color:#B9B3A5;padding:0 6px;border-radius:20px;margin-left:5px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 70px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;font-weight:600}
h1.title{font-size:27px;font-weight:800;letter-spacing:-.025em;margin-top:5px}
.lede{color:var(--ink3);font-size:13px;margin-top:5px;max-width:680px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.flexwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line2);color:var(--ink);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--ink3);background:#fff}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.pri:hover{background:#000}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.gold:hover{background:#87651f}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.danger{color:var(--red)}.btn.danger:hover{background:var(--redbg);border-color:var(--red)}
/* meeting header */
.mhead{background:var(--char);color:var(--paper);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.mhead .mtop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.mhead .mt-when{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--goldl)}
.mhead h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.mhead .msub{font-size:12px;color:#A39C8C;margin-top:4px}
.mhead input,.mhead select{background:var(--char2);border:1px solid var(--charline);border-radius:7px;padding:6px 9px;color:#fff;font-size:12.5px}
.mstat{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--charline)}
.mstat .st .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mstat .st .l{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:#8C8578;text-transform:uppercase;margin-top:2px}
.att{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.attchip{display:inline-flex;align-items:center;gap:7px;background:var(--char2);border:1px solid var(--charline);border-radius:20px;padding:5px 8px 5px 11px;font-size:12px;cursor:pointer;transition:.12s}
.attchip .ad{width:8px;height:8px;border-radius:50%;background:var(--green)}
.attchip.away{opacity:.5}.attchip.away .ad{background:var(--ink3)}
.attchip .x{color:#8C8578;font-size:14px;line-height:1}.attchip .x:hover{color:var(--red)}
.addatt{background:transparent;border:1px dashed var(--charline);border-radius:20px;padding:5px 12px;font-size:12px;color:#A39C8C}
/* department panels */
.dept{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.dept-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dept-h .dbar{width:5px;height:34px;border-radius:4px;flex:none}
.dept-h .dn{font-size:16px;font-weight:800;letter-spacing:-.015em}
.dept-h .ds{font-size:11.5px;color:var(--ink3)}
.dept-h .dlead{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3)}
.dept-b{padding:12px 16px}
.item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;transition:.12s}
.item.done{background:var(--paper);opacity:.85}
.item-row{display:flex;align-items:center;gap:11px;padding:10px 13px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;cursor:pointer;transition:.12s}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.item .ti{flex:1;border:none;background:transparent;font-size:13.5px;font-weight:600;padding:3px 2px;min-width:0}
.item.done .ti{text-decoration:line-through;color:var(--ink3)}
.item .ti:focus{outline:none;background:var(--bone);border-radius:5px}
.typesel,.ownsel,.statsel{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:11.5px;background:#fff}
.typepill{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.typepill.update{background:var(--bluebg);color:var(--blue)}
.typepill.request{background:var(--amberbg);color:var(--amber)}
.typepill.event{background:#EAE3F0;color:#6A4E86}
.typepill.decision{background:var(--greenbg);color:var(--green)}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3);background:#fff;flex:none}
.iconbtn:hover{border-color:var(--ink3);color:var(--ink)}
.item-exp{padding:0 13px 13px 44px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.item-exp textarea{flex:1;min-width:220px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;resize:vertical;min-height:40px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
/* 5-state colour system */
.pill.update{background:var(--bluebg);color:var(--blue)}
.pill.action{background:var(--greenbg);color:var(--green)}
.pill.followup{background:var(--amberbg);color:var(--amber)}
.pill.trouble{background:var(--redbg);color:var(--red)}
.pill.complete{background:#EAE3F0;color:#6A4E86}
/* subtle left accent per state on the item card */
.item.st-update{box-shadow:inset 3px 0 0 var(--blue)}
.item.st-action{box-shadow:inset 3px 0 0 var(--green)}
.item.st-followup{box-shadow:inset 3px 0 0 var(--amber)}
.item.st-trouble{box-shadow:inset 3px 0 0 var(--red)}
.item.st-complete{box-shadow:inset 3px 0 0 #6A4E86}
/* kind tag (Request/Event/Action) */
.kindtag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--ink3);background:var(--paper)}
.kindtag.request{border-color:#C9A24688;color:#8A6516}
.kindtag.event{border-color:#6A4E8688;color:#6A4E86}
.kindtag.action{border-color:#3C6E4788;color:#2E5D46}
/* assignee badge */
.who{display:inline-flex;align-items:center;gap:6px;flex:none;max-width:150px}
.who .wav{width:22px;height:22px;border-radius:50%;background:var(--char);color:#F4F2ED;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-family:'IBM Plex Mono',monospace}
.who .wn{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duetag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);background:var(--bone);border-radius:6px;padding:3px 7px;flex:none}
/* item-exp labels */
.item-exp .xl{display:flex;flex-direction:column;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.item-exp .xl select,.item-exp .xl input{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12.5px;background:#fff;color:var(--ink);text-transform:none;letter-spacing:0}
/* attendee modal */
.modal{position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;background:rgba(23,21,15,.4);opacity:0;transition:opacity .2s}
.modal.in{opacity:1}
.modal-card{background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 60px rgba(26,23,20,.35);padding:24px 26px;width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px}
.modal-card .xl{display:flex;flex-direction:column;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.modal-card .xl input{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:13.5px;background:#fff;color:var(--ink);text-transform:none;letter-spacing:0}
.modal-card .xl input:focus{outline:none;border-color:var(--gold)}
/* clickable task rows + toast */
.item-row{cursor:pointer}
.item .ti{cursor:text}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--char);color:#F4F2ED;padding:12px 20px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);font-size:13px;font-weight:600;z-index:1200;opacity:0;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
.toast.in{opacity:1;transform:translateX(-50%) translateY(0)}
/* site footer — mirrors the app's SiteLinks (visit links + Update) */
.site-footer{background:var(--char);color:#B9B3A5;padding:22px 24px calc(20px + env(safe-area-inset-bottom));border-top:1px solid #000;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center}
.sf-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}
.sf-brand{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.28em;color:#F4F2ED}
.sf-sep{color:#4a463a}
.sf-visit{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;color:#75715F}
.sf-pill{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;font-weight:600;text-transform:uppercase;color:#D8D2C4;background:rgba(255,255,255,.06);border:1px solid var(--charline);border-radius:20px;padding:6px 13px;text-decoration:none;cursor:pointer;transition:.13s}
.sf-pill:hover{background:rgba(255,255,255,.13);color:#fff;border-color:#4a463a}
.sf-copy{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:#5c5849;text-transform:uppercase}
.minutes{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.minutes textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:11px 13px;background:#fff;resize:vertical;min-height:90px;font-size:13px;line-height:1.55}
/* tables */
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:14px;font-weight:800}
table{width:100%;border-collapse:collapse}
th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-weight:600;background:var(--bone)}
td{padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.cin{width:100%;border:1px solid transparent;border-radius:6px;padding:6px 7px;background:transparent;font-size:13px}
.cin:hover{border-color:var(--line)}.cin:focus{outline:none;border-color:var(--gold);background:#fff}
.datec{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:12px;font-family:'IBM Plex Mono',monospace;background:#fff}
.selc{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:12px;background:#fff}
.deptdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.empty{text-align:center;padding:34px;color:var(--ink3)}
.empty .ei{font-size:24px;opacity:.4}
.arch{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:9px;cursor:pointer;transition:.12s}
.arch:hover{border-color:var(--ink3)}
.arch .ad{font-size:20px;font-weight:800;letter-spacing:-.02em;width:64px}
.arch .amo{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold)}
@media(max-width:820px){.item-row{flex-wrap:wrap}.mstat{gap:16px}}
/* celebration / party overlay when an agenda point is ticked */
.celebrate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(23,21,15,.34);opacity:0;transition:opacity .28s}
.celebrate.in{opacity:1}.celebrate.out{opacity:0}
.confetti-c{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.celeb-card{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 24px 60px rgba(26,23,20,.32);padding:30px 40px 26px;text-align:center;max-width:calc(100vw - 40px);transform:scale(.88) translateY(10px);transition:transform .34s cubic-bezier(.2,.9,.3,1.35)}
.celebrate.in .celeb-card{transform:scale(1) translateY(0)}
.celeb-emoji{font-size:54px;line-height:1;animation:celebpop .55s ease both}
@keyframes celebpop{0%{transform:scale(0) rotate(-18deg)}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.celeb-title{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:10px;color:var(--ink)}
.celeb-sub{font-size:13px;color:var(--ink3);margin-top:7px;max-width:360px;margin-left:auto;margin-right:auto}
.celeb-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
@media print{
  .topbar,.tabsbar,.savepill,.addatt,.iconbtn,.btn,.chk,.attchip .x,.site-footer{display:none!important}
  body{background:#fff}.wrap{padding:0}.mhead{background:#fff;color:#000;border:1px solid #ccc}
  .mhead .mt-when,.mhead h2,.mhead .msub,.mstat .st .v{color:#000}.dept,.panel,.item{box-shadow:none}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="hubback" id="hubBack" title="Back to Management Hub" onclick="if(window.parent&&window.parent!==window){window.parent.postMessage('haavn-agenda-close','*');return false;}">← Hub</button>
  <span class="brand" style="display:flex;align-items:center;gap:9px"><svg width="18" height="17" viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg" style="display:block"><path d="M12 1.6 L22.6 20.4 L1.4 20.4 Z" fill="none" stroke="#F4F2ED" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.4 20.4 L12 7.6 L16.6 20.4" fill="none" stroke="#F4F2ED" stroke-width="1.4" stroke-linejoin="round"/></svg><span style="font-size:15px;font-weight:700;letter-spacing:.34em;color:#F4F2ED;padding-right:2px">ATRIUM</span></span>
  <span class="tag">WEEKLY COMPANY MEETING</span>
  <div class="savepill" id="savePill"><span class="dot"></span><span id="saveTxt">Saved</span></div>
</div>
<div class="tabsbar" id="tabsbar"></div>
<div class="wrap" id="view"></div>
<footer class="site-footer">
  <div class="sf-row">
    <span class="sf-brand"><svg width="13" height="12" viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg"><path d="M12 1.6 L22.6 20.4 L1.4 20.4 Z" fill="none" stroke="#F4F2ED" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 20.4 L12 7.6 L16.6 20.4" fill="none" stroke="#F4F2ED" stroke-width="1.6" stroke-linejoin="round"/></svg>ATRIUM</span>
    <span class="sf-sep">|</span><span class="sf-visit">VISIT US</span>
    <a class="sf-pill" href="https://7even.au" target="_blank" rel="noopener">7EVEN.AU ↗</a>
    <a class="sf-pill" href="https://haavn.au" target="_blank" rel="noopener">HAAVN.AU ↗</a>
    <button class="sf-pill" data-act="siteUpdate">⟳ Update</button>
  </div>
  <div class="sf-copy">Design &amp; interface © 2026 JB Design × Studio · All rights reserved</div>
</footer>

<script>
/* ==================================================================
   7EVEN · HAAVN — Weekly Group Boardroom Agenda
   Live single-file app · localStorage autosave · Mondays 08:30
   ================================================================== */
const DEPTS=[
  {id:'company',name:'Company',sub:'Group-wide · Strategy & Priorities',lead:'Jamie Baldwin',color:'#4A5568'},
  {id:'7even',name:'7EVEN',sub:'Group · Strategy & Platform',lead:'Daniel Sette',color:'#2A4C6B'},
  {id:'haavn',name:'HAAVN',sub:'Homes · Sales & Product',lead:'James Winstanley',color:'#2E5D46'},
  {id:'mgmt',name:'HAAVN Management',sub:'Development & Construction',lead:'John Dimmatina',color:'#9A7526'},
  {id:'admin',name:'Administration & Accounts',sub:'Finance & Operations',lead:'Dom Ma / Amy Baldwin',color:'#7A5B8E'},
];
const dept=id=>DEPTS.find(d=>d.id===id);
/* item STATUS = colour-coded state (Asana-style working tool) */
const ISTATUS=['update','action','followup','trouble','complete'];
const IS_LABEL={update:'Update',action:'Action',followup:'Follow-up',trouble:'In trouble',complete:'Complete'};
/* KIND = which register roll-up an item feeds (built into the item itself) */
const KINDS=['','request','event','action'];
const KIND_LABEL={'':'— none —',request:'Request',event:'Event',action:'Action'};
const KIND_TABS={requests:'request',events:'event',actions:'action'};
/* migrate legacy values → new model */
const STATUS_MAP={open:'action',prog:'followup',done:'complete',block:'trouble',update:'update',action:'action',followup:'followup',trouble:'trouble',complete:'complete'};
const TYPES=['update','request','event','decision'];
const TYPE_LABEL={update:'Update',request:'Request',event:'Event',decision:'Decision'};

/* ---- date helpers ---- */
function ymd(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function upcomingMonday(){const d=new Date();const day=d.getDay();const add=(1-day+7)%7;const m=new Date(d);m.setDate(d.getDate()+add);return ymd(m);}
function fmtLong(iso){if(!iso)return '—';const d=new Date(iso+'T00:00');return d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtShort(iso){if(!iso)return '—';const d=new Date(iso+'T00:00');return isNaN(d)?iso:d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'});}

/* ---- migrate legacy data → new item-centric model (idempotent, non-destructive) ---- */
function migrateItem(i){
  if(ISTATUS.indexOf(i.status)<0) i.status=STATUS_MAP[i.status]||'action';
  if(i.kind===undefined){var t=i.type; i.kind=(t==='request'?'request':t==='event'?'event':t==='decision'?'action':''); if(t==='update'&&i.status==='action')i.status='update';}
  if(i.assigneeId===undefined)i.assigneeId='';
  if(i.due===undefined)i.due='';
  if(i.owner===undefined)i.owner='';
  if(i.discussed&&i.status!=='complete')i.status='complete';
}
function migrateAll(){
  if(!DB)return;
  (DB.meetings||[]).forEach(function(m){
    (m.attendees||[]).forEach(function(a){if(a.email===undefined)a.email='';if(a.role===undefined)a.role='';});
    (m.items||[]).forEach(migrateItem);
  });
  if(!DB.registersMerged){
    var m=DB.meetings.find(function(x){return x.id===DB.currentId;});
    if(m){
      var seen={};(m.items||[]).forEach(function(it){var k=(it.title||'').trim().toLowerCase();if(k)seen[k]=true;});
      function pushUnique(o){var k=(o.title||'').trim().toLowerCase();if(k&&seen[k])return;if(k)seen[k]=true;m.items.push(newItem(o));}
      (DB.requests||[]).forEach(function(r){pushUnique({dept:r.dept||'company',status:(r.status==='Actioned'||r.status==='Approved')?'complete':(r.status==='On hold')?'followup':(r.status==='Declined')?'trouble':'action',title:r.title||'',kind:'request',owner:r.owner||'',due:r.due||'',notes:r.detail||''});});
      (DB.events||[]).forEach(function(e){pushUnique({dept:e.dept||'company',status:(e.status==='Done')?'complete':(e.status==='Confirmed')?'action':'update',title:e.title||'',kind:'event',owner:e.owner||'',due:e.date||'',notes:e.detail||''});});
      (DB.actions||[]).forEach(function(a){pushUnique({dept:a.dept||'company',status:(a.status==='Done')?'complete':(a.status==='In progress')?'followup':'action',title:a.title||'',kind:'action',owner:a.owner||'',due:a.due||'',notes:''});});
    }
    DB.registersMerged=true;
  }
}

/* ---------------- CLOUD SYNC (Supabase capital_kv) -----------------
   Shared weekly boardroom agenda — every staff device sees the same live
   document. The whole DB blob is mirrored under one key: pull on boot (adopt if
   present, else keep local and seed), debounced push on every save, and an 8s
   poll for other people's edits. Degrades to localStorage-only if unreachable. */
const SUPA_URL='https://vgvavmnqrdgcnledztyk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZndmF2bW5xcmRnY25sZWR6dHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzIwODEsImV4cCI6MjA5OTU0ODA4MX0.hiWSzfEMXPJGs67iqiuB3hwJVxUO51uu2rygmA5wO10';
const CLOUD_KEY=(location.search.indexOf('preview')>=0||location.hash.indexOf('preview')>=0)?'haavn_boardroom_preview':'haavn_boardroom';
const SUPA_H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
let _cloudOk=false,_cloudTs=0,_cpushT=null;
function _bmTyping(){const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);}
async function cloudPull(){
  try{const r=await fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+CLOUD_KEY+'&select=value,updated_at',{headers:SUPA_H});
    if(!r.ok)return null;_cloudOk=true;const rows=await r.json();return (rows&&rows.length)?rows[0]:null;}catch(e){return null;}
}
function cloudPush(){
  if(!_cloudOk)return;clearTimeout(_cpushT);
  _cpushT=setTimeout(async()=>{
    try{const body=[{key:CLOUD_KEY,value:DB,updated_at:new Date().toISOString()}];
      const r=await fetch(SUPA_URL+'/rest/v1/capital_kv',{method:'POST',headers:Object.assign({},SUPA_H,{Prefer:'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(body)});
      if(r.ok){const rows=await r.json();if(rows&&rows[0])_cloudTs=Date.parse(rows[0].updated_at)||Date.now();}
    }catch(e){}
  },700);
}
function adoptCloud(value){DB=value;try{const ids=collectIds(DB);_uid=(ids.length?Math.max(...ids):0)+1;}catch(e){}migrateAll();try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
async function cloudPoll(){
  if(!_cloudOk||_bmTyping())return;
  try{const r=await fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+CLOUD_KEY+'&select=updated_at',{headers:SUPA_H});
    if(!r.ok)return;const rows=await r.json();if(!rows||!rows.length)return;
    const ts=Date.parse(rows[0].updated_at)||0;
    if(ts>_cloudTs){const row=await cloudPull();if(!row||!row.value)return;_cloudTs=ts;adoptCloud(row.value);render();}
  }catch(e){}
}

function set(o,p,v){const ks=p.split('.');const last=ks.pop();let t=o;ks.forEach(k=>t=t[k]);t[last]=v;}

function fireConfetti(canvas,big){
  if(!canvas)return;const ctx=canvas.getContext('2d');const DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=canvas.clientWidth*DPR;canvas.height=canvas.clientHeight*DPR;
  const colors=['#C39A46','#3C6E47','#2A4C6B','#9A7526','#8A3A2E','#6A4E86','#EACB78','#4A5568'];
  const N=big?200:130,parts=[],cx=canvas.width/2,cy=canvas.height*0.42;
  for(let i=0;i<N;i++){const ang=Math.random()*Math.PI*2,sp=(4+Math.random()*9)*DPR;
    parts.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-6*DPR,w:(6+Math.random()*7)*DPR,h:(9+Math.random()*9)*DPR,col:colors[i%colors.length],rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4});}
  const g=0.3*DPR;let t0=null;
  function frame(ts){if(t0==null)t0=ts;const el=ts-t0;ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{p.vy+=g;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-el/4200);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(el<4200)requestAnimationFrame(frame);else ctx.clearRect(0,0,canvas.width,canvas.height);}
  requestAnimationFrame(frame);
}

function meetingText(m){
  const L=[];
  L.push('7EVEN · HAAVN — WEEKLY GROUP BOARDROOM');
  L.push(fmtLong(m.date)+'  ·  '+m.time);
  L.push('Chair: '+m.chair);
  L.push('Present: '+(m.attendees.filter(a=>a.present).map(a=>a.name).join(', ')||'—'));
  L.push('');
  DEPTS.forEach(d=>{const items=m.items.filter(i=>i.dept===d.id);if(!items.length)return;
    L.push('── '+d.name.toUpperCase()+'   (Lead: '+d.lead+')');
    items.forEach(i=>{var a=i.assigneeId?m.attendees.find(p=>''+p.id===''+i.assigneeId):null;var who=a?a.name:(i.owner||'');
      L.push('  '+(i.status==='complete'?'[x]':'[ ]')+' ['+IS_LABEL[i.status]+'] '+(i.title||'')+(i.kind?' ('+KIND_LABEL[i.kind]+')':'')+(who?' — '+who:'')+(i.due?' · due '+i.due:''));
      if(i.notes)L.push('        '+i.notes);});
    L.push('');});
  if(m.minutes){L.push('MINUTES & GENERAL NOTES');L.push(m.minutes);L.push('');}
  const open=m.items.filter(i=>i.status==='action'||i.status==='followup'||i.status==='trouble');
  if(open.length){L.push('OPEN TASKS');open.forEach(i=>{var a=i.assigneeId?m.attendees.find(p=>''+p.id===''+i.assigneeId):null;L.push('  · '+(i.title||'')+' — '+IS_LABEL[i.status]+(a?' · '+a.name:'')+(i.due?' · due '+i.due:''));});L.push('');}
  return L.join('\n');
}

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));}else fallbackCopy(txt,done);}

function emailItem(id){

  if(!a){alert('Assign this item to an attendee first (open ⋯ → Assign to).');return;}

  const m=cur();const subj='['+(it.kind?KIND_LABEL[it.kind]:'Agenda')+'] '+(it.title||'Action from the boardroom');
  const body='Hi '+(a.name.split(' ')[0])+',\n\nFrom the weekly boardroom ('+fmtLong(m.date)+') you have been assigned:\n\n• '+(it.title||'')+'\n  Status: '+IS_LABEL[it.status]+(it.due?'\n  Due: '+fmtLong(it.due):'')+(it.notes?'\n  Notes: '+it.notes:'')+'\n\n— 7EVEN · HAAVN boardroom (boardroom@7even.au)\n';
  window.location.href='mailto:'+encodeURIComponent(a.email)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);

function assignmentGroups(){const m=cur();const g={};m.items.forEach(function(it){if(it.assigneeId){(g[it.assigneeId]=g[it.assigneeId]||[]).push(it);}});return Object.keys(g).map(function(k){return {a:attById(k),items:g[k]};}).filter(function(x){return x.a;});}
async function emailAssign(){
  const m=cur();const people=assignmentGroups();
  if(!people.length){alert('No items are assigned yet. Open an item (⋯) → Assign to, then try again.');return;}
  const payload={meeting:fmtLong(m.date),from:'boardroom@7even.au',assignments:people.map(function(g){return {name:g.a.name,email:g.a.email,items:g.items.map(function(it){return {title:it.title,status:IS_LABEL[it.status],due:it.due,notes:it.notes,kind:it.kind};})};})};
  try{
    const r=await fetch('/api/send-assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.ok){const j=await r.json().catch(function(){return null;});if(j&&typeof j.sent!=='undefined'){alert('✓ Assignments emailed from boardroom@7even.au — '+j.sent+' sent');return;}}
    if(r.status!==404&&r.status!==501&&!r.ok){throw new Error('HTTP '+r.status);}
  }catch(e){/* backend not deployed / not configured → fall back to the mail app */}
  const to=people.map(function(g){return g.a.email;}).filter(Boolean).join(',');
  const subj='Boardroom assignments — '+fmtLong(m.date);
  let body='Assignments from the weekly boardroom ('+fmtLong(m.date)+'):\n\n';
  people.forEach(function(g){body+=g.a.name+(g.a.email?' <'+g.a.email+'>':' (no email)')+':\n';g.items.forEach(function(it){body+='  • '+(it.title||'')+' — '+IS_LABEL[it.status]+(it.due?' (due '+it.due+')':'')+'\n';});body+='\n';});
  body+='(Auto-send from boardroom@7even.au activates once the M365 mail credentials are added — send this from the boardroom@7even.au account for now.)\n';
  window.location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}

/* inline binding: kinds m(meeting) i(item) r a e(registers) */
function applyBind(el){
  const b=el.dataset.bind;if(!b)return;const parts=b.split(':');const kind=parts[0];
  let obj,path;
  if(kind==='m'){obj=cur();path=parts.slice(1).join(':');}
  else{const id=+parts[1];path=parts.slice(2).join(':');
    if(kind==='i')obj=cur().items.find(x=>x.id===id);
    else if(kind==='r')obj=DB.requests.find(x=>x.id===id);
    else if(kind==='e')obj=DB.events.find(x=>x.id===id);
    else if(kind==='a')obj=DB.actions.find(x=>x.id===id);}
  if(!obj)return;let v=el.value;if(path==='assigneeId')v=v?(+v):'';set(obj,path,v);save();
}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.bind&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.type!=='date')applyBind(el);});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;applyBind(el);
  if(el.tagName==='SELECT'||el.type==='date'){render();}});
