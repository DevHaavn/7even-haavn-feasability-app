<style>
/* HAAVN BLACK sales pipeline. Same tokens, same components and same look as ATRIUM Workflow (atrium-workflow.html), so it sits inside it without a seam.
   It is linked to atrium-language.css and atrium-workflow-look.css below, which restyle the shared class names (.btn .card .stagechip .tablewrap .chip). */
:root{
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --gold:#d6b36a; --gold-hi:#e6d3a3; --gold-deep:#b89a5e;
  --at-blue:#9db8e8;--at-lilac:#c0a9e4;--at-peach:#f0bf9a;--at-green:#a9d4b5;--at-pink:#eeb0c4;--at-grey:#b4bac4;--at-yellow:#e8d594;--at-teal:#9fd3d0;
  --green:#a9d4b5; --blue:#9db8e8; --red:#f0a39b; --purple:#c0a9e4; --orange:#f0bf9a;
  --green-t:color-mix(in srgb,var(--green) 45%,var(--ink));--blue-t:color-mix(in srgb,var(--blue) 45%,var(--ink));--red-t:color-mix(in srgb,var(--red) 45%,var(--ink));--purple-t:color-mix(in srgb,var(--purple) 45%,var(--ink));
}
[data-theme="dark"]{
  --bg0:#0B0D0F; --bg1:#101216; --ink:#F3F2EE; --ink-2:#b7b9bf; --ink-3:#7d818b; --ink-4:#565a63;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.055); --glass:rgba(24,26,32,.62); --pill:rgba(255,255,255,.045);
}
[data-theme="light"]{
  --bg0:#eceae4; --bg1:#f4f2ec; --ink:#1a1b1e; --ink-2:#4a4d54; --ink-3:#83868e; --ink-4:#a7aab1;
  --line:rgba(20,20,25,.10); --line-2:rgba(20,20,25,.06); --glass:rgba(255,255,255,.68); --pill:rgba(20,20,25,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);background:var(--bg0);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;font-weight:300}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
button{font-family:inherit}

.topbar{position:sticky;top:0;z-index:80;background:rgba(236,234,228,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line-2);padding:14px 28px;display:flex;align-items:center;gap:14px}
[data-theme="dark"] .topbar{background:rgba(11,13,15,.86)}
.tb-title{font:300 20px/1 var(--sans);color:var(--ink)}
.tb-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;margin-left:2px;padding-left:14px;border-left:1px solid var(--line)}
.tb-right{margin-left:auto;display:flex;gap:10px;align-items:center}
body.embed .topbar{display:none}
.wrap{max-width:1380px;margin:0 auto;padding:22px 28px 90px}
body.embed .wrap{padding-top:16px}

.btn{border-radius:999px;border:1px solid var(--ink-4);background:var(--pill);color:var(--ink);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.gold{border-color:transparent;color:#1a1b1e;background:#d6b36a;font-weight:600}
.btn.sm{padding:6px 12px;font-size:9.5px}
.btn.red{color:var(--red-t)}
.btn:disabled{opacity:.35;cursor:default}
.btn.lg{padding:13px 22px;font-size:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.grid{display:grid}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
@media(max-width:1100px){.grid6{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.grid6{grid-template-columns:repeat(2,1fr)}}
.stat b{display:block;font:300 30px var(--sans);color:var(--ink)}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.stat small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.section-h{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.section-h h3{font:300 17px var(--sans);color:var(--ink)}
.section-h .spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
tbody tr.click:hover{background:var(--pill);cursor:pointer}
td.tt{color:var(--ink);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--glass)}
.chip{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);display:inline-block;white-space:nowrap}
.chip.gold{color:#1a1b1e;border-color:transparent;background:#d6b36a;font-weight:600}
.chip.green{color:var(--green-t);border-color:color-mix(in srgb,var(--green) 70%,transparent);background:color-mix(in srgb,var(--green) 22%,transparent)}
.chip.red{color:var(--red-t);border-color:color-mix(in srgb,var(--red) 70%,transparent);background:color-mix(in srgb,var(--red) 22%,transparent)}
.chip.blue{color:var(--blue-t);border-color:color-mix(in srgb,var(--blue) 70%,transparent);background:color-mix(in srgb,var(--blue) 22%,transparent)}
.chip.amber{color:#6b4a12;border-color:color-mix(in srgb,var(--gold) 80%,transparent);background:color-mix(in srgb,var(--gold) 26%,transparent)}
[data-theme="dark"] .chip.amber{color:var(--gold-hi)}
.stagestrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.stagechip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center;background:none}
.stagechip .n{font-family:var(--mono);background:var(--pill);border-radius:100px;padding:1px 6px;font-size:9px}
.stagechip.on{border-color:transparent;color:#1a1b1e;background:#d6b36a;font-weight:600}
.seg{display:flex;padding:3px;border-radius:100px;border:1px solid var(--line);background:var(--pill)}
.seg button{border:none;background:transparent;color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:6px 11px;border-radius:100px;cursor:pointer;text-transform:uppercase}
.seg button.on{background:var(--ink);color:var(--bg0)}
input,select,textarea{font-family:var(--sans);background:var(--pill);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 12px;font-size:12.5px;outline:none;width:100%}
input[type=checkbox]{width:auto;flex:none;padding:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formgrid.three{grid-template-columns:1fr 1fr 1fr}
.empty{padding:26px;text-align:center;color:var(--ink-3);font:400 12px var(--mono);letter-spacing:.08em}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:36px 20px;opacity:0;pointer-events:none;transition:.25s;overflow-y:auto}
.modalbg.on{opacity:1;pointer-events:auto}
.modal{width:min(680px,100%);background:var(--bg1);border:1px solid var(--line);border-radius:20px;padding:24px}
.modal h4{font:300 18px var(--sans);color:var(--ink);margin-bottom:6px}
.modal .lead{color:var(--ink-3);font-size:12.5px;margin-bottom:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg0);padding:11px 20px;border-radius:100px;font-size:12.5px;font-weight:500;z-index:400;opacity:0;pointer-events:none;transition:.3s;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.small{font-size:12px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px}.wrapx{flex-wrap:wrap}.sp{flex:1}
.hide{display:none!important}
.banner{margin:0 0 16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;color:var(--ink-2);font-size:12.5px;background:var(--glass)}
.banner b{color:var(--ink);font-weight:500}.banner.warn{border-color:color-mix(in srgb,var(--gold) 70%,transparent)}.banner.bad{border-color:color-mix(in srgb,var(--red) 70%,transparent)}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--pill);border:1px solid var(--line);font:600 9px var(--mono);color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);vertical-align:-3px}
.bar{height:6px;border-radius:4px;background:var(--pill);overflow:hidden}.bar i{display:block;height:100%;background:color-mix(in srgb,var(--ink) 55%,transparent);border-radius:4px}

/* the board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:240px}
.kcol.over{border-color:var(--ink)}
.kcol h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.kcol .sla{font-size:11px;color:var(--ink-3);margin-bottom:10px;min-height:15px}
.kcard{background:var(--pill);border:1px solid var(--line-2);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;font-size:11.5px}
.kcard:hover{border-color:var(--ink-3)}
.kcard.drag{opacity:.4}
.kcard b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px;font-size:13px}
.kcard .m{color:var(--ink-3);font-size:11.5px}
.kcard .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--ink-2)}
.due{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.due.over{color:var(--red-t);font-weight:600}.due.today{color:#8a6a22}[data-theme="dark"] .due.today{color:var(--gold)}.due.ok{color:var(--green-t)}

/* the lead panel */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}#shade.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg1);border-left:1px solid var(--line);z-index:210;transform:translateX(102%);transition:transform .28s ease;overflow-y:auto}
#drawer.on{transform:none}
#drawer .dh{position:sticky;top:0;background:color-mix(in srgb,var(--bg1) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 22px;z-index:2;display:flex;align-items:flex-start;gap:12px}
#drawer .db{padding:18px 22px 70px;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:4px}
.steps button{flex:1;min-width:0;text-align:left;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--pill);color:var(--ink-3);font-size:10.5px;line-height:1.25;cursor:pointer}
.steps button b{display:block;font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.14em;margin-bottom:3px}
.steps button.done{color:var(--ink-2)}.steps button.done b{color:var(--green-t)}
.steps button.cur{background:var(--ink);color:var(--bg0);border-color:var(--ink)}
.next{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--glass)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.chk:last-child{border-bottom:0}
.chk i{flex:0 0 18px;height:18px;border-radius:5px;border:1px solid var(--ink-4);display:grid;place-items:center;font-style:normal;font-size:12px;margin-top:1px}
.chk.on i{background:var(--green);border-color:var(--green);color:#10301a}.chk.on span{text-decoration:line-through;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:116px 1fr;gap:7px 12px;font-size:12.5px;color:var(--ink)}.kv dt{color:var(--ink-3)}
.tl .it{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.tl .it .d{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);padding-top:3px}
.home{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dsteps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:14px 0 4px}
.dsteps div{height:6px;border-radius:3px;background:var(--line)}.dsteps div.d{background:var(--green)}.dsteps div.c{background:var(--ink)}
.dlab{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:9.5px;color:var(--ink-3);line-height:1.25}.dlab span.c{color:var(--ink)}
.cplog .s{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.cplog .s i{flex:0 0 20px;height:20px;border-radius:50%;background:var(--green);color:#10301a;display:grid;place-items:center;font-style:normal;font-size:12px}
.email{background:var(--pill);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.email mark{background:color-mix(in srgb,var(--green) 30%,transparent);color:var(--ink);border-radius:3px;padding:0 3px}
.tog{flex:0 0 auto;width:42px;height:24px;border-radius:12px;background:var(--line);border:1px solid var(--ink-4);position:relative;cursor:pointer}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:.2s}
.tog.on{background:var(--green);border-color:var(--green)}.tog.on::after{left:20px;background:#10301a}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pickchip{padding:5px 11px;border-radius:999px;border:1px solid var(--ink-4);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;background:none}
.pickchip.on{background:var(--ink);color:var(--bg0);border-color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}.filters select{width:auto;min-width:130px}.filters input{width:220px}
.signin{max-width:480px;margin:90px auto;text-align:center}
@media(max-width:860px){.wrap{padding:16px 14px 80px}.formgrid,.formgrid.three{grid-template-columns:1fr}.steps{overflow-x:auto}.steps button{flex:0 0 96px}.kv{grid-template-columns:96px 1fr}.topbar{padding:12px 16px}}
</style>

function api(a,body){
  return fetch('/api/sales',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({a:a},body||{}))}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401){S.error='signin';throw new Error('signin')}
      if(!r.ok)throw new Error(j.error||j.message||'That did not work.');
      if(j.setup===false){S.setup=j.message;throw new Error(j.message)}
      return j;
    });
  });
}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2800)}
function fail(e){if(e&&e.message==='signin')return;toast(e&&e.message?e.message:'That did not work.')}

function load(){
  return api('init').then(function(j){
    S.me=j.me;S.leads=j.leads;S.companies=j.companies||[];S.agents=j.agents||[];S.settings=j.settings;S.inbox=j.inbox||[];S.mail=j.mail;S.team=j.team||[];S.staff=j.staff||[];S.now=j.now;S.ready=true;S.error='';S.setup='';
    if(!UI.ibx&&S.inbox[0])UI.ibx=S.inbox[0].id;
  }).catch(function(e){S.ready=true;if(!S.error&&!S.setup)S.error=e.message});
}
function poll(){
  if(!S.me||document.hidden||UI.modal)return;
  api('poll',{since:S.now}).then(function(j){
    var changed=false;
    j.leads.forEach(function(l){var i=S.leads.findIndex(function(x){return x.id===l.id});if(i<0){S.leads.unshift(l);changed=true}else if(l.updated>(S.leads[i].updated||0)){S.leads[i]=l;changed=true}});
    if(JSON.stringify(j.inbox.map(function(m){return m.id+m.status}))!==JSON.stringify(S.inbox.map(function(m){return m.id+m.status}))){S.inbox=j.inbox;changed=true}
    S.mail=j.mail;S.now=j.now;
    if(changed&&!UI.lead&&document.activeElement&&['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName)<0)render();
    announce();
  }).catch(function(){});
}
function announce(){try{parent.postMessage({hbSales:{open:S.leads.filter(function(l){return l.status==='open'&&!l.concept&&l.stage<7}).length}},'*')}catch(e){}}

/* ---------- helpers ---------- */
function agentById(id){return S.agents.find(function(a){return a.id===id})}
function teamById(id){return S.team.find(function(t){return t.id===id})}
function ownerName(id){var t=teamById(id);if(t)return t.name;var a=agentById(id);return a?a.name:(id?'Unknown':'Unassigned')}
function companyById(id){return S.companies.find(function(c){return c.id===id})}
function ownerCompany(id){var a=agentById(id);var c=a&&companyById(a.companyId);return c?c.name:(teamById(id)?'HAAVN BLACK Direct':'')}
function lead(id){return S.leads.find(function(l){return l.id===id})}
function home(l){return PRODUCTS[l.product]?PRODUCTS[l.product].n:'No preference'}
function price(l){return SOLUM.indexOf(l.product)>=0?(S.settings.prices[l.product]||0):0}
function fin(l){return [l.clad,l.pal,l.join].filter(Boolean).join(', ')||'finishes to be chosen'}
function full(l){return (l.first+' '+(l.last||'')).trim()}
function isInternal(){return S.me&&S.me.kind==='internal'}
function isAdmin(){return S.me&&S.me.admin}
function srcLabel(l){return l.source==='Other'&&l.otherSource?'Other ('+l.otherSource+')':l.source}
function nextAct(l){
  if(l.status==='lost')return null;
  if(l.concept)return {x:'Send the next concept update',due:(l.lastTouch||l.created)+14*DAY};
  if(l.stage===7)return null;
  var s=STAGES[l.stage];return {x:s.next,due:l.stage===0?l.created+HOUR:(l.lastTouch||l.created)+s.days*DAY};
}
function dueTag(l){
  var a=nextAct(l);if(!a)return l.stage===7&&l.status==='open'&&!l.concept?'<span class="due ok">Confirmed</span>':'';
  if(l.stage===0&&!l.concept&&l.maxStage===0){var h=Math.floor((now()-l.created)/HOUR);return h>=4?'<span class="due over">'+(h>=24?Math.floor(h/24)+'d':h+'h')+' waiting</span>':h>=1?'<span class="due today">'+h+'h waiting</span>':'<span class="due today">Call now</span>'}
  var d=Math.floor((sod(a.due)-sod(now()))/DAY);
  if(d<0)return '<span class="due over">Overdue '+(-d)+'d</span>';if(d===0)return '<span class="due today">Due today</span>';return '<span class="due">'+(d===1?'Tomorrow':fmtD(a.due))+'</span>';
}

/* ---------- saving a lead ---------- */
function saveLead(l,patch,quiet){
  Object.assign(l,patch);
  var send=Object.assign({id:l.id},patch);
  return api('saveLead',{lead:send}).then(function(j){var i=S.leads.findIndex(function(x){return x.id===l.id});if(i>=0)S.leads[i]=j.lead;if(!quiet)render();return j.lead}).catch(function(e){fail(e);load().then(render)});
}
function addAct(l,x,k){var e={t:now(),x:x,k:k||'sys'};l.act=[e].concat(l.act||[]);return e}
function move(l,idx){
  if(idx<0||idx>7)return;
  var dates=(l.dates||[l.created]).slice();if(idx>l.maxStage){for(var s=l.maxStage+1;s<=idx;s++)dates[s]=now()}
  var e=addAct(l,'Moved to '+STAGES[idx].n+' by '+S.me.name+'.');
  saveLead(l,{stage:idx,status:'open',lostWhy:'',dates:dates,lastTouch:now(),act:[e]});
  toast(full(l)+' is now '+STAGES[idx].n);
}

  iesave:function(t){var p={first:$('#ie_f').value,last:$('#ie_l').value,mobile:$('#ie_m').value,email:$('#ie_e').value,state:$('#ie_s').value,product:$('#ie_p').value};api('inboxCreate',{id:t.dataset.id,parsed:p}).then(function(j){var i=S.leads.findIndex(function(x){return x.id===j.lead.id});if(i<0)S.leads.unshift(j.lead);else S.leads[i]=j.lead;UI.modal=null;UI.cp={id:j.lead.id,dup:j.dup};return api('poll',{since:0}).then(function(p2){S.inbox=p2.inbox;render()})}).catch(fail)},
  conceptmsg:function(){UI.modal={t:'concept',id:UI.lead}},
  cexec:function(){var l=lead(UI.modal.id);try{navigator.clipboard.writeText($('#mtxt').value)}catch(e){}var e=addAct(l,'Sent a concept update.','note');UI.modal=null;saveLead(l,{act:[e],lastTouch:now(),eng:Math.min(100,(l.eng||20)+4)});toast('Logged as sent')},
  csend:function(){var l=lead(UI.modal.id);api('emailCustomer',{id:l.id,subject:$('#msubj').value,body:$('#mtxt').value}).then(function(j){S.leads[S.leads.findIndex(function(x){return x.id===l.id})]=j.lead;UI.modal=null;render();toast('Emailed '+l.first)}).catch(fail)},
  cwarm:function(){var l=lead(UI.lead);var c=Math.min(3,(l.cstage||0)+1);var e=addAct(l,'Moved to '+CSTAGES[c]+'.');saveLead(l,{cstage:c,act:[e]})},
  toSolum:function(){var l=lead(UI.lead);var p=l.product==='octamax'?'max':l.product==='octaplus'?'plus':'studio';var e=addAct(l,'Converted from OCTA concept to the SOLUM sales pipeline.');saveLead(l,{concept:false,product:p,stage:0,dates:[now()],lastTouch:now(),act:[e]});toast(full(l)+' is now in SOLUM sales')},
  upd:function(t){UI.modal={t:'upd',id:t.dataset.id}},
  uexec:function(t){var l=lead(t.dataset.id),o=Object.assign({},l.order);var send=t.dataset.send==='1';var v=$('#mtxt').value,sub=$('#msubj').value;
    var done=function(){o.lastUpdate=now();o.log=[{t:now(),x:'Fortnightly update '+(send?'emailed':'logged')+': '+DELIVERY[o.step].n+'.'}].concat(o.log||[]);var e=addAct(l,'Fortnightly update '+(send?'emailed to the customer':'logged as sent')+'.');UI.modal=null;saveLead(l,{order:o,act:[e]});toast('Update logged. The next one is due in 2 weeks.')};
    if(send)api('emailCustomer',{id:l.id,subject:sub,body:v}).then(function(j){S.leads[S.leads.findIndex(function(x){return x.id===l.id})]=j.lead;l=lead(l.id);o=Object.assign({},l.order);done()}).catch(fail);else{try{navigator.clipboard.writeText(v)}catch(e){}done()}},
  advdel:function(t){var l=lead(t.dataset.id),o=Object.assign({},l.order);if(o.step<7){o.step++;o.log=[{t:now(),x:'Projects team moved the order to: '+DELIVERY[o.step].n+'.'}].concat(o.log||[]);var e=addAct(l,'Projects team moved the order to: '+DELIVERY[o.step].n+'.');saveLead(l,{order:o,act:[e]});toast(DELIVERY[o.step].n)}},
  handover:function(){var l=lead(UI.lead);if(!confirm('Send the handover for '+full(l)+' to projects@haavn.au now?'))return;api('handover',{id:l.id}).then(function(j){S.leads[S.leads.findIndex(function(x){return x.id===l.id})]=j.lead;render();toast('Handover sent to the projects team')}).catch(fail)},
  csv:function(){var cols=['id','first','last','mobile','email','state','product','clad','pal','join','source','owner','stage','status'];var rows=[cols.concat(['created'])].concat(S.leads.map(function(l){return cols.map(function(c){return c==='owner'?ownerName(l.owner):c==='stage'?STAGES[l.stage].n:l[c]||''}).concat([new Date(l.created).toISOString()])}));
    var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='haavn-black-leads.csv';a.click()}
};
function saveSettings(patch){api('settingsSave',{settings:patch}).then(function(j){S.settings=Object.assign({},S.settings,j.settings);render();toast('Saved')}).catch(function(e){fail(e);render()})}
document.addEventListener('click',function(e){
  if(e.target.id==='shade'||e.target===$('#modal')){if(UI.modal)UI.modal=null;else UI.lead=null;render();return}
  var t=e.target.closest('[data-act]');if(!t)return;var fn=A[t.dataset.act];if(!fn||t.tagName==='A')return;
  fn(t);if(['pickstate','csv','nlsave','cosave','agsave','msend','csend','uexec','handover','parse','dismiss','inboxEdit','iesave'].indexOf(t.dataset.act)<0)render();
});
document.addEventListener('change',function(e){
  var c=e.target.dataset.chg;if(!c)return;var v=e.target.value;
  if(c.indexOf('f:')===0){UI.f[c.slice(2)]=v;render();return}
  if(c==='q'){UI.q=v;render();var q=$('[data-chg="q"]');if(q){q.focus();q.setSelectionRange(v.length,v.length)}return}
  if(c==='paste'){UI.paste=v;UI.parsed=null;UI.cp=null;return}
  if(c==='nlsrc'){var w=$('#nl_oth_w');if(w)w.style.visibility=v==='Other'?'visible':'hidden';return}
  if(c==='contractAdmin'){saveSettings({contractAdmin:v});return}
  if(c.indexOf('rule:')===0){var r={};r[c.slice(5)]=v;saveSettings({rules:r});return}
  if(c.indexOf('price:')===0){var p={};p[c.slice(6)]=v;saveSettings({prices:p});return}
  if(c.indexOf('spend:')===0){var s={};s[c.slice(6)]=v;saveSettings({spend:s});return}
  var l=UI.lead&&lead(UI.lead);if(!l)return;
  if(c==='owner'){var e1=addAct(l,'Owner changed to '+ownerName(v)+'.');var ag=agentById(v);saveLead(l,{owner:v,companyId:ag?ag.companyId:'',act:[e1]});return}
  if(c==='site'){saveLead(l,{order:Object.assign({},l.order,{site:v})},true);return}
  if(c==='product'){saveLead(l,{product:v,concept:!!(PRODUCTS[v]&&PRODUCTS[v].concept)});return}
  var pt={};pt[c]=v;saveLead(l,pt,['first','last','mobile','email','otherSource'].indexOf(c)>=0);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(UI.modal)UI.modal=null;else UI.lead=null;render()}if(e.key==='Enter'&&e.target.id==='note'){A.note()}});
/* drag a card to another column */
var dragId=null;
document.addEventListener('dragstart',function(e){var c=e.target.closest('.kcard[data-id]');if(!c)return;dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}});
document.addEventListener('dragend',function(){$$('.kcard.drag').forEach(function(c){c.classList.remove('drag')});$$('.kcol.over').forEach(function(c){c.classList.remove('over')});dragId=null});
document.addEventListener('dragover',function(e){var c=e.target.closest('.kcol[data-col]');if(c&&dragId){e.preventDefault();$$('.kcol.over').forEach(function(x){if(x!==c)x.classList.remove('over')});c.classList.add('over')}});
document.addEventListener('drop',function(e){var c=e.target.closest('.kcol[data-col]');if(!c||!dragId)return;e.preventDefault();var l=lead(dragId),k=c.dataset.col;dragId=null;
  if(k[0]==='c'){var cs=+k.slice(1);var en=addAct(l,'Moved to '+CSTAGES[cs]+'.');saveLead(l,{cstage:cs,act:[en],lastTouch:now()})}else move(l,+k)});

window.__sales={S:S,UI:UI,render:render,load:load};
load().then(function(){render();announce();setInterval(poll,30000);document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()})});
render();
})();
</script>
</body>
</html>
