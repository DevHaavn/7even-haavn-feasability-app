<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAAVN BLACK · Live model</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   HAAVN BLACK · LIVE MODEL
   The home as a product you can turn around and walk into, the way a car is
   shown. The geometry is the architect's own Rhino model, converted straight
   from the SOLUM internal use model to glTF, so what is on screen is the
   model itself and not an approximation of it.
   three.js is served from this app, so it works with no outside connection.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{--ink:#fff;--ink2:#a9a6a9;--ink3:#7b787b;--bg:#08080a;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.26);--led:#2fe07a;
  --f:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;overflow:hidden;height:100svh}
canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:fixed;inset:0}
.hud{position:fixed;left:0;right:0;bottom:0;padding:16px clamp(12px,3vw,28px) calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;pointer-events:none;
  background:linear-gradient(0deg,rgba(8,8,10,.86),transparent)}
.hud .grp{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:40px;background:rgba(10,10,11,.6);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);pointer-events:auto}
.hud button{height:38px;padding:0 15px;border-radius:30px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink2);transition:.25s;white-space:nowrap}
.hud button:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.hud button.on{color:#eafff2;background:rgba(47,224,122,.14);box-shadow:inset 0 0 0 1px rgba(47,224,122,.5)}
.hud .sw{display:flex;align-items:center;gap:8px}
.hud .sw i{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.3);display:inline-block}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:calc(14px + env(safe-area-inset-top)) clamp(12px,3vw,28px) 14px;background:linear-gradient(180deg,rgba(8,8,10,.8),transparent)}
.top .t{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2)}
.top .t b{color:var(--ink);font-weight:500}
.top .close{margin-left:auto;height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:2px;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;transition:opacity .6s}
.load.gone{opacity:0;pointer-events:none}
.load .in{text-align:center}
.load .bar{width:min(260px,60vw);height:1px;background:rgba(255,255,255,.15);margin:18px auto 0;overflow:hidden}
.load .bar i{display:block;height:100%;width:0;background:var(--led);transition:width .3s}
.load .p{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase;margin-top:12px}
.hint{position:fixed;left:50%;top:calc(50% + 120px);transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;
  letter-spacing:.24em;color:rgba(255,255,255,.35);text-transform:uppercase;transition:opacity .6s;text-align:center;line-height:2}
.hint.gone{opacity:0}
</style>
</head>
<body>
<div id="stage"></div>

<div class="top">
  <span class="t"><b>SOLUM</b> · Live model</span>
  <button class="close" id="close">← Return</button>
</div>

<div class="hud">
  <div class="grp" id="views">
    <button data-view="hero" class="on">Hero</button>
    <button data-view="front">Front</button>
    <button data-view="rear">Rear</button>
    <button data-view="top">Plan</button>
    <button data-view="inside">Inside</button>
  </div>
  <div class="grp" id="finishes"></div>
  <div class="grp">
    <button id="spin" class="on">Auto turn</button>
    <button id="reset">Recentre</button>
  </div>
</div>

<div class="hint" id="hint">Drag to turn · pinch or scroll to zoom · two fingers to pan</div>

<div class="load" id="load"><div class="in">
  <span class="t" style="font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ink2)">HAAVN BLACK · SOLUM</span>
  <div class="bar"><i id="bar"></i></div>
  <div class="p" id="pct">Loading the model</div>
</div></div>

<script type="importmap">
{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
/* Plan cuts the home at 2.2 m: the roof and anything above it comes away */
const CUT = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
/* the light of the place: an environment built from the project's own render,
   so glass, metal and stone pick up the same sky and ground as the imagery */
new THREE.TextureLoader().load('/haavn-3d/env.jpg', t => {
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  scene.environment = t;                      // for reflections and bounced light
  scene.background = t; scene.backgroundBlurriness = 0.92; scene.backgroundIntensity = 0.28;
});
const FOG = new THREE.Fog(0x24262a, 70, 240); scene.fog = FOG;
const planLight = new THREE.DirectionalLight(0xffffff, 0); planLight.position.set(0, 40, 0); scene.add(planLight);
let planCutY = 2.2;

/* light: a soft room environment for reflections, one sun for the shadow */
const sun = new THREE.DirectionalLight(0xffe9cf, 2.2);
sun.position.set(-14, 16, 11); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const d = 26; Object.assign(sun.shadow.camera, { left:-d, right:d, top:d, bottom:-d, near:1, far:90 });
sun.shadow.bias = -0.0006;
scene.add(sun, new THREE.HemisphereLight(0x9fb4c7, 0x14130f, 0.30));

/* ground: a quiet plate that takes the shadow */
const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 96),
  new THREE.MeshStandardMaterial({ color:0x20211d, roughness:0.96, metalness:0 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.01; ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.055;
controls.minDistance = 1.2; controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.autoRotateSpeed = 0.45;

/* the finishes, applied to the cladding meshes */
/* the timber texture stays; the tint over it is the finish */
const FINISHES = [
  { name:'Charred', sw:'#171514', tint:0x141210, rough:0.74, metal:0.0 },
  { name:'Stone',   sw:'#8d8981', tint:0x9a958c, rough:0.88, metal:0.0 },
  { name:'Black',   sw:'#0a0a0b', tint:0x0b0b0c, rough:0.50, metal:0.04 }
];
const cladding = [], roof = [];
const fbox = document.getElementById('finishes');
FINISHES.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === 0 ? ' on' : '');
  b.innerHTML = '<i style="background:' + f.sw + '"></i>' + f.name;
  b.onclick = () => { [...fbox.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); setFinish(i); };
  fbox.appendChild(b);
});
function setFinish(i){
  const f = FINISHES[i];
  cladding.forEach(m => { m.color.setHex(f.tint); m.roughness = f.rough; m.metalness = f.metal; m.needsUpdate = true; });
  post({ type:'finish', i });
}

/* views, set from the model's own size once it is in */
let VIEWS = {}, box = new THREE.Box3(), size = new THREE.Vector3(), mid = new THREE.Vector3();
let MODE = 'hero', ROOM = null;        // ROOM: the box the camera stays inside when you are indoors
function frame(name, animate = true){
  const v = VIEWS[name]; if(!v) return;
  camera.fov = (name === 'inside') ? 62 : 38; camera.updateProjectionMatrix();
  controls.minDistance = (name === 'inside') ? 0.2 : 1.2;
  controls.maxDistance = (name === 'inside') ? 6 : 120;
  MODE = name;
  const plan = (name === 'top');
  roof.forEach(o => { o.visible = !plan; });                      // Plan lifts the lid
  CUT.constant = planCutY;                                        // and cuts the walls at head height
  renderer.clippingPlanes = plan ? [CUT] : [];
  planLight.intensity = plan ? 1.5 : 0;
  scene.fog = plan ? null : FOG;
  controls.maxPolarAngle = (name === 'top') ? Math.PI/2 : Math.PI/2 - 0.02;
  controls.autoRotate = (name === 'hero') && spin.classList.contains('on');
  const from = camera.position.clone(), to = v.pos.clone();
  const tFrom = controls.target.clone(), tTo = v.target.clone();
  if(!animate){ camera.position.copy(to); controls.target.copy(tTo); controls.update(); return; }
  const t0 = performance.now(), ms = 900;
  (function step(now){
    const k = Math.min(1, (now - t0)/ms), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from, to, e);
    controls.target.lerpVectors(tFrom, tTo, e);
    controls.update();
    if(k < 1) requestAnimationFrame(step);
  })(t0);
  [...document.querySelectorAll('#views button')].forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => { frame(b.dataset.view); post({ type:'view', v:b.dataset.view }); });
document.getElementById('reset').onclick = () => frame('hero');
const spin = document.getElementById('spin');
spin.onclick = () => { spin.classList.toggle('on'); controls.autoRotate = spin.classList.contains('on') && MODE !== 'inside'; };
document.getElementById('close').onclick = () => {
  try { if(parent !== window){ parent.postMessage('haavn-3d-close','*'); return; } } catch(e){}
  history.length > 1 ? history.back() : (location.href = '/');
};

/* the model */
const bar = document.getElementById('bar'), pct = document.getElementById('pct'), load = document.getElementById('load');
new GLTFLoader().load('/haavn-3d/solum.glb', gltf => {
  const model = gltf.scene;
  model.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const n = (o.name || '').replace(/_/g, ' ').toUpperCase();   // the loader swaps spaces for underscores
    const m = o.material;
    if(m && m.isMeshStandardMaterial){
      m.envMapIntensity = 1.15;
      if(m.map){ m.map.anisotropy = 8; m.map.colorSpace = THREE.SRGBColorSpace; }
      if(m.normalMap) m.normalScale.set(0.9, 0.9);
      if(n.includes('YAKISU') || n.includes('WOOD 49')){ cladding.push(m); m.color.setHex(FINISHES[0].tint); m.roughness = FINISHES[0].rough; }
      if(n.includes('GLASS')){ m.transparent = true; m.opacity = 0.2; m.roughness = 0.02; m.metalness = 0; m.envMapIntensity = 2.0; o.castShadow = false; }
      if(n.includes('LED') || n === 'LIGHT'){ m.emissive = new THREE.Color(0xffe4bd); m.emissiveIntensity = 3.0; o.castShadow = false; }
      if(n.includes('MIRROR') || n.includes('SILVER')){ m.envMapIntensity = 1.6; }
      if(n.includes('BLACK ACE')){ m.envMapIntensity = 0.9; }
      if(n.includes('ROOFCAP')) roof.push(o);
    }
  });
  scene.add(model);

  box.setFromObject(model); box.getSize(size); box.getCenter(mid);
  /* the glazed side is the front: find where the glass sits relative to the
     middle, so Front looks into the glass and Hero is the rear three-quarter
     view from the images */
  /* which way the glazing looks: add up the glass triangles' own facing,
     weighted by their area, and take the strongest horizontal direction */
  const face = new THREE.Vector3();
  const a = new THREE.Vector3(), b2 = new THREE.Vector3(), c2 = new THREE.Vector3(),
        ab = new THREE.Vector3(), ac = new THREE.Vector3(), nrm = new THREE.Vector3();
  model.traverse(o => {
    if(!o.isMesh || !/GLASS/i.test((o.material && o.material.name) || '')) return;
    const g = o.geometry, pos = g.attributes.position, idx = g.index;
    const count = idx ? idx.count : pos.count;
    for(let k = 0; k + 2 < count; k += 3){
      const i0 = idx ? idx.getX(k) : k, i1 = idx ? idx.getX(k+1) : k+1, i2 = idx ? idx.getX(k+2) : k+2;
      a.fromBufferAttribute(pos, i0); b2.fromBufferAttribute(pos, i1); c2.fromBufferAttribute(pos, i2);
      o.localToWorld(a); o.localToWorld(b2); o.localToWorld(c2);
      ab.subVectors(b2, a); ac.subVectors(c2, a); nrm.crossVectors(ab, ac);
      const area = nrm.length() * 0.5; if(area < 0.02) continue;
      nrm.normalize(); nrm.y = 0;                                  // only the way it faces on plan
      face.addScaledVector(nrm, area);
    }
  });
  const faceX = Math.abs(face.x) >= Math.abs(face.z);
  const dir = (faceX ? Math.sign(face.x) : Math.sign(face.z)) || 1;
  window.__gdir = { face: face.toArray().map(v => +v.toFixed(2)), faceX, dir };
  /* where the rooms are: the interior linings and floor, so standing inside
     puts the camera in the room rather than in a wall */
  const ibox = new THREE.Box3(); let found = false;
  model.traverse(o => { if(o.isMesh && /INTERIOR|PLASTER|FLOORING/i.test(o.name || '')){ ibox.expandByObject(o); found = true; } });
  const iSize = new THREE.Vector3(), iMid = new THREE.Vector3();
  (found ? ibox : box).getSize(iSize); (found ? ibox : box).getCenter(iMid);
  planCutY = ibox.min.y + 2.05;
  if(found){ ROOM = ibox.clone(); ROOM.expandByScalar(-0.35); ROOM.min.y = ibox.min.y + 0.9; ROOM.max.y = ibox.min.y + 2.1; }
  const long = iSize.z >= iSize.x;
  /* a little warm light in the rooms, so walking inside is not a dark box */
  if(found){
    const n = 3;
    for(let i = 0; i < n; i++){
      const t = (i + 0.5) / n;
      const l = new THREE.PointLight(0xffd9ad, 6.5, Math.max(iSize.x, iSize.z) * 0.9, 2.0);
      l.position.set(long ? iMid.x : ibox.min.x + iSize.x * t, ibox.min.y + iSize.y * 0.82,
                     long ? ibox.min.z + iSize.z * t : iMid.z);
      scene.add(l);
    }
  }
  const r = Math.max(size.x, size.z) * 0.5, h = size.y;
  controls.target.set(mid.x, h * 0.42, mid.z);
  /* front = looking into the glass · hero = the rear three-quarter */
  const F = faceX ? new THREE.Vector3(dir, 0, 0) : new THREE.Vector3(0, 0, dir);      // outward, glazed side
  const side = faceX ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0);
  const eye = h * 0.62;
  VIEWS = {
    hero:  { pos:new THREE.Vector3(mid.x - F.x*r*1.9 + side.x*r*1.5, h*1.25, mid.z - F.z*r*1.9 + side.z*r*1.5),
             target:new THREE.Vector3(mid.x, h*0.42, mid.z) },
    front: { pos:new THREE.Vector3(mid.x + F.x*r*2.3, eye, mid.z + F.z*r*2.3),  target:new THREE.Vector3(mid.x, h*0.40, mid.z) },
    rear:  { pos:new THREE.Vector3(mid.x - F.x*r*2.3, eye, mid.z - F.z*r*2.3),  target:new THREE.Vector3(mid.x, h*0.40, mid.z) },
    top:   { pos:new THREE.Vector3(mid.x + 0.01, Math.max(r*2.6, 16), mid.z + 0.01), target:new THREE.Vector3(mid.x, 0, mid.z) },
    inside: long
      ? { pos:new THREE.Vector3(iMid.x, ibox.min.y + 1.6, iMid.z + iSize.z*0.34), target:new THREE.Vector3(iMid.x, ibox.min.y + 1.45, iMid.z - iSize.z*0.42) }
      : { pos:new THREE.Vector3(iMid.x + iSize.x*0.34, ibox.min.y + 1.6, iMid.z), target:new THREE.Vector3(iMid.x - iSize.x*0.42, ibox.min.y + 1.45, iMid.z) }
  };
  frame('hero', false);
  controls.autoRotate = true;
  sun.target.position.copy(mid); scene.add(sun.target);
  ground.position.set(mid.x, -0.01, mid.z);
  load.classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 5200);
  post({ type:'ready' });
}, ev => {
  if(!ev.total) return;
  const k = Math.round(ev.loaded / ev.total * 100);
  bar.style.width = k + '%'; pct.textContent = 'Loading the model · ' + k + '%';
}, err => { pct.textContent = 'The model could not be loaded'; console.warn(err); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function tick(){
  requestAnimationFrame(tick);
  controls.update();
  if(MODE === 'inside' && ROOM){            // indoors stays indoors
    const before = camera.position.clone();
    ROOM.clampPoint(camera.position, camera.position);
    if(!before.equals(camera.position)) controls.target.add(camera.position.clone().sub(before).multiplyScalar(0.35));
  }
  renderer.render(scene, camera);
})();

/* the Studio can drive this view when it is presenting to a television */
function post(m){ try { if(parent !== window) parent.postMessage(Object.assign({ haavn3d:1 }, m), '*'); } catch(e){} }
addEventListener('message', e => {
  const d = e.data || {}; if(!d.haavn3d) return;
  if(d.type === 'view') frame(d.v);
  else if(d.type === 'finish') { const b = fbox.children[d.i]; if(b) b.click(); }
  else if(d.type === 'spin') spin.click();
});
window.__haavn3d = { frame, setFinish, each(fn){ scene.traverse(fn); }, glassDir(){ return window.__gdir; },
  debug(){ const b=new THREE.Box3().setFromObject(scene); const s=new THREE.Vector3(), c=new THREE.Vector3(); b.getSize(s); b.getCenter(c);
    let meshes=0, tris=0; scene.traverse(o=>{ if(o.isMesh){ meshes++; const g=o.geometry; tris+=(g.index?g.index.count:g.attributes.position.count)/3; } });
    return { size:[+s.x.toFixed(2),+s.y.toFixed(2),+s.z.toFixed(2)], centre:[+c.x.toFixed(2),+c.y.toFixed(2),+c.z.toFixed(2)],
      meshes, tris:Math.round(tris), cam:camera.position.toArray().map(v=>+v.toFixed(1)), target:controls.target.toArray().map(v=>+v.toFixed(1)) }; } };
</script>
</body>
</html>
