:root {
  /* ---- Colour: base ---- */
  --c-black: #000;
  --c-white: #fff;
  --c-ink: #eaf1f6;          /* primary text                       */
  --c-ink-2: #a8b3bc;        /* body copy          · 9.6:1 on black */
  --c-ink-3: #7d8891;        /* labels             · 5.8:1 on black */
  --c-ink-4: #6e7881;        /* legal, fine print  · 4.6:1 on black */
  --c-hairline: rgb(255 255 255 / 0.08);
  --c-border: rgb(117 113 116 / 0.55);
  --c-border-hover: rgb(220 235 255 / 0.45);

  /* ---- Colour: brand light ---- */
  --c-led: #d8f1ff;          /* LED white, the signature light      */
  --c-led-core: #7fd3ff;     /* LED core, focus rings, accents       */
  --c-led-glow: rgb(110 200 255 / 0.55);
  --c-gold: #d6b36a;         /* "Arriving soon", landmark projects   */

  /* One colour per variant, lifted far enough off the real finish to stay
     legible as small type on black. The swatch derives its fill, border and
     glow from these, so a new variant needs only one value. */
  --c-burgundy: #c2747a;
  /* The greens in the renders sit at a hue of 73, which is where this
     started. On the button that read as olive more than sage, so it is
     carried round to 95 — greener than the rooms actually are, because
     the swatch has to name the palette at the size of a word rather than
     match it. Lightness and saturation stay near the others, so the set
     still reads as one. */
  --c-sage:     #a7c294;
  /* Tide is the ocean's: a clear pale blue, nothing like the greens. Vine
     is a pale green, the new leaf on the vine — lighter, fresher and a
     little cooler than Sage, so the two greens never read as one. Both
     PROVISIONAL until their renders land: sample them then and lift the
     values as the others were. */
  --c-tide:     #a6d1f0;   /* pale ocean blue */
  --c-vine:     #b4e2bd;   /* pale new-leaf green */

  --c-obsidian: #9fb4c8;
  /* PROVISIONAL, as above. */
  --c-ivory:    #e4dbc6;
  --c-forge:    #c4957a;   /* worked bronze */
  --c-char:     #b3aca6;   /* charred timber, a warm grey */
  --c-amber:    #e39a55;   /* oranger than the page's gold, so the two
                              are never mistaken for one another */
  --c-gold-glow: rgb(214 179 106 / 0.5);
  --c-error: #ff8a7e;

  /* ---- Colour: daylight ink (used after dawn, over the bright sky) ---- */
  --c-day-ink: #0f1920;
  --c-day-ink-2: #33414c;
  --c-day-gold: #6b5214;
  --c-day-signal: #8e2418;

  /* The fade: white at the start, falling away into the dark. Used by the
     word "dark" in the announcement. */
  --fade-out: linear-gradient(
    100deg,
    #ffffff 0%,
    var(--c-ink-2) 38%,
    #575f67 72%,
    #2b3239 100%
  );

  /* Its opposite number: the word warms instead of falling away. Same
     angle, so "Solum" and "dark" read as one gesture and its reverse
     across the announcement.

     It is the gold diluted, not the gold itself. At full strength the word
     turns metallic and starts advertising, and darkening the tail made it
     worse; held back to roughly three quarters it stays clearly gold while
     leaving the true colour to the "Arriving soon" mark. */
  --fade-gold: linear-gradient(
    100deg,
    #ffffff 0%,
    color-mix(in oklab, var(--c-gold) 26%, #ffffff) 40%,
    color-mix(in oklab, var(--c-gold) 58%, #ffffff) 76%,
    color-mix(in oklab, var(--c-gold) 76%, #ffffff) 100%
  );

  /* ---- Pictures ----
     A rounding small enough that it reads as a softened edge rather than
     as a rounded card. */
  --img-radius: 4px;

  /* The glass buttons over the corner of the open picture. The chip is
     the floor plan's — same size, same gap — so the two read as one
     control wherever it turns up. */
  --peek-size: 2rem;                /* the floor plan's --chip */
  --peek-gap: 6px;                  /* the floor plan's --chip-gap */
  --peek-inset: var(--space-3);     /* in from the picture's corner */

  /* The pictures' own cut corner: the same diagonal as the buttons and
     swatches, scaled to a photograph. Quoted with its size here, where the
     size is declared, since a var() inside a custom property resolves at
     its declaration and could not be overridden further down. */
  --img-notch: 16px;
  --img-notch-clip: polygon(
    0 0,
    100% 0,
    100% calc(100% - var(--img-notch)),
    calc(100% - var(--img-notch)) 100%,
    0 100%);

  /* ---- Glass surfaces ---- */
  --glass-bg: rgb(6 10 14 / 0.72);
  --glass-blur: 18px;
  --glass-highlight: inset 0 1px 0 rgb(255 255 255 / 0.1);

  /* ---- Type families ---- */
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* the editorial voice: used for the announcement, nothing else */
  --font-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;

  /* ---- Type scale (fluid, mobile first) ---- */
  --fs-micro: 0.6875rem;                              /* 11px mono labels  */
  --fs-small: clamp(0.75rem, 0.72rem + 0.15vw, 0.8125rem);
  --fs-body: clamp(0.8125rem, 0.78rem + 0.2vw, 0.9375rem);
  --fs-input: 1rem;                                   /* 16px stops iOS zoom on focus */
  --fs-statement: clamp(1.375rem, 1.05rem + 1.5vw, 2.125rem);
  /* A section's opening, the same in every one that has one: the
     headline in the serif, and the one line under it. */
  --fs-headline: clamp(2.25rem, 1.3rem + 3.6vw, 4.5rem);
  --fs-headline-line: clamp(1.0625rem, 0.95rem + 0.5vw, 1.375rem);
  --fs-count: clamp(1.375rem, 1.1rem + 1.2vw, 2.25rem);
  --fs-title: clamp(1.75rem, 1.4rem + 1.6vw, 2.25rem);

  /* ---- Tracking ---- */
  --track-mono: 0.3em;
  --track-eyebrow: 0.5em;

  /* ---- Space ---- */
  --gutter: clamp(1.25rem, 4vw, 3.5rem);
  /* the gutter, plus whatever the notch takes: for sections that set their
     own padding rather than inheriting the hero screen's */
  --gutter-safe: calc(var(--gutter) + max(var(--safe-left), var(--safe-right)));
  --section-pad: clamp(4.5rem, 11vw, 10rem);

  /* The rhythm inside a section, the same in every one:
     --head-gap   under an eyebrow that labels a block of content (a
                  gallery, the floor plan, My SOLUM), so the label is
                  read as a caption over it rather than a line of it. An
                  eyebrow over its own headline sits closer, --space-6.
     --block-gap  between the main parts of a section: what it shows,
                  and the way on from it.
     --fine-gap   above small print, under the button it qualifies. */
  --head-gap: clamp(2.5rem, 4.5vw, 4rem);
  --block-gap: clamp(3rem, 5.5vw, 5rem);
  --fine-gap: var(--space-6);

  /* ---- The cut corner ----
     Buttons and swatches take a chamfer off the bottom-right. The clip
     removes the corner and the border with it, so the cut has to draw its
     own edge: --notch-line is that line, ready to sit at the front of a
     background stack. It reads --notch-edge from whatever element uses it,
     so the line follows that element's border through its states.

     The line is laid out against the border box. A background sits in the
     padding box by default, which put the diagonal a border's width inside
     the clip and left the bottom and right borders running past its ends
     as a pair of spurs. */
  --notch: 10px;
  --notch-edge: rgb(255 255 255 / 0.12);
  /* The notched corner itself takes no radius: the clip is square-cornered,
     so a curve there would only round the border behind the cut. */
  --notch-corners: 4px 4px 0;
  --notch-line:
    linear-gradient(-45deg,
      transparent 50%,
      var(--notch-edge) 50% calc(50% + 1.5px),
      transparent calc(50% + 1.5px))
    bottom right / var(--notch) var(--notch) no-repeat border-box;
  --notch-clip: polygon(
    0 0,
    100% 0,
    100% calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%,
    0 100%);

  /* The same cut mirrored onto the bottom-left, for the times a shape's
     outer corner is on that side — a row of chips sitting in the corner
     of a cut-out, where the chamfer wants to be at the row's far end
     rather than pointing back into the row. */
  --notch-corners-bl: 4px 4px 4px 0;
  --notch-line-bl:
    linear-gradient(45deg,
      transparent 50%,
      var(--notch-edge) 50% calc(50% + 1.5px),
      transparent calc(50% + 1.5px))
    bottom left / var(--notch) var(--notch) no-repeat border-box;
  --notch-clip-bl: polygon(
    0 0,
    100% 0,
    100% 100%,
    var(--notch) 100%,
    0 calc(100% - var(--notch)));

  /* The height of a conveyor row. Shared by the interiors and the
     exteriors so the two read as one band down the page, whatever the
     pictures in them happen to be shaped like. */
  --conveyor-h: clamp(21rem, 40vw, 34rem);

  /* The card on a phone, where there is no conveyor and each row is a
     strip of equal cards. Both rows take this shape, so the two sections
     read as one the way --conveyor-h makes them on a wider screen.

     Landscape, because every render is: the interiors are 1.33 to 1.41 and
     the exteriors 16:9. A portrait card would be throwing away the sides
     of all of them. The width leaves enough of the next card showing to
     say the strip scrolls. */
  --card-phone-w: 83%;
  --card-phone-ar: 17 / 20;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --tap: 44px;               /* minimum touch target */

  /* ---- Safe areas (notches, home indicators) ---- */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  /* ---- Motion ---- */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-draw: cubic-bezier(0.3, 0.8, 0.2, 1);
  --dur-fast: 0.35s;
  --dur-base: 0.6s;
  --dur-reveal: 1.6s;
  --dur-phase: 1.8s;

  /* ---- Layers ---- */
  --z-backdrop: 0;     /* reserved for whatever the backdrop becomes */
  --z-page: 10;
}

   ========================================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--c-black);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-weight: 300;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100svh;
  background: var(--c-black);
  overflow-x: hidden;
}

img,
svg,
canvas {
  display: block;
  max-width: 100%;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  background: none;
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

strong,
b {
  font-weight: 400;
}

:focus-visible {
  outline: 1px solid var(--c-led-core);
  outline-offset: 4px;
}

/* ---- Utilities ---- */

/* Components set their own display; [hidden] must always win */
[hidden] {
  display: none !important;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Small uppercase monospace label, the site's secondary voice */
.mono,
.eyebrow,
.kicker,
.clock,
.countdown__label,
.countdown dt,
.field__label,
.site-footer {
  font-family: var(--font-mono);
  font-weight: 300;
  font-size: var(--fs-micro);
  letter-spacing: var(--track-mono);
  text-transform: uppercase;
}

/* =========================================================================
   Section rules

   A hairline marking where one section ends and the next begins. Drawn as
   a pseudo-element inset to the gutters rather than as a border, for two
   reasons: a border would run the full width of the viewport, where every
   other rule on the page stops at the gutter; and a section whose picture
   bleeds to its top edge could not carry one without drawing it across
   the picture — such a section takes its rule from the foot of the one
   above (.rule-bottom).
   ========================================================================= */

.rule-top,
.rule-bottom {
  position: relative;
}

.rule-top::before,
.rule-bottom::after {
  content: "";
  position: absolute;
  left: var(--gutter-safe);
  right: var(--gutter-safe);
  height: 1px;
  background: var(--c-hairline);
  pointer-events: none;
}

.rule-top::before { top: 0; }
.rule-bottom::after { bottom: 0; }

/* Anchors glide rather than jump — the page's one piece of scroll motion,
   and only where motion is welcome. */
@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}

/* A line break that only applies once there is room for the line it makes.
   Narrow screens wrap the sentence on their own. */
.break-wide {
  display: none;
}

@media (min-width: 40rem) {
  .break-wide {
    display: inline;
  }
}

/* =========================================================================
   Enquiry link

   Sits at the foot of a section that offers variants, naming whichever one
   is on show. See src/js/ui/variants.js — it fills the matching field in
   the register form on the way down.
   ========================================================================= */

.enquire {
  margin-top: var(--space-6);
}

/* A line to turn a preference into an action, and to take the risk out of
   it before the button is pressed. */
.enquire__prompt {
  margin: 0 0 var(--space-4);
  font-size: var(--fs-small);
  color: var(--c-ink-3);
}

.enquire__link {
  width: auto;
}

/* ---- src/css/components/button.css ---- */
/* =========================================================================
   Buttons
   .button--glass  the primary call to action (HAAVN BLACK Atrium style)
   .button--solid  form submit
   ========================================================================= */

.button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  min-height: 3rem;
  padding: 0 var(--space-5);
  overflow: hidden;
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: 0.78rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  white-space: nowrap;
  text-decoration: none;     /* the hero's is an <a>, not a <button> */
  color: var(--c-white);
  border: 1px solid var(--c-border);
  /* The same cut corner as the swatches, so the whole interface agrees on
     one shape. The clip takes the border away along that diagonal, so the
     edge is drawn in as a background layer instead — see tokens.css. */
  --notch-edge: var(--c-border);
  border-radius: var(--notch-corners);
  clip-path: var(--notch-clip);
  transition:
    border-color 0.45s,
    box-shadow 0.45s,
    transform 0.45s,
    opacity var(--dur-base);
}

.button:disabled {
  cursor: progress;
  opacity: 0.55;
}

.button__arrow {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  color: var(--c-led);
  opacity: 0.85;
  transition: transform 0.45s, opacity 0.45s;
}

/* ---- Glass ---- */
.button--glass {
  width: 100%;
  justify-content: space-between;
  box-shadow: var(--glass-highlight), 0 24px 56px -30px var(--c-black);
  background: var(--notch-line), rgb(8 12 16 / 0.25);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

/* the light that sweeps across on hover */
.button--glass::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -45%;
  width: 38%;
  background: linear-gradient(100deg, transparent, rgb(255 255 255 / 0.12), transparent);
  transition: left 0.85s cubic-bezier(0.2, 0.7, 0.3, 1);
  pointer-events: none;
}

/* Full width on phones, sized to its label once there is room */
@media (min-width: 40rem) {
  .button--glass {
    width: auto;
  }
}

/* ---- Small ----
   For sitting alongside form fields, where the full-height call to action
   overpowers a column of hairline underlines. */
.button--sm {
  min-height: 2.5rem;
  padding: 0 var(--space-4);
  font-size: 0.68rem;
  letter-spacing: 0.2em;
}

.button--sm .button__arrow {
  font-size: 0.78rem;
}

/* ---- Solid ---- */
.button--solid {
  width: 100%;
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--fs-micro);
  letter-spacing: var(--track-mono);
  --notch-edge: rgb(220 240 255 / 0.35);
  border-color: rgb(220 240 255 / 0.35);
  background: var(--notch-line), transparent;
}

/* Hover only where there's a real pointer, so taps don't stick */
@media (hover: hover) {
  .button:hover:not(:disabled) {
    --notch-edge: var(--c-border-hover);
    border-color: var(--c-border-hover);
  }

  .button--glass:hover {
    background: var(--notch-line), rgb(8 12 16 / 0.25);
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 0.18),
      0 28px 66px -28px var(--c-black),
      0 0 40px -12px rgb(180 210 255 / 0.26);
  }

  .button--glass:hover::after {
    left: 115%;
  }

  .button--glass:hover .button__arrow {
    transform: translateX(5px);
    opacity: 1;
  }

  /* The arrow on a link that moves down the page moves down with it. */
  .button--down:hover .button__arrow {
    transform: translateY(4px);
  }

  .button--solid:hover:not(:disabled) {
    box-shadow: 0 0 30px -10px rgb(180 210 255 / 0.35);
  }
}

/* =========================================================================
   The glint

   A soft band of light crosses a button as it arrives on screen, so a
   reader who has scrolled past the label still catches the movement. It
   travels the way the page is travelling: down the button on the way down
   the page, up it on the way back.

   It rides ::before because ::after is already carrying the hover sweep,
   and the two are free to overlap. The notch clips both.
   ========================================================================= */

@media (prefers-reduced-motion: no-preference) {
  .button::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 100%;
    background: linear-gradient(
      180deg,
      transparent,
      rgb(255 255 255 / 0.025) 30%,
      rgb(255 255 255 / 0.07) 50%,
      rgb(255 255 255 / 0.025) 70%,
      transparent);
    opacity: 0;
    pointer-events: none;
  }

  /* Linear, unlike everything else here. An eased sweep whips across and
     then crawls, which reads as a wipe; a reflection travels evenly. The
     fade at each end does the softening instead. */
  .button.is-glinting-down::before {
    animation: glint-down 0.72s linear;
  }

  .button.is-glinting-up::before {
    animation: glint-up 0.72s linear;
  }
}

/* Off the top, across, and off the bottom. The band is the height of the
   button, so it is never wholly inside it and the light never sits still. */
@keyframes glint-down {
  0%   { opacity: 0; transform: translateY(-115%); }
  22%  { opacity: 1; }
  78%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(115%); }
}

@keyframes glint-up {
  0%   { opacity: 0; transform: translateY(115%); }
  22%  { opacity: 1; }
  78%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(-115%); }
}



/* The display around Seth's pages. Everything here borrows his tokens (seth_shell.css comes first): his black, his ink,
   his one cut corner, his mono labels and serif names. One header, one range page, nothing else. */
html, body { height: 100%; overflow: hidden; background: var(--c-black); }
body { font-weight: 300; }
[hidden] { display: none !important; }

/* ---- the one header: ATRIUM's language. Inter 300, sentence case, no tracking, bone on a quiet ground ---- */
:root { --bone: #F3F2EE; --soft: rgba(243, 242, 238, 0.72); --faint: rgba(243, 242, 238, 0.62); --rule: rgba(243, 242, 238, 0.2); --atrium-gold: #d6b36a; --ease-atrium: cubic-bezier(0.16, 1, 0.3, 1); }
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 70; display: flex; align-items: center; gap: var(--space-4); padding: 1.15rem var(--gutter);
  transition: background 0.5s ease, border-color 0.5s ease; border-bottom: 1px solid transparent; }
#logo { width: clamp(8rem, 13vw, 12.5rem); }
#nav { display: flex; gap: clamp(1.25rem, 2.6vw, 2.5rem); }
#menus { display: flex; gap: clamp(1.25rem, 2.6vw, 2.5rem); margin-right: auto; margin-left: clamp(1.5rem, 4vw, 4rem); }
#menus .mn, #nav button { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0; white-space: nowrap;

body.lbx #wash { opacity: 0; pointer-events: none; }

/* ---- scenes ---- */
#stage { position: fixed; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 0.6s var(--ease-out), visibility 0s linear 0.6s; }
.scene.on { opacity: 1; visibility: visible; transition: opacity 0.6s var(--ease-out), visibility 0s; }
#sc-home iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

/* ---- the two menus: ATRIUM's index. Name left, size right, a hairline between, the row lifting and indenting on hover.
   No box. The ground darkens from the left behind it, as it does in ATRIUM, and the list sits straight on that. ---- */
#wash { position: fixed; inset: 0; z-index: 62; opacity: 0; pointer-events: none; transition: opacity 0.55s var(--ease-atrium);
  background: linear-gradient(90deg, rgba(10, 11, 12, 0.97) 0%, rgba(10, 11, 12, 0.9) 38%, rgba(10, 11, 12, 0.66) 72%, rgba(10, 11, 12, 0.48) 100%),
    radial-gradient(145% 115% at 0% 100%, rgba(6, 7, 8, 0.92), transparent 66%); }
body.mo #wash { opacity: 1; pointer-events: auto; }
.menu { position: fixed; z-index: 66; top: 4.4rem; left: var(--gutter); width: min(430px, 92vw); display: none; }
.menu.on { display: block; animation: menu-in 0.45s var(--ease-atrium) both; }
@keyframes menu-in { from { opacity: 0; translate: 0 -6px; } to { opacity: 1; translate: 0 0; } }
.menu .mi { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; width: 100%; padding: 13px 0; text-align: left;
  border: 0; border-top: 1px solid var(--rule); background: transparent; transition: padding 0.35s var(--ease-atrium), border-color 0.35s; }
.menu .mi:last-child { border-bottom: 1px solid var(--rule); }

.menu .mi .ln { font: 300 12.5px Inter, system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--faint); white-space: nowrap; transition: color 0.35s; }
.menu .mi:hover { padding-left: 12px; border-top-color: rgba(214, 179, 106, 0.6); }
.menu .mi:hover .nm { color: var(--atrium-gold); }
.menu .mi:hover .ln { color: rgba(243, 242, 238, 0.88); }
.menu .mi[aria-current="true"] .nm { color: var(--bone); }
.menu .mi:focus-visible { outline: 1px solid rgba(243, 242, 238, 0.5); outline-offset: 4px; }

/* ---- present: the same index, on the right ---- */
#present { position: fixed; z-index: 66; right: var(--gutter); top: 4.4rem; width: min(380px, 92vw); display: none; }
#present.on { display: block; animation: menu-in 0.45s var(--ease-atrium) both; }
.pr__t { margin: 0 0 8px; font: 300 12px Inter, system-ui, sans-serif; letter-spacing: 0; color: var(--faint); }

  border: 0; border-top: 1px solid var(--rule); background: transparent; transition: padding 0.35s var(--ease-atrium), border-color 0.35s; }
button.pr__row:hover { padding-left: 12px; border-top-color: rgba(214, 179, 106, 0.6); }

.pr__link { font: 300 15px Inter, system-ui, sans-serif; letter-spacing: 0; color: var(--bone); border-bottom: 1px solid rgba(243, 242, 238, 0.34); padding: 0 0 4px; transition: border-color 0.3s; }

.pr__live.on i { background: #2fe07a; }

/* ---- the viewer (3D model, film) and the TV gate ---- */
#modal { position: fixed; inset: 0; z-index: 90; display: none; background: #000; }
#modal.on { display: block; }
#modal iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

#gate p { max-width: 30rem; margin: 0 auto 0.8rem; color: var(--soft); font: 300 15px/1.6 Inter, system-ui, sans-serif; }

  function toPage(m) { var f = sf(); if (f && f.contentWindow) { try { f.contentWindow.postMessage(Object.assign({ hbs: 1 }, m), '*') } catch (e) {} } }
  function pageOf(h) { return S.s === 'landing' ? 'landing.html' : (h && HOMES[h] ? HOMES[h].page : '') }
  function unload() { var f = sf(); if (f && f.getAttribute('src')) { f.src = 'about:blank'; f.removeAttribute('src') } loaded = ''; ready = false }
  function ensure() {
    var want = pageOf(S.h), f = sf(); if (!want) { unload(); return }
    if (loaded !== want) {
      loaded = want; ready = false;
      try { sessionStorage.removeItem('haavn-my-solum') } catch (e) {}
      f.src = want + '?v=' + SOLV + (TV ? '&tv=1' : '');
    }
  }
  function open(h) {
    closeMenus(); resetPicks(); unload(); S.s = 'home'; S.h = h; S.sec = 'overview';
    if (HOMES[h] && HOMES[h].page === 'solum.html') { S.cl = 'urban'; S.p = 'urban' }      // Urban Earth is the opening exterior and interior of SOLUM Studio and SOLUM Plus
    render()
  }
  function toLanding() { closeMenus(); unload(); S.s = 'landing'; S.h = ''; S.sy = 0; render() }

  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || !m.hbs) return; var f = sf(); if (!f || e.source !== f.contentWindow) return;
    if (m.type === 'ready') {
      ready = true;
      if (TV) toPage({ type: 'apply', st: picks(), scroll: true });
      else { toPage({ type: 'apply', st: picks() }); if (S.sec && S.sec !== 'overview') toPage({ type: 'goto', sec: S.sec, instant: true }); try { f.contentWindow.focus() } catch (x) {} }
      return;
    }
    if (m.type === 'key') { if (m.key === 'Escape') { closeMenus(); closeModal() } else fs(); return }
    if (m.type === 'res') { res(m.kind, m.h); return }
    if (m.type === 'menu') { toggleMenu(m.which); return }
    if (m.type === 'state' && !TV && S.s === 'home') {
      var st = m.st; if (st.h && HOMES[st.h]) S.h = st.h;
      ['cl', 'p', 'm', 't', 'it', 'd', 'sy', 'sec', 'lb'].forEach(function (k) { if (st[k] !== undefined) S[k] = st[k] });
      render();
    }
  });

  /* ── render ──────────────────────────────────────────────────────────── */
  function render(fromRemote) {
    validate();
    var home = S.s === 'home';
    document.body.classList.toggle('sc', home && S.sy > 0.012);
    document.body.classList.toggle('lbx', home && !!S.lb);
    $('#sc-home').classList.add('on');
    paintMenus();
    ensure();
    if (TV && ready) toPage({ type: 'apply', st: picks(), scroll: true });
    save(); if (!fromRemote) broadcast();
  }

  /* ── the resources of a SOLUM: brochure, 3D model, launch film ───────── */
  function openModal(src) {
    var m = $('#modal');
    m.innerHTML = '<button class="mx" id="mdX" type="button">Return</button>' +
      (src ? '<iframe src="' + src + '" title="Viewer" allow="fullscreen; autoplay"></iframe>' : '<div class="note"><p>The brochure, 3D model and launch film open from ATRIUM.</p></div>');
    m.classList.add('on');
  }
  function closeModal() { var m = $('#modal'); m.classList.remove('on'); m.innerHTML = '' }
  window.addEventListener('message', function (e) { if (e.data === 'haavn-3d-close') closeModal() });
  function res(kind, h) {
    var H = HOMES[h] || HOMES[S.h]; if (!H) return;
    var u = kind === 'brochure' ? H.brochure : kind === 'model' ? H.model : H.launch;
    if (!u) return;
    if (!APP) { openModal(''); return }
    if (kind === 'brochure') window.open(u, '_blank', 'noopener'); else openModal(u);
  }

  /* ── the chrome ──────────────────────────────────────────────────────── */
  function fs() { var d = document.documentElement; if (document.fullscreenElement) { document.exitFullscreen() } else if (d.requestFullscreen) { d.requestFullscreen() } }
  if (!EMBED) $('#retBtn').remove();
  if (!APP) { var pv = $('#prevStudio'); if (pv) pv.remove() }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) { closeMenus(); return }
    if (t.id === 'logo') { toLanding(); return }
    if (t.dataset.menu) { toggleMenu(t.dataset.menu); return }
    if (t.dataset.open) { open(t.dataset.open); return }
    if (t.id === 'retBtn') { try { parent.postMessage('haavn-ds-close', '*') } catch (x) {} return }
    if (t.id === 'mdX') { closeModal(); return }
    if (t.id === 'presentBtn') { var p = $('#present'), on = !p.classList.contains('on'); closeMenus(); p.classList.toggle('on', on); t.setAttribute('aria-expanded', on); wash(); return }
    if (t.id === 'tvOpen') { var w = window.open(location.pathname + '?tv=1', 'hb-tv', 'width=1280,height=720'); if (w) { wins.push(w); setTimeout(broadcast, 900) } return }
    if (t.id === 'pairGo') { var c = ($('#pairIn').value || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (c.length !== 4) { pairStatus('Type the four letters shown on the TV'); return } ROOM = c; paired = true; pairStatus('Connecting to TV ' + c); relay(); return }
    if (t.id === 'pairStop') { paired = false; ROOM = null; pairStatus('Not paired'); return }
    if (t.id === 'fsBtn') { fs(); return }
    if (t.id === 'prevStudio') { location.href = '/haavn-black-studio.html?v=20261008c'; return }
    if (!t.closest('#present') && !t.closest('.menu')) closeMenus();
  });
  $('#pairIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#pairGo').click(); e.stopPropagation() });
  $('#pairUrl').textContent = (APP ? location.origin + location.pathname + '?tv=1' : 'the address of this page, with ?tv=1 on the end');
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return; if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') fs(); else if (e.key === 'Escape') { closeMenus(); closeModal() }
  });
  window.__hb = { S: S, open: open, render: render, HOMES: HOMES, toggleMenu: toggleMenu };
  validate(); render(); liveDot();
})();
</script>
