*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg0);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:13.5px}

button,input,select,textarea{font:inherit;color:inherit}

.sub{color:var(--ink-3);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}

.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.kpi .k{color:var(--ink-3)}

.kpi .d{color:var(--ink-3);font-size:12px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--pill);padding:7px 13px;border-radius:100px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink-4)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1b1e;font-weight:600}

.pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:500;border:1px solid var(--line);background:var(--pill)}

table{width:100%;border-collapse:collapse}

textarea{min-height:90px;resize:vertical}

.tools select{width:auto}

.ghead .glabel{z-index:8;display:flex;align-items:flex-end;padding:0 12px 8px;color:var(--ink-4)}
.gchart{position:relative;flex:none}

.grow .glabel .nm{overflow:hidden;text-overflow:ellipsis;flex:1;cursor:pointer}

.grow .glabel .ow{color:var(--ink-4);font-size:11px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bar{position:absolute;top:7px;height:20px;border-radius:7px;cursor:grab;touch-action:none;overflow:hidden;border:1px solid rgba(0,0,0,.12)}
.bar.ro{cursor:pointer}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3)}

.bar .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}.bar .h.l{left:0}.bar .h.r{right:0}

svg.deps{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.tip{position:fixed;z-index:999;background:var(--ink);color:var(--bg0);padding:5px 10px;border-radius:8px;font-size:11.5px;pointer-events:none;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-3);font-size:11.5px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,10,14,.5);z-index:100;display:grid;place-items:center;backdrop-filter:blur(3px)}
.modal{background:var(--bg1);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;gap:10px;justify-content:space-between;margin-top:10px}
.pbar{height:6px;background:var(--pill);border-radius:10px;overflow:hidden;min-width:70px}.pbar i{display:block;height:100%;background:var(--green)}
.quote{display:grid;grid-template-columns:24px 1.5fr 1fr 1fr 100px 30px;gap:10px;align-items:center;padding:7px 0}
.pcgwrap{display:grid;grid-template-columns:260px 1fr;gap:16px}
.mlist button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);padding:10px 13px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.mlist button.on{border-color:var(--accent);background:rgba(214,179,106,.12)}
.mlist button .d{font-weight:600}.mlist button .s{color:var(--ink-3);font-size:11.5px}
.ag li{margin:0 0 6px 18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg0);padding:10px 18px;border-radius:100px;z-index:300;font-size:13px}
.rag{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.note{color:var(--ink-3);font-size:12px}
.client .dmonly{display:none!important}
.hide{display:none!important}
html.embed .hub,html.embed .wm,html.embed .tag{display:none}
html.embed .top{height:46px}
html.embed main{padding:16px 18px 40px}
html.embed .gwrap{max-height:calc(100vh - 230px)}
.bar.sup,.msd.sup{opacity:.4}
.pathbanner{display:flex;gap:12px;align-items:center;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--pill);margin-bottom:14px;color:var(--ink-2);font-size:12.5px}
.pathbanner b{color:var(--ink)}

 '<div class="pcgwrap"><div class="mlist">'+ds.map(function(n){var mm=S.meetings[n2d(n)],na=mm?mm.actions.length:0;return'<button data-m="'+n+'" class="'+(n===sel?"on":"")+'"><div class="d">'+fmt(n2d(n))+(n===np?' <span class="pill" style="color:var(--accent)">next</span>':n<TODAY?' <span class="pill">held</span>':"")+'</div><div class="s">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][(n+4)%7]+(na?" · "+na+" actions":"")+'</div></button>';}).join("")+'</div>'+
 '<div><div class="card"><div class="row wrap"><h2 style="flex:1">PCG '+fmt(n2d(sel))+'</h2><button class="btn noprint" id="mail">Email agenda</button></div>'+
 '<div class="grid g2" style="margin-top:12px"><div><div class="mono" style="color:var(--accent);margin-bottom:6px">1. Programme this fortnight</div>'+li(active,function(t){return"<li>"+esc(t.name)+' <span class="note">'+esc(t.owner)+" · due "+fmt(t.end,1)+"</span></li>";})+
 '<div class="mono" style="color:var(--accent);margin:12px 0 6px">2. Starting next</div>'+li(starting,function(t){return"<li>"+esc(t.name)+' <span class="note">'+fmt(t.start,1)+"</span></li>";})+
 '<div class="mono" style="color:var(--accent);margin:12px 0 6px">3. Milestones in next 6 weeks</div>'+li(mss,function(t){return"<li>"+esc(t.name)+' <span class="note">'+fmt(t.end,1)+"</span></li>";})+'</div>'+
 '<div><div class="mono" style="color:var(--red-t);margin-bottom:6px">4. Late, delayed or critical</div>'+li(lateT,function(t){return"<li>"+esc(t.name)+' <span class="note st-'+t.status+'">'+(isLate(t)?"past due "+fmt(t.end,1):t.status)+"</span></li>";})+
 '<div class="mono" style="color:var(--accent);margin:12px 0 6px">5. Consultant quotes</div>'+(out.length?'<div class="note">'+out.length+' fee lines still awaiting a price.</div>':'<div class="note">All lines priced.</div>')+li(multi,function(l){return"<li>"+esc(l.disc+": "+l.scope)+' <span class="note">client to choose between '+l.quotes.length+" quotes</span></li>";})+'</div></div></div>'+
 '<div class="card" style="margin-top:14px"><div class="mono" style="color:var(--accent);margin-bottom:8px">Minutes</div>'+
 '<label class="f"><span class="mono">Attendees</span><input type="text" id="m_att" value="'+esc(m.attendees)+'"></label><label class="f"><span class="mono">Discussion</span><textarea id="m_notes">'+esc(m.notes)+'</textarea></label><label class="f"><span class="mono">Decisions</span><textarea id="m_dec" style="min-height:60px">'+esc(m.decisions)+'</textarea></label>'+
