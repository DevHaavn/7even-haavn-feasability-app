<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAAVN · Entrance preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PREVIEW ONLY — the HAAVN wordmark entrance. Not linked from anywhere.

   The wordmark splits at 58.42% of its width, which is the one genuinely empty
   column in the artwork (px 1395–1409 of 2400) — the gap before the final N.
   So the cut runs through blank paper: no sliced stroke, no shadow edge, and
   the two halves rejoin pixel-perfect. HAAV comes in from off-screen left,
   the N follows it in from off-screen right.

   Pick a speed below and I'll port that one into the live page.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#e2e4e2; --tablet:#fafbfa;
  --ink:#101010; --ink-2:#2c2c2c; --ink-3:#6c6e6c; --ink-4:#9a9c9a;
  --hair:#c4c6c4;
  --lime:#a8bc10; --lime-txt:#687808;
  --f-display:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --d:1.8s;                       /* travel time for each half */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:300;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
#stage .wash{position:absolute;inset:0;
  background:radial-gradient(100% 70% at 50% 26%, rgba(168,188,16,.06) 0%, rgba(226,228,226,0) 60%)}
#stage .vig{position:absolute;inset:0;
  background:radial-gradient(140% 120% at 50% 46%, rgba(226,228,226,0) 42%, rgba(168,170,168,.24) 100%)}
/* the corner device, at the new smaller size */
#stage .device{position:absolute;right:-6vw;bottom:-7vh;width:min(39vw,630px);height:auto;
  opacity:0;animation:deviceIn 2.6s ease 2.2s forwards}
@keyframes deviceIn{to{opacity:.26}}

#shell{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;padding:0 clamp(16px,3.4vw,46px)}

/* ── the wordmark, in two halves ─────────────────────────────────────── */
.mk{position:relative;width:min(54vw,620px);aspect-ratio:2400/281}
.mk img{position:absolute;inset:0;width:100%;height:100%;display:block;
  filter:drop-shadow(0 10px 26px rgba(16,16,16,.14))}
.mk .l{clip-path:inset(0 41.58% 0 0);transform:translateX(-125vw)}
.mk .r{clip-path:inset(0 0 0 58.42%);transform:translateX(125vw)}
.mk.go .l{animation:slideL var(--d) cubic-bezier(.16,.86,.26,1) .25s forwards}
.mk.go .r{animation:slideR var(--d) cubic-bezier(.16,.86,.26,1) calc(.25s + var(--d) * .5) forwards}
@keyframes slideL{to{transform:translateX(0)}}
@keyframes slideR{to{transform:translateX(0)}}

.subline{margin-top:clamp(18px,2.8vh,32px);display:flex;align-items:center;gap:16px;opacity:0}
.mk.go ~ .subline{animation:fade 1.4s ease calc(.25s + var(--d) * 1.5 + .25s) forwards}
.subline span{font-family:var(--f-mono);font-size:9px;letter-spacing:.42em;color:var(--ink-3);white-space:nowrap}
.subline .dot{width:4px;height:4px;border-radius:50%;background:var(--lime-txt)}
@keyframes fade{to{opacity:1}}

/* ── preview controls (never ship) ───────────────────────────────────── */
.ctl{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:8px}
.ctl b{font-family:var(--f-mono);font-weight:400;font-size:8px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--ink-4);margin-right:6px}
.ctl button{padding:9px 15px;border:1px solid transparent;border-radius:2px;
  border-image:linear-gradient(180deg,#4a4a4a 0%,#141414 32%,#000 58%,#2e2e2e 88%,#181818 100%) 1;
  background:rgba(250,251,250,.06);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);
  transition:.3s}
.ctl button:hover{background:rgba(250,251,250,.2)}
.ctl button.on{box-shadow:inset 3px 0 0 var(--lime);color:var(--ink)}
.note{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;
  font-family:var(--f-mono);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-4)}
</style>
</head>
<body>

<div id="stage">
  <div class="wash"></div>
  <img class="device" src="assets/brand/haavn-device-d4e84a.png" alt="">
  <div class="vig"></div>
</div>

<div id="shell">
  <div class="mk" id="mk">
    <img class="l" src="assets/brand/haavn-wordmark-black.png" alt="">
    <img class="r" src="assets/brand/haavn-wordmark-black.png" alt="HAAVN">
  </div>
  <div class="subline">
    <span>A SUPPLY BUSINESS</span><span class="dot"></span><span>NOT A BUILDER</span>
  </div>
</div>

<div class="ctl">
  <b>Speed</b>
  <button data-d="1.4s">Quick · 1.4s</button>
  <button data-d="1.8s" class="on">Slow · 1.8s</button>
  <button data-d="2.6s">Slower · 2.6s</button>
  <button id="replay">↻ Replay</button>
</div>
<div class="note">Preview · pick a speed and I'll port it into the live page</div>

<script>
(function(){
  var mk = document.getElementById('mk');
  function play(){
    mk.classList.remove('go');
    void mk.offsetWidth;               /* restart the animation */
    mk.classList.add('go');
  }
  document.querySelectorAll('.ctl button[data-d]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.ctl button[data-d]').forEach(function(o){ o.classList.remove('on'); });
      b.classList.add('on');
      document.documentElement.style.setProperty('--d', b.dataset.d);
      play();
    });
  });
  document.getElementById('replay').addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
