<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HORI7ON · Project Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d6b36a;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif}
html,body{height:100%}
body{font-family:var(--sans);background:#040404;color:#e8e9eb;overflow:hidden}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,4,4,.72),rgba(4,4,4,.55) 44%,rgba(4,4,4,.9))}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:22px;z-index:30;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#c9cdd2;
  background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:2px;padding:9px 14px;transition:.3s;text-decoration:none}
.back:hover{border-color:rgba(214,179,106,.75);color:#fff;background:rgba(214,179,106,.07)}
.stage{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 90px}
.mark{width:clamp(280px,46vw,720px);height:auto;filter:drop-shadow(0 0 18px rgba(214,179,106,.35)) drop-shadow(0 0 60px rgba(214,179,106,.14));
  opacity:0;animation:mfade 2.6s ease-out .3s forwards}
@keyframes mfade{to{opacity:1}}
.sub{font-family:var(--mono);font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:#9aa0a6;margin-top:22px;text-align:center;
  opacity:0;animation:mfade 2.2s ease-out 1.4s forwards}
.line{width:230px;height:1px;background:linear-gradient(90deg,transparent,rgba(214,179,106,.5),transparent);margin-top:26px;
  opacity:0;animation:mfade 2.2s ease-out 1.9s forwards}
.enterst{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;padding:13px 46px;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#d6d9dd;
  background:transparent;border:1px solid rgba(214,179,106,.5);border-radius:2px;transition:.35s;
  opacity:0;animation:mfade 2.2s ease-out 2.3s forwards}
.enterst:hover{border-color:rgba(214,179,106,.9);color:#fff;background:rgba(214,179,106,.08);box-shadow:0 0 28px -10px rgba(214,179,106,.65)}
.enterst .tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6.5px solid var(--gold)}
.fadeout{position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fadeout.on{opacity:1;pointer-events:auto}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(6,7,8,.92),#050607);padding:0 clamp(18px,3.4vw,46px)}
.hair{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 12%,rgba(255,255,255,.16) 88%,transparent)}
.frail{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px 14px;white-space:nowrap}
.atr{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:#c3c7cd;text-decoration:none}
.tri{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:7px solid rgba(255,255,255,.55);transform:translateY(-1px)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:#8a8f95;text-transform:uppercase}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline preload="auto" src="/haavn-black-bg.mp4"></video>
<div class="scrim"></div>
<a class="back" href="/">&#8592; ATRIUM</a>
<div class="stage">
  <img class="mark" src="/hori7on-gold.png" alt="HORI7ON">
  <div class="sub">A 7EVEN Development &nbsp;&#183;&nbsp; Project Overview Display</div>
  <div class="line"></div>
  <button class="enterst" onclick="enterStudio()"><span class="tri"></span>Enter Studio</button>
</div>
<div class="foot">
  <div class="hair"></div>
  <div class="frail">
    <a class="atr" href="/"><span class="tri"></span>ATRIUM</a>
    <span class="tag">HORI7ON &#183; 7EVEN</span>
  </div>
</div>
<div class="fadeout" id="fadeout"></div>
<script>
function enterStudio(){
  document.getElementById('fadeout').classList.add('on');
  setTimeout(function(){ window.location.href='/hori7on-studio.html'; }, 950);
}
</script>
</body>
</html>
