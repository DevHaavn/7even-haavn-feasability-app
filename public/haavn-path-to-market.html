<style>
:root{
  --bone:#ECE8DE;--paper:#F4F1E9;--card:#FBFAF6;--ink:#1A1714;--ink2:#403A32;--ink3:#736E62;
  --line:#D6D0C2;--line2:#C4BDAB;--gold:#9A7526;--goldl:#C39A46;
  --char:#17150F;--char2:#211E17;--charline:#332F26;
  --green:#3C6E47;--greenbg:#E4EBE0;--amber:#9A6B1F;--amberbg:#F3E9D4;--red:#8A3A2E;--redbg:#F1E0DA;--blue:#2A4C6B;--bluebg:#E1E8EE;
  --sh:0 1px 2px rgba(26,23,20,.05),0 8px 24px rgba(26,23,20,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bone);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.mono{font-family:'IBM Plex Mono',monospace}
/* chrome */
.topbar{height:54px;background:var(--char);color:#E9E5DB;display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:40;border-bottom:1px solid #000}
.home-btn{font-size:12px;color:#B9B3A5;text-decoration:none;font-weight:600}
.home-btn:hover{color:#fff}
.brand svg{height:19px;display:block}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;color:#75715F;font-weight:600}
.savepill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:#B9B3A5;background:#0C0B08;border:1px solid var(--charline);padding:5px 11px;border-radius:20px;white-space:nowrap}
.savepill .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.savepill.saving .dot{background:var(--goldl);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.tabsbar{background:var(--char);padding:0 24px;display:flex;gap:2px;position:sticky;top:54px;z-index:39;border-bottom:1px solid #000;overflow-x:auto}
.tabsbar button{padding:12px 16px;font-size:12.5px;font-weight:600;color:#8C8578;border-bottom:2px solid transparent;letter-spacing:.01em;white-space:nowrap}
.tabsbar button.on{color:#fff;border-bottom-color:var(--goldl)}
.wrap{max-width:1280px;margin:0 auto;padding:26px 30px 70px}
/* headers */
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;font-weight:600}
.sec-head{margin-bottom:22px}
h1.title{font-size:30px;font-weight:800;letter-spacing:-.026em;line-height:1.04;margin-top:6px}
h1.title i{font-style:normal;color:var(--ink3)}
.lede{color:var(--ink3);font-size:13.5px;margin-top:7px;max-width:770px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line2);color:var(--ink);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--ink3);background:#fff}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.gold:hover{background:#87651f}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.danger{color:var(--red)}.btn.danger:hover{background:var(--redbg);border-color:var(--red)}
.ml-auto{margin-left:auto}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px;box-shadow:var(--sh)}
.kpi.hl{background:var(--char);border-color:#000;color:var(--paper)}
.kpi .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.kpi.hl .k{color:#8C8578}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:7px;line-height:1}
.kpi .v .u{font-size:15px;color:var(--gold);font-weight:700}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:6px}.kpi.hl .s{color:#A39C8C}
/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);overflow:hidden;margin-bottom:18px}
.panel-h{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.panel-h .sub{font-size:11.5px;color:var(--ink3)}
.panel-b{padding:16px 18px}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}
/* pills */
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.done{background:var(--greenbg);color:var(--green)}
.pill.inprogress{background:var(--amberbg);color:var(--amber)}
.pill.todo{background:var(--bone);color:var(--ink3)}
.pill.risk{background:var(--redbg);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--ink2)}
/* rag cards */
.ragstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ragcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer;transition:.12s;box-shadow:var(--sh)}
.ragcard:hover{border-color:var(--ink3);transform:translateY(-1px)}
.ragcard .top{display:flex;align-items:center;gap:9px}
.ragcard .nm{font-weight:800;font-size:14px;letter-spacing:-.01em}
.ragcard .sub{font-size:10.5px;color:var(--ink3);margin-top:3px}
.prog{height:7px;background:var(--bone);border-radius:20px;overflow:hidden;margin:12px 0 6px}
.prog>span{display:block;height:100%;border-radius:20px}
.ragcard .foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3)}
/* gates */
.gates{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px}
.gate{flex:none;width:158px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.gate.done{background:var(--char);border-color:var(--char);color:var(--paper)}
.gate .g{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.gate .gt{font-size:12px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.gate .gu{font-size:10px;color:var(--ink3);margin-top:5px;line-height:1.4}
.gate.done .gu{color:#A39C8C}
.gate .gd{margin-top:8px}
.gate .gd input{width:100%;background:transparent;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-size:10px;font-family:'IBM Plex Mono',monospace;color:inherit}
.gate.done .gd input{border-color:var(--charline);color:#C9C3B4}
/* critical path */
.cpath{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.cpath .node{background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:8px;font-weight:600;font-size:11.5px}
.cpath .node.hl{background:var(--gold)}
.cpath .arr{color:var(--ink3)}
/* process phases */
.phase{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.phase-h{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--line)}
.phase-h .pnum{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:14px}
.phase-h .pn{font-size:15px;font-weight:800;letter-spacing:-.015em}
.phase-h .pmo{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.06em;margin-top:1px}
.phase-h .pgoal{font-size:11.5px;color:var(--ink3);margin-top:2px}
.phase-b{padding:12px 16px}
.phline{display:flex;align-items:center;gap:11px;padding:9px 4px;border-top:1px solid var(--line)}
.phline:first-child{border-top:none}
.phline .pt{flex:1;min-width:0}
.phline .ptt{font-weight:600;font-size:13px}
.phline .pts{font-size:11px;color:var(--ink3)}
/* deliverable rows */
.delrow{display:grid;grid-template-columns:5px 1fr 138px 128px 78px;gap:12px;align-items:center;padding:12px 15px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--card);transition:.12s}
.delrow:hover{border-color:var(--line2)}
.delrow .bar{width:5px;height:40px;border-radius:4px}
.delrow .main{min-width:0}
.delrow .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.delrow .dsub{font-size:11.5px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delrow .who{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.gateflag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.datein,.stsel,.inp{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12px;background:#fff;width:100%}
.datein{font-family:'IBM Plex Mono',monospace}
.stsel{font-weight:600}
.delact{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink3);position:relative;background:#fff}
.iconbtn:hover{border-color:var(--ink3);color:var(--ink)}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.deledit{border:1px solid var(--line2);border-radius:12px;margin:-2px 0 10px;background:var(--paper);padding:15px 16px}
.deledit textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;resize:vertical;min-height:46px;background:#fff}
.fgrid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.fgrid label{flex:1;min-width:180px;font-size:11px;color:var(--ink3)}
.fgrid input,.fgrid select{width:100%;margin-top:4px;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;font-size:12.5px;background:#fff}
.mlbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:8px}
.note{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px;background:#fff}
.note .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);margin-bottom:3px}
.note .tx{font-size:12.5px;color:var(--ink2);line-height:1.45}
.att{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff;font-size:12.5px}
.att .fi{width:24px;height:24px;border-radius:5px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex:none}
.att a{color:var(--blue);text-decoration:none;font-weight:600}
.att .sz{margin-left:auto;color:var(--ink3);font-size:11px}
/* timeline */
.tl{overflow-x:auto}
.tlgrid{min-width:900px}
.tlhead{display:grid;grid-template-columns:160px repeat(6,1fr);border-bottom:1px solid var(--line)}
.tlhead .mh{padding:10px 8px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-align:center;color:var(--ink2);border-left:1px solid var(--line)}
.tlhead .mh.hot{color:var(--gold)}
.tlrow{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid var(--line);min-height:56px}
.tlrow .pn{padding:11px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.tllane{position:relative;border-left:1px solid var(--line)}
.tlgridlines{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none}
.tlgridlines>div{border-left:1px solid var(--line)}
.tlbar{position:absolute;top:50%;transform:translateY(-50%);height:24px;color:#fff;font-size:10px;font-weight:600;padding:0 9px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;box-shadow:0 2px 6px rgba(26,23,20,.18)}
.tlbar.done{background:var(--green)}.tlbar.inprogress{background:var(--gold)}.tlbar.risk{background:var(--red)}.tlbar.todo{background:#7A756A}
.hardline{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:.55;z-index:2}
.hardline .hl-lbl{position:absolute;top:-2px;left:5px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--gold);white-space:nowrap;font-weight:600}
.tllegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:4px}
/* stakeholders */
.team{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tmember{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:7px 10px 7px 8px;background:var(--paper)}
.tmember .av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#F3EFE6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.tmember .tn{font-size:12.5px;font-weight:700;line-height:1.1}
.tmember .tr{font-size:10.5px;color:var(--ink3)}
.tmember .tx{margin-left:4px;color:var(--ink3);font-size:14px;line-height:1}
.tmember .tx:hover{color:var(--red)}
.slist{border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 0}
.hide{display:none!important}
.empty{text-align:center;padding:34px 20px;color:var(--ink3)}
.empty .ei{font-size:24px;opacity:.4}
@media(max-width:1000px){.kpis,.ragstrip{grid-template-columns:1fr 1fr}.delrow{grid-template-columns:5px 1fr;gap:9px}.delrow>.datein,.delrow>.stsel,.delrow>.delact{grid-column:2}}
</style>
</head>

const SUPA_URL='https://vgvavmnqrdgcnledztyk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZndmF2bW5xcmRnY25sZWR6dHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzIwODEsImV4cCI6MjA5OTU0ODA4MX0.hiWSzfEMXPJGs67iqiuB3hwJVxUO51uu2rygmA5wO10';
const CLOUD_KEY='haavn_path_to_market';
const SUPA_H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
let _cloudOk=false,_cloudTs=0,_pushT=null;
function _isTyping(){const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);}
function _reuidFromDB(){try{const ids=DB.dels.map(d=>d.id);_uid=(ids.length?Math.max(...ids):0)+1;}catch(e){}}
async function cloudPull(){
  try{const r=await fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+CLOUD_KEY+'&select=value,updated_at',{headers:SUPA_H});
    if(!r.ok)return null; _cloudOk=true; const rows=await r.json(); return (rows&&rows.length)?rows[0]:null;
  }catch(e){return null;}
}
function cloudPush(){
  if(!_cloudOk)return; clearTimeout(_pushT);
  _pushT=setTimeout(async()=>{
    try{const body=[{key:CLOUD_KEY,value:stripForSave(),updated_at:new Date().toISOString()}];
      const r=await fetch(SUPA_URL+'/rest/v1/capital_kv',{method:'POST',headers:Object.assign({},SUPA_H,{Prefer:'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(body)});
      if(r.ok){const rows=await r.json(); if(rows&&rows[0])_cloudTs=Date.parse(rows[0].updated_at)||Date.now();}
    }catch(e){}
  },500);
}
async function cloudPoll(){
  if(!_cloudOk||_isTyping())return;
  try{const r=await fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+CLOUD_KEY+'&select=updated_at',{headers:SUPA_H});
    if(!r.ok)return; const rows=await r.json(); if(!rows||!rows.length)return;
    const ts=Date.parse(rows[0].updated_at)||0;
    if(ts>_cloudTs){const row=await cloudPull(); if(!row||!row.value)return;
      DB=row.value; _cloudTs=ts; _reuidFromDB(); try{localStorage.setItem(KEY,JSON.stringify(stripForSave()));}catch(e){}
      render();
    }
  }catch(e){}
}

function get(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function set(o,p,v){const ks=p.split('.');const last=ks.pop();let t=o;ks.forEach(k=>t=t[k]);t[last]=v;}
function shortDate(iso){if(!iso)return '—';const d=new Date(iso+'T00:00');return isNaN(d)?iso:d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'});}
function datePct(iso){const d=new Date(iso+'T00:00');const p=(d-M_START)/(M_END-M_START)*100;return Math.max(0,Math.min(100,p));}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('');}
function delsBy(key,val){return DB.dels.filter(d=>d[key]===val).sort((a,b)=>a.due.localeCompare(b.due));}
function stakeStats(sid){const ds=delsBy('stake',sid);const done=ds.filter(d=>d.status==='done').length;const risk=ds.some(d=>d.status==='risk');
  const next=ds.find(d=>d.status!=='done');const pct=ds.length?Math.round(ds.reduce((a,d)=>a+(d.status==='done'?100:d.pct),0)/ds.length):0;
  return {total:ds.length,done,pct,risk,next};}
function ragColor(sid){const s=stakeStats(sid);if(s.risk)return 'var(--red)';if(s.pct===100)return 'var(--green)';if(s.pct>=50)return 'var(--goldl)';return 'var(--gold)';}
function phaseStats(pid){const ds=delsBy('phase',pid);const done=ds.filter(d=>d.status==='done').length;
  const pct=ds.length?Math.round(ds.reduce((a,d)=>a+(d.status==='done'?100:d.pct),0)/ds.length):0;return {total:ds.length,done,pct};}

/* ---------- TIMELINE ---------- */
function vTimeline(){
  const rows=DB.stakeholders.map(p=>{const ds=delsBy('stake',p.id);
    return `<div class="tlrow"><div class="pn"><span class="dotc" style="background:${p.color}"></span>${esc(p.name.split(' ')[0])}${p.id==='fraser'?' & P.':p.id==='hamilton'?' Marino':' Tech'}</div>
     <div class="tllane"><div class="tlgridlines">${MONTHS.map(()=>'<div></div>').join('')}</div>
      ${ds.map(d=>{const l=datePct(d.start),r=datePct(d.due);const w=Math.max(4,r-l);
        return `<div class="tlbar ${d.status}" style="left:${l}%;width:${w}%" data-act="editDelTL" data-id="${d.id}" title="${esc(d.title)} · ${shortDate(d.start)}–${shortDate(d.due)}">${esc(d.title.length>26?d.title.slice(0,24)+'…':d.title)}</div>`;}).join('')}
     </div></div>`;
  }).join('');
  return `<div class="sec-head"><div class="eyebrow">Six months of deliverables · ${esc(DB.meta.window)}</div><h1 class="title">Timeline</h1>
    <p class="lede">Every partner's deliverables as start-to-due bars across the six-month plan. Two hard dates anchor it — 1 Sep volume supply opens and Dec Black Series launch. Click any bar to edit it.</p></div>
   <div class="panel"><div class="panel-b tl"><div class="tlgrid">
    <div class="tlhead"><div class="mh" style="border-left:none"></div>${MONTHS.map(([m,y],i)=>`<div class="mh ${m==='SEP'||m==='DEC'?'hot':''}">${m} ${y}</div>`).join('')}</div>
    <div style="position:relative">${rows}
      <div style="position:absolute;left:160px;right:0;top:0;bottom:0;pointer-events:none">
        <div class="hardline" style="left:${datePct('2026-09-01')}%"><span class="hl-lbl">1 Sep · volume opens</span></div>
        <div class="hardline" style="left:${datePct('2026-12-01')}%"><span class="hl-lbl">Dec · launch</span></div>
      </div>
    </div>
   </div></div></div>
   <div class="tllegend">
     ${STATUSES.map(s=>`<span><span class="tlbar ${s}" style="position:static;display:inline-flex;height:auto;padding:2px 8px;box-shadow:none">${ST_LABEL[s]}</span></span>`).join('')}
   </div>`;
}

/* ---------- STAKEHOLDERS ---------- */
function vStakeholders(){
  return `<div class="h-row"><div><div class="eyebrow">Partners in precision</div><h1 class="title">Stakeholders</h1>
    <p class="lede">The shareholder view of the blueprint — each delivery partner, their team, live progress, next due date and status. Everything here is editable.</p></div>
    <button class="btn pri" data-act="addStake">＋ Add stakeholder</button></div>
   ${DB.stakeholders.map(p=>{const s=stakeStats(p.id);const ds=delsBy('stake',p.id);
    return `<div class="panel"><div class="panel-h"><span class="dotc" style="width:12px;height:12px;background:${p.color}"></span>
      <input class="inp" style="font-size:14px;font-weight:800;border:none;background:transparent;width:auto;min-width:180px;padding:2px 0" value="${esc(p.name)}" data-bind="s:${p.id}:name">
      <input class="inp" style="font-size:11.5px;color:var(--ink3);border:none;background:transparent;width:auto;min-width:150px;padding:2px 0" value="${esc(p.sub)}" data-bind="s:${p.id}:sub">
      <span class="ml-auto pill ${s.pct===100?'done':s.risk?'risk':'inprogress'}"><span class="d"></span>${s.pct}% complete</span>
      <button class="iconbtn" data-act="delStake" data-id="${p.id}" title="Remove stakeholder">×</button></div>
     <div class="panel-b">
      <div class="team">${p.team.map(m=>`<div class="tmember"><span class="av">${esc(initials(m.n))}</span><div><div class="tn">${esc(m.n)}</div><div class="tr">${esc(m.r)}</div></div><button class="tx" data-act="rmMember" data-id="${p.id}" data-mid="${m.id}" title="Remove">×</button></div>`).join('')}
        <button class="btn sm" data-act="addMember" data-id="${p.id}">＋ Person</button></div>
      <div class="prog" style="height:9px"><span style="width:${s.pct}%;background:${ragColor(p.id)}"></span></div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-bottom:8px"><span>${s.done} of ${s.total} deliverables complete</span><span>${s.next?'Next: '+esc(s.next.title)+' · '+shortDate(s.next.due):'All complete'}</span></div>
      ${ds.map(d=>`<div class="slist"><span class="pill ${d.status}"><span class="d"></span>${ST_LABEL[d.status]}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(d.title)} ${d.gate?'<span class="gateflag">◆</span>':''}</div><div style="font-size:11px;color:var(--ink3)">${esc(d.owner)} · ${phase(d.phase)?esc(phase(d.phase).month):''}</div></div>
        <span class="mono" style="font-size:12px;color:var(--ink2)">${shortDate(d.due)}</span>
        <button class="btn sm" data-act="editDelJump" data-id="${d.id}">Open</button></div>`).join('')}
     </div></div>`;}).join('')}`;
}

/* ===========================================================
   MUTATIONS
   =========================================================== */
function addPhase(){const n=DB.phases.length+1;DB.phases.push({id:'ph'+uid(),name:'New phase '+n,month:'2026',color:'#736E62',goal:'Describe the goal of this phase…'});save();render();}
function delPhase(id){if(delsBy('phase',id).length&&!confirm('This phase has deliverables. Remove the phase anyway? (deliverables stay, unassigned)'))return;DB.phases=DB.phases.filter(p=>p.id!==id);save();render();}
function addDel(pid,sid){const d=mkDel([pid||DB.phases[0].id,sid||DB.stakeholders[0].id,'New deliverable','Describe the deliverable…','2026-09-01','2026-09-15','todo','Owner',false,0]);DB.dels.push(d);openId=d.id;save();
  if(tab!=='deliverables'){tab='deliverables';}render();
  setTimeout(()=>{const e=document.querySelector('.deledit');if(e)e.scrollIntoView({block:'center'});},60);}
function rmDel(id){DB.dels=DB.dels.filter(d=>d.id!==id);openId=null;save();render();}
function editDel(id){openId=openId===id?null:id;render();}
function editDelJump(id){tab='deliverables';delGroup='phase';openId=id;render();setTimeout(()=>{const e=document.querySelector('.deledit');if(e)e.scrollIntoView({block:'center'});},60);}
function addNote(id){const inp=document.getElementById('note_'+id);const tx=inp.value.trim();if(!tx)return;
  del(id).notes.unshift({who:'You',when:new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'short'}),tx});save();render();
  setTimeout(()=>{const e=document.querySelector('.deledit');if(e)e.scrollIntoView({block:'center'});},40);}
function addStake(){DB.stakeholders.push({id:'st'+uid(),name:'New stakeholder',sub:'Role',color:'#736E62',team:[]});save();render();}
function delStake(id){if(!confirm('Remove this stakeholder? Their deliverables remain but become unassigned.'))return;DB.stakeholders=DB.stakeholders.filter(s=>s.id!==id);save();render();}
function addMember(sid){stake(sid).team.push({id:'m'+uid(),n:'New person',r:'Role'});save();render();}
function rmMember(sid,mid){const s=stake(sid);s.team=s.team.filter(m=>m.id!==mid);save();render();}
function toggleGate(i){DB.gates[i].done=!DB.gates[i].done;if(DB.gates[i].done&&!DB.gates[i].date)DB.gates[i].date=new Date().toISOString().slice(0,10);save();render();}
function attach(id){_fileTarget=id;document.getElementById('fileInput').click();}
function rmAtt(id,i){del(id).atts.splice(i,1);save();render();}
document.getElementById('fileInput').onchange=function(e){const f=e.target.files[0];if(!f||_fileTarget==null)return;
  const d=del(_fileTarget);const url=URL.createObjectURL(f);
  d.atts.push({name:f.name,size:(f.size/1024).toFixed(0)+' KB',when:new Date().toLocaleDateString('en-AU'),url});
  openId=d.id;save();render();e.target.value='';
  setTimeout(()=>{const el=document.querySelector('.deledit');if(el)el.scrollIntoView({block:'center'});},50);};

/* ===========================================================
   EVENT DELEGATION
   =========================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'tab': tab=t.dataset.tab; openId=null; render(); break;
    case 'openStake': tab='stakeholders'; render(); break;
    case 'group': delGroup=t.dataset.g; render(); break;
    case 'addPhase': addPhase(); break;
    case 'delPhase': delPhase(id); break;
    case 'addDel': addDel(); break;
    case 'addDelPhase': addDel(id); break;
    case 'editDel': editDel(+id); break;
    case 'editDelJump': editDelJump(+id); break;
    case 'editDelTL': editDelJump(+id); break;
    case 'rmDel': rmDel(+id); break;
    case 'addNote': addNote(+id); break;
    case 'attach': attach(+id); break;
    case 'rmAtt': rmAtt(+id,+t.dataset.i); break;
    case 'addStake': addStake(); break;
    case 'delStake': delStake(id); break;
    case 'addMember': addMember(id); break;
    case 'rmMember': rmMember(id,t.dataset.mid); break;
    case 'toggleGate': toggleGate(+t.dataset.i); break;
  }
});
/* inline binding: data-bind="<kind>:<id>:<path>" kinds d|s|p|g */
function applyBind(el){
  const b=el.dataset.bind; if(!b)return;
  const [kind,id,...pp]=b.split(':'); const path=pp.join(':');
  let obj;
  if(kind==='d')obj=del(+id);
  else if(kind==='s')obj=stake(id);
  else if(kind==='p')obj=phase(id);
  else if(kind==='g')obj=DB.gates[+id];
  if(!obj)return;
  let v;
  if(el.dataset.bool){v=el.checked;}
  else{v=el.value; if(el.dataset.num){v=parseInt(String(v).replace(/[^0-9-]/g,''),10);if(isNaN(v))v=0;if(el.dataset.clamp)v=Math.max(0,Math.min(+el.dataset.clamp,v));}}
  set(obj,path,v);
  save();
}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.bind&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.type!=='date'&&el.type!=='checkbox')applyBind(el);});
document.addEventListener('change',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.bind)return;
  applyBind(el);
  if(el.dataset.rerender||el.tagName==='SELECT'||el.type==='date'||el.type==='checkbox'){
    /* preserve caret focus is unnecessary for date/select; re-render to refresh rollups */
    render();
  }
});

/* boot */
(async function boot(){
  const row=await cloudPull();
  if(row&&row.value){ DB=row.value; _cloudTs=Date.parse(row.updated_at)||Date.now(); _reuidFromDB(); try{localStorage.setItem(KEY,JSON.stringify(stripForSave()));}catch(e){} }
  else { load(); if(_cloudOk) cloudPush(); }
  render();
  if(_cloudOk) setInterval(cloudPoll, 12000);
})();
</script>
