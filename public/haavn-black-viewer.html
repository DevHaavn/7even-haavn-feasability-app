<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAAVN BLACK · Live model</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   HAAVN BLACK · LIVE MODEL
   The home as a product you can turn around and walk into, the way a car is
   shown. The geometry is the architect's own Rhino model, converted straight
   from the SOLUM internal use model to glTF, so what is on screen is the
   model itself and not an approximation of it.
   three.js is served from this app, so it works with no outside connection.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{--ink:#fff;--ink2:#a9a6a9;--ink3:#7b787b;--bg:#08080a;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.26);--led:#2fe07a;
  --f:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;overflow:hidden;height:100svh}
canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:fixed;inset:0}
.hud{position:fixed;left:0;right:0;bottom:0;padding:16px clamp(12px,3vw,28px) calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;pointer-events:none;
  background:linear-gradient(0deg,rgba(8,8,10,.86),transparent)}
.hud .grp{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:40px;background:rgba(10,10,11,.6);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);pointer-events:auto}
.hud button{height:38px;padding:0 15px;border-radius:30px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink2);transition:.25s;white-space:nowrap}
.hud button:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.hud button.on{color:#eafff2;background:rgba(47,224,122,.14);box-shadow:inset 0 0 0 1px rgba(47,224,122,.5)}
.hud .sw{display:flex;align-items:center;gap:8px}
.hud .sw i{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.3);display:inline-block}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:calc(14px + env(safe-area-inset-top)) clamp(12px,3vw,28px) 14px;background:linear-gradient(180deg,rgba(8,8,10,.8),transparent)}
.top .t{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2)}
.top .t b{color:var(--ink);font-weight:500}
.top .close{margin-left:auto;height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:2px;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;transition:opacity .6s}
.load.gone{opacity:0;pointer-events:none}
.load .in{text-align:center}
.load .bar{width:min(260px,60vw);height:1px;background:rgba(255,255,255,.15);margin:18px auto 0;overflow:hidden}
.load .bar i{display:block;height:100%;width:0;background:var(--led);transition:width .3s}
.load .p{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase;margin-top:12px}
.hint{position:fixed;left:50%;top:calc(50% + 120px);transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;
  letter-spacing:.24em;color:rgba(255,255,255,.35);text-transform:uppercase;transition:opacity .6s;text-align:center;line-height:2}
.hint.gone{opacity:0}
</style>
</head>
<body>
<div id="stage"></div>

<div class="top">
  <span class="t"><b>SOLUM</b> · Live model</span>
  <button class="close" id="close">← Return</button>
</div>

<div class="hud">
  <div class="grp" id="views">
    <button data-view="hero" class="on">Hero</button>
    <button data-view="front">Front</button>
    <button data-view="rear">Rear</button>
    <button data-view="top">Plan</button>
    <button data-view="inside">Inside</button>
  </div>
  <div class="grp" id="finishes"></div>
  <div class="grp" id="light">
    <button data-sky="golden" class="on">Golden</button>
    <button data-sky="day">Day</button>
    <button data-sky="night">Night</button>
  </div>
  <div class="grp">
    <button id="spin" class="on">Auto turn</button>
    <button id="reset">Recentre</button>
  </div>
</div>

<div class="hint" id="hint">Drag to turn · pinch or scroll to zoom · two fingers to pan</div>

<div class="load" id="load"><div class="in">
  <span class="t" style="font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ink2)">HAAVN BLACK · SOLUM</span>
  <div class="bar"><i id="bar"></i></div>
  <div class="p" id="pct">Loading the model</div>
</div></div>

<script type="importmap">
{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const EMBED = /[?&]embed=1/.test(location.search);       // shown inside a product page
if(EMBED) document.querySelector('.top').style.display = 'none';
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
/* Plan cuts the home at 2.2 m: the roof and anything above it comes away */
const CUT = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
/* the light of the place: an environment built from the project's own render,
   so glass, metal and stone pick up the same sky and ground as the imagery */
/* The light of a real sky (Poly Haven, CC0), which is what lifts glass, metal
   and charred timber out of looking like plastic. Day for the walk-around,
   night for the mood the brand is built on. */
const SKIES = { golden:'/haavn-3d/sky_golden.hdr', day:'/haavn-3d/sky_day.hdr', night:'/haavn-3d/sky_night.hdr' };
/* matched to the renders: warm light, mid tone around 0.47, highlights near 0.9 */
const LOOK = {
  golden:{ sun:2.15, sunCol:0xffe4c4, hemi:0.10, env:0.62, exp:0.92, blur:0.22, bg:0.95, fog:0x8d7f6e, inside:1.6, bloom:0.16 },
  day:   { sun:2.1, sunCol:0xffe9cf, hemi:0.12, env:0.60, exp:0.88, blur:0.22, bg:0.85, fog:0x9aa3ab, inside:1.4, bloom:0.10 },
  night: { sun:0.30, sunCol:0xa9c3ff, hemi:0.06, env:0.45, exp:1.15, blur:0.35, bg:0.55, fog:0x0a0c12, inside:7.5, bloom:0.50 }
};
const pmrem = new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
let skyNow = 'day';
function loadSky(which){
  skyNow = which; const L = LOOK[which];
  new RGBELoader().load(SKIES[which], hdr => {
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = pmrem.fromEquirectangular(hdr).texture;
    scene.background = hdr;
    scene.backgroundBlurriness = L.blur; scene.backgroundIntensity = L.bg; scene.environmentIntensity = L.env;
    sun.intensity = L.sun; sun.color.set(L.sunCol);
    hemi.intensity = L.hemi;
    interiorLights.forEach(l => l.intensity = L.inside);
    if(FOG) FOG.color.set(L.fog);
    renderer.toneMappingExposure = L.exp;
    if(window.__bloom) window.__bloom.strength = L.bloom;
  });
}
const FOG = new THREE.Fog(0x24262a, 70, 240); scene.fog = FOG;
const planLight = new THREE.DirectionalLight(0xffffff, 0); planLight.position.set(0, 40, 0); scene.add(planLight);
let planCutY = 2.2;

/* light: a soft room environment for reflections, one sun for the shadow */
const sun = new THREE.DirectionalLight(0xffe9cf, 2.2);
sun.position.set(-14, 16, 11); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 3; sun.shadow.blurSamples = 12;
const d = 26; Object.assign(sun.shadow.camera, { left:-d, right:d, top:d, bottom:-d, near:1, far:90 });
sun.shadow.bias = -0.0006;
const hemi = new THREE.HemisphereLight(0x9fb4c7, 0x14130f, 0.28);
scene.add(sun, hemi);
const interiorLights = [];

/* ground: a quiet plate that takes the shadow */
/* ground: the project's own grass texture, fading out before the horizon so
   the plate never shows an edge */
const grass = new THREE.TextureLoader().load('/haavn-3d/tex/Grass_04_albedo_1k.jpg', t => {
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(90, 90); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 128),
  new THREE.MeshStandardMaterial({ map:grass, color:0x5d5443, roughness:1, metalness:0 }));   // the dry olive ground of the renders
ground.rotation.x = -Math.PI/2; ground.position.y = -0.012; ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.055;
controls.minDistance = 1.2; controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.autoRotateSpeed = 0.45;

/* The finishes. Each one carries its own cladding surface, cut out of the
   Enscape renders themselves: the board pitch, the seams, the grain and the
   colour are the render's own pixels, with the sunset divided back out so the
   viewer lights them once. */
const TEX = new THREE.TextureLoader();
function cladMap(file, rep, srgb){
  const t = TEX.load('/haavn-3d/tex/' + file);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep[0], rep[1]); t.anisotropy = 8;
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const FINISHES = [
  { name:'Black',   sw:'#14161a', map:'clad_black',   rough:0.58, metal:0.03, rep:[1.0, 1.0], nrm:0.85 },
  { name:'Charred', sw:'#24211d', map:'clad_charred', rough:0.82, metal:0.00, rep:[1.0, 1.0], nrm:1.00 },
  { name:'Stone',   sw:'#9b968e', map:'clad_stone',   rough:0.93, metal:0.00, rep:[1.0, 1.0], nrm:0.55 }
];
FINISHES.forEach(f => { f.tex = cladMap(f.map + '.jpg', f.rep, true); f.nmap = cladMap(f.map + '_n.jpg', f.rep, false); });
const cladding = [], cladMesh = [], roof = [];
const fbox = document.getElementById('finishes');
FINISHES.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === 0 ? ' on' : '');
  b.innerHTML = '<i style="background:' + f.sw + '"></i>' + f.name;
  b.onclick = () => { [...fbox.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); setFinish(i); };
  fbox.appendChild(b);
});
function setFinish(i){
  const f = FINISHES[i];
  cladding.forEach(m => {
    m.color.setHex(0xffffff);                 // the surface comes from the map, not a tint
    m.map = f.tex; m.normalMap = f.nmap;
    if(m.normalScale) m.normalScale.set(f.nrm, f.nrm);
    m.roughnessMap = null; m.metalnessMap = null;
    m.roughness = f.rough; m.metalness = f.metal;
    m.needsUpdate = true;
  });
  post({ type:'finish', i });
}

/* views, set from the model's own size once it is in */
let VIEWS = {}, box = new THREE.Box3(), size = new THREE.Vector3(), mid = new THREE.Vector3();
let MODE = 'hero', ROOM = null;        // ROOM: the box the camera stays inside when you are indoors
function frame(name, animate = true){
  const v = VIEWS[name]; if(!v) return;
  camera.fov = (name === 'inside') ? 62 : 38; camera.updateProjectionMatrix();
  controls.minDistance = (name === 'inside') ? 0.2 : 1.2;
  controls.maxDistance = (name === 'inside') ? 6 : 120;
  MODE = name;
  const plan = (name === 'top');
  roof.forEach(o => { o.visible = !plan; });                      // Plan lifts the lid
  CUT.constant = planCutY;                                        // and cuts the walls at head height
  renderer.clippingPlanes = plan ? [CUT] : [];
  planLight.intensity = plan ? 1.5 : 0;
  scene.fog = plan ? null : FOG;
  controls.maxPolarAngle = (name === 'top') ? Math.PI/2 : Math.PI/2 - 0.02;
  controls.autoRotate = (name === 'hero') && spin.classList.contains('on');
  const from = camera.position.clone(), to = v.pos.clone();
  const tFrom = controls.target.clone(), tTo = v.target.clone();
  if(!animate){ camera.position.copy(to); controls.target.copy(tTo); controls.update(); return; }
  const t0 = performance.now(), ms = 900;
  (function step(now){
    const k = Math.min(1, (now - t0)/ms), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from, to, e);
    controls.target.lerpVectors(tFrom, tTo, e);
    controls.update();
    if(k < 1) requestAnimationFrame(step);
  })(t0);
  [...document.querySelectorAll('#views button')].forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => { frame(b.dataset.view); post({ type:'view', v:b.dataset.view }); });
document.getElementById('reset').onclick = () => frame('hero');
document.querySelectorAll('#light button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#light button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); loadSky(b.dataset.sky); post({ type:'sky', v:b.dataset.sky });
});
const spin = document.getElementById('spin');
spin.onclick = () => { spin.classList.toggle('on'); controls.autoRotate = spin.classList.contains('on') && MODE !== 'inside'; };
document.getElementById('close').onclick = () => {
  try { if(parent !== window){ parent.postMessage('haavn-3d-close','*'); return; } } catch(e){}
  history.length > 1 ? history.back() : (location.href = '/');
};

loadSky('golden');

/* the model */
const bar = document.getElementById('bar'), pct = document.getElementById('pct'), load = document.getElementById('load');
new GLTFLoader().load('/haavn-3d/solum.glb', gltf => {
  const model = gltf.scene;
  model.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const n = (o.name || '').replace(/_/g, ' ').toUpperCase();   // the loader swaps spaces for underscores
    const m = o.material;
    if(m && m.isMeshStandardMaterial){
      m.envMapIntensity = 0.75;
      if(m.map){ m.map.anisotropy = 8; m.map.colorSpace = THREE.SRGBColorSpace; }
      if(m.normalMap) m.normalScale.set(0.9, 0.9);
      if(n.includes('YAKISU') || n.includes('WOOD 49') || n.includes('BLACK ACE')){
        cladding.push(m); cladMesh.push(o);
        m.color.setHex(0xffffff); m.map = FINISHES[0].tex; m.normalMap = FINISHES[0].nmap;
        m.roughnessMap = null; m.metalnessMap = null;
        m.roughness = FINISHES[0].rough; m.metalness = FINISHES[0].metal;
      }
      if(n.includes('GLASS')){ m.transparent = true; m.opacity = 0.46; m.color.setHex(0x7d8b92); m.roughness = 0.03; m.metalness = 0.12; m.envMapIntensity = 1.9; o.castShadow = false; }
      if(n.includes('FABRIC')){ m.color.setHex(0xefe7da); m.roughness = 0.95; m.metalness = 0; m.envMapIntensity = 0.5; }   /* the sheers */
      if(n.includes('LED') || n === 'LIGHT'){ m.emissive = new THREE.Color(0xffe4bd); m.emissiveIntensity = 3.0; o.castShadow = false; }
      if(n.includes('MIRROR') || n.includes('SILVER')){ m.envMapIntensity = 1.6; }
      if(n.includes('ROOFCAP')) roof.push(o);
    }
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  /* The Rhino shell carries one 0-1 unwrap across the whole envelope, which
     stretches any surface put on it. Re-map the cladding off world position
     instead, so a board is 300 mm on every face, corner to corner. */
  const TILE = 1.8;                                   // the tile holds six boards
  cladMesh.forEach(o => {
    const g = o.geometry = o.geometry.clone();
    const pos = g.attributes.position, nor = g.attributes.normal;
    const uv = new Float32Array(pos.count * 2);
    const p = new THREE.Vector3(), nv = new THREE.Vector3();
    const nm = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);
    for(let i = 0; i < pos.count; i++){
      p.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      nv.fromBufferAttribute(nor, i).applyMatrix3(nm).normalize();
      const ax = Math.abs(nv.x), ay = Math.abs(nv.y), az = Math.abs(nv.z);
      let u, v;
      if(ay >= ax && ay >= az){ u = p.x; v = p.z; }     // soffits and the roof cap
      else if(ax >= az){ u = p.z; v = p.y; }            // the end walls
      else { u = p.x; v = p.y; }                        // the long elevations
      uv[i*2] = u / TILE; uv[i*2+1] = v / TILE;
    }
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.attributes.uv.needsUpdate = true;
  });

  box.setFromObject(model); box.getSize(size); box.getCenter(mid);
  /* the glazed side is the front: find where the glass sits relative to the
     middle, so Front looks into the glass and Hero is the rear three-quarter
     view from the images */
  /* which way the glazing looks: add up the glass triangles' own facing,
     weighted by their area, and take the strongest horizontal direction */
  /* Which side is the glazed front. The home is long and narrow and the glass
     runs down a long elevation, so the front looks out across the short axis;
     the side with more glass on it is the front. */
  const shortX = size.x <= size.z;                     // the short plan axis
  let gPos = 0, gNeg = 0;
  const gbox = new THREE.Box3(), gmid = new THREE.Vector3();
  model.traverse(o => {
    if(!o.isMesh || !/GLASS/i.test((o.material && o.material.name) || '')) return;
    gbox.makeEmpty(); gbox.expandByObject(o); gbox.getCenter(gmid);
    const w = Math.max(gbox.max.x-gbox.min.x, gbox.max.z-gbox.min.z) * (gbox.max.y-gbox.min.y);
    ((shortX ? gmid.x - mid.x : gmid.z - mid.z) >= 0 ? (gPos += w) : (gNeg += w));
  });
  const faceX = shortX;
  const dir = gPos >= gNeg ? 1 : -1;
  window.__gdir = { faceX, dir, gPos:+gPos.toFixed(1), gNeg:+gNeg.toFixed(1),
                    size: size.toArray().map(v => +v.toFixed(2)) };
  /* where the rooms are: the interior linings and floor, so standing inside
     puts the camera in the room rather than in a wall */
  const ibox = new THREE.Box3(); let found = false;
  model.traverse(o => { if(o.isMesh && /INTERIOR|PLASTER|FLOORING/i.test(o.name || '')){ ibox.expandByObject(o); found = true; } });
  const iSize = new THREE.Vector3(), iMid = new THREE.Vector3();
  (found ? ibox : box).getSize(iSize); (found ? ibox : box).getCenter(iMid);
  planCutY = ibox.min.y + 2.05;
  if(found){ ROOM = ibox.clone(); ROOM.expandByScalar(-0.35); ROOM.min.y = ibox.min.y + 0.9; ROOM.max.y = ibox.min.y + 2.1; }
  const long = iSize.z >= iSize.x;
  /* a little warm light in the rooms, so walking inside is not a dark box */
  if(found){
    const n = 4;
    for(let i = 0; i < n; i++){
      const t = (i + 0.5) / n;
      const l = new THREE.PointLight(0xffd9ad, 5.5, Math.max(iSize.x, iSize.z) * 0.95, 2.0);
      l.position.set(long ? iMid.x : ibox.min.x + iSize.x * t, ibox.min.y + iSize.y * 0.82,
                     long ? ibox.min.z + iSize.z * t : iMid.z);
      scene.add(l); interiorLights.push(l);
    }
  }
  const r = Math.max(size.x, size.z) * 0.5, h = size.y;
  controls.target.set(mid.x, h * 0.42, mid.z);
  /* front = looking into the glass · hero = the rear three-quarter */
  const F = faceX ? new THREE.Vector3(dir, 0, 0) : new THREE.Vector3(0, 0, dir);      // outward, glazed side
  const side = faceX ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0);
  const eye = h * 0.62;
  /* The renders are shot off a corner, a little above eye level, with the long
     elevation running away to the light. Distance is worked out from the home's
     own size so the whole of it sits in frame whatever the model. */
  const fit = (w) => (w * 0.5) / Math.tan(THREE.MathUtils.degToRad(38 * 0.5));
  const span = Math.max(size.x, size.z), D = fit(span);
  const shot = (fwd, sideK, hK, dK) => {
    const v = new THREE.Vector3(F.x*fwd + side.x*sideK, 0, F.z*fwd + side.z*sideK).normalize();
    return { pos:new THREE.Vector3(mid.x + v.x*D*dK, h*hK, mid.z + v.z*D*dK),
             target:new THREE.Vector3(mid.x, h*0.45, mid.z) };
  };
  VIEWS = {
    hero:  shot(-1.0,  0.85, 1.05, 0.92),      // the rear three-quarter
    front: shot( 1.0,  0.42, 0.88, 0.95),      // looking into the glass
    rear:  shot(-1.0,  0.00, 0.80, 0.86),
    top:   { pos:new THREE.Vector3(mid.x + 0.01, Math.max(span*1.5, 16), mid.z + 0.01), target:new THREE.Vector3(mid.x, 0, mid.z) },
    inside: (() => {
      /* standing in the living end, looking the length of the home with the
         glass on one side, which is how the interiors are shot */
      const A = (iSize.z >= iSize.x) ? new THREE.Vector3(0,0,1) : new THREE.Vector3(1,0,0);
      const len = A.z ? iSize.z : iSize.x, wide = A.z ? iSize.x : iSize.z, fy = ibox.min.y;
      return { pos:new THREE.Vector3(iMid.x - A.x*len*0.36 - F.x*wide*0.17, fy + 1.55, iMid.z - A.z*len*0.36 - F.z*wide*0.17),
               target:new THREE.Vector3(iMid.x + A.x*len*0.45 + F.x*wide*0.10, fy + 1.32, iMid.z + A.z*len*0.45 + F.z*wide*0.10) };
    })()
  };
  frame('hero', false);
  controls.autoRotate = true;
  sun.target.position.copy(mid); scene.add(sun.target);
  ground.position.set(mid.x, -0.01, mid.z);
  load.classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 5200);
  post({ type:'ready' });
}, ev => {
  if(!ev.total) return;
  const k = Math.round(ev.loaded / ev.total * 100);
  bar.style.width = k + '%'; pct.textContent = 'Loading the model · ' + k + '%';
}, err => { pct.textContent = 'The model could not be loaded'; console.warn(err); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
});
/* Contact darkening in the corners and under the floor plate. It is the second
   thing after the sky that stops a real-time model looking flat. Left off on
   small or slow machines. */
const HEAVY = !(navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) <= 900);
let composer = null;
if(HEAVY){
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const ssao = new SSAOPass(scene, camera, innerWidth, innerHeight);
  ssao.kernelRadius = 0.32; ssao.minDistance = 0.0006; ssao.maxDistance = 0.12; ssao.output = SSAOPass.OUTPUT.Default;
  composer.addPass(ssao);
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.75, 0.92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  window.__ssao = ssao; window.__bloom = bloom;
}

(function tick(){
  requestAnimationFrame(tick);
  controls.update();
  if(MODE === 'inside' && ROOM){            // indoors stays indoors
    const before = camera.position.clone();
    ROOM.clampPoint(camera.position, camera.position);
    if(!before.equals(camera.position)) controls.target.add(camera.position.clone().sub(before).multiplyScalar(0.35));
  }
  if(composer && MODE !== 'top') composer.render(); else renderer.render(scene, camera);
})();

/* the Studio can drive this view when it is presenting to a television */
function post(m){ try { if(parent !== window) parent.postMessage(Object.assign({ haavn3d:1 }, m), '*'); } catch(e){} }
addEventListener('message', e => {
  const d = e.data || {}; if(!d.haavn3d) return;
  if(d.type === 'view') frame(d.v);
  else if(d.type === 'finish') { const b = fbox.children[d.i]; if(b) b.click(); }
  else if(d.type === 'sky') { const b = document.querySelector('#light [data-sky="' + d.v + '"]'); if(b) b.click(); }
  else if(d.type === 'spin') spin.click();
});
window.__haavn3d = { frame, setFinish, each(fn){ scene.traverse(fn); }, glassDir(){ return window.__gdir; },
  debug(){ const b=new THREE.Box3().setFromObject(scene); const s=new THREE.Vector3(), c=new THREE.Vector3(); b.getSize(s); b.getCenter(c);
    let meshes=0, tris=0; scene.traverse(o=>{ if(o.isMesh){ meshes++; const g=o.geometry; tris+=(g.index?g.index.count:g.attributes.position.count)/3; } });
    return { size:[+s.x.toFixed(2),+s.y.toFixed(2),+s.z.toFixed(2)], centre:[+c.x.toFixed(2),+c.y.toFixed(2),+c.z.toFixed(2)],
      meshes, tris:Math.round(tris), cam:camera.position.toArray().map(v=>+v.toFixed(1)), target:controls.target.toArray().map(v=>+v.toFixed(1)) }; } };
</script>
</body>
</html>
