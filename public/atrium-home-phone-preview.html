<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATRIUM · Phone Home (preview)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d6b36a;--mono:'JetBrains Mono',ui-monospace,monospace}
html,body{height:100%}
body{background:#040404;color:#e8e9eb;font-family:var(--mono);overflow:hidden}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(0)}
.scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,4,4,.6),rgba(4,4,4,.35) 44%,rgba(4,4,4,.85))}

/* gold LED pair (phone shows two) */
.vled{position:fixed;top:0;bottom:64px;width:2px;pointer-events:none;z-index:2}
.vled::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(214,179,106,.75) 7%,#d6b36a 50%,rgba(214,179,106,.75) 93%,transparent 100%);
  filter:brightness(1.3) drop-shadow(0 0 9px rgba(244,227,189,.95)) drop-shadow(0 0 26px rgba(214,179,106,.9))}
.vl{left:26px}.vl::before{animation:dDown 15.6s linear infinite}
.vr{right:26px}.vr::before{animation:dUp 15.6s linear infinite}
@keyframes dDown{0%{transform:scaleY(0);transform-origin:top}42%{transform:scaleY(1);transform-origin:top}58%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes dUp{0%{transform:scaleY(0);transform-origin:bottom}42%{transform:scaleY(1);transform-origin:bottom}58%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(0);transform-origin:top}}

/* ── phone layout: CAPITAL block dead-centre, burger centred under STUDIO ── */
.stage{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 120px;text-align:center}
.wings{height:40px;width:auto;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6))}
.cap{font-size:10px;letter-spacing:.5em;color:#c9cdd2;margin-top:12px;padding-left:.5em;text-transform:uppercase}
.eyebrow{font-size:11px;letter-spacing:.4em;color:#9aa0a6;margin-top:14px;text-transform:uppercase;line-height:1.9;padding-left:.4em}

.burger{margin-top:26px;width:64px;height:56px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;
  cursor:pointer;border:none;background:transparent;padding:0;transition:.3s;position:relative}
.burger span{display:block;width:4px;height:22px;background:#dfe1e4;transition:.3s;border-radius:1px}
.burger:hover span,.burger.on span{background:var(--gold);box-shadow:0 0 10px rgba(214,179,106,.9),0 0 22px rgba(214,179,106,.5)}
.burger.on span{opacity:0}
.burger.on::before,.burger.on::after{content:'';position:absolute;top:50%;width:13px;height:22px;transform:translateY(-50%);
  background:var(--gold);filter:drop-shadow(0 0 8px rgba(214,179,106,.85))}
.burger.on::before{left:17px;clip-path:polygon(0 0,42% 0,100% 50%,42% 100%,0 100%,58% 50%)}
.burger.on::after{right:17px;clip-path:polygon(100% 0,58% 0,0 50%,58% 100%,100% 100%,42% 50%)}

/* 7EVEN brand — lower third */
.seven{width:min(300px,76vw);height:auto;margin-top:11vh;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(255,255,255,.28)) drop-shadow(0 3px 18px rgba(0,0,0,.6))}
.sub{font-size:6.5px;letter-spacing:.42em;color:#7e838a;margin-top:14px;text-transform:uppercase}

/* menu drops centred under the burger, page fades */
.pmenu{position:fixed;left:50%;top:46%;transform:translate(-50%,-8px);width:88vw;z-index:60;max-height:calc(54% - 100px);overflow-y:auto;
  opacity:0;pointer-events:none;transition:.36s cubic-bezier(.2,.7,.3,1)}
.pmenu.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.mrow{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:9px;padding:12px 15px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.32);border-radius:2px;
  font-family:var(--mono);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.mrow img{height:13px;width:auto}
.mrow .g{color:var(--gold);font-size:12px}
.mrow.gold{border-color:rgba(214,179,106,.55)}
.menu-open .fadeable{opacity:.07;filter:blur(2px)}
.fadeable{transition:.36s}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(6,7,8,.92),#050607);padding:0 16px}
.hair{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 12%,rgba(255,255,255,.16) 88%,transparent)}
.frail{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:9px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.livewrap{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.2em;color:#a9a6a9}
.dot{width:6px;height:6px;border-radius:50%;background:#2fe07a;box-shadow:0 0 10px #2fe07a;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clock{color:#e8e6e8;font-size:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:2px;border:1px solid rgba(255,255,255,.28);
  font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:#b9bdc4;text-transform:uppercase;background:transparent;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline src="/haavn-black-bg.mp4"></video>
<div class="scrim"></div>
<div class="vled vl"></div><div class="vled vr"></div>

<div class="stage">
  <div class="fadeable" style="display:flex;flex-direction:column;align-items:center">
    <img class="wings" src="/winged-device-white.png" alt="CAPITAL">
    <div class="cap">Capital</div>
    <div class="eyebrow">Development Feasibility<br>Studio</div>
  </div>
  <button class="burger" id="bg7" aria-label="Menu"><span></span><span></span></button>
  <div class="fadeable" style="display:flex;flex-direction:column;align-items:center">
    <img class="seven" src="/seven-mark-white-hd.png" alt="7EVEN">
    <div class="sub">Atrium &nbsp;·&nbsp; Precision Feasibility &nbsp;·&nbsp; By Invitation</div>
  </div>
</div>

<div class="pmenu" id="pm">
  <button class="mrow"><img src="/base-white.png" style="height:15px" alt="BASE"><span class="g">▸</span></button>
  <button class="mrow"><img src="/hori7on-white.png" alt="HORI7ON"><span class="g">→</span></button>
  <button class="mrow gold"><img src="/enterprise-gold.png" alt="ENTERPRISE"><span class="g">→</span></button>
  <button class="mrow"><img src="/navigators-white.png" alt="NAVIGATORS"><span class="g">→</span></button>
  <button class="mrow"><img src="/pro7ect-white.png" alt="PROJECT 7"><span class="g">→</span></button>
  <button class="mrow"><img src="/haavn-black-logo.png" style="height:12px" alt="HAAVN BLACK"><span class="g">→</span></button>
  <button class="mrow" style="justify-content:center;font-size:10px;color:#b9bdc4">Log Out</button>
</div>

<div class="foot">
  <div class="hair"></div>
  <div class="frail">
    <span class="livewrap"><span class="dot"></span>LIVE&nbsp;<span class="clock" id="ck">--:--:--</span>&nbsp;· MELBOURNE</span>
    <a class="chip" href="#">7EVEN.AU ↗</a><a class="chip" href="#">HAAVN.AU ↗</a><button class="chip">⟳ UPDATE</button>
  </div>
</div>

<script>
function tick(){document.getElementById('ck').textContent=new Date().toLocaleTimeString('en-AU',{hour12:false});}
tick();setInterval(tick,1000);
var b=document.getElementById('bg7'),m=document.getElementById('pm');
b.addEventListener('click',function(){b.classList.toggle('on');m.classList.toggle('on');document.body.classList.toggle('menu-open',m.classList.contains('on'));});
</script>
</body>
</html>
