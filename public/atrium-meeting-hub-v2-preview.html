<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ATRIUM · Meeting Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
/* ============================================================================
   ATRIUM MEETING MANAGEMENT — Pillar 02 preview (v2)
   Create a named internal/external meeting, run it, record it (real Azure
   Speech when available, native browser fallback), set agenda + notes,
   present, and email the outcome to internal + external attendees.
   Shares companies/contacts (pillar 01) and tasks bidirectionally.
   Brand: black / bone / gold — no 7EVEN or HAAVN marks on this surface.
   ============================================================================ */
:root{
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bg0:#060708; --bg1:#0B0D0F; --panel:#101215; --ink:#F3F2EE; --ink2:#b9bcc2; --ink3:#7a7e86;
  --gold:#d6b36a; --gold-hi:#f4e3bd; --gold-lo:#a3782a;
  --line:rgba(243,242,238,.14); --line2:rgba(243,242,238,.07);
  --red:#e0645c; --green:#2fe07a; --blue:#5b8def;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg0);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:var(--mono)}
::selection{background:rgba(214,179,106,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}

.pvbanner{position:fixed;top:0;left:0;right:0;z-index:500;text-align:center;padding:6px 10px;font:500 9.5px/1 var(--mono);
  letter-spacing:.28em;text-transform:uppercase;color:#0B0D0F;background:linear-gradient(90deg,var(--gold),var(--gold-hi));}

.app{padding-top:30px;min-height:100%;display:flex;flex-direction:column}
.hdr{position:sticky;top:30px;z-index:80;background:rgba(6,7,8,.86);backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line2);padding:16px 26px}
.hdr-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px}
.hmark{width:34px;height:34px;flex:none;border-radius:999px;border:1px solid rgba(243,242,238,.32);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.hmark svg{width:16px;height:16px;display:block}
.hword{display:flex;align-items:baseline;font:100 22px/1 var(--sans);letter-spacing:.32em;color:var(--ink)}
.hword b{font-weight:400}
.hpillar{margin-left:2px;color:var(--ink3);font:400 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:14px}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.hclock{font:400 11px var(--mono);letter-spacing:.16em;color:var(--ink3)}
.hclock i{color:var(--green);font-style:normal}

.wrap{max-width:1180px;margin:0 auto;padding:22px 26px 90px;flex:1;width:100%}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:20px}
.card h3{font:500 12px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:14px;display:flex;align-items:center;gap:10px}

.btn{border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.04);color:var(--ink);
  font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.09)}
.btn.gold{border-color:var(--gold);color:var(--gold-hi);background:rgba(214,179,106,.08)}
.btn.gold:hover{background:rgba(214,179,106,.18);box-shadow:0 0 24px -10px rgba(214,179,106,.7)}
.btn.red{border-color:var(--red);color:#ffd8d4;background:rgba(224,100,92,.1)}
.btn.red:hover{background:rgba(224,100,92,.2);box-shadow:0 0 24px -10px rgba(224,100,92,.7)}
.btn.sm{padding:7px 13px;font-size:10px}
.btn:disabled{opacity:.35;cursor:default}

.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.litem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.02);transition:.2s;cursor:pointer}
.litem:hover{border-color:var(--line);background:rgba(255,255,255,.04)}
.lname{font:500 13px var(--sans);color:#fff}
.lsub{font:400 10.5px var(--mono);letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.chip{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.chip.int{color:var(--blue);border-color:rgba(91,141,239,.45);background:rgba(91,141,239,.08)}
.chip.ext{color:var(--gold-hi);border-color:rgba(214,179,106,.45);background:rgba(214,179,106,.08)}
.chip.weekly{color:var(--green);border-color:rgba(47,224,122,.45);background:rgba(47,224,122,.08)}
.chip.rec{color:var(--red);border-color:rgba(224,100,92,.55);background:rgba(224,100,92,.1)}

input,select,textarea{font-family:var(--sans);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);padding:10px 13px;font-size:13px;outline:none;transition:.2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:6px;font:500 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:26px;text-align:center;color:var(--ink3);font:400 12px var(--mono);letter-spacing:.1em}

.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.25s}
.modalbg.on{opacity:1;pointer-events:auto}
.modal{width:min(560px,100%);max-height:88vh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line);border-radius:24px;padding:24px}
.modal h4{font:500 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.pickpill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font:500 10px var(--mono);letter-spacing:.12em;cursor:pointer;margin:3px 4px 3px 0;text-transform:uppercase}
.pickpill.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(214,179,106,.1)}
.pickpill.rm{border-color:rgba(224,100,92,.5);color:#ffd8d4}

/* three-way kind picker (weekly / internal / external) — same pill language as menus */
.kindpick{display:flex;gap:8px}
.kindpick .k{flex:1;text-align:center;padding:12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.kindpick .k.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(214,179,106,.1)}

/* meeting screen */
.mtabs{display:flex;gap:8px;margin:16px 0}
.mtab{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink2);
  font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.mtab.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(214,179,106,.1)}

.agitem{border:1px solid var(--line2);border-radius:16px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.agitem .top{display:flex;align-items:center;gap:10px}
.agitem input[type=text]{background:transparent;border:none;color:#fff;font-size:14px;padding:0}
.agitem textarea{background:rgba(255,255,255,.03);margin-top:8px;font-size:12.5px}

.reclive{display:flex;align-items:center;gap:14px;padding:20px;border-radius:18px;border:1px solid rgba(224,100,92,.35);background:rgba(224,100,92,.05);margin-bottom:16px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:recPulse 1.2s ease-in-out infinite;flex:none}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.3}}
.rectime{font:400 26px var(--mono);letter-spacing:.06em}
.transcript{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.tline{font-size:13px;color:var(--ink2);line-height:1.5}
.tline b{color:var(--gold-hi);font-weight:500}

/* the floating "leave to present" persistence bar — shown across both pillars
   while a meeting is recording; in the live app this is hoisted into App.tsx
   above the iframe swap so it survives navigating to the HAAVN menu itself */
.recbar{position:fixed;right:20px;bottom:20px;z-index:200;display:none;align-items:center;gap:10px;padding:11px 18px;
  border-radius:999px;border:1px solid rgba(224,100,92,.6);background:rgba(20,10,10,.85);backdrop-filter:blur(12px);
  cursor:pointer;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
.recbar.on{display:flex}
.recbar span{font:500 11px var(--mono);letter-spacing:.14em;color:#fff}
.recbar b{color:var(--red)}

/* present mode — fullscreen, clean, for screen-sharing */
.present{position:fixed;inset:0;background:#000;color:var(--ink);z-index:400;display:none;flex-direction:column;padding:60px 8vw}
.present.on{display:flex}
.present .peye{font:500 13px var(--mono);letter-spacing:.3em;color:var(--gold-hi);text-transform:uppercase;margin-bottom:8px}
.present h1{font:200 clamp(28px,4vw,52px)/1.2 var(--sans);letter-spacing:.02em;margin-bottom:28px}
.present .pagenda{display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1}
.present .pitem{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line2)}
.present .pitem b{font-size:19px;font-weight:400;min-width:0}
.present .pitem span{color:var(--ink3);font-size:13px;font-family:var(--mono)}
.present .pexit{position:absolute;top:24px;right:28px}

@media(max-width:600px){
  .hword{font-size:17px;letter-spacing:.24em}.hpillar{display:none}
  .formgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="pvbanner">PREVIEW BUILD · PILLAR 02 · MEETING MANAGEMENT — not yet wired into the live hub</div>

<div class="app">
  <div class="hdr">
    <div class="hdr-inner">
      <div class="hmark" onclick="goList()"><svg viewBox="0 0 66 74" aria-hidden="true"><path d="M4 74 L33 0 L62 74" fill="none" stroke="#F3F2EE" stroke-width="5.2" stroke-linejoin="miter" stroke-linecap="butt"/></svg></div>
      <div class="hword"><b>ATRIUM</b></div>
      <div class="hpillar">02 · MEETING MANAGEMENT</div>
      <div class="hright">
        <div class="hclock"><i>●</i> LIVE <span id="clock">--:--:--</span> MELBOURNE</div>
        <button class="btn sm" onclick="location.href='atrium-workflow-v2-preview.html'">← Workflow · 01</button>
      </div>
    </div>
  </div>

  <div class="wrap" id="view"></div>
</div>

<div class="recbar" id="recbar" onclick="jumpToMeeting()">
  <span class="recdot" style="width:8px;height:8px;border-radius:50%;background:var(--red);animation:recPulse 1.2s ease-in-out infinite;display:inline-block"></span>
  <span>RECORDING — <b id="recTitle"></b> — <b id="recTime">00:00</b> — tap to return</span>
</div>

<div class="present" id="present">
  <div class="pexit"><button class="btn sm" onclick="exitPresent()">Exit present</button></div>
  <div class="peye" id="presEye">WEEKLY COMPANY MEETING</div>
  <h1 id="presTitle"></h1>
  <div class="pagenda" id="presBody"></div>
</div>

<div class="modalbg" id="modalbg"><div class="modal" id="modalBody"></div></div>

<script>
/* ===================== cloud (capital_kv, shared with pillar 01) ===================== */
var SUPA_URL='https://vgvavmnqrdgcnledztyk.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZndmF2bW5xcmRnY25sZWR6dHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzIwODEsImV4cCI6MjA5OTU0ODA4MX0.hiWSzfEMXPJGs67iqiuB3hwJVxUO51uu2rygmA5wO10';
var SUPA_H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var CRM_KEY='atrium_crm_v2_preview', TASKS_KEY='atrium_tasks_v2_preview', MEET_KEY='atrium_meetings_v2_preview';

function kvPull(key,fallback){
  return fetch(SUPA_URL+'/rest/v1/capital_kv?key=eq.'+key+'&select=value',{headers:SUPA_H})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(rows){return (rows&&rows.length)?rows[0].value:fallback;})
    .catch(function(){return fallback;});
}
function kvPush(key,value){
  var body=[{key:key,value:value,updated_at:new Date().toISOString()}];
  return fetch(SUPA_URL+'/rest/v1/capital_kv',{method:'POST',headers:Object.assign({},SUPA_H,{Prefer:'resolution=merge-duplicates'}),body:JSON.stringify(body)}).catch(function(){});
}

var CRM={companies:[],contacts:[],seq:1};
var TASKS={tasks:[],seq:1};
var MEET={meetings:[],seq:1};
var CUR=null;      // current meeting id
var MTAB='agenda';  // agenda | live | wrap
var rec={active:false,ctrl:null,mode:null,startedAt:0,timer:null,heartbeat:null};

function uid(store){return 'a'+(store.seq++)+'-'+Math.random().toString(36).slice(2,7);}

function boot(){
  Promise.all([kvPull(CRM_KEY,{companies:[],contacts:[],seq:1}), kvPull(TASKS_KEY,{tasks:[],seq:1}), kvPull(MEET_KEY,{meetings:[],seq:1})])
    .then(function(r){
      CRM=r[0]; TASKS=r[1]; MEET=r[2];
      var params=new URLSearchParams(location.search);
      if(params.get('m')) CUR=params.get('m');
      render();
      setInterval(pollShared,5000);
      setInterval(tickClock,1000); tickClock();
    });
}
function saveMeet(){kvPush(MEET_KEY,MEET);}
function saveTasks(){kvPush(TASKS_KEY,TASKS);}
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function curMeeting(){return MEET.meetings.find(function(m){return m.id===CUR;});}
function goList(){CUR=null;history.replaceState(null,'','atrium-meeting-hub-v2-preview.html');render();}

/* ===================== router ===================== */
function render(){
  var v=document.getElementById('view');
  v.innerHTML = CUR ? viewMeeting(curMeeting()) : viewList();
}

/* ===================== list + create ===================== */
function viewList(){
  var groups=[['weekly','Weekly'],['internal','Internal'],['external','External']];
  var h='<div class="row" style="margin-bottom:16px"><h3 class="mono" style="letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);font-size:11px">Meetings</h3><div class="spacer"></div><button class="btn gold" onclick="openNewMeeting()">+ New meeting</button></div>';
  groups.forEach(function(g){
    var items=MEET.meetings.filter(function(m){return m.kind===g[0];});
    if(!items.length) return;
    h+='<div class="card" style="margin-bottom:14px"><h3>'+g[1]+'</h3><div class="list">'+items.slice().reverse().map(function(m){
      return '<div class="litem" onclick="openMeeting(\''+m.id+'\')"><div><div class="lname">'+esc(m.title)+'</div><div class="lsub">'+fmtDate(m.whenISO)+' · '+m.attendees.length+' attendees</div></div><div class="spacer"></div>'+
        (m.recording&&m.recording.active?'<span class="chip rec">● Recording</span>':'')+
        '<span class="chip '+(g[0]==='external'?'ext':'int')+'">'+m.status+'</span></div>';
    }).join('')+'</div></div>';
  });
  if(!MEET.meetings.length) h+='<div class="card"><div class="empty">No meetings yet — start one, or send items from ATRIUM Workflow\'s Weekly Agenda.</div></div>';
  return h;
}
function openMeeting(id){CUR=id;history.replaceState(null,'','atrium-meeting-hub-v2-preview.html?m='+id);MTAB='agenda';render();}

function openNewMeeting(){
  showModal('New meeting','<form onsubmit="return createMeeting(event)">'+
    '<label class="f">Meeting name<input id="nmTitle" required placeholder="e.g. SOLUM design review"/></label><div style="height:12px"></div>'+
    '<label class="f">Type</label><div class="kindpick" id="nmKind" style="margin-top:6px">'+
      '<div class="k on" data-v="internal" onclick="pickKind(this)">Internal</div>'+
      '<div class="k" data-v="external" onclick="pickKind(this)">External</div>'+
      '<div class="k" data-v="weekly" onclick="pickKind(this)">Weekly</div>'+
    '</div><div style="height:12px"></div>'+
    '<div class="formgrid"><label class="f">Date<input id="nmDate" type="date"/></label><label class="f">Time<input id="nmTime" type="time" value="10:00"/></label></div><div style="height:12px"></div>'+
    '<label class="f">Attendees</label><div id="nmAttendees" style="margin-top:6px">'+attendeePicker([])+'</div>'+
    '<div style="height:8px"></div>'+
    '<div class="row"><input id="nmExtName" placeholder="External attendee name" style="flex:1"/><input id="nmExtEmail" placeholder="email" style="flex:1"/><button type="button" class="btn sm" onclick="addExtAttendee()">Add</button></div>'+
    '<div id="nmExtList" style="margin-top:8px"></div>'+
    '<div class="foot"><button type="button" class="btn sm" onclick="closeModal()">Cancel</button><button type="submit" class="btn sm gold">Create meeting</button></div>'+
  '</form>');
  window._nmExt=[];
}
function pickKind(el){document.querySelectorAll('#nmKind .k').forEach(function(k){k.classList.remove('on');});el.classList.add('on');}
function attendeePicker(selectedIds){
  return CRM.contacts.map(function(c){
    var on=selectedIds.indexOf(c.id)>=0;
    return '<span class="pickpill'+(on?' on':'')+'" data-cid="'+c.id+'" onclick="this.classList.toggle(\'on\')">'+esc(c.name)+'</span>';
  }).join('')||'<span class="lsub">No CRM contacts yet — add some in ATRIUM Workflow.</span>';
}
function addExtAttendee(){
  var n=document.getElementById('nmExtName').value.trim(), e=document.getElementById('nmExtEmail').value.trim();
  if(!n||!e) return;
  window._nmExt.push({name:n,email:e});
  document.getElementById('nmExtList').innerHTML=window._nmExt.map(function(x,i){return '<span class="pickpill rm" onclick="window._nmExt.splice('+i+',1);addExtAttendee()">'+esc(x.name)+' ✕</span>';}).join('');
  document.getElementById('nmExtName').value='';document.getElementById('nmExtEmail').value='';
}
function createMeeting(e){
  e.preventDefault();
  var kind=document.querySelector('#nmKind .k.on').dataset.v;
  var date=document.getElementById('nmDate').value||new Date().toISOString().slice(0,10);
  var time=document.getElementById('nmTime').value||'10:00';
  var picked=Array.prototype.slice.call(document.querySelectorAll('#nmAttendees .pickpill.on')).map(function(el){return el.dataset.cid;});
  var attendees=picked.map(function(cid){var c=CRM.contacts.find(function(x){return x.id===cid;});var co=CRM.companies.find(function(x){return x.id===c.companyId;});
    return {contactId:c.id,name:c.name,email:c.email,kind:(co&&co.kind)||'external'};});
  (window._nmExt||[]).forEach(function(x){attendees.push({contactId:null,name:x.name,email:x.email,kind:'external'});});
  var m={id:uid(MEET),title:document.getElementById('nmTitle').value.trim(),kind:kind,whenISO:new Date(date+'T'+time+':00').toISOString(),
    status:'scheduled',attendees:attendees,agenda:[],transcript:[],summary:'',decisions:[],actions:[],
    recording:{active:false,startedAt:0,lastBeat:0},sentAt:null,sentTo:[]};
  MEET.meetings.push(m); saveMeet(); closeModal(); openMeeting(m.id); return false;
}

/* ===================== meeting screen ===================== */
function viewMeeting(m){
  if(!m) return '<div class="empty">Meeting not found.</div>';
  var h='<div class="row" style="margin-bottom:6px"><button class="btn sm" onclick="goList()">← All meetings</button><div class="spacer"></div>'+
    '<span class="chip '+(m.kind==='external'?'ext':'int')+'">'+m.kind+'</span><span class="chip">'+m.status+'</span></div>';
  h+='<h2 style="font:300 26px Inter;margin:14px 0 2px">'+esc(m.title)+'</h2>';
  h+='<div class="lsub">'+fmtDate(m.whenISO)+' · '+m.attendees.length+' attendees ('+m.attendees.filter(function(a){return a.kind==='internal';}).length+' internal, '+m.attendees.filter(function(a){return a.kind==='external';}).length+' external)</div>';
  h+='<div class="mtabs">'+
    ['agenda','Agenda','live','Live','wrap','Wrap &amp; Send'].reduce(function(acc,v,i,arr){if(i%2)return acc;acc.push([v,arr[i+1]]);return acc;},[]).map(function(t){
      return '<div class="mtab'+(MTAB===t[0]?' on':'')+'" onclick="setMTab(\''+t[0]+'\')">'+t[1]+'</div>';
    }).join('')+
    '<div class="spacer"></div><button class="btn sm gold" onclick="openPresent()">▷ Present</button></div>';
  if(MTAB==='agenda') h+=tabAgenda(m);
  else if(MTAB==='live') h+=tabLive(m);
  else h+=tabWrap(m);
  return h;
}
function setMTab(t){MTAB=t;render();}

/* ---- Agenda tab ---- */
function tabAgenda(m){
  var weeklyTasks=TASKS.tasks.filter(function(t){return t.weekly&&t.status!=='done'&&!m.agenda.some(function(a){return a.fromTaskId===t.id;});});
  var h='<div class="card">';
  h+='<h3>Agenda items <span class="chip">'+m.agenda.length+'</span><div class="spacer"></div>'+
    '<button class="btn sm" onclick="addAgendaItem(\''+m.id+'\')">+ Add item</button></h3>';
  h+=m.agenda.length?m.agenda.map(function(a){
    return '<div class="agitem"><div class="top">'+
      '<input type="text" value="'+esc(a.title)+'" onchange="editAgenda(\''+m.id+'\',\''+a.id+'\',\'title\',this.value)"/>'+
      '<span class="chip '+(a.state==='discussed'?'weekly':'')+'">'+a.state+'</span>'+
      '<button class="btn sm" onclick="toggleAgendaState(\''+m.id+'\',\''+a.id+'\')">'+(a.state==='discussed'?'Reopen':'Mark discussed')+'</button>'+
      (a.fromTaskId?'<span class="chip int" title="Linked to a task">↺ Task</span>':'<button class="btn sm" onclick="pushAgendaAsTask(\''+m.id+'\',\''+a.id+'\')">Push → task</button>')+
      '</div>'+
      '<div class="lsub" style="margin-top:6px">'+esc(a.ownerName||'')+(a.dept?(' · '+esc(a.dept)):'')+'</div>'+
      '<textarea rows="2" placeholder="Notes…" onchange="editAgenda(\''+m.id+'\',\''+a.id+'\',\'notes\',this.value)">'+esc(a.notes)+'</textarea>'+
    '</div>';
  }).join(''):'<div class="empty">No agenda items yet.</div>';
  h+='</div>';
  if(weeklyTasks.length){
    h+='<div class="card" style="margin-top:14px"><h3>Pull from Weekly Agenda (ATRIUM Workflow) <span class="chip weekly">'+weeklyTasks.length+'</span></h3>'+
      '<div class="list">'+weeklyTasks.map(function(t){return '<div class="litem" onclick="pullTaskToAgenda(\''+m.id+'\',\''+t.id+'\')"><div><div class="lname">'+esc(t.title)+'</div><div class="lsub">'+esc(t.owner)+' · '+esc(t.dept)+'</div></div><div class="spacer"></div><span class="chip">+ Pull in</span></div>';}).join('')+'</div></div>';
  }
  return h;
}
function addAgendaItem(mid){var m=MEET.meetings.find(function(x){return x.id===mid;});m.agenda.push({id:uid(MEET),title:'New item',ownerName:'',dept:'',fromTaskId:null,state:'pending',notes:''});saveMeet();render();}
function editAgenda(mid,aid,field,val){var m=MEET.meetings.find(function(x){return x.id===mid;});var a=m.agenda.find(function(x){return x.id===aid;});a[field]=val;saveMeet();}
function toggleAgendaState(mid,aid){var m=MEET.meetings.find(function(x){return x.id===mid;});var a=m.agenda.find(function(x){return x.id===aid;});a.state=a.state==='discussed'?'pending':'discussed';saveMeet();render();}
function pullTaskToAgenda(mid,tid){var m=MEET.meetings.find(function(x){return x.id===mid;});var t=TASKS.tasks.find(function(x){return x.id===tid;});
  m.agenda.push({id:uid(MEET),title:t.title,ownerName:t.owner,dept:t.dept,fromTaskId:t.id,state:'pending',notes:''});saveMeet();render();}
function pushAgendaAsTask(mid,aid){
  var m=MEET.meetings.find(function(x){return x.id===mid;});var a=m.agenda.find(function(x){return x.id===aid;});
  var t={id:uid(TASKS),title:a.title,owner:a.ownerName||'Unassigned',dept:a.dept||'Company',status:'todo',due:'',weekly:true,updated:Date.now()};
  TASKS.tasks.push(t); a.fromTaskId=t.id; saveTasks(); saveMeet(); render();
}

/* ---- Live tab (recording that survives navigation via a shared cloud doc) ---- */
function tabLive(m){
  var h='';
  if(m.recording&&m.recording.active){
    h+='<div class="reclive"><span class="recdot"></span><div><div class="rectime" id="liveTimer">00:00</div><div class="lsub">'+ (rec.mode==='azure'?'Azure Speech · live translation':'Browser speech recognition') +'</div></div><div class="spacer"></div>'+
      '<button class="btn red" onclick="stopRecording()">■ Stop recording</button></div>';
    h+='<div class="card"><h3>Live transcript</h3><div class="transcript" id="transcript">'+renderTranscript(m)+'</div></div>';
  } else {
    h+='<div class="card" style="text-align:center;padding:34px">'+
      '<p style="color:var(--ink3);font-size:13px;max-width:480px;margin:0 auto 18px;line-height:1.6">Starts live transcription (Azure Speech if the meeting service is configured, otherwise your browser\'s own speech recognition) and marks the meeting as recording in the shared store — so it keeps going, and this indicator keeps showing, even if you leave this screen to present something in the HAAVN menu and come back.</p>'+
      '<button class="btn gold" onclick="startRecording(\''+m.id+'\')">● Start recording</button></div>';
    if(m.transcript&&m.transcript.length) h+='<div class="card" style="margin-top:14px"><h3>Previous transcript</h3><div class="transcript">'+renderTranscript(m)+'</div></div>';
  }
  return h;
}
function renderTranscript(m){
  return (m.transcript||[]).map(function(t){return '<div class="tline"><b>'+esc(t.sp||'—')+':</b> '+esc(t.text)+'</div>';}).join('')||'<div class="lsub">Listening…</div>';
}
function startRecording(mid){
  var m=MEET.meetings.find(function(x){return x.id===mid;});
  m.status='recording'; m.recording={active:true,startedAt:Date.now(),lastBeat:Date.now()}; saveMeet();
  rec.active=true; rec.startedAt=Date.now();
  rec.timer=setInterval(function(){
    var secs=Math.floor((Date.now()-rec.startedAt)/1000);
    var el=document.getElementById('liveTimer'); if(el) el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
  },1000);
  rec.heartbeat=setInterval(function(){ if(!rec.active) return; m.recording.lastBeat=Date.now(); saveMeet(); },4000);
  startAzureOrFallback(m);
  render();
}
function onUtterance(m,speaker,text){
  m.transcript.push({t:Date.now(),sp:speaker,text:text});
  saveMeet();
  var t=document.getElementById('transcript'); if(t) t.innerHTML=renderTranscript(m);
}
function startAzureOrFallback(m){
  fetch('/api/azure-token').then(function(r){return r.ok?r.json():null;}).then(function(tok){
    if(tok&&tok.token&&window.SpeechSDK){
      try{
        var speechConfig=SpeechSDK.SpeechConfig.fromAuthorizationToken(tok.token,tok.region||'australiaeast');
        speechConfig.speechRecognitionLanguage='en-AU';
        var audioConfig=SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
        var recognizer=new SpeechSDK.SpeechRecognizer(speechConfig,audioConfig);
        recognizer.recognized=function(s,e){ if(e.result.text) onUtterance(m,'Speaker',e.result.text); };
        recognizer.startContinuousRecognitionAsync();
        rec.mode='azure'; rec.ctrl={stop:function(){recognizer.stopContinuousRecognitionAsync();}};
        return;
      }catch(err){ /* fall through to native */ }
    }
    startNativeSpeech(m);
  }).catch(function(){ startNativeSpeech(m); });
}
function startNativeSpeech(m){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ rec.mode='none'; return; }
  var sr=new SR(); sr.continuous=true; sr.interimResults=false; sr.lang='en-AU';
  sr.onresult=function(e){ for(var i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) onUtterance(m,'Speaker',e.results[i][0].transcript); } };
  sr.onend=function(){ if(rec.active) try{sr.start();}catch(e){} };
  try{ sr.start(); }catch(e){}
  rec.mode='browser'; rec.ctrl={stop:function(){ try{sr.stop();}catch(e){} }};
}
function stopRecording(){
  var m=curMeeting(); if(!m) return;
  rec.active=false;
  if(rec.timer) clearInterval(rec.timer);
  if(rec.heartbeat) clearInterval(rec.heartbeat);
  if(rec.ctrl&&rec.ctrl.stop) rec.ctrl.stop();
  m.recording.active=false; m.status='ended'; saveMeet(); render();
}

/* ---- Wrap & Send tab ---- */
function tabWrap(m){
  var h='<div class="card"><h3>Summary</h3><textarea rows="3" onchange="setField(\''+m.id+'\',\'summary\',this.value)">'+esc(m.summary)+'</textarea></div>';
  h+='<div class="card" style="margin-top:14px"><h3>Decisions</h3>'+
    (m.decisions.length?m.decisions.map(function(d,i){return '<div class="litem"><div class="lname">'+esc(d)+'</div><div class="spacer"></div><button class="btn sm" onclick="rmDecision(\''+m.id+'\','+i+')">Remove</button></div>';}).join(''):'<div class="empty">No decisions logged.</div>')+
    '<div class="row" style="margin-top:10px"><input id="newDecision" placeholder="Add a decision…"/><button class="btn sm" onclick="addDecision(\''+m.id+'\')">Add</button></div></div>';
  h+='<div class="card" style="margin-top:14px"><h3>Actions <span class="lsub">— pushing creates a task in ATRIUM Workflow, weekly-flagged</span></h3>'+
    (m.actions.length?m.actions.map(function(a,i){return '<div class="litem"><div><div class="lname">'+esc(a.text)+'</div><div class="lsub">'+esc(a.owner||'Unassigned')+'</div></div><div class="spacer"></div>'+
      (a.pushed?'<span class="chip weekly">Pushed</span>':'<button class="btn sm" onclick="pushActionAsTask(\''+m.id+'\','+i+')">Push → task</button>')+'</div>';}).join(''):'<div class="empty">No actions yet.</div>')+
    '<div class="row" style="margin-top:10px"><input id="newActionText" placeholder="Action…" style="flex:2"/><input id="newActionOwner" placeholder="Owner" style="flex:1"/><button class="btn sm" onclick="addAction(\''+m.id+'\')">Add</button></div></div>';
  h+=recipientPanel(m);
  return h;
}
function setField(mid,field,val){var m=MEET.meetings.find(function(x){return x.id===mid;});m[field]=val;saveMeet();}
function addDecision(mid){var v=document.getElementById('newDecision').value.trim();if(!v)return;var m=MEET.meetings.find(function(x){return x.id===mid;});m.decisions.push(v);saveMeet();render();}
function rmDecision(mid,i){var m=MEET.meetings.find(function(x){return x.id===mid;});m.decisions.splice(i,1);saveMeet();render();}
function addAction(mid){var t=document.getElementById('newActionText').value.trim();if(!t)return;var o=document.getElementById('newActionOwner').value.trim();var m=MEET.meetings.find(function(x){return x.id===mid;});m.actions.push({text:t,owner:o,pushed:false});saveMeet();render();}
function pushActionAsTask(mid,i){
  var m=MEET.meetings.find(function(x){return x.id===mid;});var a=m.actions[i];
  TASKS.tasks.push({id:uid(TASKS),title:a.text,owner:a.owner||'Unassigned',dept:'Company',status:'todo',due:'',weekly:true,updated:Date.now()});
  a.pushed=true; saveTasks(); saveMeet(); render();
}

function recipientPanel(m){
  var internal=m.attendees.filter(function(a){return a.kind==='internal';});
  var external=m.attendees.filter(function(a){return a.kind==='external';});
  return '<div class="card" style="margin-top:14px"><h3>Send agenda &amp; notes</h3>'+
    '<div class="lsub" style="margin-bottom:8px">Internal</div>'+
    internal.map(function(a){return '<span class="pickpill on recip" data-email="'+esc(a.email)+'">'+esc(a.name)+'</span>';}).join('')+
    '<div class="lsub" style="margin:12px 0 8px">External</div>'+
    (external.length?external.map(function(a){return '<span class="pickpill on recip" data-email="'+esc(a.email)+'">'+esc(a.name)+' ('+esc(a.email)+')</span>';}).join(''):'<span class="lsub">No external attendees on this meeting.</span>')+
    '<div style="height:6px"></div>'+
    (m.sentAt?('<div class="chip weekly" style="margin-top:10px">Sent '+fmtDate(m.sentAt)+' to '+m.sentTo.length+' recipient(s)</div>'):'')+
    '<div style="margin-top:16px" id="sendStatus"></div>'+
    '<div style="margin-top:10px"><button class="btn gold" onclick="sendMeetingEmail(\''+m.id+'\')">Email agenda + notes</button></div>'+
  '</div>';
}
function buildEmailHtml(m){
  var ag=m.agenda.map(function(a){return '<li><b>'+esc(a.title)+'</b>'+(a.ownerName?(' — '+esc(a.ownerName)):'')+(a.notes?('<br><span style="color:#666">'+esc(a.notes)+'</span>'):'')+'</li>';}).join('');
  var dec=m.decisions.map(function(d){return '<li>'+esc(d)+'</li>';}).join('');
  var act=m.actions.map(function(a){return '<li>'+esc(a.text)+(a.owner?(' — '+esc(a.owner)):'')+'</li>';}).join('');
  return '<h2>'+esc(m.title)+'</h2><p>'+fmtDate(m.whenISO)+'</p>'+
    (m.summary?('<p>'+esc(m.summary)+'</p>'):'')+
    '<h3>Agenda</h3><ul>'+(ag||'<li>—</li>')+'</ul>'+
    (dec?('<h3>Decisions</h3><ul>'+dec+'</ul>'):'')+
    (act?('<h3>Actions</h3><ul>'+act+'</ul>'):'');
}
function sendMeetingEmail(mid){
  var m=MEET.meetings.find(function(x){return x.id===mid;});
  var emails=Array.prototype.slice.call(document.querySelectorAll('.recip.on')).map(function(el){return el.dataset.email;}).filter(Boolean);
  var status=document.getElementById('sendStatus');
  status.innerHTML='<span class="lsub">Sending…</span>';
  var html=buildEmailHtml(m);
  fetch('/api/send-mail',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({to:emails,subject:m.title+' — agenda &amp; notes',html:html,from:'boardroom@haavn.au'})})
    .then(function(r){
      if(r.ok){
        m.sentAt=Date.now(); m.sentTo=emails; m.status='sent'; saveMeet();
        status.innerHTML='<span class="chip weekly">Sent via Graph to '+emails.length+' recipient(s)</span>'; render();
      } else { throw new Error('send-mail unavailable ('+r.status+')'); }
    })
    .catch(function(err){
      status.innerHTML='<span class="chip" style="border-color:var(--gold);color:var(--gold-hi)">Live send not configured here ('+esc(err.message)+') — opening mailto: as fallback</span>';
      var body=encodeURIComponent(m.title+'\n'+fmtDate(m.whenISO)+'\n\n'+(m.summary||'')+'\n\nAgenda:\n'+m.agenda.map(function(a){return '- '+a.title;}).join('\n')+'\n\nDecisions:\n'+m.decisions.map(function(d){return '- '+d;}).join('\n')+'\n\nActions:\n'+m.actions.map(function(a){return '- '+a.text+(a.owner?(' ('+a.owner+')'):'');}).join('\n'));
      window.location.href='mailto:'+emails.join(',')+'?subject='+encodeURIComponent(m.title+' — agenda & notes')+'&body='+body;
      m.sentAt=Date.now(); m.sentTo=emails; m.status='sent'; saveMeet();
    });
}

/* ---- Present mode ---- */
function openPresent(){
  var m=curMeeting(); if(!m) return;
  document.getElementById('presEye').textContent=(m.kind||'').toUpperCase()+' MEETING';
  document.getElementById('presTitle').textContent=m.title;
  document.getElementById('presBody').innerHTML=m.agenda.map(function(a){
    return '<div class="pitem"><b>'+esc(a.title)+'</b><span>'+esc(a.ownerName||'')+' '+(a.state==='discussed'?'· discussed':'')+'</span></div>';
  }).join('')||'<div class="lsub">No agenda items.</div>';
  document.getElementById('present').classList.add('on');
}
function exitPresent(){document.getElementById('present').classList.remove('on');}

/* ---- shared-store polling (keeps 01/02 in sync, drives the persistence bar) ---- */
function pollShared(){
  kvPull(MEET_KEY,null).then(function(v){
    if(v) MEET=v;
    var live=MEET.meetings.find(function(m){return m.recording&&m.recording.active&&(Date.now()-m.recording.lastBeat)<20000;});
    var bar=document.getElementById('recbar');
    if(live && live.id!==CUR){
      bar.classList.add('on');
      document.getElementById('recTitle').textContent=live.title;
      var secs=Math.floor((Date.now()-live.recording.startedAt)/1000);
      document.getElementById('recTime').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
      window._liveMeetingId=live.id;
    } else { bar.classList.remove('on'); }
    if(!CUR) render();
  });
  kvPull(CRM_KEY,null).then(function(v){if(v)CRM=v;});
  kvPull(TASKS_KEY,null).then(function(v){if(v)TASKS=v;});
}
function jumpToMeeting(){if(window._liveMeetingId) openMeeting(window._liveMeetingId);}

/* ===================== modal / util ===================== */
function showModal(title,body){document.getElementById('modalBody').innerHTML='<h4>'+title+'</h4>'+body;document.getElementById('modalbg').classList.add('on');}
function closeModal(){document.getElementById('modalbg').classList.remove('on');}
document.getElementById('modalbg').addEventListener('click',function(e){if(e.target===this)closeModal();});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false});}

boot();
</script>
