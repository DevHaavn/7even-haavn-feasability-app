<!DOCTYPE html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATRIUM · HAAVN BLACK Sales (phone)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050607">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The fonts load without holding the page up: a stylesheet that is slow or blocked on the phone's network used to stop every script from running, which left this page blank. The system font shows until Inter arrives. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
/* HAAVN BLACK Sales on a phone. The same customers, the same rules and the same server as the desktop pipeline (atrium-sales.html): this page only
   changes how it is held. Built for one thumb on the road: the next step is always the big gold button at the bottom, every change is a tap,
   notes and email are two taps away, and notes and edits are kept on the phone when there is no signal. Look: HAAVN BLACK (black, white type,
   LED blue, gold for money and the one main action), the website's four journey colours, and the cut bottom-right corner. */
:root{--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gold:#d6b36a;--led:#7fd3ff;--discover:#7cb5c0;--commit:#d9a54f;--secure:#96b483;--deliver:#c2747a;--notch:10px;
  --cut:polygon(0 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%);--ease:cubic-bezier(.16,1,.3,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#050607;--panel:#0c0e11;--panel2:#12151a;--hl:rgb(255 255 255 / .08);--edge:rgb(255 255 255 / .2);--ink:#eaf1f6;--ink2:#a8b3bc;--ink3:#7d8891;--ink4:#566068;
  --ok:#7fd9a0;--bad:#ff6b5e;--warn:#d6b36a;--scrim:rgba(0,0,0,.66);--inp:#080a0c;--onGold:#15110a;color-scheme:dark}
[data-theme=light]{--bg:#dfe2e6;--panel:#fafbfc;--panel2:#edeff2;--hl:rgb(15 19 24 / .1);--edge:rgb(15 19 24 / .6);--ink:#0f1318;--ink2:#2f3640;--ink3:#555d68;--ink4:#7d848e;
  --ok:#2e8b57;--bad:#c2392f;--warn:#8a6420;--scrim:rgba(15,19,24,.5);--inp:#fff;--onGold:#15110a;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font:400 15px/1.45 var(--sans);color:var(--ink);background:#0a0b0d;-webkit-font-smoothing:antialiased;overflow:hidden}
[data-theme=light] body{background:#c9ccd1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
a{color:inherit}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.eb{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.hide{display:none!important}
/* the app fills the phone; on a wider screen it is one centred column */
#app{position:fixed;top:0;left:50%;width:100%;max-width:520px;height:100%;transform:translateX(-50%);display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg)}   /* clip, not hidden: the sheets wait just below the screen, and a frame that is only "hidden" can still be scrolled up to them by a focused field */
@media(min-width:521px){#app{box-shadow:0 0 0 1px var(--hl),0 0 80px rgba(0,0,0,.45)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sh{padding:calc(var(--sat) + 6px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:calc(var(--sat) + 60px);flex:none}
.sh h1{font:500 24px var(--sans);letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh h1 small{display:block;font:500 10px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-bottom:2px}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--hl);display:grid;place-items:center;color:var(--ink2);position:relative;flex:none}
.ibtn:active{background:var(--panel2)}
.me{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--edge);display:grid;place-items:center;font:500 13px var(--sans);flex:none}
.savedpill{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;white-space:nowrap}
.savedpill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.savedpill.off:before,.savedpill.busy:before{background:var(--warn)}
.tabs{display:flex;height:calc(64px + var(--sab));padding-bottom:var(--sab);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--hl);flex:none;z-index:6}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink3);font-size:11px;position:relative}
.tabs button.on{color:var(--ink)}.tabs button.on:before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--led);box-shadow:0 0 12px var(--led)}
.tabs .bdg,.bdg{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:600 10px/17px var(--sans);text-align:center;padding:0 4px;font-style:normal}
.card{position:relative;background:linear-gradient(-45deg,transparent 50%,var(--edge) 50% calc(50% + 1.2px),transparent calc(50% + 1.2px)) bottom right/var(--notch) var(--notch) no-repeat,var(--panel);border:1px solid var(--hl);border-radius:4px 4px 0;clip-path:var(--cut)}
.sec{display:flex;align-items:baseline;gap:10px;padding:22px 20px 10px}.sec h2{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);flex:1}.sec span{font:500 11px var(--mono);color:var(--ink3)}
.btn{min-height:48px;padding:0 18px;border:1px solid var(--edge);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:500;font-size:15px;color:var(--ink);white-space:nowrap}
.btn:active{background:var(--panel2)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.primary{background:var(--gold);color:var(--onGold);border-color:transparent;min-height:56px;font-size:16px;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);border-radius:6px 6px 0}
.btn.primary:active{filter:brightness(.94)}
.btn.ghost{border-color:var(--hl);color:var(--ink2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--hl);font:500 10.5px var(--mono);letter-spacing:.04em;color:var(--ink2);white-space:nowrap}
.chip.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.chip.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.led{color:var(--led);border-color:color-mix(in srgb,var(--led) 45%,transparent)}
.dotp{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent)}
/* today */
.hello{padding:4px 20px 0}.hello h2{font:300 28px/1.15 var(--sans);letter-spacing:-.02em}.hello h2 b{font-weight:500}.hello p{color:var(--ink3);font-size:13.5px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 16px 0}
.stat{padding:12px 12px 13px}.stat .v{font:300 28px/1 var(--sans);margin-top:8px;letter-spacing:-.02em}.stat .s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.do{margin:0 16px 12px;padding:0;overflow:hidden}
.do .top{padding:15px 16px 4px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.do .who{flex:1;min-width:0}.do .who b{font-weight:500;font-size:17px;display:flex;align-items:center;gap:9px;line-height:1.2}
.do .who small{display:block;color:var(--ink3);font-size:13px;margin-top:3px}
.do .what{padding:2px 16px 12px;color:var(--ink2);font-size:14.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.do .what .amt{margin-left:auto;font:500 14px var(--sans);color:var(--gold)}
.do .acts{display:grid;grid-template-columns:52px 52px 1fr;gap:8px;padding:0 12px 12px}
.do .acts .btn{min-height:48px;padding:0}
.do .acts .btn.primary{padding:0 12px;min-height:48px;font-size:15px}
.do .acts .btn.primary span{overflow:hidden;text-overflow:ellipsis}
.wait{margin:0 16px 8px;padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.wait b{font-weight:500;font-size:15px;display:block}.wait small{color:var(--ink3);font-size:12.5px}.wait .go{margin-left:auto;color:var(--ink4)}
.fab{position:absolute;right:16px;bottom:calc(64px + var(--sab) + 16px);width:60px;height:60px;border-radius:18px;background:var(--gold);color:var(--onGold);display:grid;place-items:center;z-index:5;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.fab:active{filter:brightness(.92)}
/* pipeline */
.search{margin:0 16px 10px;height:48px;border-radius:6px;background:var(--inp);border:1px solid var(--hl);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink3)}
.search input{flex:1;background:none;border:0;outline:0;height:100%;color:var(--ink);min-width:0}
.who2{display:flex;gap:6px;margin:0 16px 12px}.who2 button{flex:1;min-height:38px;border:1px solid var(--hl);border-radius:99px;font-size:13px;color:var(--ink3)}.who2 button.on{background:var(--ink);color:var(--bg);font-weight:500;border-color:transparent}
.jbar{display:flex;gap:3px;height:6px;margin:0 16px 12px}.jbar i{flex:var(--n,1);min-width:3px;border-radius:1px;background:var(--c);opacity:.9}
.stg{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none;scroll-snap-type:x proximity}.stg::-webkit-scrollbar{display:none}
.stg button{flex:none;display:flex;flex-direction:column;gap:6px;min-width:78px;padding:10px 12px;border:1px solid var(--hl);border-radius:4px;text-align:left;scroll-snap-align:start;background:var(--panel)}
.stg button b{font:300 22px/1 var(--sans)}.stg button span{font:500 10px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;white-space:nowrap}
.stg button.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}.stg button.on span{color:var(--ink)}
.stg button:before{content:"";height:3px;border-radius:2px;background:var(--c);width:18px;opacity:.9}
.lrow{position:relative;margin:0 16px 8px;overflow:hidden;border-radius:4px}
.lrow .under{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch}
.lrow .under button{width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px var(--sans);color:#fff}
.lrow .under .c1{background:#2a7a4b}.lrow .under .c2{background:#2a5f8a}.lrow .under .c3{background:#6a5a2a}
.lrow .face{position:relative;padding:14px 16px;display:flex;gap:12px;align-items:center;transition:transform .25s var(--ease);touch-action:pan-y;cursor:pointer}
.lrow .face .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--c)}
.lrow .tx{flex:1;min-width:0}.lrow b{font-weight:500;font-size:16.5px;display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .meta{display:flex;gap:8px;align-items:center;color:var(--ink3);font-size:12.5px;margin-top:4px;flex-wrap:wrap}
.lrow .nx{color:var(--ink2);font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .r{text-align:right;flex:none}.lrow .r .p{font:500 14px var(--sans);color:var(--ink)}.lrow .r .a{font-size:11.5px;color:var(--ink3);margin-top:3px}.lrow .r .a.late{color:var(--bad)}.lrow .r .a.soon{color:var(--warn)}
.sw{display:inline-flex;gap:3px;vertical-align:middle}.sw i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .25)}
.hint{margin:6px 20px 0;color:var(--ink4);font-size:12px;display:flex;align-items:center;gap:8px}
/* approvals */
.ap{margin:0 16px 12px;padding:14px 16px}
.ap .t{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.ap .t b{font-weight:500;font-size:16.5px;display:block}.ap .t small{color:var(--ink3);font-size:12.5px}
.ap .g{margin:8px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink2);font-size:14px}.ap .g .a{margin-left:auto;font:500 15px var(--sans);color:var(--gold)}
/* customer */
.lead{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .4s var(--ease),visibility 0s linear .4s;z-index:8;visibility:hidden}
.lead.on{transform:none;visibility:visible;transition:transform .4s var(--ease),visibility 0s}
.lead .scroll{padding-bottom:24px}
.hero{margin:0 16px;padding:18px 16px 16px}
.hero .id{display:flex;gap:14px;align-items:center}
.hero .ini{width:56px;height:56px;border-radius:50%;background:var(--panel2);border:1px solid var(--edge);display:grid;place-items:center;font:500 18px var(--sans);flex:none}
.hero h2{font:500 22px/1.15 var(--sans)}.hero .sub{color:var(--ink3);font-size:13px;margin-top:4px}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.contact button{min-height:64px;border:1px solid var(--hl);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--ink2);background:var(--panel2)}
.contact button:active{border-color:var(--led);color:var(--ink)}
.contact button[disabled]{opacity:.4}
.rail{margin:18px 16px 0}
.rail .bars{display:flex;gap:4px;height:34px;align-items:flex-end}
.rail .bars i{display:block;flex:1;height:6px;border-radius:2px;background:var(--hl)}
.rail .bars i.d{background:var(--c)}.rail .bars i.c{height:14px;background:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 80%,transparent);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 5px color-mix(in srgb,var(--c) 60%,transparent)}}
.rail .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;gap:8px}
.rail .lbl b{font-weight:500;font-size:15px}.rail .lbl span{font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.rail .ph{display:flex;gap:4px;margin-top:6px}.rail .ph span{flex:var(--n);font:500 9px var(--mono);letter-spacing:.08em;color:var(--c);text-transform:uppercase;border-top:1px solid var(--c);padding-top:3px;opacity:.85;white-space:nowrap;overflow:hidden}
.now{margin:14px 16px 0;padding:16px}
.now .q{font:300 20px/1.25 var(--sans);letter-spacing:-.01em;margin:8px 0 4px}.now .q b{font-weight:500}
.now .s{color:var(--ink3);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.now .row{display:grid;gap:8px;margin-top:14px}
.now .banner{margin-top:10px}
.banner{padding:10px 12px;border-radius:6px;border:1px solid var(--hl);font-size:13px;color:var(--ink2);background:var(--panel2)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.acc{margin:12px 16px 0;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:16px;text-align:left;min-height:56px}
.acc>button b{font-weight:500;font-size:15.5px;flex:1}.acc>button span{color:var(--ink3);font-size:13px;display:flex;align-items:center;gap:6px}.acc>button .ic{transition:transform .25s;color:var(--ink3)}
.acc.open>button .ic.cv{transform:rotate(180deg)}
.acc .bd{display:none;padding:0 16px 16px}.acc.open .bd{display:block}
.kv{display:flex;align-items:center;gap:12px;min-height:50px;border-top:1px solid var(--hl)}
.kv:first-child{border-top:0}.kv .k{width:96px;color:var(--ink3);font-size:13px;flex:none}.kv .v{flex:1;min-width:0;font-size:15px}
.kv input,.kv select{width:100%;min-height:48px;background:none;border:0;outline:0;color:var(--ink);padding:0;text-overflow:ellipsis}
.kv select{appearance:none;-webkit-appearance:none;padding-right:20px;background-image:linear-gradient(45deg,transparent 50%,var(--ink4) 50%),linear-gradient(135deg,var(--ink4) 50%,transparent 50%);background-position:calc(100% - 8px) 50%,calc(100% - 3px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.kv input::placeholder{color:var(--ink4)}
.locked{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:11px 12px;border:1px dashed var(--edge);border-radius:4px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.locked .eb{display:flex;align-items:center;gap:6px}.locked .ic{width:13px;height:13px}
.locked .pv{display:inline-flex;align-items:center;gap:6px}.locked .pv i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .25)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.pick button{min-height:62px;border:1px solid var(--hl);border-radius:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 12px;text-align:left;background:var(--panel2)}
.pick button b{font-weight:500;font-size:15px}.pick button small{font-size:11.5px;color:var(--ink3)}
.pick button.on{border-color:var(--led);box-shadow:inset 0 0 0 1px var(--led);background:color-mix(in srgb,var(--led) 8%,var(--panel2))}
.pick button[disabled]{opacity:.4}
.pick.sw4{grid-template-columns:repeat(4,1fr)}.pick.sw4 button{min-height:70px;align-items:center;text-align:center;padding:8px 4px;gap:6px}
.pick.sw2{grid-template-columns:repeat(2,1fr)}
.swc{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .3)}
.lbl2{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:2px 0 4px}
.chg{font-size:11.5px;color:var(--warn);margin:-8px 0 12px}
.pay{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--hl);padding:6px 0}.pay:first-child{border-top:0}
.pay .k{flex:1;min-width:0}.pay .k b{font-weight:500;font-size:15px;display:block}.pay .k small{color:var(--ink3);font-size:12.5px}.pay .a{font:500 15px var(--sans);text-align:right}
.log{position:relative;padding-left:22px}.log:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--hl)}
.log .e{position:relative;padding:8px 0 12px}.log .e:before{content:"";position:absolute;left:-21px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--ink4)}
.log .e.note:before{background:var(--led);border-color:var(--led)}.log .e.mail:before{background:var(--gold);border-color:var(--gold)}.log .e.call:before{background:var(--ok);border-color:var(--ok)}
.log .e b{font-weight:400;font-size:14.5px;display:block;word-wrap:break-word}.log .e small{color:var(--ink3);font-size:12px}
.dock{flex:none;padding:10px 14px calc(10px + var(--sab));background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--hl);display:grid;grid-template-columns:52px 52px 52px 1fr;gap:8px;z-index:3}
.dock .btn{padding:0;min-height:56px}.dock .btn.primary{padding:0 14px;min-width:0}
.dock .btn.primary span{overflow:hidden;text-overflow:ellipsis}
/* sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--edge);transform:translateY(105%);transition:transform .42s var(--ease),visibility 0s linear .42s;z-index:41;display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.sheet.tall{height:92%}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--ink4);margin:9px auto 0;opacity:.7;flex:none}
.sheet .hd{padding:12px 20px 6px;display:flex;align-items:flex-start;gap:10px;flex:none}.sheet .hd h3{font:500 20px/1.2 var(--sans);flex:1;min-width:0}.sheet .hd h3 small{display:block;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.sheet .bd{padding:6px 20px 14px;overflow-y:auto;flex:1;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}.sheet .bd::-webkit-scrollbar{display:none}
.sheet .ft{padding:10px 16px calc(12px + var(--sab));border-top:1px solid var(--hl);display:grid;gap:8px;flex:none;background:var(--panel)}
.sheet .ft.two{grid-template-columns:1fr 1fr}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.f>span{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.in{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--hl);border-radius:6px;background:var(--inp);outline:0;color:var(--ink)}
.in:focus{border-color:var(--led)}
select.in{appearance:none;-webkit-appearance:none}
textarea.in{padding:13px 14px;min-height:130px;line-height:1.5;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{min-height:44px;padding:0 15px;border:1px solid var(--hl);border-radius:99px;font-size:14px;background:var(--panel2);color:var(--ink2)}
.chips button.on{border-color:var(--led);color:var(--ink);background:color-mix(in srgb,var(--led) 10%,var(--panel2))}
.mailhd{border:1px solid var(--hl);border-radius:6px;margin-bottom:12px;background:var(--inp)}
.mailhd div{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 14px;border-top:1px solid var(--hl);font-size:14px}.mailhd div:first-child{border-top:0}.mailhd span{color:var(--ink3);width:56px;font-size:13px;flex:none}
.mailhd em{font-style:normal;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mailhd input{flex:1;background:none;border:0;outline:0;min-width:0;height:44px}
.callout{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:6px;background:color-mix(in srgb,var(--gold) 7%,transparent);margin-bottom:14px;font-size:13.5px;color:var(--ink2)}
.callout b{color:var(--gold);font-weight:500;font-size:17px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:4px 0 14px}.grid2 span:nth-child(odd){color:var(--ink3);font-size:13px}
.prev{width:100%;height:320px;border:1px solid var(--hl);border-radius:6px;background:#000;display:block;margin-top:8px}
.mic{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13.5px}
.mic.on{color:var(--bad)}
.ck{display:flex;gap:12px;align-items:flex-start;min-height:50px;padding:12px 0;border-top:1px solid var(--hl);cursor:pointer;font-size:14.5px}.ck:first-of-type{border-top:0}
.ck i{width:26px;height:26px;border-radius:6px;border:1px solid var(--edge);display:grid;place-items:center;flex:none;color:transparent}
.ck.on i{background:var(--ok);border-color:var(--ok);color:#06150c}
.fx{display:grid;gap:8px;font-size:13.5px;color:var(--ink2);margin-bottom:14px}.fx div{padding-left:16px;position:relative}.fx div:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--led)}
.sent{text-align:center;padding:36px 20px 28px}
.sent .tick{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok);color:var(--ok);animation:pop .5s var(--ease)}
.sent .tick .ic{width:34px;height:34px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.sent h3{font:500 22px var(--sans)}.sent p{color:var(--ink3);margin-top:8px;font-size:14px;line-height:1.5}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 84px);z-index:60;background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:13px 16px;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);transition:.3s var(--ease);pointer-events:none;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:none}.toast .ic{color:var(--ok);flex:none}.toast.bad .ic{color:var(--bad)}
.offline{background:var(--warn);color:#1a1405;font:500 12.5px var(--sans);text-align:center;padding:6px 12px;display:none;flex:none}
.offline.on{display:block}
.empty{padding:40px 24px;text-align:center;color:var(--ink3);font-size:14px}
.gate{margin:auto;padding:28px 24px;text-align:center;max-width:380px}
.gate h2{font:300 26px/1.2 var(--sans);margin:10px 0}.gate p{color:var(--ink3);font-size:14px;margin-bottom:18px}
.wm0{width:150px;height:13px;background:var(--ink);-webkit-mask:url(/atrium-hb/hvn-black-wordmark.svg) left/contain no-repeat;mask:url(/atrium-hb/hvn-black-wordmark.svg) left/contain no-repeat;display:block}
.menu .btn{width:100%;justify-content:flex-start;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--hl);border-radius:99px;padding:3px;gap:3px;background:var(--inp);margin-bottom:12px}.seg button{flex:1;min-height:42px;border-radius:99px;font-size:13.5px;color:var(--ink3)}.seg button.on{background:var(--ink);color:var(--bg);font-weight:500}
.load{margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--ink3);font-size:13px}
.load i{width:44px;height:44px;border-radius:50%;border:2px solid var(--hl);border-top-color:var(--led);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<script>
/* This page never goes black. If anything stops it drawing, the reason is written on the screen with a way back. */
window.__hbsFail=function(msg,force){try{
  if(window.__hbsDrawn&&!force)return;
  window.__hbsErr=String(msg||'Unknown error').slice(0,200);
  var b=document.getElementById('body');if(!b)return;
  b.innerHTML='';var d=document.createElement('div');d.className='gate';
  function add(tag,txt,css){var n=document.createElement(tag);n.textContent=txt;if(css)n.style.cssText=css;d.appendChild(n);return n}
  add('div','HAAVN BLACK').className='eb';add('h2','Sales could not open');
  add('p','Go back and open it again. If it keeps happening, tell Jess what is written underneath.');
  add('p',String(msg||'Unknown error').slice(0,240),'font-family:var(--mono);font-size:12px;word-break:break-word');
  var x=add('button','Back');x.className='btn primary block';
  x.onclick=function(){try{parent.postMessage({atriumSales:'close'},'*')}catch(e){}
    if(parent===window){if(/[?&]embed=chat/.test(location.search))location.href='/atrium-chat.html?app=1';else if(history.length>1)history.back()}};
  b.appendChild(d)}catch(e){}};
window.addEventListener('error',function(e){window.__hbsFail((e&&e.message)||'Script error')});
window.addEventListener('unhandledrejection',function(e){window.__hbsFail((e&&e.reason&&e.reason.message)||'Request failed')});
</script>
<div id="app">
  <div id="head"></div>
  <div class="offline" id="off">No signal. Notes and edits are kept on this phone and sent when you are back online. Moves, approvals and emails need signal.</div>
  <div class="scroll" id="body"><div class="load"><i></i>Opening sales</div></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="fab hide" id="fab" data-a="newlead" aria-label="New customer"></button>
  <div class="lead" id="lead" aria-hidden="true"></div>
  <div class="scrim" id="scrim" data-a="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="/atrium-sales-core.js?v=3"></script>
<script>
(function(){
'use strict';
var H=HBS,S=H.S,esc=H.esc,money=H.money,ST=H.ST,G=H.G,PH=H.PH,PRODUCTS=H.PRODUCTS,CLAD=H.CLAD,PAL=H.PAL,JOIN=H.JOIN;
function $(s,r){return (r||document).querySelector(s)}function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
var EMB=(location.search.match(/[?&]embed=(\w+)/)||[])[1]||'';
var CHAT_USERS=['jb','mf'];   /* Sales inside ATRIUM Chat is for Jamie and Mike only */
var UI={tab:'today',stage:'all',q:'',mineOnly:null,lead:null,sl:null,sheet:null,open:{home:false,cust:false,pay:false,log:true},chk:{},offline:!navigator.onLine,pill:'',logMore:false,pend:null};

/* ============ theme: dark or light, switchable from the header on every surface. ?sch= is what the host (Chat or the ATRIUM shell) is showing when this opens;
   a switch here is handed to the host so the whole app changes with it, and applied here at once either way. ============ */
var FORCED=(location.search.match(/[?&]sch=(light|dark)/)||[])[1]||'';
function theme(t){t=t==='light'?'light':'dark';var m=$('meta[name=theme-color]');document.documentElement.setAttribute('data-theme',t);if(m)m.setAttribute('content',t==='light'?'#dfe2e6':'#050607');
  try{$$('.seg button[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});$$('[data-a=flip]').forEach(function(b){b.setAttribute('aria-label',t==='light'?'Switch to dark':'Switch to light');b.innerHTML=ic(t==='light'?'moon':'sun',null,20)})}catch(e){}}
function curTheme(){if(FORCED)return FORCED;var t='dark';try{if(EMB==='chat'){t=localStorage.getItem('atrium-chat-scheme')||'dark';if(t==='auto')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}else t=localStorage.getItem('atrium_theme')||'dark'}catch(e){}return t==='light'?'light':'dark'}
theme(curTheme());
window.addEventListener('storage',function(e){if((e.key==='atrium_theme'||e.key==='atrium-chat-scheme')&&!FORCED)theme(curTheme())});
function flipIcon(){return ic(curTheme()==='light'?'moon':'sun',null,20)}
function setScheme(v){v=v==='light'?'light':'dark';FORCED=v;theme(v);
  try{if(window.parent!==window)window.parent.postMessage({atriumSales:'scheme',v:v},'*');else if(EMB==='chat')localStorage.setItem('atrium-chat-scheme',v);else localStorage.setItem('atrium_theme',v)}catch(e){}}
window.addEventListener('message',function(e){var d=e.data;if(!d)return;if(d.atriumScheme&&e.source===window.parent){FORCED=d.atriumScheme;theme(FORCED)}
  if(d.atriumSales==='open'&&d.lead&&e.source===window.parent){if(H.lead(d.lead))openLead(d.lead);else{H.load().then(function(){render();openLead(d.lead)})}}});

/* ============ small helpers ============ */
var IC={phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',sms:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',mail:'<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>',note:'<path d="M5 19l1-4L17 4l3 3L9 18z"/><path d="M14.5 6.5l3 3"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M9 6l6 6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',back:'<path d="M15 6l-6 6 6 6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',day:'<circle cx="12" cy="12" r="3.4"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/>',pipe:'<path d="M4 5v14M10 5v10M16 5v14M21 5v8"/>',appr:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',more:'<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'};
function ic(n,c,s){return '<svg class="ic '+(c||'')+'" viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+'>'+(IC[n]||'')+'</svg>'}
function sw(l){return '<span class="sw"><i style="--c:'+(CLAD[l.clad]||'#444')+'"></i><i style="--c:'+(PAL[l.pal]||'#444')+'"></i><i style="--c:'+(JOIN[l.join]||'#444')+'"></i></span>'}
function phc(l){return PH[ST[l.stage].ph].c}
function initials(l){return ((l.first||'?')[0]+((l.last||'')[0]||'')).toUpperCase()}
function name(l){return H.full(l)}
function pn(l){return H.homeShort(l)}
/* bad: true for a problem (red cross), 'info' for guidance (bell), otherwise a tick */
function toast(t,bad){var e=$('#toast');e.className='toast on'+(bad===true?' bad':'');e.innerHTML=ic(bad===true?'x':bad==='info'?'bell':'check')+'<span>'+esc(t)+'</span>';clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on')},bad?4200:2400)}
function fail(e){
  if(!e)return;
  if(e.message==='signin'){render();return}
  if(H.isOffline(e)){setOffline(true);toast('No signal. That needs a connection.',true);return}
  toast(e.message||'That did not work.',true)}
function ready(){return S.me&&S.ready&&!S.error&&!S.setup&&!S.denied}

/* ============ layers (lead screen, sheets) and the phone's back button ============ */
var STACK=[],ON=false;
function lay(k){if(!STACK.length&&!ON){try{history.pushState({hbs:1},'');ON=true}catch(e){}}STACK.push(k)}
function unlay(k){var i=STACK.lastIndexOf(k);if(i>=0)STACK.splice(i,1)}
window.addEventListener('popstate',function(){
  ON=false;if(!STACK.length)return;var k=STACK.pop();hideLayer(k);
  if(STACK.length){try{history.pushState({hbs:1},'');ON=true}catch(e){}}});
function hideLayer(k){if(k==='sheet'){UI.sheet=null;$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');micStop()}else if(k==='lead'){UI.lead=null;$('#lead').classList.remove('on');$('#lead').setAttribute('aria-hidden','true');render()}}

/* ============ saving: instant, one place, kept on the phone when there is no signal ============ */
var FLUSHING=false;
function qKey(){return 'hbs_q:'+(S.me?S.me.id:'x')}
function qGet(){try{return JSON.parse(localStorage.getItem(qKey())||'[]')}catch(e){return []}}
function qSet(a){try{localStorage.setItem(qKey(),JSON.stringify(a))}catch(e){}}
function qIds(){var o={};qGet().forEach(function(x){o[x.id]=1});return o}
var QUEUEABLE=['act','lastTouch','first','last','mobile','email','state','setting','pay','deliv','msg','clad','pal','join','product','order','qual','otherSource'];
function queueable(p){return Object.keys(p).every(function(k){return QUEUEABLE.indexOf(k)>=0})}
function setOffline(b){
  if(UI.offline===b)return;UI.offline=b;
  $('#off').classList.toggle('on',b);pill();
  if(b){clearTimeout(setOffline._t);(function ping(){setOffline._t=setTimeout(function(){H.poll(qIds()).then(function(){setOffline(false)}).catch(function(e){if(H.isOffline(e)||!navigator.onLine)ping();else setOffline(false)})},6000)})()}
  else{flush();poll()}}
function pill(){
  var n=qGet().length;
  $$('.savedpill').forEach(function(p){
    p.className='savedpill'+(UI.offline?' off':UI.pill==='busy'?' busy':'');
    p.textContent=UI.offline?(n?n+' waiting for signal':'Offline, kept on phone'):UI.pill==='busy'?'Saving':n?n+' waiting':'Saved'})}
function flush(){
  if(FLUSHING||UI.offline)return;if(!qGet().length)return;FLUSHING=true;
  (function next(){
    var q=qGet();if(!q.length){FLUSHING=false;pill();render();return}
    H.api('saveLead',{lead:q[0]}).then(function(j){put(j.lead);qSet(qGet().slice(1));pill();next()}).catch(function(e){
      if(H.isOffline(e)||e.message==='signin'){FLUSHING=false;if(H.isOffline(e))setOffline(true);return}
      qSet(qGet().slice(1));toast('One saved change could not go through: '+e.message,true);next()})})()}
function put(lead){var i=S.leads.findIndex(function(x){return x.id===lead.id});if(i>=0)S.leads[i]=lead;else S.leads.unshift(lead)}
function act(l,x,k){return {t:H.now(),x:x,k:k||'sys'}}
/* patch: what changes. Notes and finishes apply on the screen at once, then go to the server (or wait for signal). */
function save(l,patch,o){
  o=o||{};
  var send=Object.assign({id:l.id},patch);
  Object.keys(patch).forEach(function(k){if(k==='act')l.act=patch.act.concat(l.act||[]);else l[k]=patch[k]});
  if(UI.offline&&queueable(patch)){var q=qGet();q.push(send);qSet(q);pill();if(!o.quiet)render();return Promise.resolve(l)}
  UI.pill='busy';pill();
  return H.api('saveLead',{lead:send}).then(function(j){UI.pill='';put(j.lead);pill();if(!o.quiet)render();return j.lead}).catch(function(e){
    UI.pill='';
    if(H.isOffline(e)&&queueable(patch)){setOffline(true);var q2=qGet();q2.push(send);qSet(q2);pill();if(!o.quiet)render();return l}
    fail(e);return H.load().then(function(){pill();render()})})}
function gateCall(l,op,extra){return H.api('gate',Object.assign({id:l.id,op:op},extra||{})).then(function(j){put(j.lead);return j.lead})}
function needNet(){if(UI.offline||!navigator.onLine){toast('No signal. That needs a connection.',true);return false}return true}
function cur(el){var id=(el&&el.dataset&&el.dataset.id)||UI.sl||UI.lead;return id?H.lead(id):null}

/* ============ what to do next for one customer: the big gold button ============ */
function primary(l){
  var it=H.itemOf(l),f=l.first;
  if(l.status==='lost')return {a:'reopen',label:'Re-open this customer',short:'Re-open',icon:'check'};
  if(l.concept)return {a:'concept',label:'Send a concept update',short:'Update',icon:'mail'};
  if(l.ret)return {a:'resubmit',label:'Fixed, resubmit',short:'Resubmit',icon:'check'};
  if(!it){if(l.stage>=9)return {a:'sms',label:'Send a thank you',short:'Thank you',icon:'sms'};return {a:'sms',label:'Message '+f,short:'Message',icon:'sms'}}
  if(it.k==='call'){
    if(l.stage===0)return {a:'call',label:'Call '+f,short:'Call '+f,icon:'phone'};
    if(l.stage===1)return {a:'qualify',label:'Qualify '+f,short:'Qualify',icon:'check'};
    return {a:'preorder',label:'Send the pre-order',short:'Pre-order',icon:'mail'}}
  if(it.k==='approve')return H.canGate(l.gate)?{a:'review',label:'Review and approve',short:'Approve',icon:'check'}:{a:'nudge',label:'Nudge '+H.roleWho(G[l.gate].role).split(' ')[0],short:'Nudge',icon:'bell'};
  if(it.k==='chase'){
    if(l.gate==='out'&&H.isInternal())return {a:'signedby',label:'Customer has signed',short:'Signed',icon:'check'};
    if(G[l.gate].money&&H.canGate(l.gate))return {a:'arrived',label:'Payment arrived',short:'Payment in',icon:'check'};
    return {a:'chase',label:'Chase '+f,short:'Chase',icon:'mail'}}
  if(it.k==='handover')return H.isInternal()?{a:'handover',label:'Send handover to projects',short:'Handover',icon:'mail'}:{a:'sms',label:'Message '+f,short:'Message',icon:'sms'};
  if(it.k==='update')return {a:'update',label:'Write the update',short:'Update',icon:'mail'};
  return {a:'sms',label:'Message '+f,short:'Message',icon:'sms'}}
function dueChip(it){
  if(it.urgent)return '<span class="chip late">Leaves port in '+Math.max(0,Math.round(it.dep))+' days</span>';
  if(it.over)return '<span class="chip late">'+H.dur((it.age-it.sla)*H.DAY)+' late</span>';
  if(it.sla!=null&&it.sla-it.age<it.sla*.35+.05)return '<span class="chip soon">Due in '+H.dur((it.sla-it.age)*H.DAY)+'</span>';
  return '<span class="chip">'+H.dur(it.age*H.DAY)+' in stage</span>'}

/* ============ rendering ============ */
function announce(){if(!ready())return;try{var c=H.counts();parent.postMessage({atriumSales:'counts',need:c.need,late:c.late,waiting:c.waiting},'*')}catch(e){}}
function titleFor(){return {today:['HAAVN BLACK','Today'],pipe:['HAAVN BLACK','Pipeline'],appr:['HAAVN BLACK','Approvals']}[UI.tab]||['HAAVN BLACK','Sales']}

/* pipeline */
function pipeLeads(){
  var q=UI.q.trim().toLowerCase(),ls=H.visible().filter(function(l){return UI.mineOnly===false||l.owner===S.me.id});
  if(q)ls=ls.filter(function(l){return (name(l)+' '+(l.state||'')+' '+pn(l)+' '+(l.email||'')+' '+(l.mobile||'')).toLowerCase().indexOf(q)>=0});
  return ls}
function stageLeads(ls,st){
  if(st==='all')return ls.filter(function(l){return l.status==='open'&&!l.concept});
  if(st==='lost')return ls.filter(function(l){return l.status==='lost'});
  if(st==='concept')return ls.filter(function(l){return l.concept&&l.status==='open'});
  return ls.filter(function(l){return l.status==='open'&&!l.concept&&l.stage===st})}

/* ============ swipe a row left: call, text, note ============ */
function wireSwipe(){
  $$('.lrow').forEach(function(row){
    var face=$('.face',row),x0=0,y0=0,dx=0,base=0,drag=false,mv=false,W=210;
    face.addEventListener('pointerdown',function(e){x0=e.clientX;y0=e.clientY;base=row.classList.contains('open')?-W:0;dx=0;drag=true;mv=false});
    face.addEventListener('pointermove',function(e){
      if(!drag)return;var ax=e.clientX-x0,ay=e.clientY-y0;
      if(!mv){if(Math.abs(ax)>10&&Math.abs(ax)>Math.abs(ay)*1.4){mv=true;try{face.setPointerCapture(e.pointerId)}catch(x){}face.style.transition='none';$$('.lrow.open').forEach(function(o){if(o!==row){o.classList.remove('open');$('.face',o).style.transform=''}})}else if(Math.abs(ay)>10){drag=false;return}}
      if(mv){dx=Math.max(-W,Math.min(0,base+ax));face.style.transform='translateX('+dx+'px)'}});
    function end(){if(!drag)return;drag=false;face.style.transition='';if(mv){var open=dx<-W/2;row.classList.toggle('open',open);face.style.transform=open?'translateX(-'+W+'px)':'';row._swiped=Date.now()}}
    face.addEventListener('pointerup',end);face.addEventListener('pointercancel',end);
    face.addEventListener('click',function(e){
      if(row._swiped&&Date.now()-row._swiped<350){e.stopPropagation();e.preventDefault();return}
      if(row.classList.contains('open')){e.stopPropagation();e.preventDefault();row.classList.remove('open');face.style.transform='';}},true)})}

function advance(l){

  if(l.stage===1&&!l.qual){sheetQual(l);return Promise.resolve()}
  if(l.stage>=3||l.gate||l.concept)return Promise.resolve();var to=l.stage+1;
  return save(l,{stage:to,lastTouch:H.now(),act:[act(l,'Moved to '+ST[to].n+' by '+S.me.name+'.')]}).then(function(r){if(r)toast(name(l)+' is now at '+ST[to].n+'.');return r})}

document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-a]');if(!t)return;var fn=A[t.dataset.a];if(!fn)return;
  if(t.tagName==='A'&&t.dataset.a==null)return;
  if(t.closest('.lrow')&&t.closest('.under')){/* a swipe action */}
  try{fn(t)}catch(err){toast('That did not work. Try again.',true);try{console.error(err)}catch(x){}}});
document.addEventListener('change',function(e){
  var el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;var l=H.lead(el.dataset.id);if(!l)return;var v=el.value;
  if(f==='owner'){var ag=H.agentById(v);return void save(l,{owner:v,companyId:ag?ag.companyId:'',act:[act(l,'Owner changed to '+H.ownerName(v)+'.')]},{quiet:true}).then(function(){render()})}
  if(f==='site'){return void save(l,{order:Object.assign({},l.order,{site:v})},{quiet:true})}
  if(f==='source'){if(!needNet()){render();return}return void save(l,{source:v},{quiet:true})}
  if(String(l[f]||'')===String(v))return;
  var patch={};patch[f]=v.trim?v.trim():v;
  if(f==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){toast('That email address does not look right.',true);el.value=l.email||'';return}
  save(l,patch,{quiet:true}).then(function(){if(f==='first'||f==='last'||f==='state')renderLead()})});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){UI.q=e.target.value;var pl=$('#plist');if(pl){pl.innerHTML=plistHTML();wireSwipe()}}});
window.addEventListener('online',function(){setOffline(false)});
window.addEventListener('offline',function(){setOffline(true)});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(UI.pend){var l=H.lead(UI.pend);UI.pend=null;if(l&&!UI.sheet)setTimeout(function(){sheetCall(l)},250)}
  poll()});
function busy(){var a=document.activeElement;return UI.sheet||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
function poll(){
  if(!ready()||document.hidden||UI.offline)return;
  H.poll(qIds()).then(function(ch){if(ch&&!busy()){render()}else if(ch){announce()}}).catch(function(e){if(H.isOffline(e))setOffline(true)})}
setInterval(poll,20000);
setInterval(function(){if(ready()&&!document.hidden&&!UI.sheet&&!busy())render()},60000);   /* the "late" chips and ages tick on by themselves */

/* ============ start ============ */
render();
H.load().then(function(){
  /* the pipeline opens on my own customers, or on everyone's when I have none of my own */
  if(ready())UI.mineOnly=H.visible().some(function(l){return l.owner===S.me.id})||!(H.isInternal()||S.me.manager);
  var tb=(location.search.match(/[?&]tab=(\w+)/)||[])[1];   /* the shells open it on Approvals or the Pipeline */
  if(ready()&&tb)UI.tab=tb==='appr'&&H.hasApprovals()?'appr':tb==='pipe'?'pipe':'today';
  render();flush();
  var id=(location.search.match(/[?&]lead=([\w-]+)/)||[])[1];
  if(id&&ready()&&H.lead(id)){openLead(id);try{history.replaceState(null,'',location.pathname+location.search.replace(/([?&])lead=[\w-]+&?/,'$1').replace(/[?&]$/,''))}catch(e){}}
  var fd=(location.search.match(/[?&]find=([^&]*)/)||[])[1];
  if(fd&&ready()){var ct=(location.search.match(/[?&]contact=([^&]*)/)||[])[1];findCustomer(decodeURIComponent(fd.replace(/\+/g,' ')),ct?decodeURIComponent(ct.replace(/\+/g,' ')):'')}});

/* "Open in Sales" from a lead message in Chat: find the customer by their mobile or email first, then by name. One match opens them;
   more than one, or none, opens the pipeline searched on the name so the right one is picked by eye. */
function findCustomer(name,contact){
  var ls=H.visible(),nm=String(name||'').trim().toLowerCase(),dg=String(contact||'').replace(/\D/g,'').slice(-9),em=/@/.test(contact||'')?String(contact).trim().toLowerCase():'';
  var byContact=ls.filter(function(l){return (dg.length>=8&&String(l.mobile||'').replace(/\D/g,'').slice(-9)===dg)||(em&&String(l.email||'').toLowerCase()===em)});
  var byName=ls.filter(function(l){return H.full(l).toLowerCase()===nm});
  var both=byContact.filter(function(l){return byName.indexOf(l)>=0});
  var pick=both.length===1?both[0]:byContact.length===1?byContact[0]:(!byContact.length&&byName.length===1)?byName[0]:null;
  if(pick){openLead(pick.id);return}
  UI.tab='pipe';UI.q=name;UI.stage='all';UI.mineOnly=false;UI.reset=true;render();
  if(byContact.length>1||byName.length>1)toast('More than one '+name+'. Pick the right one.','info');else toast('Could not find '+name+'. They may have been merged or removed.',true)}
})();
</script>
